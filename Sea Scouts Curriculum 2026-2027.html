s with real paddles, so that when we reach the water this summer our hands already know the moves.", "steps": [{"title": "Boat parts, paddle parts and sizing", "min": 7, "detail": "Walk a bench 'canoe' and name the parts: bow (front), stern (back), gunwales (the rails along the top edges), thwarts (crossbars), the yoke (the shaped centre thwart for carrying on your shoulders), keel line, seats, deck plates and the painter (a rope tied at each end). A kayak adds a cockpit with a raised rim called the coaming, a deck, hatches, bulkheads that make watertight compartments, foot pegs, and sometimes a rudder or skeg. Canoe paddle parts from the top: grip (T-grip or palm grip), shaft, throat, blade, tip. Sizing a canoe paddle: sit on the bench, stand the paddle upside down with the grip on the seat between your knees; the throat, where the blade begins, should reach between your chin and your nose. Standing, a rough check is floor to chin. Kayak paddle: two blades, 210-230 cm for scouts your size, blades either lined up (unfeathered) or twisted at an angle (feathered) to cut wind; drip rings keep water off your hands. Hand out paddles and have every scout size one."}, {"title": "Body position and the forward stroke", "min": 8, "detail": "Sit on the bench as a bow paddler: knees slightly apart, feet flat, back straight, weight centred. In a real canoe you kneel with your bottom against the seat edge for the lowest centre of gravity, and you keep three points of contact whenever you move. Grip: top hand on the grip, bottom hand at the throat, hands a little wider than shoulders. Forward stroke in three phases. Catch: rotate your torso toward the paddle side, reach forward and plant the whole blade in the 'water' beside your feet, shaft vertical and close to the hull. Power: unwind your torso, pushing with the top hand at eye level while the bottom hand guides; the blade stays vertical and travels straight back to your hip, no farther, since pulling past the hip lifts water and slows you. Recovery: slice the blade out sideways, turn it flat (feather) and swing it forward low over the water, rotating your torso for the next catch. Say together 'catch, power, out' and do twenty strokes in rhythm. Tandem partners paddle on opposite sides, the bow sets the pace and the stern matches it."}, {"title": "The J-stroke: steering from the stern", "min": 8, "detail": "Ask: if the stern paddler only does forward strokes on the right, which way does the canoe turn? It turns left, away from the paddling side, because the stroke pushes the stern to the left. Without a correction the canoe zigzags. The J-stroke fixes it in one motion. Begin a normal forward stroke. As the blade reaches your hip, roll your top-hand thumb down and away from you, so the thumb points down toward the water and the blade turns edge-on with the power face now facing away from the canoe. Then, with the blade still in the water behind your hip, push it gently outward away from the hull, like drawing the hook of a letter J, and lift it out. That small outward push pulls the stern back toward the paddle side and cancels the turn. Practise slowly on the bench: 'catch, power, thumb down, push out, recover.' The mistake is turning the thumb up (a 'goon stroke'), which strains the wrist and is weaker. The stern paddler steers; the bow paddler keeps a steady forward stroke and watches for rocks. Do twenty J-strokes each, switching seats halfway."}, {"title": "Draw, pry and sweep", "min": 8, "detail": "These move the boat sideways or turn it sharply. Draw stroke: rotate to face the paddle side, reach out at your hip with the blade parallel to the hull and the power face toward you, plant the blade in the water an arm's length out, and pull the water toward your hip; the boat moves toward the paddle. Before the blade hits the hull, slice it out sideways and repeat. Pry stroke: the opposite; plant the blade close alongside the hull, power face against the hull, rest the shaft on the gunwale as a lever, and lever the blade outward with the top hand pulling inward; the boat moves away from the paddle side. Sweep: for turning; plant the blade far forward near the bow, blade nearly flat and just under the surface, and sweep it in a wide half circle out to the side and all the way to the stern; the boat turns away from the paddle side. A reverse sweep, stern to bow, turns the boat toward the paddle side. In a tandem canoe, a bow draw plus a stern pry spins the boat on the spot. In a kayak the forward sweep is the main turning stroke. Practise each on command."}, {"title": "The rowing stroke", "min": 5, "detail": "Rowers face the stern and pull; the boat moves toward their back. Hand out broom handles as oars and sit two scouts per bench facing backward. The oar pivots in an oarlock on the gunwale, so the blade is out to the side. Four phases in a loop. Catch: arms straight, body leaning slightly forward from the hips, blades dropped into the water squared (vertical). Drive: push with the legs first if the seat slides (in a dinghy you sit still and use back and arms), then swing the body back, then pull the arms in to the ribs; the blade travels through the water. Finish: press the hands down to lift the blades out, and turn the wrists to feather the blades flat. Recovery: arms extend away, body swings forward, slide up, blades square again just before the next catch. Chant 'catch, drive, finish, recover' and row twenty strokes together in time; in a two-person boat both must match or the boat turns. Sculling means two oars per rower; sweep rowing means one oar each."}, {"title": "Paddling safety rules", "min": 4, "detail": "Read the safety card together and make scouts repeat the rules back. A properly fitted PFD is worn, not stowed, every time, no exceptions, and it is the rule for leaders too. Buddy system: never paddle alone, and stay within sight and voice of another boat. Check the marine forecast before launching and stay ashore in wind above Beaufort 3-4 for beginners, in fog, or with thunder within 30 seconds of a lightning flash. Remember cold water: Ontario lakes are dangerously cold until late June; dress for the water temperature, not the air. Stay low: kneel or sit, keep your head over the centreline, never stand, and switch places only at the shore. Carry a whistle on the PFD, a bailer and a painter. Tell someone your route and return time (a float plan). Stay close to shore and know how to swim to it. Announce that anyone who cannot pass the swim test will still paddle, in a PFD, with a leader, in shallow water."}], "tips": ["Watch for arm-only paddlers. Have them cross their arms and rotate their shoulders without a paddle to feel torso rotation, then put the paddle back in their hands.", "For the J-stroke, stand behind the scout and gently guide their top hand thumb down at the hip on the first three strokes; muscle memory beats explanation.", "Use the words 'toward the paddle' and 'away from the paddle' for every stroke so scouts build the map: draw toward, pry away, sweep away, reverse sweep toward.", "Pair scouts with left-handed and right-handed grips on opposite sides of a bench so the tandem picture is right.", "Keep the rowing section short and fun; the chant and the backward-facing surprise are enough for tonight."], "safety": ["Paddles are swung only in the marked stroke zone beside a bench; keep 2 m between benches and no paddles above shoulder height.", "Broom-handle oars stay below chest height and are never used for pushing scooter boards.", "Scooter boards: hands inside the board, no standing, no ramming; the pusher pushes on the rider's shoulders or a rope, never on the head or neck.", "Benches are for sitting only; nobody stands or kneels on a bench during strokes."]}, "spiritual": {"title": "Launch Out into the Deep", "ref": "Luke 5:1-11", "verse": "When He had stopped speaking, He said to Simon, 'Launch out into the deep and let down your nets for a catch.' But Simon answered and said to Him, 'Master, we have toiled all night and caught nothing; nevertheless at Your word I will let down the net.'", "url": "https://www.biblegateway.com/passage/?search=Luke+5%3A1-11&version=NKJV", "message": "Tonight you learned that a good paddler does not pull with the arms alone; the whole body rotates and the boat goes where you send it, stroke after stroke. Simon Peter was a professional. He had paddled and rowed that lake all night with every stroke he knew, and the nets came up empty. Then a carpenter told him to row back out into deep water in the heat of the day, the worst time to fish. Peter could have argued. Instead he said the sentence that changed his life: 'Nevertheless at Your word I will let down the net.' That is faith: tired, unconvinced, but obedient. The catch nearly sank two boats. Next week the Church celebrates the Annunciation, when the Virgin Mary said the same kind of yes: 'Let it be to me according to your word.' Great Lent is our long night of rowing. Fasting is hard, prayers feel dry, and you may see no catch at all. Keep the stroke. Catch, power, recover; pray, fast, forgive; and launch out into the deep anyway, because He said so. St. Mark rowed the same way, leaving Rome for the unknown port of Alexandria at the Lord's word, and a whole church, our church, was the catch. Remember the safety card too: never paddle alone. Peter called James and John to help haul the net. Bring your patrol with you into the deep.", "discussion": ["Peter obeyed even though he was tired and thought it would not work. When have you done the right thing 'nevertheless', and what happened?", "Jesus told Peter to go to the deep water, not the shallows. Where is the 'deep water' God might be calling you this Lent, something harder than you would choose yourself?", "Peter needed his partners to haul in the catch. Who is your paddling buddy in faith, and how can your patrol help each other keep the stroke?"], "prayer": "Lord Jesus, You told Peter to launch out into the deep, and at Your word he obeyed and was not disappointed. Give us the same trust when we are tired and the nets seem empty, and the same steady stroke in prayer and fasting through this Great Lent. Keep us safe on every water, and make us fishers of men like Your apostle St. Mark, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Land-Canoe Relay and the Stroke Command Game", "setup": "Part 1 (14 minutes): two taped lanes 12 m long with a pylon at the far end. Each patrol has two scooter boards (or sliders and a folded blanket) placed one behind the other as a 'tandem canoe', a bow paddle and a stern paddle. Part 2 (11 minutes): all scouts on benches or chairs in patrol rows facing the leader, one paddle each (sharing if short), with a 2 m gap between rows.", "materials": ["Scooter boards or sliders, 2 per patrol", "Canoe paddles, 2 per patrol for the relay, 1 per scout (or shared) for the command game", "Pylons for the turn", "Whistle, stopwatch, score sheet", "PFDs for the 'launch check' (2, shared)"], "rules": ["Land-Canoe Relay: two scouts sit on the scooter boards in a line, the bow paddler in front and the stern paddler behind, each holding a paddle. A third scout is the 'launch checker'. Before each crew starts, the checker must ask 'PFD on? Buddy? Weather checked?' and the crew answers all three; skipping the check is a 5-second penalty.", "On the whistle the crew moves down the lane using only paddle strokes on the floor with the blade tip (rubber-tipped or taped) and their feet; hands may not touch the floor. The bow paddles forward on one side, the stern on the other and must call 'J' when correcting. At the pylon the stern paddler must call and perform a sweep to turn the crew around the pylon, then they return to the start.", "The next crew from the patrol goes; every scout must ride once. The patrol's time is the total for all crews. Penalties: 5 seconds for a hand on the floor, 5 seconds for standing or kneeling up, 10 seconds for a paddle swung above shoulder height.", "Stroke Command Game: the leader calls a command and every scout performs the stroke on the bench; the last patrol to have everyone doing the correct stroke, judged by the leader, loses a point, and a patrol where anyone does the wrong stroke loses a point. Commands: 'Forward', 'J-stroke', 'Draw', 'Pry', 'Sweep', 'Reverse sweep', 'Rowing: catch, drive, finish, recover', 'Switch sides', and the trick command 'Stand up' (nobody moves; any scout who stands costs the patrol 2 points).", "The leader speeds up the commands every 30 seconds. Play 6 minutes, then the top two patrols face off with a 'Simon says' round where only commands preceded by 'Skipper says' are obeyed. Combine relay and command-game scores; lowest relay time earns 10 points, second 7, third 5, fourth 3, fifth 1."], "variations": ["Short on time: run the relay only with one crew per patrol and 'Stand up' as the only trick command in a 3-minute game.", "Harder: put a 'rock' (a chair) in each lane that the crew must avoid by calling and performing a bow draw or stern pry as they pass it.", "Easier: allow the crews to use feet only for propulsion but still require the paddle calls (J, sweep) at the correct moments.", "No scooter boards: run the relay with crews sitting on a folded blanket pulled by a rope held by a third scout, with the paddlers still performing and calling the strokes."]}, "tables": [{"caption": "Canoe strokes at a glance", "headers": ["Stroke", "Who uses it", "How", "Boat moves"], "rows": [["Forward", "Both paddlers", "Plant at the toes, shaft vertical, pull to the hip with torso rotation, slice out, feather forward", "Straight ahead (with a J from the stern)"], ["J-stroke", "Stern paddler", "Forward stroke, then thumb down at the hip and push the blade outward like a J", "Straight, cancelling the turn"], ["Draw", "Either", "Reach out at the hip, power face toward you, pull the water to the hull", "Toward the paddle side"], ["Pry", "Either (often stern)", "Blade alongside the hull, shaft on the gunwale, lever the blade outward", "Away from the paddle side"], ["Forward sweep", "Either (main kayak turn)", "Wide half circle from bow to stern, blade shallow", "Turns away from the paddle side"], ["Reverse sweep", "Either", "Wide half circle from stern to bow", "Turns toward the paddle side"]]}, {"caption": "Paddling safety card", "headers": ["Rule", "Why"], "rows": [["Wear a fitted PFD every time, buckled", "Most paddling deaths in Canada involve no PFD; you cannot put one on in cold water"], ["Never paddle alone; buddy boats within sight and voice", "A capsize needs a second boat for rescue"], ["Check the marine forecast; no thunder, fog or strong wind", "Wind and waves build fast on Ontario lakes"], ["Dress for the water temperature; know the 1-10-1 rule", "Cold shock can stop you swimming within a minute"], ["Stay low, head over the centreline, never stand", "A high centre of gravity capsizes a canoe"], ["Whistle on the PFD, bailer and painter in the boat", "Signal, empty water, tie up or be towed"], ["Leave a float plan and stay near shore", "Searchers know where to look and you can swim to safety"]]}], "references": [{"label": "Paddle Canada", "url": "https://www.paddlecanada.com/", "why": "National paddling body; skills levels and safety guidance for canoe and kayak."}, {"label": "Wikipedia: Canoe paddle strokes", "url": "https://en.wikipedia.org/wiki/Canoe_paddle_strokes", "why": "Written descriptions and diagrams of the forward, J, draw, pry and sweep strokes."}, {"label": "YouTube search: canoe J stroke tutorial", "url": "https://www.youtube.com/results?search_query=canoe+J+stroke+tutorial", "why": "Watch the thumb-down motion at the hip before teaching it; the most misunderstood stroke."}, {"label": "YouTube search: rowing stroke phases catch drive finish recovery", "url": "https://www.youtube.com/results?search_query=rowing+stroke+phases+catch+drive+finish+recovery", "why": "Short clips showing the four phases in slow motion."}, {"label": "Lifesaving Society", "url": "https://www.lifesaving.ca/", "why": "Canadian drowning facts and swim-to-survive standards for the summer swim test."}, {"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Required equipment for canoes and kayaks (PFD, whistle, bailer, buoyant heaving line)."}], "visual": "stroke-guide", "takeHome": "Sit on a kitchen chair each day this week and do twenty forward strokes and ten J-strokes with a broom handle, saying 'catch, power, thumb down, push out' aloud, and ask a family member to check that your top-hand thumb points down at the hip."}, {"n": 27, "date": "2027-04-06", "term": "Spring", "title": "Citizenship & Ceremonies", "theme": "Flag etiquette, colour party drill, and what it means to belong", "sea": false, "calendar": ["Great Lent continues (Mar 8 to May 1). Any snack tonight must be vegan: no meat, dairy, eggs, or fish. Pretzels, fruit, and hummus are safe choices.", "Feast of the Annunciation is tomorrow, Apr 7 (29 Baramhat). Mention it at the opening; the spiritual lesson is built around it.", "Remind families of the Friday Lenten prayers and that Palm Sunday is Apr 25, three weeks away. Palm crosses will be woven at Lesson 29."], "objectives": ["State the proportions, colours, and history of the National Flag of Canada and at least five rules of flag etiquette.", "Fold, attach, raise, and lower the flag correctly as a member of a colour party.", "Give and respond to the six colour party commands, the Scout salute, and the left handshake.", "Recall two facts about the history of the waterway nearest the church.", "Explain three concrete ways a Scout acts as a good Canadian citizen."], "materials": [{"item": "National Flag of Canada, 90 x 180 cm (3 x 6 ft), with two grommets on the hoist", "qty": "2", "note": "borrow from the church hall or group; must be clean and untorn"}, {"item": "Portable indoor flagpole: 2.4 m (8 ft) pole or closet dowel, screw eye or small pulley at the top, 6 m loop of 4 mm cord as halyard, weighted base", "qty": "1 or 2", "note": "or lash a tripod of three 2.4 m spars (Lesson 6) and screw the eye into one leg; a Christmas tree stand works as a base"}, {"item": "Snap hooks or toggles tied into the halyard, 1 m apart", "qty": "2 per pole", "note": "hardware store, about $2 each"}, {"item": "Small cleat screwed to the pole at chest height, or use two half hitches around the pole", "qty": "1 per pole", "note": "optional"}, {"item": "Printed flag etiquette one-pager from the canada.ca link", "qty": "1 per patrol", "note": "print in colour if possible"}, {"item": "Trivia question cards (use the table in this lesson)", "qty": "1 set", "note": "cut into cards, shuffle"}, {"item": "Map or large photo of the nearest waterway (lake, harbour, river, or canal)", "qty": "1", "note": "print from a municipal website or draw on the flip chart"}, {"item": "Whiteboard or flip chart with markers", "qty": "1", "note": "for commands and scoring"}, {"item": "Score sheets and pens for judges", "qty": "3", "note": "one per judge"}, {"item": "Vegan snack: pretzels or apple slices", "qty": "enough for 25", "note": "Great Lent; check allergies"}], "prep": ["Read the Canadian flag etiquette page (reference list) and print one copy per patrol.", "Set up the flagpole at the front of the hall before scouts arrive. Test that the halyard runs freely and that the flag reaches the top without hitting a ceiling fan or light.", "Practise the fold and the raise and lower sequence yourself at least twice. Time it: a smooth crew takes under 90 seconds.", "Learn the six commands in the table below and practise saying them out loud: warning word, pause, action word.", "Look up three facts about your local waterway (municipal website, Wikipedia) and mark it on the map. Write the facts on a card for the leader teaching step 5.", "Print and cut the trivia cards. Assign one leader as quizmaster and one leader as flag ceremony judge, and give each a score sheet.", "Check that patrol leaders know the Scout Promise and Scout Law by heart; they will lead their patrols in the competition."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in by patrol, flag raised by a leader colour party (scouts watch closely tonight), Scout Promise, Lord's Prayer, mention the Annunciation tomorrow, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: flag rules, folding, raising and lowering, colour party drill and salute, local waterway and citizenship"}, {"time": "7:05", "min": 10, "what": "Spiritual: St. Mary's 'Let it be to me' (Luke 1:26-38), saying yes to God"}, {"time": "7:15", "min": 25, "what": "Activity: Colours Cup flag ceremony competition, then Canada and sea trivia"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, flag lowered by the winning patrol, dismissal"}], "practical": {"title": "Colours! Flag Etiquette and the Colour Party", "intro": "Every Sea Scout meeting, camp, and regatta opens with the colours. Raising the flag well is a small act of respect that says who we are and whom we serve. Tonight you will learn the rules of our flag, the drill of a colour party, and the story of the waters near our church.", "steps": [{"title": "The flag and its rules", "min": 8, "detail": "Hold the flag up between two scouts. Teach: the National Flag of Canada was first raised on Parliament Hill on Feb 15, 1965, now National Flag of Canada Day. Its proportions are 2:1, twice as long as it is tall. The white centre square is half the flag's length, and the stylized maple leaf has 11 points. Red and white were named Canada's national colours by King George V in 1921. Point out the hoist (the edge with grommets that goes next to the pole), the fly (the free edge), and the leaf's stem, which must point down. Then read the rules from the Canadian Heritage sheet: raise briskly, lower slowly and with ceremony; never let it touch the ground or floor; give it the place of honour when flown with others (on the observer's left, or in the centre of three); never dip it to any person or thing; never use it as a tablecloth, curtain, costume, or cover; never write on it; fly it only in good condition, and dispose of a worn flag privately and respectfully (burning), never in the garbage; at night, fly it only if lit. To half-mast, first raise it to the top, then lower to half; when bringing it down from half-mast, raise it to the top first. Ask: why raise briskly and lower slowly? (Joy at the start of the day, respect at the end.)"}, {"title": "Folding the flag", "min": 7, "detail": "Canadian Heritage does not prescribe an official fold, so we use the standard Scouting fold, which keeps the maple leaf on the outside and the grommets ready to clip. Two scouts face each other holding the flag taut by its corners, leaf side up, at waist height so it never touches the floor. Fold 1: bring the bottom long edge up to the top long edge (flag is now half as tall). Fold 2: bring the new bottom edge up to the top again (a long strip one quarter of the original height, leaf still showing). Fold 3: starting from the fly end, the scout at the fly folds the strip back on itself in rectangles the width of the strip, walking toward the hoist, keeping the folds square and tight. Stop one rectangle before the grommets so the grommets are exposed on the outside of the bundle. Tuck the last fold under the previous one so it holds. The folded flag is carried on the flag bearer's forearms, held against the chest, grommets toward the pole, never under the arm and never in one hand. Every pair folds twice, then swaps ends and folds twice more. Store flags folded, dry, and out of the sun."}, {"title": "Attaching, raising, and lowering", "min": 8, "detail": "Demonstrate at the pole with two scouts. The halyard is the loop of cord running through the pulley at the top; it has two snap hooks. Attaching: the flag bearer holds the folded flag while the halyard handler clips the top grommet to the upper snap hook first, then the bottom grommet to the lower hook. Check that the flag is not twisted and the leaf stem points down. Raising: on the command 'Hoist the colours', the handler pulls the halyard hand over hand, quickly and steadily, so the flag climbs briskly, while the bearer feeds the flag out of the bundle so it unfurls and never touches the floor. When the flag reaches the top, the handler secures the halyard with a cleat hitch on the cleat (Lesson 19) or two half hitches around the pole, and steps back one pace. Lowering: on 'Lower the colours', untie, then lower slowly hand under hand. The bearer gathers the flag into the arms as it comes down, keeping it off the floor. Unclip the bottom grommet first, then the top, and fold immediately. Each patrol sends a pair to raise and lower once while the rest watch and call out any breach of the rules."}, {"title": "Colour party drill, Scout salute, and left handshake", "min": 9, "detail": "A colour party has five roles: colour party leader (gives the commands), flag bearer, halyard handler, and two escorts who march either side of the bearer and stand one pace behind at the pole. Every command has a warning word, a pause, and an action word: 'Troop... fall in' (patrols form a horseshoe facing the pole, patrol leaders on the right of their patrol). 'Troop... attention' (heels together, toes apart, arms straight, thumbs along the seams, eyes front, no talking). 'Colour party... advance' (party marches from the back of the hall in step, left foot first, halts one pace from the pole on 'Colour party... halt'). 'Hoist the colours' (flag goes up briskly). 'Troop... salute' (everyone salutes as the flag starts to rise and holds until the leader says 'Two', then the hand drops smartly; then the whole troop says the Scout Promise). 'Colour party... retire' (party returns to its patrols). 'Troop... at ease' (left foot moves out to shoulder width, hands clasped behind the back). The Scout salute: right hand, index, middle, and ring fingers straight and together, thumb holding down the little finger, fingertips to the right eyebrow or cap brim, elbow at shoulder height. The three fingers stand for the three parts of the Promise: duty to God and the King, helping other people, and carrying out the Scout Law. Salute when the flag is raised or lowered, when the Promise is said, and to greet a uniformed Scouter. The left handshake is the Scout greeting: Baden-Powell learned it in West Africa, where a warrior who put down his shield to shake with the left hand showed trust. Run each patrol through the full command sequence twice with a leader calling."}, {"title": "Our waterway and good citizenship", "min": 8, "detail": "Show the map of your local waterway and give your three prepared facts. Add the wider Ontario story: Indigenous peoples such as the Anishinaabe, Haudenosaunee, and Huron-Wendat travelled and traded these waters by canoe for thousands of years before Samuel de Champlain paddled Georgian Bay in 1615. The Great Lakes hold about one fifth of the world's surface fresh water. In the War of 1812, control of Lake Ontario was fought over from Kingston and York (Toronto). The Welland Canal (first opened 1829, current canal 1932) lifts ships 99.5 m (326 ft) between Lake Ontario and Lake Erie through eight locks. The Rideau Canal (1832) is a UNESCO World Heritage Site, and the St. Lawrence Seaway (1959) lets ocean ships sail all the way to Thunder Bay. Then connect to citizenship. Our Promise says 'to do my duty to God and the King, to help other people at all times.' Ask patrols to name ways a Scout is a good citizen and write them up: obey laws, including boating rules; learn and respect the land acknowledgement for your area; vote when you turn 18; serve (shoreline cleanup, Remembrance Day parade, helping newcomers, as St. Mark himself was once a newcomer to Egypt); respect the flag and the people it stands for. Each patrol chooses one service idea for this summer and writes it on the flip chart."}], "tips": ["Voice matters: say the warning word, pause for a full second, then bark the action word. Scouts move on the action word only.", "The most common raising mistake is going too slowly. Say 'briskly means briskly' and demonstrate hand over hand.", "Check the stem of the leaf points down before every hoist. An upside-down flag is a distress signal at sea.", "Keep drill periods short and rotate roles quickly so nobody stands still for more than three minutes.", "Correct gently and privately. A scout who fumbles the fold in front of the troop needs encouragement, not a joke."], "safety": ["Weight the pole base (sandbags or a tree stand) and keep scouts from running near it. A falling 2.4 m pole can cause injury.", "Snap hooks pinch fingers. Show scouts how to open them with the thumb away from the gate.", "Hands must be clean and dry before handling the flag. Snacks come after the practical."]}, "spiritual": {"title": "Let It Be to Me: Saying Yes Like St. Mary", "ref": "Luke 1:26-38", "verse": "Then Mary said, 'Behold the maidservant of the Lord! Let it be to me according to your word.' And the angel departed from her.", "url": "https://www.biblegateway.com/passage/?search=Luke+1%3A26-38&version=NKJV", "message": "Tonight, every time the flag went up, you saluted and said the Promise: 'On my honour, I promise that I will do my best.' A promise is a yes. Tomorrow the Church celebrates the Annunciation, the day the archangel Gabriel brought a message to a young girl in Nazareth, probably only a few years older than you. Mary did not understand everything. She asked, 'How can this be?' But she trusted God and answered, 'Behold the maidservant of the Lord! Let it be to me according to your word.' That single yes changed the world: through it, the Son of God took flesh and came to save us. This is why the Coptic Church honours the Theotokos in every liturgy and sings her praises in the Theotokia every Kiahk. A colour party is nothing without the people who show up, stand straight, and do the small things properly. Citizenship is the same. It is not just a passport; it is saying yes to serving the people God has placed around you, in your country, your church, and your patrol. Great Lent is a season of small yeses: yes to fasting, yes to prayer, yes to giving. St. Mary's yes was not easy, but God gave her the grace to carry it. He offers the same grace to you.", "discussion": ["What is one thing God might be asking you to say yes to this Lent, at home, at school, or in the troop?", "St. Mary asked a question before she said yes. Is it wrong to ask God questions? How do we ask with trust instead of doubt?", "How is saying the Scout Promise every week like St. Mary's 'Let it be to me'? What would it look like to mean it?"], "prayer": "Lord Jesus Christ, who chose the Virgin Mary and gave her the courage to say yes, give us the same trusting heart. Help us keep our Promise to You, to our country, and to one another, and make us faithful citizens of Your Kingdom. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Colours Cup: Flag Ceremony Competition and Canada & Sea Trivia", "setup": "Part 1 (13 min): the pole stays at the front. Patrols wait in a horseshoe. One leader is the judge with a score sheet; one leader is the timekeeper. Each patrol appoints its own colour party leader, bearer, halyard handler, and two escorts. Part 2 (12 min): patrols sit in their corners with a whiteboard or paper for answers; the quizmaster stands in the middle with the shuffled trivia cards.", "materials": ["Flagpole with halyard and flag", "Judge score sheet (criteria listed in the rules)", "Stopwatch or phone timer", "Trivia cards from the table, one set", "One sheet of paper and marker per patrol for written answers", "Prize for the winning patrol: vegan treat or bragging rights on the troop board"], "rules": ["Part 1, Flag Ceremony (13 min). Patrols perform in an order drawn from a hat. Each patrol has 2.5 minutes: fold the flag from flat, advance as a colour party, attach and hoist, salute and recite the Scout Promise together, lower, and fold again.", "Judge scores out of 30: fold neat and leaf out (5), commands given correctly in order with warning and action words (5), marching in step and halt together (5), flag never touches the floor and is not twisted (5), raised briskly and lowered slowly (5), salute correct and Promise recited word for word (5).", "Deduct 2 points every time a leader must prompt the patrol. Deduct 5 if the flag touches the floor. The judge reads the score aloud with one compliment and one correction.", "Part 2, Trivia (12 min). Quizmaster reads a question. Patrols have 15 seconds to write one answer and hold it up together. Every correct patrol earns the points on the card (1, 2, or 3). No shouting answers; a patrol that calls out loses the points for that question.", "Play as many cards as time allows (aim for 15). Add trivia points to the ceremony score. Highest total wins the Colours Cup and lowers the flag at closing.", "Tie-break: sudden-death question with a 5-second answer window."], "variations": ["Short on time: skip the second fold in the ceremony and run only 10 trivia cards.", "Harder: the colour party must perform without the leader calling any command, and one scout must call the commands with their back to the pole.", "Easier or first-year scouts: allow the etiquette sheet to be held by one escort as a cue card.", "Bonus round: each patrol tells the troop one fact about the local waterway learned tonight for 2 extra points."]}, "tables": [{"caption": "Colour party commands", "headers": ["Command (warning... action)", "What everyone does", "Common error"], "rows": [["Troop... fall in", "Patrols form a horseshoe facing the pole, patrol leaders on the right, silent", "Talking, uneven lines"], ["Troop... attention", "Heels together, toes apart, arms straight, thumbs on seams, eyes front", "Hands in pockets, slouching"], ["Colour party... advance / halt", "Party marches in step, left foot first, halts one pace from the pole", "Out of step, stopping at different times"], ["Hoist the colours", "Handler raises the flag briskly, bearer feeds it out, secure halyard at the top", "Raising slowly, flag twisted, flag on the floor"], ["Troop... salute (hold) ... Two", "Right hand three-finger salute as the flag rises; drop on 'Two'; then the Scout Promise", "Wrong hand, fingers spread, dropping early"], ["Colour party... retire / Troop... at ease", "Party returns to patrols; left foot out, hands behind back", "Slouching before the command"]]}, {"caption": "Canada and sea trivia cards (points in brackets)", "headers": ["Question", "Answer", "Points"], "rows": [["On what date was the maple leaf flag first raised?", "February 15, 1965", "2"], ["What is the ratio of the Canadian flag's length to its height?", "2 to 1", "1"], ["How many points does the maple leaf on the flag have?", "11", "1"], ["What is Canada's motto (in English)?", "From sea to sea (A Mari Usque Ad Mare)", "2"], ["Name all five Great Lakes.", "Superior, Michigan, Huron, Erie, Ontario", "2"], ["Which Great Lake is entirely in the United States?", "Lake Michigan", "2"], ["Which canal joins Lake Ontario and Lake Erie?", "The Welland Canal", "2"], ["Which canal in Ottawa is a UNESCO World Heritage Site?", "The Rideau Canal", "2"], ["Which side of a boat is port?", "The left side when facing the bow", "1"], ["What colour is a starboard navigation light?", "Green", "1"], ["Which country has the longest coastline in the world?", "Canada (about 243,000 km)", "2"], ["What is one knot in kilometres per hour (nearest whole number)?", "About 2 km/h (1.852 km/h)", "3"], ["Who founded Scouting and in what year was the first camp?", "Robert Baden-Powell, 1907 (Brownsea Island)", "2"], ["What is the meaning of the three fingers in the Scout salute?", "The three parts of the Scout Promise", "1"], ["Which famous schooner appears on the Canadian dime?", "Bluenose", "3"], ["Which Coptic feast falls on April 7?", "The Annunciation", "1"], ["When was O Canada officially adopted as the national anthem?", "1980", "3"], ["How many feet are in a fathom?", "6 feet (about 1.8 m)", "2"]]}], "references": [{"label": "Canadian Heritage: Flag etiquette in Canada", "url": "https://www.canada.ca/en/canadian-heritage/services/flag-canada-etiquette.html", "why": "The official rules for displaying, raising, lowering, half-masting, and disposing of the flag; print the key points for each patrol."}, {"label": "Wikipedia: Flag of Canada", "url": "https://en.wikipedia.org/wiki/Flag_of_Canada", "why": "History of the 1965 flag debate, design details, and the meaning of the colours for the trivia round."}, {"label": "Wikipedia: Great Lakes", "url": "https://en.wikipedia.org/wiki/Great_Lakes", "why": "Facts and figures for the local waterway history segment."}, {"label": "YouTube search: Scouts colour party flag raising ceremony drill", "url": "https://www.youtube.com/results?search_query=scouts+colour+party+flag+raising+ceremony+drill", "why": "Watch a colour party in action to copy the pace of the commands and marching."}, {"label": "Scouts Canada: The Canadian Path", "url": "https://www.scouts.ca/programs/canadian-path/", "why": "Current wording of the Scout Promise and Law and the citizenship elements of the program."}, {"label": "Bible Gateway: Luke 1:26-38 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Luke+1%3A26-38&version=NKJV", "why": "Full Annunciation passage for the spiritual lesson."}], "visual": null, "takeHome": "Find out the name of the nearest body of water to your home and one fact about its history, and be ready to share it next week; bonus if you spot a Canadian flag flown incorrectly and can say which rule it breaks."}, {"n": 28, "date": "2027-04-13", "term": "Spring", "title": "Pioneering: Build & Launch", "theme": "Lashings, triangles, and a patrol catapult that actually fires", "sea": false, "calendar": ["Great Lent continues (Mar 8 to May 1). No food is planned tonight; if a snack is added it must be vegan. Do not use marshmallows as projectiles (they contain gelatin), use cotton balls or foam balls.", "Palm Sunday is Apr 25 and Holy Week begins Apr 26. Announce that Lesson 30 (Apr 27, Holy Tuesday) may be shortened or moved; leaders will confirm with the church this week.", "Spring regatta and summer camp sign-up forms go home tonight if available."], "objectives": ["Tie a tight square lashing, a shear lashing, and a tripod lashing from memory, with correct wrapping and frapping turns.", "Explain why triangles make a structure rigid and identify the triangles in their own catapult.", "Work as a patrol to build a working elastic-powered catapult from dowels and cord in under 25 minutes.", "Test, adjust, and describe one change that improved range or accuracy.", "Follow the launch-range safety rules without being reminded."], "materials": [{"item": "Hardwood dowel 19 mm (3/4 in) or 1x2 furring strip, 2.4 m (8 ft) lengths", "qty": "2 per patrol (10)", "note": "cut into the parts list before the meeting; reusable kit for future years; about $3 to $5 each"}, {"item": "Catapult parts per patrol, cut from the dowels: 2 x 60 cm rails, 2 x 40 cm base cross bars, 2 x 45 cm A-frame legs, 1 x 40 cm stop bar, 1 x 50 cm throwing arm", "qty": "1 set per patrol", "note": "label parts with tape: R, B, L, S, A"}, {"item": "Three spare 60 cm spars per patrol for the tripod lashing review", "qty": "3 per patrol", "note": "can be the rails and one leg before assembly"}, {"item": "Lashing cord: 3 mm sisal or braided nylon cut in 1.5 m lengths", "qty": "10 per patrol (50)", "note": "sisal grips better for beginners; whip or tape the ends"}, {"item": "Elastic power: 30 cm bungee cord loop or 4 heavy rubber bands (size 64 or 117B) chained", "qty": "2 per patrol", "note": "one spare per patrol; check for cracks"}, {"item": "Plastic soup spoon or small paper cup", "qty": "2 per patrol", "note": "this is the projectile cup; secure with duct tape"}, {"item": "Duct tape", "qty": "1 roll per 2 patrols", "note": "for the cup and padding the stop bar"}, {"item": "Foam padding or an old sock for the stop bar", "qty": "1 per patrol", "note": "prevents the arm from splitting"}, {"item": "Projectiles: cotton balls, pom-poms, or 4 cm foam balls", "qty": "20", "note": "soft only, nothing that can hurt an eye"}, {"item": "Safety glasses", "qty": "1 per launcher and 1 per leader", "note": "dollar store or hardware store; optional but recommended"}, {"item": "Tape measure 5 m, masking tape for the launch line and range marks, 2 buckets and 2 hula hoops for targets", "qty": "1 set", "note": "for the tournament"}, {"item": "Printed catapult diagram (draw it on the flip chart from the description in step 3)", "qty": "1 per patrol", "note": "a side view sketch is enough"}], "prep": ["Cut and label the dowels at home with a hand saw or mitre saw. Sand the cut ends so nobody gets a splinter. Bundle each patrol's set with an elastic.", "Build one complete catapult yourself the night before, following steps 3 to 5, so you know where the lashings go and how tight the elastic should be. Keep it as the demonstration model.", "Practise the three lashings until you can tie each in under two minutes using the Animated Knots links in the references.", "Draw a large side-view diagram of the catapult on the flip chart: base rectangle, A-frame at 30 cm from the rear, stop bar, arm hinged at the rear cross bar, elastic from the arm to the top of the A-frame.", "Mark the launch range on the hall floor with masking tape before scouts arrive: a launch line, then lines every 1 m out to 8 m, and set the two buckets at 3 m and 5 m with a hula hoop around each.", "Assign one leader per two patrols as a lashing coach and one leader as range safety officer for the tournament.", "Check rubber bands and bungees for cracks and replace any that are worn."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in by patrol, flag, Scout Promise, Lord's Prayer, announcements (Holy Week schedule), attendance"}, {"time": "6:25", "min": 40, "what": "Practical: triangles, lashing review, build the patrol catapult in stages, test and tune"}, {"time": "7:05", "min": 10, "what": "Spiritual: the wise builder on the rock (Matthew 7:24-27)"}, {"time": "7:15", "min": 25, "what": "Activity: catapult tournament, distance round then accuracy round, engineering points"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, untie and coil cord, dismissal"}], "practical": {"title": "Build a Patrol Catapult with Lashings", "intro": "Pioneering is the Scout craft of building useful structures from spars and rope, the same skills sailors used to rig masts and build rafts. Tonight each patrol builds a real catapult using only dowels, cord, and elastic. If your lashings are tight and your triangles are true, it will fire. If they are loose, it will wobble and fall apart, and that is the lesson.", "steps": [{"title": "Why triangles are strong", "min": 5, "detail": "Hand each patrol four spars and two cords and ask them to make a square with a lashing at each corner, then push on one corner. It folds into a diamond. Now add a diagonal spar across the square. It cannot fold. Explain: a triangle is the only shape whose sides cannot change angle without changing length, so a triangle of rigid sticks is rigid. Every bridge truss, sailing mast with shrouds, and roof uses triangles for this reason. Ask them to spot the triangles in the finished demonstration catapult: the A-frame is a triangle, the A-frame lashed to the rails makes side triangles, and even the elastic and arm form a triangle against the frame. Rule for tonight: if something wobbles, add a triangle or tighten a lashing."}, {"title": "Lashing review: square, shear, tripod", "min": 8, "detail": "Coach demonstrates each, patrols copy on spare spars. Square lashing (joins two spars at right angles): tie a clove hitch around the vertical spar just below where the cross spar will sit, and twist the short tail around the standing part so it will not slip. Lay the cross spar on top. Wrap: take the cord over the cross spar, behind the vertical, over the cross spar on the other side, behind the vertical, going around in a square path. Make three or four wrapping turns, each laid neatly inside the previous one, pulling hard every turn. Frap: change direction and make two or three frapping turns in the gap between the spars, around the wrapping turns, to cinch them. Finish with a clove hitch on the cross spar. Shear lashing (two spars that will open into an A): lay the spars side by side, clove hitch on one, seven or eight loose wrapping turns around both, two frapping turns between the spars, clove hitch on the other spar, then open the legs. Tripod lashing (three spars): lay them side by side with the middle spar's butt pointing the opposite way, clove hitch on an outer spar, weave six to eight turns over and under through the three spars in a figure-8 path, two frapping turns in each gap, clove hitch on the far spar, then stand and spread the legs. Each patrol stands a tripod and checks it holds a scout's hand pressing down."}, {"title": "Build the base frame", "min": 8, "detail": "Show the diagram. The base is a rectangle: the two 60 cm rails run front to back; the two 40 cm cross bars lie on top of the rails at the very front and the very rear. Each corner is a square lashing, four in total. Split the patrol: two pairs each take one cross bar and lash both of its ends at once, one scout holding the spars square while the other ties. Check squareness by measuring the diagonals with the tape measure: if they are equal (about 72 cm), the frame is square. The rear cross bar is the hinge for the throwing arm, so make sure it sits on top of the rails, not underneath. Push the frame at a corner. It will rack into a diamond a little, and that is fine, because the A-frame in the next step will lock it. Coach checks every lashing: can you slide the spar with your hand? Then it is too loose; add a frapping turn."}, {"title": "Build and mount the A-frame with its stop bar", "min": 8, "detail": "Shear-lash the two 45 cm legs together at one end with seven turns and two frapping turns, then spread the feet about 35 cm apart. Square-lash the 40 cm stop bar across the two legs 10 cm below the shear lashing, on the rear face of the A (the face that will look toward the arm's hinge). Pad the stop bar with foam or a sock taped on; this is what the throwing arm will slam into. Now stand the A-frame on the rails, 30 cm forward of the rear cross bar, and square-lash each foot to its rail. The A-frame should lean back very slightly toward the hinge (about 5 degrees) so the arm stops at roughly 45 degrees above horizontal. Look at the side view now: rail, A-frame leg, and rail-to-hinge distance make a triangle, so the whole base has stopped wobbling. Have one scout press down on the top of the A-frame while another pushes it sideways; if it moves, tighten the foot lashings."}, {"title": "Hinge the arm, add power and cup", "min": 7, "detail": "Tape the spoon or cup firmly to one end of the 50 cm arm with the bowl facing up when the arm rests against the stop bar; three wraps of duct tape. Hinge: lay the other end of the arm on the rear cross bar, centred between the rails, and tie a loose lashing: three turns of cord around the arm and the cross bar together, finished with a reef knot, leaving about 1 cm of slack so the arm can swing up and down freely but cannot slide sideways. Power: hook the elastic loop around the arm about 35 cm from the hinge (two-thirds of the way up) and stretch the other end over the top of the A-frame at the shear lashing. The elastic now pulls the arm forward and up toward the stop bar. Cocking: a scout pulls the arm back and down toward the rear until it is nearly horizontal, another loads a cotton ball in the cup, the launcher releases on 'Fire!' and the arm swings forward, hits the padded stop bar, and the projectile flies on. If the elastic is too weak, add a band; if the frame lifts, hold the rear cross bar down or add a scout's foot on each rail."}, {"title": "Test and tune", "min": 4, "detail": "Each patrol fires three test shots from the launch line into the empty range with the safety officer watching. Coach them to tune one variable at a time and note what changed: move the elastic higher on the arm for more speed, move the stop bar slightly forward or back to change the launch angle (higher stop means a steeper, shorter shot), shorten the elastic for more tension, or retighten the A-frame feet if the shot wanders sideways. Ask each patrol to say out loud what they changed and whether it helped. Untidy or loose lashings are fixed now, not during the tournament, because engineering points are judged before the first competition shot."}], "tips": ["Tightness comes from pulling every single wrapping turn, not from the last frapping turn. Lean back with your body weight.", "Wrapping turns must lie flat beside each other, not on top of each other. Crossed turns slip.", "Keep the clove hitches on the correct spars: square lashing starts on the vertical and ends on the horizontal.", "If a patrol falls behind, a coach ties one base corner for them while they watch, then they do the rest.", "Have patrols count the triangles in their finished catapult; the best ones have at least six."], "safety": ["Soft projectiles only (cotton balls, pom-poms, foam). Never fire coins, erasers, stones, or hard candy.", "Nobody stands downrange while a catapult is cocked. The range safety officer says 'Range clear' before every shot and 'Cease fire' to stop.", "Launchers wear safety glasses; everyone else stays behind the launch line. A cocked arm can snap forward if the elastic slips.", "Do not pull the arm past horizontal or stretch rubber bands beyond about three times their length; they can snap and sting.", "Watch for splinters on cut dowel ends and keep cord away from necks during pulling."]}, "spiritual": {"title": "Built on the Rock", "ref": "Matthew 7:24-27", "verse": "Therefore whoever hears these sayings of Mine, and does them, I will liken him to a wise man who built his house on the rock: and the rain descended, the floods came, and the winds blew and beat on that house; and it did not fall, for it was founded on the rock.", "url": "https://www.biblegateway.com/passage/?search=Matthew+7%3A24-27&version=NKJV", "message": "Tonight some catapults fired far and some wobbled. The difference was never the elastic. It was the base: square lashings pulled tight, an A-frame lashed to the rails, triangles everywhere. The same elastic on a loose frame just shakes the frame apart. Jesus finishes His Sermon on the Mount with a builder's story. Two men build houses. Both hear His words. Both houses get hit by the same rain, floods, and wind. Only one stands, and the difference is the foundation: the wise man 'hears these sayings of Mine, and does them.' Hearing is not enough; doing is the lashing that ties your life to the Rock. Notice that the storm comes to both houses. Being a Christian does not mean no storms; it means a foundation that holds. St. Antony the Great went into the desert and was beaten by every kind of temptation, but he stood, because his life was tied to Christ by prayer, Scripture, and obedience. In Great Lent we are tightening our lashings: fasting, the Agpeya prayers, confession, Communion, kindness at home. Each is a wrapping turn. None looks impressive by itself, but together they make a life that does not fall when the wind blows.", "discussion": ["What are the 'wrapping turns' in your life right now, the small daily habits that tie you to Christ? Which one is loose?", "Jesus says the wise man 'hears and does.' Name one thing you have heard in church this Lent that you could actually do this week.", "Storms hit both houses. Why do you think God allows storms to hit people who are trying to follow Him?"], "prayer": "Lord Jesus, our Rock, teach us not only to hear Your words but to do them. Tighten every loose place in our lives and build us on You, so that when the floods and winds come we will stand. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Catapult Tournament: Distance, Accuracy, Engineering", "setup": "Range down the long axis of the hall. Masking tape launch line; range lines every 1 m from 1 m to 8 m; buckets at 3 m and 5 m with a hula hoop laid flat around each. Patrols line up behind the launch line in a queue with their catapult and 6 projectiles. One leader is range safety officer, one is scorer with a clipboard, one is engineering judge. Spectators stay 2 m behind the launch line.", "materials": ["Each patrol's catapult and elastic spare", "20 cotton balls or foam balls", "Tape measure 5 m and range lines already taped", "2 buckets, 2 hula hoops", "Score sheet with three columns: Engineering, Distance, Accuracy", "Safety glasses for launchers"], "rules": ["Round 0, Engineering (3 min): before any shots, the judge inspects each catapult and awards up to 10 points: tight lashings that do not slide (4), correct clove hitches at start and finish of every lashing (2), frame square and A-frame vertical (2), neat frapping turns (2).", "Round 1, Distance (10 min): each patrol fires 3 shots in turn. The rear of the catapult base must stay behind the launch line and only two scouts may hold it down. Distance is measured from the launch line to where the projectile first touches the floor, to the nearest 0.5 m. Best of 3 counts. Score 2 points per full metre (a 4.5 m shot scores 8). Any shot that hits the ceiling scores 0 for that shot.", "Round 2, Accuracy (10 min): each patrol fires 3 shots at the 3 m bucket, then 3 shots at the 5 m bucket. In the bucket 5 points; inside the hoop but not in the bucket 3 points; touching the hoop 1 point. Maximum 30.", "Range safety: the officer calls 'Range clear' before each shot and 'Cease fire' if anyone crosses the line. A patrol that fires without 'Range clear' loses 5 points. Retrieve projectiles only when the officer says 'Retrieve'.", "Total = Engineering + Distance + Accuracy. Highest total wins. Tie-break: one sudden-death shot at the 5 m bucket, closest wins.", "Last 2 minutes: every patrol untie all lashings, coil the cords (Lesson 19), and bundle the dowels for next year."], "variations": ["Short on time: drop to 2 shots per round and skip the 5 m target.", "Harder: after Round 1, patrols get 2 minutes to modify their catapult before Round 2, and must explain what they changed for 2 bonus points.", "Easier: leaders pre-lash the base frame and patrols build only the A-frame, arm, and elastic.", "Rainy-day bonus: patrols name their catapult and give a 30-second 'engineer's briefing' on the triangles in it; best briefing earns 3 points."]}, "tables": [{"caption": "Catapult parts list per patrol (19 mm dowel or 1x2)", "headers": ["Part", "Length", "Qty", "Joined by"], "rows": [["Rails (R)", "60 cm", "2", "Square lashing to both cross bars and to A-frame feet"], ["Base cross bars (B)", "40 cm", "2", "Square lashing at the four corners; rear bar is the hinge"], ["A-frame legs (L)", "45 cm", "2", "Shear lashing at the top; square lashing at each foot to a rail"], ["Stop bar (S)", "40 cm", "1", "Square lashing to both legs, 10 cm below the shear lashing, padded"], ["Throwing arm (A)", "50 cm", "1", "Loose three-turn hinge lashing to the rear cross bar; spoon taped at the tip"], ["Elastic", "30 cm loop", "1 plus spare", "Hooked around the arm at 35 cm and over the top of the A-frame"]]}], "references": [{"label": "Animated Knots: Square Lashing", "url": "https://www.animatedknots.com/square-lashing-knot", "why": "Step-by-step photos of the clove hitch, wrapping turns, and frapping turns; watch it twice before the meeting."}, {"label": "Animated Knots: Shear Lashing", "url": "https://www.animatedknots.com/shear-lashing-knot", "why": "The A-frame lashing, including how loose the wraps should be so the legs can open."}, {"label": "Animated Knots: Tripod Lashing", "url": "https://www.animatedknots.com/tripod-lashing-knot", "why": "The over-under weave for three spars, used in the review."}, {"label": "YouTube search: scout pioneering catapult lashing dowels", "url": "https://www.youtube.com/results?search_query=scout+pioneering+catapult+lashing+dowels", "why": "See several small lashed catapult designs and how the elastic and stop bar are arranged."}, {"label": "Scouts Canada: Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Pioneering and camping skill requirements this lesson helps scouts complete."}, {"label": "Bible Gateway: Matthew 7:24-27 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+7%3A24-27&version=NKJV", "why": "The full wise and foolish builders passage."}], "visual": null, "takeHome": "Find one triangle in a structure near your home (a bridge, roof truss, bike frame, or crane), take a photo or sketch it, and be ready to explain what it is holding rigid."}, {"n": 29, "date": "2027-04-20", "term": "Spring", "title": "Marine Life & Conservation", "theme": "Ontario fish, invasive species, and fishing the right way", "sea": true, "calendar": ["Great Lent continues (Mar 8 to May 1). No fish may be eaten in Great Lent in the Coptic tradition, so tonight's fish are for identifying, not tasting. Snacks must be vegan.", "Palm Sunday is this Sunday, Apr 25 (Hosanna Sunday). The activity weaves palm crosses for scouts to bring to the liturgy; check with Abouna whether the church would like extra crosses for the congregation.", "Holy Week begins Apr 26. Announce the plan for Lesson 30 (Holy Tuesday, Apr 27): the shortened schedule or a moved night, as confirmed with the church.", "Ontario Family Fishing events: the next free licence-free weekend for adults is usually Mother's Day weekend in May; check ontario.ca/page/fishing for this year's dates."], "objectives": ["Identify eight common Ontario sport fish from key features (fins, spots, bars, mouth shape).", "Name four aquatic invasive species in Ontario and explain how each spreads and what harm it does.", "Perform the Clean, Drain, Dry steps for a boat, paddle, or fishing gear.", "State who needs an Ontario fishing licence and where to check seasons and limits.", "Demonstrate catch and release handling and a safe overhead cast with a practice plug."], "materials": [{"item": "Fish ID cards: 8 species, one card with the name, one card with the description (from the table)", "qty": "1 set per patrol (5 sets)", "note": "print the description table and cut; add a picture from a web image search if you can"}, {"item": "Invasive species cards with name and one fact", "qty": "1 set", "note": "zebra mussel, quagga mussel, round goby, sea lamprey, Asian carps, rusty crayfish, Eurasian watermilfoil, phragmites"}, {"item": "Spincast rod and reel with a rubber practice casting plug (no hook)", "qty": "2", "note": "borrow from a fishing family; plug is $3 at a tackle shop"}, {"item": "Hula hoops or buckets as casting targets", "qty": "3", "note": "reuse from Lesson 28"}, {"item": "Needle-nose pliers, a barbless hook glued into a cork, a soft toy fish or rolled towel", "qty": "1 set", "note": "for the catch and release demo; never a loose hook"}, {"item": "Palm strips for crosses, about 45 to 50 cm long and 1.5 cm wide (Sabal or Phoenix palm fronds), soaked in water 30 min before", "qty": "3 per scout (75)", "note": "order through the church's Palm Sunday supplier; soaking makes them bendable"}, {"item": "Scissors and a spray bottle of water", "qty": "3", "note": "keep palms damp"}, {"item": "Small bucket, sponge, towel, and a toy boat or paddle", "qty": "1", "note": "Clean, Drain, Dry demonstration"}, {"item": "Whiteboard or flip chart and markers", "qty": "1", "note": ""}, {"item": "Vegan snack: dried fruit or crackers", "qty": "for 25", "note": "Great Lent; check allergies"}], "prep": ["Print and cut the fish ID cards and invasive species cards. If possible add a photo to each fish name card using a web image search for the species name.", "Soak the palm strips in a bucket of water for 30 minutes before the meeting so they bend without splitting. Practise weaving one cross yourself using the rules in the activity; it takes three tries to get smooth.", "Read the current Ontario fishing regulations summary (link in references), especially who needs a licence, and note your local Fisheries Management Zone number.", "Read the Invading Species Awareness Program site and note the current 'watch list' species to mention.", "Set up a casting lane at one end of the hall with three hoops at 3, 5, and 7 m. Test the practice plug: it should not have a hook.", "Ask Abouna whether extra palm crosses are wanted for Palm Sunday and how they should be delivered.", "Assign leaders: one for the fish ID and invasives station, one for the casting and release station, one to run the palm cross weaving."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in by patrol, flag, Scout Promise, Lord's Prayer, Palm Sunday announcement, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: Ontario fish ID, invasive species and Clean Drain Dry, licence rules, casting and catch and release"}, {"time": "7:05", "min": 10, "what": "Spiritual: the miraculous catch of fish (John 21:1-14) and Hosanna Sunday"}, {"time": "7:15", "min": 25, "what": "Activity: palm cross weaving, then fish ID matching game by patrol"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer with Hosanna, dismissal"}], "practical": {"title": "Fish, Invaders, and Fishing Right", "intro": "Sea Scouts spend their summers on Ontario lakes and rivers, and those waters are full of life that depends on us. Tonight you learn to recognise the fish you will see, the invaders that are quietly wrecking the Great Lakes, and how to fish legally and gently. A scout who knows the water protects the water.", "steps": [{"title": "Ontario fish identification", "min": 10, "detail": "Write the eight species on the board and teach the quick tells from the table. Walleye: gold and olive, big glassy eyes, a white tip on the lower tail lobe, sharp teeth. Northern pike: long torpedo body, duck-bill snout, light bean-shaped spots on a dark green body, dorsal fin far back. Muskellunge: like a pike but dark bars or spots on a light body and pointed tail lobes; rare and released. Largemouth bass: the upper jaw extends past the eye when the mouth is closed, dark horizontal stripe along the side. Smallmouth bass: jaw ends below the eye, vertical bronze bars, red eyes. Yellow perch: yellow with six to nine dark vertical bars, two separate dorsal fins, orange lower fins. Lake trout: deep water, white spots on grey, deeply forked tail. Rainbow trout: pink stripe along the side, small black spots over the whole body and tail. Then the two-step method: first look at body shape (torpedo, deep and flat, or rounded), then look at the pattern (bars, spots, stripe). Quiz with the picture cards: hold one up, patrols shout the name."}, {"title": "Invasive species and why they matter", "min": 8, "detail": "An invasive species is one that arrived from elsewhere, usually by ship ballast water or by people, and spreads with no natural predators. Zebra and quagga mussels came from the Caspian Sea in ballast water in the 1980s; one female lays a million eggs a year, they coat docks, intake pipes, and boat hulls, cut swimmers' feet, and filter out the plankton that young fish need. Round goby (a small bottom fish with a black spot on the front dorsal fin) eats native fish eggs and can be mistaken for a native sculpin; it is illegal to use as bait. Sea lamprey, an eel-like parasite with a sucker mouth, came through the Welland Canal and killed most Lake Ontario lake trout before control programs began; each lamprey kills up to 18 kg of fish. Asian carps (bighead, silver, grass, black) are not yet established in Ontario, and keeping them out is the goal. Also mention rusty crayfish, spiny water flea, Eurasian watermilfoil, and phragmites (the tall reed that chokes shorelines). Rule: it is illegal in Ontario to possess or transport most invasive species, alive or dead. Ask: what is the one thing scouts can do? Answer: never move water, plants, or animals from one lake to another."}, {"title": "Clean, Drain, Dry", "min": 5, "detail": "Demonstrate with the toy boat, paddle, bucket, and sponge. CLEAN: before leaving the launch, inspect the hull, trailer, paddles, anchor line, PFDs, and fishing gear, and remove every bit of plant, mud, or mussel; rinse with hot water (over 50 C) or a pressure washer if available. DRAIN: pull the drain plug, tip the boat, empty the bilge, live wells, bailers, and coolers on land at the launch site, never into the next lake. Ontario law requires the drain plug to be out while trailering. DRY: leave everything in the sun for at least five days before using it in a different body of water, because mussel larvae and water fleas survive for days in a damp cooler. Also: dump unused bait in the garbage on land, not in the water, and never release aquarium pets or bait fish. Have each patrol recite the three words and one action for each while pointing to the model."}, {"title": "Fishing law basics", "min": 6, "detail": "Ontario residents under 18 and 65 and over may fish without a licence but must follow all seasons and limits; everyone from 18 to 64 needs an Outdoors Card plus a Sport or Conservation fishing licence, and non-residents need their own licence. Ontario is divided into 20 Fisheries Management Zones, each with its own open seasons and catch limits: for example, walleye and bass have closed seasons in spring to protect spawning, and there are size limits (slot sizes) on many lakes. The rules are in the free Ontario Fishing Regulations Summary at ontario.ca/page/fishing. Licence-free family fishing days happen several times a year, including the Family Day weekend and the first week of July. Conservation officers can inspect your catch, and fines for fishing out of season or over the limit can be hundreds of dollars. Lead-free tackle is encouraged because loons swallow lost sinkers. Ask each patrol to find the zone number for your area on the map on the site (leader shows it)."}, {"title": "Casting and catch and release", "min": 11, "detail": "Casting with a spincast reel (the one with a push button): hold the rod in the dominant hand with the reel below, press and hold the thumb button, look at the target, bring the rod tip back to about the 1 o'clock position over the shoulder, then sweep forward smoothly and release the button as the rod passes about 11 o'clock in front. Stop the rod at 10 o'clock and let the plug fly. Late release goes into the ground; early release goes straight up. Check behind you before every cast ('clear behind'). Each scout casts twice at the hoops. Catch and release, demonstrated on the toy fish: decide quickly, keep the fish in the water as much as possible, wet your hands so you do not strip the protective slime, hold it horizontally supporting the belly, never by the gills or hanging by the jaw for big fish, back out the hook with pliers (barbless hooks make this easy; pinch barbs flat with pliers), cut the line if the hook is deep, and revive the fish by holding it upright facing the current until it kicks away on its own. A fish that is bleeding heavily from the gills should be kept if it is legal to keep."}], "tips": ["Bass are the confusing pair. Teach 'jaw past the eye means largemouth' and the rest follows.", "Scouts remember invasives by damage stories (cut feet, dead lake trout). Tell the story, then the name.", "Give every scout at least two casts; the game is the reward for waiting quietly in line.", "If you have a fishing family in the parish, invite the parent to run the casting station; scouts love a real angler."], "safety": ["No hooks in the hall. The practice plug is rubber; the demo hook is glued into a cork and handled only by a leader.", "Casting lane: one caster at a time, everyone else behind the caster, 'clear behind' before every cast.", "Palm strips have sharp edges when dry; keep them damp and warn about paper-cut style nicks.", "Great Lent: any snack is vegan; check nut allergies before serving dried fruit mixes."]}, "spiritual": {"title": "Cast on the Right Side", "ref": "John 21:1-14", "verse": "And He said to them, 'Cast the net on the right side of the boat, and you will find some.' So they cast, and now they were not able to draw it in because of the multitude of fish.", "url": "https://www.biblegateway.com/passage/?search=John+21%3A1-14&version=NKJV", "message": "After the Resurrection, seven disciples went back to what they knew: fishing on the Sea of Tiberias. They fished all night, real fishermen using real skill, and caught nothing. At dawn a man on the shore said, 'Cast the net on the right side of the boat.' They did not yet know it was Jesus, but they obeyed, and the net filled with 153 large fish and did not break. Tonight you learned that skill on the water matters: knowing the fish, the rules, how to handle a catch gently. The disciples had all that skill. What they lacked was Christ's word. When they obeyed Him, the skill finally bore fruit. St. John recognised Him first: 'It is the Lord!' Peter jumped into the water to reach Him. This Sunday is Hosanna Sunday, Palm Sunday, when the crowd waved palm branches and shouted 'Hosanna! Blessed is He who comes in the name of the Lord!' We will weave palm crosses tonight, and in a few days the same crowd's cry turns to 'Crucify Him.' The disciples in John 21 had already failed Him once and run away. Yet He stood on the shore, cooked them breakfast, and gave them a second chance. Whatever this Lent has been for you, He is on the shore. Cast on the right side. Obey His word, and let Him fill the net.", "discussion": ["The disciples worked all night with real skill and caught nothing. When has your best effort not been enough, and what did you learn?", "John recognised Jesus first; Peter acted first. Which one are you more like, and how can the two work together in a patrol?", "Palm Sunday and Good Friday are five days apart. How can we keep our 'Hosanna' from turning into indifference by the end of Holy Week?"], "prayer": "Lord Jesus, who stood on the shore and filled the empty nets, fill our lives with Your word and make our skills bear fruit. Bless the waters of our land, and as we lift our palms this Sunday, keep our hearts faithful to You through Your Passion to Your Resurrection. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Palm Cross Weaving and Fish ID Match", "setup": "Part 1 (15 min): patrols at tables with damp palm strips, scissors, and the spray bottle; one leader demonstrates from the front, step by step, with a large strip so everyone can see, and patrol leaders help their patrol. Part 2 (10 min): clear the tables, each patrol gets one shuffled set of fish ID cards (8 name cards, 8 description cards) plus the invasive cards mixed in.", "materials": ["Soaked palm strips, 3 per scout", "Scissors, spray bottle of water", "Fish ID card sets, 1 per patrol", "Invasive species cards, 1 set per patrol", "Timer and score sheet"], "rules": ["Palm cross, single-strip method. Step 1: hold the strip vertically. About one third of the way down from the top, fold the top part toward you and down to the right so it makes a right angle. The long part hangs down (this becomes the bottom of the cross); the short part points right.", "Step 2: take the right-pointing piece and fold it back behind the vertical strip so it comes out pointing left. Then fold it forward across the front of the vertical strip so it points right again. You have now wrapped it once around the vertical strip, making a small square at the centre.", "Step 3: take the long piece hanging down and fold it up behind the square so it sticks up above the square. Then fold it forward over the top of the square and tuck it down through the front, under the horizontal band you made in Step 2, so it hangs down again. The loop left above the square is the top of the cross; adjust it to about 3 cm.", "Step 4: take the right-pointing piece and thread its end through the centre square from the right side to the left (under the band). Pull until a loop of about 4 cm is left on the right; that loop is the right arm. Now the end is on the left side.", "Step 5: fold the left end back on itself to make a 4 cm loop (the left arm) and tuck the end into the centre square from the left, under the band. Snug everything gently, trim the bottom tail to about 10 cm, and spray the cross once. Make a second one for a family member.", "Scouts who struggle: use the two-strip method. Cut a 25 cm and a 15 cm strip, lay them in a cross one third from the top, and bind the centre with a narrow 20 cm strip wrapped diagonally both ways and tucked under itself.", "Fish ID Match (10 min): on 'Go', patrols match each fish name card to its description card and sort the invasive cards into a separate 'INVADER' pile. First patrol to shout 'Done' stops the clock; the leader checks. Score 2 points per correct pair, 1 point per correct invader, minus 1 for each wrong pair. Then a 2-minute lightning round: the leader reads a description and the first patrol to hold up the right name card gets 2 points.", "Highest score wins and chooses which patrol delivers the extra palm crosses to Abouna."], "variations": ["Short on time: weave one cross only and play the lightning round without the matching round.", "Harder: add three fake fish descriptions to each set (e.g., 'a purple striped fish with three tails') that must be sorted out.", "Easier: pin the fish pictures on the wall with names and let patrols use them as a reference during the match.", "Bonus: each patrol must say one Clean, Drain, Dry action for 1 extra point."]}, "tables": [{"caption": "Ontario sport fish quick identification", "headers": ["Species", "Key features", "Where and when"], "rows": [["Walleye", "Gold-olive, large glassy eyes, white tip on lower tail lobe, sharp teeth", "Lakes and rivers, dawn and dusk; spring closed season"], ["Northern pike", "Long torpedo body, duck-bill snout, light bean-shaped spots on dark green, dorsal fin far back", "Weedy bays; open most of the year"], ["Muskellunge", "Pike shape, dark bars on light body, pointed tail lobes, can exceed 1.2 m", "Larger lakes; short season, mostly released"], ["Largemouth bass", "Upper jaw extends past the eye, dark horizontal stripe, deep body", "Warm weedy water; closed in spring"], ["Smallmouth bass", "Jaw ends below the eye, vertical bronze bars, red eyes", "Rocky shores and rivers; closed in spring"], ["Yellow perch", "Yellow with 6 to 9 dark vertical bars, two dorsal fins, orange lower fins", "Everywhere, all year, great for beginners"], ["Lake trout", "Grey with white spots, deeply forked tail, cold deep water", "Deep lakes; ice fishing and early spring"], ["Rainbow trout", "Pink stripe along the side, small black spots on body and tail", "Great Lakes tributaries, spring and fall runs"]]}, {"caption": "Aquatic invasive species in Ontario", "headers": ["Species", "How it spreads", "Harm", "Scout action"], "rows": [["Zebra and quagga mussels", "Ship ballast water, larvae in bilge and bait buckets, adults on hulls", "Clog pipes, cut feet, strip plankton, coat everything", "Clean, Drain, Dry; never move water between lakes"], ["Round goby", "Ballast water, moved as live bait", "Eats native fish eggs, outcompetes sculpins", "Never use as bait; report sightings"], ["Sea lamprey", "Swam in through shipping canals", "Parasite that kills up to 18 kg of fish each", "Support control programs; report"], ["Asian carps", "Live food trade, flooding from US rivers", "Would take over the Great Lakes food web", "Never release live fish; report"], ["Rusty crayfish", "Dumped bait buckets", "Eats plants and eggs, displaces native crayfish", "Dump bait on land in the garbage"], ["Eurasian watermilfoil and phragmites", "Fragments on trailers, propellers, and paddles", "Choke bays and shorelines, block boating", "Remove every plant fragment before leaving the launch"]]}], "references": [{"label": "Ontario: Fishing (regulations summary and licences)", "url": "https://www.ontario.ca/page/fishing", "why": "Who needs a licence, licence-free days, and the zone-by-zone seasons and limits."}, {"label": "Invading Species Awareness Program (Ontario)", "url": "https://www.invadingspecies.com/", "why": "Fact sheets and photos for each invader, the Clean Drain Dry campaign, and how to report a sighting."}, {"label": "Wikipedia: Zebra mussel", "url": "https://en.wikipedia.org/wiki/Zebra_mussel", "why": "History of the Great Lakes invasion and numbers for the leader's story."}, {"label": "YouTube search: how to make a palm cross from one palm strip", "url": "https://www.youtube.com/results?search_query=how+to+make+a+palm+cross+from+one+palm+strip", "why": "Watch a demonstration before the meeting so you can show the folds smoothly."}, {"label": "YouTube search: how to cast a spincast reel for beginners", "url": "https://www.youtube.com/results?search_query=how+to+cast+a+spincast+reel+for+beginners", "why": "The push-button cast shown in slow motion."}, {"label": "Bible Gateway: John 21:1-14 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+21%3A1-14&version=NKJV", "why": "The miraculous catch passage for the spiritual lesson."}], "visual": null, "takeHome": "Bring your palm cross to the Palm Sunday liturgy, and at home find out which Fisheries Management Zone your family's favourite lake or river is in and when walleye season opens there."}, {"n": 30, "date": "2027-04-27", "term": "Spring", "title": "Holy Week Reflection Night", "theme": "The ship's log, quiet review, care of gear, and the Servant King", "sea": false, "calendar": ["HOLY TUESDAY of Pascha Week (Holy Week Apr 26 to May 1; Resurrection Sunday May 2). Strict fast: vegan food only, and many families fast until sunset. Do not serve any snack tonight.", "CONFIRM WITH THE CHURCH: Pascha evening prayers are usually held every night of Holy Week, often starting around 7:00 pm, and the hall may be needed. Ask Abouna and the church board at least a week ahead whether to (a) keep the meeting, (b) run the 60-minute version, or (c) move the meeting to Monday Apr 26 or cancel and invite scouts to attend Pascha together in uniform.", "60-MINUTE ALTERNATIVE SCHEDULE (5:45 to 6:45 pm, or any hour before the church service): 5 min opening (Lord's Prayer only, no flag drill, attendance), 20 min practical (ship's log and journaling, then rope and first-aid kit care; skip the review stations), 10 min spiritual, 20 min activity (hymn 10 min, shoe shine 10 min), 5 min closing. Then walk together into the Pascha service.", "Tone for tonight: no loud games, no competitions, no prizes. Speak quietly, dim the lights a little, and treat the hall as an extension of the church.", "Next week (May 4) is Bright Week: Christ is Risen! Red eggs and a celebration are planned; no fasting."], "objectives": ["Explain what a ship's log records and why it is kept, and write a proper log entry for a meeting.", "Write a personal reflection on the year's Sea Scout journey using guided prompts.", "Inspect a rope and decide whether it is safe, retired, or needs repair.", "Check a first-aid kit against a standard list and write a restock list.", "Sing the
