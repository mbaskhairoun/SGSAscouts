 "tables": [{"caption": "International Morse code alphabet", "headers": ["Letter", "Code", "Letter", "Code", "Letter", "Code"], "rows": [["A", ". -", "J", ". - - -", "S", ". . ."], ["B", "- . . .", "K", "- . -", "T", "-"], ["C", "- . - .", "L", ". - . .", "U", ". . -"], ["D", "- . .", "M", "- -", "V", ". . . -"], ["E", ".", "N", "- .", "W", ". - -"], ["F", ". . - .", "O", "- - -", "X", "- . . -"], ["G", "- - .", "P", ". - - .", "Y", "- . - -"], ["H", ". . . .", "Q", "- - . -", "Z", "- - . ."], ["I", ". .", "R", ". - .", "SOS", ". . . - - - . . ."]]}, {"caption": "Semaphore letters by flag position (from the sender's view; right arm first)", "headers": ["Letter", "Right arm", "Left arm"], "rows": [["A", "Low (45 down)", "Down"], ["B", "Horizontal", "Down"], ["C", "High (45 up)", "Down"], ["D", "Straight up", "Down"], ["E", "Down", "High (45 up)"], ["F", "Down", "Horizontal"], ["G", "Down", "Low (45 down)"], ["H", "Low", "Horizontal across the body"], ["I", "Low", "High across the body"], ["K", "Low", "Straight up"], ["L", "Low", "High"], ["M", "Low", "Horizontal"], ["N", "Low", "Low"], ["O", "Horizontal", "High across the body"], ["P", "Horizontal", "Straight up"], ["Q", "Horizontal", "High"], ["R", "Horizontal", "Horizontal"], ["S", "Horizontal", "Low"], ["T", "High", "Straight up"], ["U", "High", "High"], ["Y", "High", "Horizontal"], ["J", "Straight up", "Horizontal"], ["V", "Straight up", "Low"], ["W", "High across the body", "Horizontal"], ["X", "High across the body", "Low"], ["Z", "Horizontal across the body", "Low"], ["Rest / space", "Down, crossed", "Down, crossed"], ["Error", "Wave both up and down", "Wave both up and down"]]}], "references": [{"label": "Wikipedia: Flag semaphore", "url": "https://en.wikipedia.org/wiki/Flag_semaphore", "why": "The full alphabet with stick figure diagrams to print for each scout"}, {"label": "Wikipedia: Morse code", "url": "https://en.wikipedia.org/wiki/Morse_code", "why": "Alphabet, timing rules and history"}, {"label": "Wikipedia: Battle of the Atlantic", "url": "https://en.wikipedia.org/wiki/Battle_of_the_Atlantic", "why": "Facts and figures on Canada's role for the Remembrance step"}, {"label": "Wikipedia: Royal Canadian Navy", "url": "https://en.wikipedia.org/wiki/Royal_Canadian_Navy", "why": "History of the RCN from 13 ships to the fourth largest navy"}, {"label": "YouTube search: flag semaphore alphabet tutorial", "url": "https://www.youtube.com/results?search_query=flag+semaphore+alphabet+tutorial", "why": "Watch a person send the alphabet so you can copy the arm positions"}, {"label": "John 15:13 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+15%3A13&version=NKJV", "why": "The verse for the spiritual lesson"}], "visual": "semaphore", "takeHome": "Attend or watch a Remembrance Day ceremony tomorrow at 11 am, then teach a family member to send SOS with a flashlight and your family's initials in semaphore."}, {"n": 10, "date": "2026-11-17", "term": "Fall", "title": "Rules of the Road: Buoys & Navigation Lights", "theme": "Reading the harbour: Canadian buoys, boat lights, who gives way, and sound signals", "sea": true, "calendar": ["The Nativity (Advent) fast begins next Tuesday, Nov 25. Remind scouts and families that next week's galley lesson will be fully fasting-friendly (vegan).", "Tonight is not a fast day. No food is planned this week.", "Kiahk praises (Saturday night tasbeha) begin in December; watch the church bulletin for dates."], "objectives": ["Identify Canadian port-hand and starboard-hand lateral buoys by colour, shape, number and light, and explain the phrase red right returning.", "Recognize the four cardinal buoys (north, east, south, west) and state which side of each is safe water.", "Name the colour and direction of port, starboard, stern and masthead lights, and tell from a light pattern which way another vessel is moving.", "Apply the basic give-way and stand-on rules for head-on, crossing, overtaking, and sail versus power situations.", "Give the meaning of one, two, three and five short blasts and one prolonged blast."], "materials": [{"item": "Red construction paper cones taped to pylons or chairs (starboard-hand nun buoys)", "qty": "8", "note": "reusable; number them 2, 4, 6, 8 with marker"}, {"item": "Green flat-topped paper cans (paper cups or cylinders) on pylons (port-hand can buoys)", "qty": "8", "note": "number them 1, 3, 5, 7"}, {"item": "Cardinal buoys: black and yellow paper wrapped on cardboard tubes with two paper cones on top", "qty": "4 (N, E, S, W)", "note": "see the buoy table for band order and cone direction"}, {"item": "White buoy with an orange diamond (hazard) on a pylon", "qty": "1", "note": "printer paper and orange marker"}, {"item": "Pylons or chairs to hold the buoys", "qty": "20", "note": "church hall chairs work fine"}, {"item": "Flashlights with red and green cellophane taped over the lens, plus one white", "qty": "3", "note": "navigation light demo; reusable"}, {"item": "Blindfolds (bandanas or sleep masks)", "qty": "5", "note": "one per patrol"}, {"item": "Whistle", "qty": "1", "note": "sound signals"}, {"item": "Masking tape, stopwatch, scoresheet, markers", "qty": "1 set", "note": ""}, {"item": "Printed copy of the two tables in this lesson", "qty": "1 per patrol (5)", "note": "study sheet during the activity"}, {"item": "Toy boats or paper boat cut-outs", "qty": "6", "note": "tabletop crossing scenarios"}], "prep": ["Read the buoy and navigation light pages of the Transport Canada Safe Boating Guide (link in references) and the two tables below; they contain everything you need to teach.", "Watch one short video from the YouTube search link on Canadian buoys so you can picture red right returning.", "Build the buoys the night before: red cone on a pylon = starboard nun, green flat cup on a pylon = port can. Make four cardinal buoys with the correct band order and cone directions from the table.", "Tape cellophane on the flashlights (red, green) and test them in a dim room.", "Print the tables, one copy per patrol, and one large copy for the wall.", "Arrive early and lay out the Human Harbour channel at one end of the hall (see activity setup) so it is ready by 7:15; a second leader can finish it during the spiritual lesson.", "Prepare six quick tabletop scenarios with the toy boats (head-on, crossing from the right, crossing from the left, overtaking, sail vs power, ship in channel)."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, announcements (Nativity fast starts Nov 25), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: lateral and cardinal buoys, navigation lights, give-way rules, sound signals."}, {"time": "7:05", "min": 10, "what": "Spiritual: John 8:12, Christ the light that guides the ship home."}, {"time": "7:15", "min": 25, "what": "Activity: Human Harbour, blindfolded helmsman steered through the buoy channel by patrol helm commands."}, {"time": "7:40", "min": 5, "what": "Closing: recap the two rhymes, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Rules of the Road on Canadian Waters", "intro": "On the water there are no lanes, no traffic lights and no brakes, and a boat keeps sliding after you turn the wheel. So every Canadian boater follows the same Collision Regulations, and the Canadian buoy system marks the safe path like signs on a highway. Tonight you will learn to read the buoys, read another boat's lights at night, know who gives way, and understand the horn signals, so that you can bring a boat into a harbour safely.", "steps": [{"title": "Why rules of the road?", "min": 5, "detail": "Ask: what happens at a four-way stop if nobody knows the rules? Now imagine the same corner with no road, no signs and a boat that takes twenty metres to stop. Hold up one red and one green buoy. Explain that a buoy is a floating sign anchored to the bottom that tells you where the deep water is, where the rocks are, and which side to pass. Lights on a boat at night tell other boats where it is and which way it is heading. Sound signals are the boat's horn. Every summer camp, regatta and canoe trip on a real waterway depends on these three things, so tonight every scout will learn to read them."}, {"title": "Lateral buoys: red right returning", "min": 9, "detail": "Canada uses the same buoy system as the USA (IALA Region B). A starboard-hand buoy is RED, cone-shaped on top (called a nun), carries EVEN numbers, and flashes a red light at night. A port-hand buoy is GREEN, flat-topped (called a can), carries ODD numbers, and flashes green. The rule: when you are RETURNING from open water into a harbour, or heading upstream on a river, keep the red buoys on your RIGHT (starboard) side and the green on your left. Say red right returning and have the troop repeat it three times. Heading out to open water the colours swap sides, so green is on your right. Buoy numbers increase as you head in. Demonstrate: place a red and a green buoy 2 m apart, push a chair boat between them heading into harbour with red on the right, then turn the chair around and show that green is now on the right. A junction (bifurcation) buoy has red and green horizontal bands; the top colour tells you the main channel, so treat it as that colour."}, {"title": "Cardinal and special buoys", "min": 7, "detail": "Cardinal buoys are black and yellow and tell you where the safe water is by compass direction. NORTH: black on top, yellow below, two cones pointing up; pass to the north of it. SOUTH: yellow on top, black below, cones pointing down; pass to the south. EAST: black, yellow, black bands, cones base to base like an egg; pass to the east. WEST: yellow, black, yellow, cones point to point like a wineglass with a waist (W for waist); pass to the west. Memory trick: the black band sits where the cones point. At night they flash white: north continuously, east three flashes, south six plus one long, west nine, like the hours on a clock. Other buoys: fairway (red and white vertical stripes) means safe water, pass on either side; isolated danger (black with a red band and two black balls) means keep well clear; yellow buoys mark special areas such as anchorages; white buoys with orange shapes are for small craft: diamond = hazard, diamond with a cross = keep out, circle = a control such as a speed limit. Hold up each model as you describe it."}, {"title": "Navigation lights", "min": 8, "detail": "Dim the hall lights. Every boat under way at night shows a RED light on the port (left) side and a GREEN light on the starboard (right) side, each shining from dead ahead to about 112.5 degrees back on its own side, plus a WHITE stern light facing aft. A power boat also shows a white masthead light facing forward and higher up. A sailboat under sail shows only red, green and the stern light, no masthead light. Have three scouts stand as a boat: red flashlight on the left hand, green on the right, white behind held high. Walk the boat toward the troop: seeing red and green together with white above means a power boat is coming straight at you. Turn the boat sideways: seeing only green means you are looking at its starboard side and it is crossing from your left to your right. Seeing only white means you are behind it and overtaking. Teach the rhymes: Green to green, red to red, perfect safety, go ahead. If to starboard red appear, it is your duty to keep clear."}, {"title": "Give-way and stand-on", "min": 7, "detail": "The give-way vessel must take early and obvious action: turn clearly or slow down. The stand-on vessel holds course and speed, but must still act to avoid a collision if the other boat does nothing. Run the six scenarios with the toy boats and let patrols call the answer. (1) Head-on: both turn to starboard and pass port to port, like driving on the right. (2) Crossing: the boat that sees the other on its STARBOARD side gives way; the zone from dead ahead to 112.5 degrees on your right is the danger zone. (3) Overtaking: the overtaking boat always gives way, sail or power. (4) Power gives way to sail, unless the sailboat is overtaking. (5) Small boats keep clear of big ships, vessels fishing, and vessels that cannot manoeuvre; never impede a ship in a narrow channel. (6) In a channel keep to the starboard side. Point out that a canoe or dinghy should assume the ship cannot see it."}, {"title": "Sound signals", "min": 4, "detail": "A short blast lasts about one second; a prolonged blast lasts four to six seconds. Blow the whistle for each: one short = I am turning to starboard; two short = I am turning to port; three short = my engine is going astern (backing up); five or more short = danger, or I do not understand what you are doing. One prolonged = I am leaving a dock or approaching a blind bend. In fog a power boat sounds one prolonged blast every two minutes, and a sailboat sounds one prolonged plus two short every two minutes. Finish with a lightning quiz: blow a pattern, the first patrol to shout the correct meaning scores a point."}], "tips": ["Port and left both have four letters; port wine is red. Starboard, right and green are the other set.", "The most common mistake is keeping red on the right when LEAVING the harbour. Always ask first: am I returning or leaving?", "For cardinal buoys, have scouts make the cone shapes with their hands: both hands up for north, both down for south, wrists together for east (egg), fingertips together for west (waist).", "In the crossing rule, tell scouts to look at their own right shoulder: if another boat is out there, you give way.", "Keep the toy boat scenarios fast; scouts learn the rules by calling out answers, not by listening to a lecture."], "safety": ["Blindfolded scouts walk only, never run; a leader shadows each blindfolded helmsman within arm's reach.", "Clear the channel area of bags, cables and loose chairs before the activity.", "Do not shine flashlights into anyone's eyes.", "Whistle blasts are loud indoors; hold the whistle away from the group and warn scouts with sensitive hearing."]}, "spiritual": {"title": "The Light of the World", "ref": "John 8:12", "verse": "Then Jesus spoke to them again, saying, \"I am the light of the world. He who follows Me shall not walk in darkness, but have the light of life.", "url": "https://www.biblegateway.com/passage/?search=John+8%3A12&version=NKJV", "message": "Tonight you learned that a harbour at night is full of lights, and every one of them means something. A red and a green light tell you which way a boat is heading. A lighthouse tells you where the rocks are. Without lights, even the best sailor is only guessing in the dark. Jesus said, \"I am the light of the world.\" He did not say He would point to a light; He said He is the light. Just as a helmsman fixes his eyes on the harbour light and steers straight for it, we fix our eyes on Christ and the safe channel becomes clear. Next Tuesday the Nativity fast begins. For 43 days the Church prepares for the Light who came into the world in Bethlehem, and during Kiahk we sing praises through the night, waiting for the dawn. Fasting is like dimming the other lights in the harbour, the extra food, the noise, the screens, so we can see the one light that matters. St. Antony went into the desert for the same reason: fewer distractions, clearer sight of God. A buoy only helps the boat that follows it, and Christ's light only guides the heart that steers toward it. Decide tonight which light you are steering by.", "discussion": ["What lights in your life pull your attention away from steering toward Christ?", "Buoys warn us before we hit the rocks. Who or what warns you before a bad decision, and do you listen?", "How could the Nativity fast, which starts next week, help you see Christ's light more clearly this year?"], "prayer": "Lord Jesus Christ, Light of the world, shine on our path and keep us clear of the rocks. As we begin the Nativity fast, dim every distraction so that we may see You alone and follow You safely home. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Human Harbour", "setup": "At one end of the hall build a channel about 15 m long using five pairs of buoys on pylons: red on one side, green on the other, gates 1.5 m wide, with the channel bending left then right so it is not a straight line. Place one cardinal buoy (announce which one, for example North) near the middle where the helmsman must pass on the correct side, and the orange-diamond hazard buoy just off the line. Tape a start line labelled OPEN WATER and a 1 m by 1 m taped box labelled DOCK at the far end. Patrols line up behind the start line. One leader is timekeeper, one is judge with the penalty sheet, one shadows the helmsman.", "materials": ["Buoys on pylons from the practical", "Blindfolds", "Stopwatch", "Masking tape", "Scoresheet and marker", "Red and green flashlights for round 2"], "rules": ["Each patrol chooses a helmsman, who is blindfolded at the start line. The rest of the patrol stays behind the start line and may not enter the channel.", "The helmsman is RETURNING to harbour, so must keep every red buoy on the right and every green buoy on the left, pass the cardinal buoy on its safe side, and stay clear of the hazard buoy.", "The patrol may use ONLY these helm commands: Port 10 (turn left a little), Port 20 (turn left a lot), Starboard 10, Starboard 20, Midships (straighten up), Ahead slow (walk), Stop, Astern (two steps back). Any other words, such as left, right, go around the chair, or a scout's name, cost a 5 second penalty each.", "The timer starts on the first Ahead slow and stops when the helmsman has both feet inside the DOCK box.", "Penalties added to the time: touching a buoy 10 s; passing a buoy on the wrong side 20 s; walking outside the channel 20 s; passing the cardinal buoy on the unsafe side 15 s; touching the hazard buoy 15 s.", "Each patrol runs two different helmsmen. Add both times; lowest total wins. Patrols waiting their turn study the buoy sheet and quiz each other.", "Round 2, Night Passage (if time allows): dim the lights. A leader walks across the channel holding the red and green flashlights as a crossing boat. When the patrol sees the leader's RED light on the helmsman's starboard side they must call Stop (give way) until the boat passes; if they see GREEN they may keep going. Calling Stop when not required, or failing to stop when required, costs 20 s."], "variations": ["Easier: straight channel with no cardinal buoy and 2 m gates.", "Harder: the helmsman is LEAVING harbour, so colours are reversed; or require the patrol to say Toot once before every starboard turn and Toot toot before every port turn, with a 5 s penalty for a missed signal.", "Short on time: one helmsman per patrol and no round 2."]}, "tables": [{"caption": "Canadian buoys at a glance", "headers": ["Buoy", "Colour and shape", "Number / light", "What to do"], "rows": [["Starboard-hand (lateral)", "Red, cone top (nun)", "Even numbers; red flashing light", "Keep on your RIGHT when returning to harbour or heading upstream"], ["Port-hand (lateral)", "Green, flat top (can)", "Odd numbers; green flashing light", "Keep on your LEFT when returning; on your right when leaving"], ["Junction (bifurcation)", "Red and green horizontal bands", "Light matches top colour", "Top colour shows the preferred channel; treat as that colour"], ["North cardinal", "Black over yellow; two cones pointing UP", "White light, continuous quick flashing", "Pass to the NORTH of it"], ["East cardinal", "Black, yellow, black; cones base to base (egg)", "White light, 3 flashes", "Pass to the EAST of it"], ["South cardinal", "Yellow over black; two cones pointing DOWN", "White light, 6 flashes plus 1 long", "Pass to the SOUTH of it"], ["West cardinal", "Yellow, black, yellow; cones point to point (waist)", "White light, 9 flashes", "Pass to the WEST of it"], ["Fairway (safe water)", "Red and white vertical stripes, round top", "White light", "Safe water all around; pass either side"], ["Isolated danger", "Black with red band, two black balls on top", "White light, 2 flashes", "Danger under the buoy; keep well clear"], ["Hazard", "White with orange diamond", "Yellow light", "Rock, shoal or wreck nearby; keep clear"], ["Keep out", "White with orange diamond and cross", "Yellow light", "Do not enter (dam, rapids, swim area)"], ["Control", "White with orange circle", "Yellow light", "Restriction inside the circle, such as speed limit or no wake"]]}, {"caption": "Lights and sound signals", "headers": ["Signal", "Meaning"], "rows": [["Red light", "The other vessel's PORT side; if it is on your starboard side, you give way"], ["Green light", "The other vessel's STARBOARD side; you are the stand-on vessel in a crossing"], ["Red and green together, white above", "Power vessel coming straight at you; both turn to starboard"], ["White light only", "You are behind it (overtaking, so you give way) or it is at anchor"], ["1 short blast (1 s)", "I am altering course to starboard"], ["2 short blasts", "I am altering course to port"], ["3 short blasts", "My engines are going astern"], ["5 or more short blasts", "Danger, or I do not understand your intentions"], ["1 prolonged blast (4 to 6 s)", "Leaving a dock or approaching a blind bend; in fog, power vessel every 2 minutes"], ["1 prolonged + 2 short every 2 min", "Sailing vessel under way in fog"]]}], "references": [{"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Official colour pictures of every Canadian buoy, navigation light diagrams and the give-way rules; print the buoy page for the wall."}, {"label": "Wikipedia: Lateral mark", "url": "https://en.wikipedia.org/wiki/Lateral_mark", "why": "Explains why Region B (Canada and USA) uses red to starboard and how junction buoys work."}, {"label": "Wikipedia: Cardinal mark", "url": "https://en.wikipedia.org/wiki/Cardinal_mark", "why": "Diagrams of the four cardinal buoys, their cones and light rhythms."}, {"label": "Wikipedia: Navigation light", "url": "https://en.wikipedia.org/wiki/Navigation_light", "why": "Arc diagrams for sidelights, stern light and masthead light."}, {"label": "YouTube search: Canadian buoys explained red right returning", "url": "https://www.youtube.com/results?search_query=canadian+buoys+explained+red+right+returning", "why": "Pick a short video (under 5 minutes) to watch before the meeting or show on a phone during step 2."}, {"label": "Bible Gateway: John 8:12 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+8%3A12&version=NKJV", "why": "The spiritual verse in the Orthodox Study Bible translation."}], "visual": "lateral-buoys", "takeHome": "Next time you are in a car at night, point out which vehicles are coming toward you and which are going away using only their lights, then draw the four cardinal buoys from memory and bring the drawing next week."}, {"n": 11, "date": "2026-11-24", "term": "Fall", "title": "Galley Cooking & Nutrition", "theme": "Planning, cooking and cleaning up a fasting-friendly camp meal safely", "sea": false, "calendar": ["The Nativity (Advent) fast begins tomorrow, Nov 25, and runs 43 days to Coptic Christmas on Jan 7. Everything cooked or eaten tonight is vegan so scouts practise fasting-friendly cooking.", "Collect the troop allergy list before tonight: hummus contains sesame (tahini); tortillas contain wheat. Have a sesame-free spread (mashed chickpeas with lemon and oil, no tahini) and a gluten-free wrap available.", "Kiahk begins in about two weeks; encourage families to attend Saturday night praises."], "objectives": ["Plan a balanced one-day camp menu for a patrol using the Canada's Food Guide plate (half vegetables and fruit, quarter whole grains, quarter protein).", "Set up, light and shut down a single-burner butane or propane camp stove safely and recite five stove rules.", "Practise galley hygiene: 20 second hand washing, the 4 to 60 degrees C danger zone, and the three-basin dish wash.", "Prepare a no-cook hummus wrap and describe how to cook one-pot koshari-style lentils and rice.", "Explain what makes a meal fasting-friendly in the Coptic Orthodox tradition and read a food label for hidden animal ingredients."], "materials": [{"item": "Large flour tortillas (check label: no milk or lard)", "qty": "3 packs of 10", "note": "plus 1 pack gluten-free wraps"}, {"item": "Hummus, 227 g tubs", "qty": "5 (1 per patrol)", "note": "or make from canned chickpeas, see recipe; sesame allergy check"}, {"item": "Canned chickpeas, 540 mL", "qty": "6", "note": "5 for patrol boxes, 1 for the hummus demo"}, {"item": "Cucumbers, carrots, red peppers, baby spinach", "qty": "5 cucumbers, 10 carrots, 5 peppers, 1 large box spinach", "note": "washed before the meeting; ask families to donate"}, {"item": "Black olives (jar), canned corn 341 mL, dates, bananas, apples (secret ingredient), tortilla chips", "qty": "1 jar, 5 cans, 500 g, 10, 5, 2 bags", "note": ""}, {"item": "Olive oil, lemons, salt, pepper, cumin, paprika, cinnamon", "qty": "1 bottle, 5 lemons, 1 each spice", "note": "reusable pantry kit"}, {"item": "Koshari demo: brown lentils 250 mL, long grain rice 250 mL, 1 onion, tomato sauce 398 mL, 1 clove garlic, vinegar", "qty": "1 batch (6 servings)", "note": "pre-cook at home if the hall does not allow a stove"}, {"item": "Single-burner butane stove with canister (or electric hot plate), 3 L pot with lid, wooden spoon", "qty": "1", "note": "confirm hall permission for open flame"}, {"item": "Cutting boards, plastic or butter knives, peelers, box grater, mixing bowls, forks, spoons, plates", "qty": "1 board, 4 knives, 1 grater, 2 bowls per patrol; plates for all", "note": "reusable kit"}, {"item": "Three wash basins, dish soap, unscented bleach, dish cloths, tea towels, paper towel, hand soap, garbage bags, nitrile gloves", "qty": "1 set", "note": "hygiene station"}, {"item": "Printed recipe cards and the food guide plate diagram", "qty": "1 per patrol", "note": "from the tables below"}, {"item": "Decoy item: one non-vegan snack (for example a chocolate bar listing milk) placed in each patrol box", "qty": "5", "note": "tests label reading"}], "prep": ["Confirm with the church office whether a butane stove may be lit indoors in the hall. If not, use an electric hot plate, or cook the koshari at home and demonstrate the stove unlit with the canister removed.", "Collect allergy information (sesame, wheat, nuts, legumes) and buy the substitutes listed. Keep all packaging so labels can be checked at the meeting.", "Wash and dry all produce at home. Pack five identical patrol boxes: 6 tortillas, 1 tub hummus, 1 can chickpeas, 1 cucumber, 2 carrots, 1 pepper, 2 handfuls spinach, 10 olives, 1 can corn, 10 dates, 2 bananas, 1 handful chips, 1 lemon, small containers of oil, salt, cumin, paprika, cinnamon, and the decoy snack.", "Set up a hand-washing station (or sanitizer if no sink nearby) and the three-basin wash line on a side table before scouts arrive.", "Print recipe cards and the food guide plate; draw the plate on a flip chart.", "Have a fire extinguisher and a pot lid beside the stove table; bring a lighter and a spare canister.", "Ask two parents to help with knife supervision and judging."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (fast starts tomorrow, allergy check), attendance, everyone washes hands."}, {"time": "6:25", "min": 40, "what": "Practical: menu planning, fasting-friendly food, stove safety, galley hygiene, hummus wraps, one-pot koshari."}, {"time": "7:05", "min": 10, "what": "Spiritual: Daniel's fast (Daniel 1:8-16) and why the Church fasts."}, {"time": "7:15", "min": 25, "what": "Activity: Iron Chef, Fasting Edition patrol cook-off with fixed ingredients and a secret ingredient."}, {"time": "7:40", "min": 5, "what": "Closing: recap, wash-up check, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Galley Skills: Plan, Cook, Clean", "intro": "On a ship the kitchen is called the galley, and a crew that eats well works well. Tonight you will learn how to plan camp meals that actually feed you, how to run a camp stove without burning the tent down, how to keep everyone from getting sick, and how to make two fasting-friendly meals you can cook at camp or at home during the Nativity fast, which starts tomorrow.", "steps": [{"title": "Meal planning for camp", "min": 8, "detail": "Draw the Canada's Food Guide plate on the flip chart: half the plate vegetables and fruit, one quarter whole grains (rice, oats, whole wheat wraps), one quarter protein foods (lentils, beans, chickpeas, tofu, nuts and seeds, and outside fasting seasons eggs, fish and meat). Water is the drink of choice. Then teach the four planning steps. One: count people and meals, for example 8 scouts, Friday supper to Sunday lunch = 6 meals. Two: choose a menu with at least one hot meal a day and one no-cook meal for quick starts. Three: list quantities per person: about 80 g dry rice, 60 g dry lentils, 100 g pasta, 2 wraps, 1 piece of fruit per meal. Four: check cooler space (anything that must stay under 4 degrees C), weight if you carry it, the number of pots, and how you will pack out garbage. Give each patrol three minutes to write a fasting-friendly Saturday menu (breakfast, lunch, supper) on a card, then read two aloud."}, {"title": "Fasting-friendly food and label reading", "min": 4, "detail": "In the Coptic Orthodox Church a fasting meal has no meat, poultry, fish, eggs, or dairy (fish is allowed on some days of the Nativity fast; ask your priest). Hold up the tortilla and hummus packages and read the ingredients together. Hidden animal ingredients to spot: milk powder, whey, casein, butter, lard, gelatin, and in some traditions honey. Good vegan proteins for camp: lentils, chickpeas, beans, tofu, peanut butter and seeds (allergy caution), oats. Point out that chips are vegan but not nutritious; fasting food should still fill the food guide plate. Show the decoy snack from a patrol box and have scouts find the word milk on the label."}, {"title": "Stove safety: butane and propane", "min": 8, "detail": "Demonstrate with the stove on a flat, stable, non-flammable table with nothing flammable within 1 m. Butane single-burner: check the canister is straight with the notch aligned, lock the lever, turn the knob to ignite, and adjust to a steady blue flame. If the flame goes out, turn the knob off, wait 30 seconds for gas to clear, then relight. Never use a pot wider than the burner; a pot that overhangs the canister side reflects heat onto the canister and can make it explode. Propane: screw the cylinder on hand-tight, check for leaks with soapy water (bubbles mean leak, do not light), open the valve slowly, hold the lighter at the burner before turning on the gas. Rules for both: outdoors or a well-ventilated space only, never inside a tent (carbon monoxide and fire), roll up sleeves and tie back hair, never leave a lit stove, turn off at the knob and let it cool before removing the canister, store canisters upright and away from heat. Grease fire: smother with the lid, never water. Know where the extinguisher is."}, {"title": "Galley hygiene", "min": 6, "detail": "Wash hands with soap for 20 seconds (sing the Lord's Prayer at speed) before touching food, after the washroom, and after touching raw meat outside fasting seasons. The danger zone is 4 to 60 degrees C: bacteria multiply fast there, so keep cold food cold in a cooler with ice packs and hot food hot, and throw out cooked food left out more than two hours. Use a separate board for raw meat, wash produce, and cover food from flies. The three-basin wash: basin one, hot soapy water and a scrub; basin two, clean hot rinse; basin three, sanitizer made with 5 mL (1 teaspoon) of unscented bleach in 4 L of cool water, dip for one minute, then air dry on a clean towel, do not wipe. Strain food bits from the dishwater into the garbage and pour the water into a sump hole at least 60 m from any lake or stream. Have two scouts demonstrate the three basins with the demo dishes."}, {"title": "No-cook hummus wraps", "min": 7, "detail": "Demonstrate one wrap, then patrols each make one to share. Quick hummus from a can: drain a 540 mL can of chickpeas, keeping 60 mL of the liquid, mash in a bowl with a fork or potato masher, add the juice of one lemon, 30 mL olive oil, one clove of minced garlic, 2.5 mL salt and 2.5 mL cumin, and mash until spreadable, adding the reserved liquid a spoon at a time. (Tahini, 30 mL, makes it classic but contains sesame.) Build the wrap: spread 45 mL hummus over the tortilla leaving a 3 cm border, add cucumber sticks, grated carrot, pepper strips, spinach and a few olives, sprinkle paprika, fold the two sides in, then roll tightly from the bottom and cut on a diagonal. Knife skills: curl the fingertips of the holding hand into a claw, cut round vegetables in half first so they sit on a flat side, and keep the blade pointed away from the body."}, {"title": "One-pot koshari-style lentils and rice", "min": 7, "detail": "Koshari is Egypt's national street food and a perfect fasting camp meal: cheap, filling, one pot. Recipe for 6: heat 30 mL oil, brown one diced onion 5 minutes and set half aside for topping. Add 250 mL rinsed brown or green lentils and 750 mL water, bring to a boil, simmer 15 minutes. Add 250 mL rinsed long grain rice, 5 mL cumin, 5 mL coriander, 5 mL salt and 500 mL more water, cover, cook on low 15 to 18 minutes until the water is absorbed, then rest 5 minutes off the heat. Sauce: warm a 398 mL can of tomato sauce with one minced garlic clove, 15 mL vinegar and a pinch of chili. Serve lentils and rice topped with sauce and the crispy onions; add 250 mL cooked macaroni and a handful of chickpeas for the full version. At the meeting show the finished pot and let every scout taste a spoonful. Talk through the timing: lentils first because they take longer than rice."}], "tips": ["Keep the stove demonstration at a separate table with a rope or chairs marking a 1 m no-go line for scouts.", "Rotate jobs inside the patrol so every scout handles a knife under supervision and every scout washes a dish.", "If the hall has no sink, bring a 20 L water jug with a tap and a catch bucket for hand washing.", "Common mistake: overfilling a wrap. Less filling and a tight roll beats a wrap that falls apart.", "Have scouts say the five stove rules back to you before you light the burner: flat surface, clear 1 m, pot not wider than the burner, never in a tent, never unattended."], "safety": ["Allergies: check the troop list; sesame (hummus), wheat (tortillas) and legume allergies are the main risks tonight. Label every box and keep substitutes separate.", "Only a leader lights or moves the stove; scouts stay behind the 1 m line. Keep a lid and fire extinguisher beside the stove.", "Use plastic or butter knives for scouts; leaders do any cutting that needs a sharp knife.", "Wipe up spills immediately to prevent slips; nothing hot is carried across the hall.", "Any food that touches the floor goes in the garbage."]}, "spiritual": {"title": "Daniel's Fast: Training the Whole Person", "ref": "Daniel 1:8-16", "verse": "Please test your servants for ten days, and let them be given vegetables to eat and water to drink.\" ... And at the end of ten days their features appeared better and fatter in flesh than all the young men who ate the portion of the king's delicacies.", "url": "https://www.biblegateway.com/passage/?search=Daniel+1%3A8-16&version=NKJV", "message": "Daniel was a teenager, probably about your age, taken as a captive to Babylon. The king offered him the best food in the empire, but Daniel \"purposed in his heart\" not to eat it, and asked for vegetables and water instead. After ten days he and his friends looked healthier and stronger than everyone else, and God gave them wisdom ten times greater than the king's advisors. Tonight you cooked fasting food, and tomorrow the Church begins the 43-day Nativity fast. Notice that Daniel's fast was not about food being bad; it was about deciding who he belonged to before he even sat down at the table. The Church fasts the same way: we say no to a small thing so that we learn to say yes to God in big things. St. Antony, St. Mina and Pope Kyrillos VI all fasted, and they became the strongest people of their age, not the weakest. But fasting without prayer is just a diet, so the Church joins the fast with the Agpeya prayers, the Kiahk praises and giving to the poor. A galley crew plans the menu before the trip; a Christian decides before the fast what he will give up and what he will give. Plan your fast tonight, like Daniel, and God will do the rest.", "discussion": ["Daniel decided before the food arrived. What decision could you make tonight about the Nativity fast before it starts tomorrow?", "Fasting without prayer is just a diet. What will you add to your fast this year: an Agpeya prayer, Kiahk praises, a kindness?", "Why do you think God let Daniel look healthier than the others after only ten days?"], "prayer": "Lord, You fed Daniel with vegetables and water and made him wise and strong. Bless our Nativity fast, feed our bodies with simple food and our hearts with prayer, and prepare us to welcome You at Your Nativity. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Iron Chef: Fasting Edition", "setup": "One table per patrol with its sealed ingredient box, cutting board, knives, bowls and plates, plus a judges' table at the front and the three-basin wash line at the side. Assign roles inside each patrol: head chef, two prep cooks, plater, dishwasher, presenter. Three leaders or parents are judges with scoresheets. Everyone washes hands before the box is opened.", "materials": ["5 identical patrol boxes (contents listed in the table below)", "Secret ingredient: 1 apple per patrol, kept hidden until the start", "Judges' scoresheets and pens", "Timer visible to all", "Three-basin wash station, garbage bags, paper towel"], "rules": ["Boxes open on the whistle. The leader reveals the secret ingredient (apples); it must appear in at least one dish.", "Patrols have 15 minutes to make two dishes: one savoury (a wrap, salad or dip plate) and one sweet or snack (for example cinnamon apple and date bites, banana and date wrap, or chickpea and corn salad). One judging plate of each dish, plus a taste for every scout in the patrol.", "Every dish must be fasting-friendly (vegan). Each box contains one decoy item with milk in the ingredients; a patrol that uses it loses 10 points. Spotting it and setting it aside earns 2 bonus points if the presenter names the animal ingredient.", "Only plastic or butter knives; claw grip on the holding hand. A judge who sees an unsafe cut calls Knives down and the patrol loses 30 seconds.", "At the 15 minute whistle hands go up. Each presenter has 30 seconds to name the dishes and explain which parts of the food guide plate they cover.", "Each judge scores out of 30: taste 10, food guide balance 5, creativity and use of the secret ingredient 5, presentation 5, cleanliness and teamwork 5. Total out of 90 across three judges.", "Clean-up counts: station wiped, food waste in garbage, dishes through all three basins by 7:38. A patrol that is not clean by then loses 5 points.", "The winning patrol is named Galley Chiefs and gets to plan the menu (with a leader) for the next troop camp."], "variations": ["Short on time: one dish only, 10 minutes, judges score taste, balance and cleanliness out of 20.", "Harder: give every ingredient a point cost (tortilla 2, hummus 3, vegetables 1 each, chips 2, dates 2) and cap each patrol at 12 points to teach budgeting.", "Larger troop: run two heats of the cook-off with judges tasting between heats, or pair patrols."]}, "tables": [{"caption": "One-pot koshari-style lentils and rice (fasting-friendly)", "headers": ["Ingredient", "For 6", "For 12", "Notes"], "rows": [["Vegetable oil", "30 mL", "60 mL", "for browning the onion"], ["Onion, diced", "1", "2", "keep half for the crispy topping"], ["Brown or green lentils, rinsed", "250 mL (1 cup)", "500 mL", "start these first, 15 min"], ["Long grain rice, rinsed", "250 mL (1 cup)", "500 mL", "add after the lentils"], ["Water", "1.25 L total", "2.5 L", "750 mL with lentils, 500 mL with rice"], ["Cumin, coriander, salt", "5 mL each", "10 mL each", "add with the rice"], ["Tomato sauce", "1 can (398 mL)", "2 cans", "heat with 1 garlic clove, 15 mL vinegar, pinch of chili"], ["Optional: cooked macaroni and chickpeas", "250 mL each", "500 mL each", "for the full koshari"]]}, {"caption": "Iron Chef patrol box contents (identical for every patrol)", "headers": ["Item", "Quantity", "Food group"], "rows": [["Flour tortillas (plus gluten-free if needed)", "6", "Whole grains"], ["Hummus (or tahini-free chickpea mash)", "1 tub, 227 g", "Protein"], ["Canned chickpeas, drained", "1 can", "Protein"], ["Cucumber, carrots, red pepper, spinach", "1, 2, 1, 2 handfuls", "Vegetables"], ["Canned corn, olives", "1 can, 10", "Vegetables"], ["Dates, bananas", "10, 2", "Fruit"], ["Tortilla chips", "1 handful", "Grain (treat)"], ["Lemon, olive oil, salt, cumin, paprika, cinnamon", "1 lemon, small containers", "Flavour"], ["Decoy snack (contains milk)", "1", "Not fasting-friendly, do not use"], ["Secret ingredient (revealed at start)", "1 apple", "Fruit"]]}], "references": [{"label": "Wikipedia: Canada's Food Guide", "url": "https://en.wikipedia.org/wiki/Canada%27s_Food_Guide", "why": "Summary of the plate model (half vegetables and fruit, quarter grains, quarter protein) used in step 1."}, {"label": "Wikipedia: Kushari", "url": "https://en.wikipedia.org/wiki/Kushari", "why": "Background on Egypt's national dish so the leader can tell its story."}, {"label": "YouTube search: butane camp stove safety", "url": "https://www.youtube.com/results?search_query=butane+camp+stove+safety+how+to+use", "why": "Watch a 3 to 5 minute video on setting up and lighting a single-burner stove before demonstrating."}, {"label": "Scouts Canada: Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Camping skill requirements that include menu planning, stove use and dish washing; tick off badge stages tonight."}, {"label": "Coptic Orthodox Church Network", "url": "https://www.copticchurch.net/", "why": "Fasting calendar and articles on the Nativity fast to share with families."}, {"label": "Bible Gateway: Daniel 1:8-16 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Daniel+1%3A8-16&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": null, "takeHome": "Cook one fasting-friendly meal for your family this week (koshari or hummus wraps), take a photo, and be ready to tell your patrol which parts of the food guide plate were on the table."}, {"n": 12, "date": "2026-12-01", "term": "Fall", "title": "Water Safety & Cold Water", "theme": "Lifejackets, the 1-10-1 rule, hypothermia, reach-throw-don't-go, throw bags and Ontario ice", "sea": true, "calendar": ["Nativity fast (day 7 of 43). No food tonight; if a snack is offered it must be vegan.", "The Coptic month of Kiahk begins around Dec 10 and Saturday night Kiahk praises start soon after; announce the church schedule.", "Ontario lakes and ponds will begin to freeze this month; tonight's ice safety section is timely for scouts who skate or snowmobile."], "objectives": ["Name the Canadian lifejacket and PFD types, check a PFD for approval and fit, and explain why Scouts wear one at all times on the water.", "Recite the 1-10-1 rule of cold water immersion and describe what to do in each phase.", "Recognize mild, moderate and severe hypothermia and give the correct first aid for each.", "Explain reach, throw, don't go, and throw a rescue bag accurately to 10 m.", "State the Lifesaving Society ice thickness guidelines and the self-rescue steps if you fall through ice."], "materials": [{"item": "Lifejackets and PFDs of different types (keyhole lifejacket, vest PFD, inflatable PFD if available), various sizes", "qty": "5 or more", "note": "borrow from families, the church camp or a local Scout group"}, {"item": "Throw bags with 15 to 20 m of floating rope (or a stuff sack with 15 m of 8 mm polypropylene rope)", "qty": "3", "note": "reusable; about $30 each"}, {"item": "Hula hoops (targets)", "qty": "3", "note": ""}, {"item": "Gym mats or blankets", "qty": "3", "note": "victim zone for throws"}, {"item": "Wool blankets, a toque, a foil emergency blanket, chemical hand warmers", "qty": "2, 1, 1, 4", "note": "hypothermia treatment demo"}, {"item": "Bucket of ice water and towels", "qty": "1 bucket, 3 towels", "note": "optional 20 second hand test for cold shock"}, {"item": "Printed 1-10-1 poster and hypothermia table", "qty": "1 large, 1 per patrol", "note": "from the tables below"}, {"item": "Stopwatch, masking tape, tape measure, scoresheet", "qty": "1 set", "note": ""}, {"item": "Paddle or broom handle and a towel", "qty": "1 each", "note": "reach demo"}], "prep": ["Read the Transport Canada Safe Boating Guide sections on lifejackets and cold water, and the Lifesaving Society ice safety page (links in references).", "Watch a video from the YouTube search on the 1-10-1 rule (Dr. Gordon Giesbrecht) so you can describe cold shock confidently.", "Collect lifejackets and PFDs; check each for a Transport Canada or Canadian Coast Guard approval label, working buckles and zips, and no rips. Bring one clearly damaged or unapproved one as a bad example if you can.", "Practise the throw bag underhand throw in a park so you can demonstrate a 10 m throw on the first try; learn to restuff the bag.", "Tape three throwing lanes 12 m long on the hall floor with a throw line at one end and hoops at 6, 9 and 12 m.", "Print the tables and the 1-10-1 poster.", "Fill the ice bucket 10 minutes before the meeting if using the hand test."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (Kiahk praises), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: lifejackets and PFDs, 1-10-1, hypothermia, reach-throw-don't go, throw bag, ice safety."}, {"time": "7:05", "min": 10, "what": "Spiritual: Peter walking on the water (Matthew 14:28-31), Lord, save me."}, {"time": "7:15", "min": 25, "what": "Activity: throw-bag accuracy contest and PFD dressing relay."}, {"time": "7:40", "min": 5, "what": "Closing: recap 1-10-1, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Cold Water Survival and Rescue", "intro": "Most people who drown in Canada never planned to be in the water: they fell out of a canoe, went through the ice, or were knocked off a dock. Most were not wearing a lifejacket, and most were within sight of safety. Cold water is the real killer in Ontario, even in summer. Tonight you learn the gear, the rule and the skills that turn a fall into the water into a story instead of a tragedy.", "steps": [{"title": "Lifejackets and PFDs", "min": 8, "detail": "Lay out the jackets. In Canada there are two families. Lifejackets (standard, SOLAS, small vessel) are red, orange or yellow, bulky, and designed to turn an unconscious person face up; the keyhole style is the one at every camp. PFDs (personal flotation devices) are lighter, more comfortable, come in any colour, and keep a conscious person afloat but may not turn you face up. Inflatable PFDs are only approved for people 16 and older who weigh over 36.3 kg (80 lb), must be worn to count, and are not for whitewater or personal watercraft. The law says one approved, correctly sized jacket for every person on board; Scouts Canada says you wear it, done up, the whole time. Fit check on a scout: read the label for weight or chest size, zip and click every buckle, tighten the side straps, then a partner lifts by the shoulders: if it rides up over the ears or chin it is too big or too loose. Look for the approval label, no rips, no mildew, working buckles. Show the bad example."}, {"title": "Cold water shock and the 1-10-1 rule", "min": 8, "detail": "Water below 15 degrees C (most Ontario water most of the year) causes cold shock. Teach the rule from Dr. Gordon Giesbrecht, a Canadian scientist. ONE minute: on hitting cold water you gasp uncontrollably and breathe very fast; if your face is under water during the gasp you can drown in seconds. You have about one minute to get your breathing under control: keep your head up, hold onto something, and breathe slowly and deliberately. TEN minutes: your arms and legs cool so fast that within about ten minutes you lose meaningful movement, so you cannot swim, climb or grip. Use those minutes to get out, climb on the boat, or get into a position to be rescued. ONE hour: even in very cold water it takes about an hour before hypothermia makes you unconscious. Wearing a lifejacket buys you that hour. Optional: volunteers put a hand in the ice bucket for up to 20 seconds and describe the pain and the urge to gasp. Teach HELP (heat escape lessening posture): knees to chest, arms crossed over the jacket, and the Huddle for groups, chests together."}, {"title": "Hypothermia: stages and treatment", "min": 8, "detail": "Hypothermia is a core temperature below 35 degrees C. Mild (35 to 32): shivering, cold hands and feet, the umbles: mumbles, stumbles, fumbles and grumbles. Moderate (32 to 28): violent shivering that then stops, confusion, slurred speech, clumsy, sleepy, may refuse help. Severe (below 28): no shivering, unconscious, very slow breathing and pulse, may look dead. Treatment, demonstrate on a volunteer: get them out of wind and wet, handle them gently and keep them lying flat (rough handling of a severely cold heart can stop it), remove wet clothing, put on dry layers and a toque, wrap in blankets with the foil blanket outside, put wrapped warm packs in the armpits, groin and on the chest, never directly on skin, and never rub arms or legs. Warm sweet drinks only if fully awake and able to swallow, no alcohol or caffeine. Call 911 for moderate or severe. Remember the rule from the doctors: nobody is dead until they are warm and dead, so keep going with CPR if needed."}, {"title": "Reach, throw, don't go", "min": 6, "detail": "A drowning person will climb on top of anything, including you, to get air. So the rule for every rescuer, even strong swimmers, is reach, throw, don't go. REACH: lie flat on the dock or bank so you cannot be pulled in, and extend a paddle, pole, branch, towel or even a jacket; demonstrate with the broom handle and towel on a mat. THROW: a throw bag, a ring buoy, a rope, a cooler, a spare PFD, anything that floats; the victim grabs it and you pull, or they rest on it. ROW: if you are in a boat, bring the boat to them and pull them over the stern or side without capsizing. DON'T GO: entering the water is the last resort for trained lifeguards with equipment. Add: shout for help and send someone to call 911 first. Have patrols rehearse the phrase and mime the flat reach."}, {"title": "Throw bag technique", "min": 5, "detail": "Demonstrate, then every scout throws once at a leader standing 8 m away. Open the bag and pull out about 1 m of rope. Hold the loose end of the rope (not the loop around your wrist, so you can let go) in your non-throwing hand and the bag in your throwing hand. Shout the person's name and ROPE so they look up. Throw underhand, like a bowling ball, aiming just beyond the person and slightly upstream if there is current, so the rope falls across their arms. Brace with one foot forward, or sit down, and pull them in hand over hand. For a second throw do not restuff: coil the rope in big loops or scoop water into the bag for weight and throw again. To restuff, feed the rope in loosely from the end, never coiled, so it pays out cleanly next time."}, {"title": "Ice safety in Ontario", "min": 5, "detail": "No ice is ever completely safe. Lifesaving Society Canada guidelines for clear blue ice: 15 cm (6 in) for walking or skating alone, 20 cm (8 in) for a group skating or playing, 25 cm (10 in) for snowmobiles. White or snow ice is only about half as strong, and grey ice means water is in it, so stay off. Never trust ice near rivers, inlets, docks, bubblers, springs or anywhere current runs underneath. If you go through: stay calm and control your breathing (the one minute), turn to face the way you came because that ice held you, kick your legs hard while pulling with your arms or ice picks, slide onto the ice on your belly, and roll away, do not stand until you are well back. Rescuing someone: preach (call to them to self-rescue), reach, throw, and call 911; never walk out to them. Carry ice picks around your neck and keep a throw rope on the sled."}], "tips": ["Have every scout say the 1-10-1 rule out loud with the actions: one finger and slow breath, ten fingers and swimming arms, arms crossed for the hour.", "For PFD fit, the shoulder-lift test is the one scouts remember; let every patrol do it on each other.", "Common throw bag mistake: overhand throws go high and short. Insist on underhand.", "Ask who skates on ponds or lakes; use their real examples when teaching ice colour and thickness.", "If the ice bucket test is used, keep it voluntary and to 20 seconds; the point is the gasp reflex, not endurance."], "safety": ["Throw bags are thrown only down a marked lane toward a leader or a seated scout with arms up; nobody stands behind the target.", "Hold the rope end loosely; never wrap rope around a hand or neck.", "Ice bucket hand test is optional, 20 seconds maximum, towels ready, and not for scouts with circulation problems.", "Walk, do not run, during the PFD relay; buckles must be undone before the jacket is pulled off."]}, "spiritual": {"title": "Lord, Save Me", "ref": "Matthew 14:28-31", "verse": "But when he saw that the wind was boisterous, he was afraid; and beginning to sink he cried out, saying, \"Lord, save me!\" And immediately Jesus stretched out His hand and caught him, and said to him, \"O you of little faith, why did you doubt?", "url": "https://www.biblegateway.com/passage/?search=Matthew+14%3A28-31&version=NKJV", "message": "Peter was a professional fisherman on the Sea of Galilee, and he knew exactly how dangerous that water was at night in a storm. Yet when Jesus said Come, he stepped out of the boat. As long as his eyes were on Christ he walked on the water. The moment he looked at the wind and the waves, he began to sink. Tonight you learned that when you hit cold water you have one minute to get control of your breathing, and that panic is what drowns people. Peter did the one thing that saves a drowning man: he stopped thrashing and cried out, \"Lord, save me!\" And Jesus reached. He did not lecture first; He reached immediately, and caught him. That is the Gospel in one verse. We are all in cold water. Sin, fear and doubt pull us down faster than we can swim. Christ does not stand on the shore waiting for us to swim to Him; He walks out on the water to where we are, and He reaches. During the Nativity fast we remember that God came down into our storm as a baby in Bethlehem. Your part is Peter's part: keep your eyes on Christ, and when you sink, cry out. He has never once failed to reach.", "discussion": ["What waves or winds make you take your eyes off Christ during a normal week?", "Peter's prayer was three words. Why do you think short, honest prayers are so powerful when we are afraid?", "Reach, throw, don't go: who in your life needs you to reach out to them this week, and how?"], "prayer": "Lord Jesus, when we sink in fear and doubt, hear our cry as You heard Peter, stretch out Your hand and catch us. Keep our eyes fixed on You through this fast and through every storm. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Throw-Bag Accuracy Contest and PFD Dressing Relay", "setup": "Part A uses the three taped lanes: a throw line at one end and a gym mat with a hula hoop at 6 m, 9 m and 12 m in each lane. A scout sits in the target hoop as the victim with both arms raised. Part B: one PFD per patrol placed unbuckled on a chair 10 m from the patrol's start line, with a leader judge beside each chair. Patrols rotate: two patrols on throw lanes while the others run the relay, then switch after 12 minutes.", "materials": ["3 throw bags", "3 hula hoops", "3 gym mats", "5 PFDs of the right size for the scouts", "Stopwatch", "Scoresheet"], "rules": ["Part A, throw bag (12 minutes): each scout gets two throws from the throw line; patrols choose the target distance for each throw (6 m, 9 m or 12 m) before throwing.", "The thrower must hold the rope end in the free hand and shout the victim's name and ROPE before throwing, or the throw scores zero.", "Scoring per throw: rope lands across the victim's raised arms: 5 points at 12 m, 4 at 9 m, 3 at 6 m. Rope lands inside the hoop or touches the victim: 3 points at 12 m, 2 at 9 m, 1 at 6 m. Within 1 m of the hoop: 1 point at any distance. Dropping the rope end: minus 1.", "The next thrower must restuff the bag correctly (rope fed in loosely, not coiled) before their throw; a leader may call Restuff and take 1 point if it is coiled.", "Part B, PFD relay (12 minutes): on Go the first scout walks quickly to the chair, puts the PFD on, closes every zip and buckle, and tightens the straps. The judge lifts by the shoulders; if it rides above the ears the judge says Ride up and the scout must fix it before continuing.", "The scout then undoes everything, lays the PFD back on the chair open, walks back and tags the next scout. Time stops when the last scout is back behind the line.", "Relay penalties: 10 seconds for each buckle or zip left open at the shoulder lift, 5 seconds for running.", "Final standings: add each patrol's total throw points to relay points (fastest relay 10 points, then 8, 6, 4, 2). Highest total wins the title Rescue Crew."], "variations": ["Easier: victims at 6 m and 9 m only; relay with one buckle and the zip.", "Harder: throws with the non-dominant hand for double points, or a moving victim who walks slowly across the lane; relay with the PFD put on while the scout lies on the floor (as if already in the water).", "Short on time: one throw per scout and the relay only once."]}, "tables": [{"caption": "Hypothermia stages and first aid", "headers": ["Stage", "Core temperature", "Signs", "What to do"], "rows": [["Mild", "35 to 32 degrees C", "Shivering, cold hands and feet, mumbles, stumbles, fumbles, grumbles", "Shelter, remove wet clothes, dry layers and toque, blankets, warm sweet drink, light activity, watch closely"], ["Moderate", "32 to 28 degrees C", "Violent shivering that stops, confusion, slurred speech, clumsy, sleepy, may refuse help", "Call 911, handle gently and keep flat, dry layers, insulate, wrapped warm packs at armpits, groin and chest, no rubbing, drinks only if fully alert"], ["Severe", "Below 28 degrees C", "No shivering, unconscious, barely breathing, weak or no pulse, may appear dead", "Call 911, extreme gentleness, insulate, check breathing, start CPR if no breathing, keep going until help arrives (not dead until warm and dead)"]]}, {"caption": "Ice thickness guide (clear blue ice, Lifesaving Society Canada)", "headers": ["Thickness", "Safe for"], "rows": [["Under 15 cm (6 in)", "Stay off"], ["15 cm (6 in)", "Walking or skating alone"], ["20 cm (8 in)", "Skating parties or group games"], ["25 cm (10 in)", "Snowmobiles"], ["White or snow ice", "Only half as strong; double every number above"], ["Grey ice, or ice near currents, docks and inlets", "Unsafe at any thickness"]]}], "references": [{"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Official lifejacket and PFD types, approval labels and the cold water section."}, {"label": "Lifesaving Society", "url": "https://www.lifesaving.ca/", "why": "Ice safety guidelines, drowning statistics and the Swim to Survive standard."}, {"label": "Canadian Safe Boating Council", "url": "https://csbc.ca/", "why": "Cold water awareness resources and the wear it campaign."}, {"label": "Wikipedia: Cold shock response", "url": "https://en.wikipedia.org/wiki/Cold_shock_response", "why": "Background on the gasp reflex and the 1-10-1 phases."}, {"label": "YouTube search: 1-10-1 rule cold water Giesbrecht", "url": "https://www.youtube.com/results?search_query=1-10-1+rule+cold+water+immersion+giesbrecht", "why": "Short Canadian videos showing cold shock and the 1-10-1 rule to show on a screen."}, {"label": "Bible Gateway: Matthew 14:28-31 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+14%3A28-31&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": "cold-water-1-10-1", "takeHome": "Teach the 1-10-1 rule and reach-throw-don't-go to someone at home, and check whether your family's lifejackets have an approval label and still fit each person."}, {"n": 13, "date": "2026-12-08", "term": "Fall", "title": "Service & Leadership: Christmas Kindness Project", "theme": "Plan-do-review a real service project while learning what a leader actually does", "sea": false, "calendar": ["Nativity fast continues (day 14 of 43). All snack items in the care packages and anything eaten tonight must be vegan.", "The Coptic month of Kiahk begins around Dec 10; Saturday night Kiahk praises (tasbeha) start this week or next. Invite scouts and families.", "Confirm the delivery date for the care packages with the seniors' residence or shelter before tonight (see prep)."], "objectives": ["Describe the Plan-Do-Review cycle and use it to plan a real service project with goal, recipient, tasks, roles, budget and deadline.", "Name four leadership styles (directing, coaching, supporting, delegating) and choose the right one for a given situation.", "List the duties of a patrol leader and assistant patrol leader.", "Assemble care packages for seniors or a shelter that meet the recipient's rules and are fasting-friendly.", "Connect service to the Gospel command in Matthew 25 and to the Church's almsgiving during the fast."], "materials": [{"item": "Warm socks (adult), new", "qty": "20 pairs", "note": "main budget item; ask families to donate extra"}, {"item": "Lip balm, small hand cream, travel toothbrush and toothpaste, tea bags (boxed)", "qty": "20 each", "note": "dollar store; sealed items only"}, {"item": "Vegan granola bars and dried fruit packs (check labels: no milk, honey optional)", "qty": "40 bars, 20 packs", "note": "sealed, nut-free if the recipient requires"}, {"item": "Chemical hand warmers", "qty": "20 pairs", "note": "for shelter packages"}, {"item": "Gift bags or large zip bags, tissue paper, ribbon", "qty": "25", "note": ""}, {"item": "Card stock folded to A5, coloured markers, stickers, glue sticks, envelopes", "qty": "40 cards, 5 marker sets", "note": "card making"}, {"item": "Wrapping paper, tape dispensers, scissors, empty shoeboxes", "qty": "5 rolls, 5 dispensers, 5 scissors, 5 boxes", "note": "gift-wrap relay"}, {"item": "Printed plan sheet (goal, recipient, tasks, who, when, budget, risks)", "qty": "1 per patrol", "note": "template described in step 2"}, {"item": "Christmas trivia question cards", "qty": "20 cards", "note": "questions listed in the activity"}, {"item": "Flip chart and markers", "qty": "1", "note": ""}], "prep": ["Two weeks ahead: phone a seniors' residence, a Coptic church senior ministry or a local shelter and ask (a) whether they accept care packages, (b) how many residents, (c) their rules (usually sealed items only, no homemade food, no scented products in some homes, no candles), and (d) a drop-off date. Write these on the flip chart as the project's real constraints.", "Buy or collect the package items; keep receipts for the budget review. Sort items into 5 bins, one per patrol assembly line.", "Draw the plan sheet template and photocopy 5. Headings: Goal (who, what, how many, by when), Recipient rules, Task list (5 tasks), Who does each, Deadline, Budget, What could go wrong and the fix.", "Write the 20 trivia cards from the list in the activity, with answers on the back.", "Prepare three leadership scenarios on cards (see step 3).", "Ask two parents to help with the assembly line quality check.", "Read Matthew 25:31-46 and the Canadian Path page on Plan-Do-Review (link in references)."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (Kiahk praises, delivery date), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: why we serve, PLAN the project, leadership styles, patrol leader duties, DO the assembly line, REVIEW."}, {"time": "7:05", "min": 10, "what": "Spiritual: Matthew 25:35-40, you did it to Me; Kiahk anticipation."}, {"time": "7:15", "min": 25, "what": "Activity: card-making for the packages, then Christmas trivia and gift-wrap relay."}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Plan, Do, Review: The Christmas Kindness Project", "intro": "A Scout promises to help other people at all times, and a Sea Scout crew only works when someone steps up to lead. Tonight we do both: we plan and build a real service project for people who will spend Christmas alone or without a home, and along the way you learn what leadership actually looks like when the job has to get done.", "steps": [{"title": "Why scouts serve, and how: Plan-Do-Review", "min": 5, "detail": "Ask the troop to recite the line of the Scout Promise about helping other people. Explain that Scouts Canada's Canadian Path runs every adventure through three words: Plan, Do, Review. Plan means deciding the goal and how to reach it before you touch anything. Do means carrying it out with everyone in a role. Review means asking afterwards what worked, what did not, and what we would change. Tell them tonight's project: care packages for the seniors' residence (or shelter) you contacted, to be delivered on the confirmed date. Add the Church angle: during every fast, especially the Nativity fast, the Coptic Church pairs fasting with almsgiving. The money we save by eating simply is meant to go to someone who needs it. Tonight is the Scout version of that."}, {"title": "PLAN: designing the project", "min": 10, "detail": "Hand out the plan sheets. Work through the headings with the whole troop on the flip chart, then patrols fill their own. Goal: write it as a sentence with numbers, for example 20 packages for the residents of X, delivered by Saturday Dec 19. Recipient rules: read out what the residence told you (sealed items only, no homemade food, no candles, maybe no nuts or scents). Task list: sort items, quality-check, assemble, write cards, wrap, label, deliver. Who: assign one scout's name to each task. Deadline: tonight for assembly, delivery date for drop-off. Budget: show the receipts and divide by 20 to get the cost per package. Risks: ask each patrol to name one thing that could go wrong (a snack with milk slips in, a card has a spelling mistake, not enough socks) and write the fix beside it. Point out that a plan with names and numbers is a plan; a plan without them is a wish. Collect the sheets for the review."}, {"title": "Leadership styles", "min": 8, "detail": "Draw four boxes on the flip chart. DIRECTING: the leader gives clear orders and checks; use it when the team is new to the task or safety is at stake, such as lighting a stove. COACHING: the leader explains why and shows how, then lets people try; use it when the team is learning, such as a first knot relay. SUPPORTING: the leader asks the team how they want to do it and helps; use it when they know the skill but need confidence. DELEGATING: the leader hands over the job and trusts the result; use it when the team is skilled and motivated. Read three scenario cards and have patrols hold up one to four fingers for the style they would use: (1) a new scout is about to use a knife, (2) your patrol has built ten tripods and must build another, (3) a scout knows first aid but freezes at the sight of a bandage. Finish with the Christian twist: Christ washed His disciples' feet, so every style is used to serve the team, not to boss it."}, {"title": "Patrol leader duties", "min": 5, "detail": "Ask the current patrol leaders to stand and have the troop name what they do; write the list. A patrol leader takes attendance and knows where every scout in the patrol is, leads the patrol corner and fall-in, assigns duties fairly and rotates them, looks after new and younger scouts, watches safety (PFDs, knives, rope), represents the patrol at the troop council and reports back, keeps patrol gear together, and sets the example in uniform, promptness and behaviour. The assistant patrol leader does all of this when the PL is absent and usually looks after gear and the patrol log. Tell them the PL is the first leadership job most of them will ever hold and that tonight's assembly line is a chance to practise it: the PL assigns the roles in step 5."}, {"title": "DO: the assembly line", "min": 10, "detail": "Each patrol gets a bin of items and four gift bags to fill (adjust to the number of packages). The PL assigns: a checker who reads every snack label and rejects anything with milk, whey, butter or eggs (keep the fast and respect the residents' dietary rules); a packer who puts items in the bag in a set order (socks at the bottom, hygiene items, snacks, tea, hand warmers on top); a folder who does tissue paper and ribbon; a labeller who writes To a friend, from the Sea Scouts of St. ___ and the date on a tag; and a quality controller who ticks a checklist for each bag: all eight items present, no open packaging, no non-vegan snack, tag attached. A parent does a second check. Any bag that fails goes back to the packer. Finished bags go in a labelled box for delivery. Aim for four bags per patrol in ten minutes; the cards will be added during the activity."}, {"title": "REVIEW", "min": 2, "detail": "Stop the room and ask three questions, one word answers first, then one sentence: What went well? What slowed us down? What would we change for the next project? Have each PL say one thing their patrol learned about leading. Then remind them the project is not finished until it is delivered and reviewed, and name the scouts and leader who will do the drop-off on the confirmed date. Write the three answers on the flip chart for the next troop council."}], "tips": ["Let the patrol leaders actually assign roles in step 5; resist the urge to do it for them, and coach quietly if a PL is stuck.", "Keep the assembly line moving by giving each patrol a visible target (four bags) and a timer.", "If the recipient organization has not confirmed, plan the packages for the church's own seniors or the parish food bank rather than skipping the project.", "Common mistake: cards with private information; first names only, no phone numbers, no photos.", "Praise specific leadership behaviours you see (You checked on the new scout, well done) rather than general good job."], "safety": ["Scissors are used seated at a table; walk with points down.", "Check the troop allergy list before opening snack packages; keep nuts out of the room if the recipient asks for nut-free items.", "Scouts handling delivery must be accompanied by two leaders and follow the organization's visitor rules.", "No scouts share personal contact information in the cards."]}, "spiritual": {"title": "You Did It to Me", "ref": "Matthew 25:35-40", "verse": "And the King will answer and say to them, \"Assuredly, I say to you, inasmuch as you did it to one of the least of these My brethren, you did it to Me.", "url": "https://www.biblegateway.com/passage/?search=Matthew+25%3A35-40&version=NKJV", "message": "Look at the bags you just filled. Jesus tells us something amazing about them: whoever opens one of those bags, He will count it as if we gave it to Him. \"I was hungry and you gave Me food; I was thirsty and you gave Me drink; I was a stranger and you took Me in.\" That means a pair of socks handed to a lonely senior is handed to Christ. It also means leadership in the Church is measured upside down: the greatest is the one who serves. This week the month of Kiahk begins, the month of praises. On Saturday nights the Church stays up singing to the Theotokos St. Mary, waiting for the Child to be born. Kiahk is a month of waiting, but not idle waiting; it is like a crew preparing the ship before a voyage. We fast, we sing, and we give, because the One we are waiting for was born poor, in a borrowed stable, to a family that soon had to flee to Egypt as refugees. When you deliver these packages you are welcoming that family. And when you plan, do and review as a patrol leader, remember the Captain who washed His crew's feet.", "discussion": ["Who is one of the least of these in your school or neighbourhood, and what would it look like to serve them this month?", "Jesus led by washing feet. Which leadership style from tonight is closest to that, and when have you seen a leader do it?", "Kiahk is a month of waiting and praising. How could your family prepare for Christmas differently this year?"], "prayer": "Lord Jesus, You were born poor and became a stranger in Egypt for our sake. Receive these gifts as given to You, bless those who will open them, and make us leaders who serve. Prepare our hearts through the praises of Kiahk to welcome You at Your Nativity. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Christmas Cards, Trivia and Gift-Wrap Relay", "setup": "Part A (12 minutes): patrols stay at their tables with card stock, markers and stickers. Part B (13 minutes): clear a lane 10 m long per patrol; at the far end of each lane place a shoebox, a roll of wrapping paper, tape dispenser and scissors. A quizmaster leader stands at the front with the trivia cards; a judge holds the scoresheet.", "materials": ["Card stock, markers, stickers, glue sticks, envelopes", "5 shoeboxes, wrapping paper, tape, scissors", "20 trivia cards", "Scoresheet"], "rules": ["Part A, cards: every scout makes at least one card for a package. Front: a Christmas or Nativity picture. Inside: a two-line message and first name only, for example Merry Christmas and a warm winter from Mark, Sea Scout. No addresses or phone numbers. Cards must be readable, so print neatly. A leader checks each card and drops it into a package; the patrol with the most approved cards in 12 minutes earns 5 points.", "Part B, trivia and wrap relay: the quizmaster reads a trivia question. The first patrol to raise a hand answers; a correct answer sends one of their scouts down the lane to do ONE wrap step on their box (step 1: cut paper to size; step 2: fold and tape the long seam; step 3: fold and tape one end; step 4: fold and tape the other end; step 5: add ribbon or a tag). A wrong answer passes the question to the next patrol.", "Each scout may run once until everyone in the patrol has run; then start again.", "Sample questions: In what town was Jesus born? (Bethlehem) What date is Coptic Christmas? (Jan 7) How many days is the Nativity fast? (43) Which Coptic month is the month of praises? (Kiahk) Which country did the Holy Family flee to? (Egypt) What gifts did the Magi bring? (gold, frankincense, myrrh) Who told the shepherds the good news? (an angel) What is tasbeha? (the praises service) Who was the Roman emperor who ordered the census? (Caesar Augustus) What is the Coptic Christmas Eve service called? (the Paramoun, then the Nativity liturgy) Which prophet said a virgin would give birth? (Isaiah) Name a Coptic Nativity hymn (any correct answer).", "The first patrol to finish all five wrap steps shouts Wrapped; the judge stops the relay after that round is completed. Scoring: 10 points for the first finished box, 8 for second, 6 for third, 4 and 2 after; plus 1 point for each correct trivia answer; plus up to 5 points from the judge for neatness (no exposed box, tight corners).", "Add Part A card points to Part B points. Highest total is the Kindness Crew and carries the delivery box to the car."], "variations": ["Short on time: skip the ribbon step and use 10 trivia questions.", "Harder: wrappers must work with one hand behind their back, or the trivia questions must be answered in Scripture references (chapter and verse).", "Larger troop: run two relay lanes per patrol with two boxes."]}, "tables": [{"caption": "Four leadership styles and when to use them", "headers": ["Style", "What the leader does", "Use it when", "Scout example"], "rows": [["Directing", "Gives clear instructions and checks each step", "Team is new to the task or safety matters", "Lighting a stove, first time with a knife"], ["Coaching", "Explains why, demonstrates, lets them try, gives feedback", "Team is learning and motivated", "Teaching the bowline to new scouts"], ["Supporting", "Asks the team how they want to do it, encourages, helps", "Team has the skill but lacks confidence", "A scout who knows CPR but freezes in a drill"], ["Delegating", "Hands over the job and trusts the result, checks at the end", "Team is skilled and reliable", "Experienced patrol building a tripod they have built ten times"]]}, {"caption": "Care package checklist (fasting-friendly, sealed items only)", "headers": ["Item", "Seniors' package", "Shelter package"], "rows": [["Warm socks, new", "1 pair", "1 pair"], ["Lip balm", "1", "1"], ["Hand cream (unscented if required)", "1", "1"], ["Toothbrush and toothpaste", "optional", "1 each"], ["Vegan granola bars", "2", "2"], ["Dried fruit pack", "1", "1"], ["Tea bags", "5, sealed", "optional"], ["Hand warmers", "optional", "1 pair"], ["Hand-made card, first name only", "1", "1"], ["Tag: To a friend, from the Sea Scouts", "1", "1"]]}], "references": [{"label": "Scouts Canada: The Canadian Path", "url": "https://www.scouts.ca/programs/canadian-path/", "why": "Plan-Do-Review and youth-led leadership, the framework used in step 1 and 2."}, {"label": "Scouts Canada", "url": "https://www.scouts.ca/", "why": "Service project ideas and safety expectations for community outings such as the delivery."}, {"label": "Bible Gateway: Matthew 25:35-40 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+25%3A35-40&version=NKJV", "why": "Full passage for the spiritual lesson."}, {"label": "Coptic Reader app", "url": "https://www.copticreader.com/", "why": "Kiahk praises texts to show scouts what tasbeha is and to display a Nativity hymn if you sing one."}, {"label": "St. Takla Coptic resources", "url": "https://st-takla.org/", "why": "Articles on the Nativity fast, Kiahk and almsgiving for leader background."}, {"label": "YouTube search: how to wrap a gift neatly", "url": "https://www.youtube.com/results?search_query=how+to+wrap+a+gift+neatly", "why": "One-minute technique video so the judge knows what tight corners look like."}], "visual": null, "takeHome": "Do one secret act of kindness at home or school this week that nobody finds out about, and attend one Kiahk praises night with your family if you can."}, {"n": 14, "date": "2026-12-15", "term": "Fall", "title": "Charts & Navigation 2", "theme": "Reading a nautical chart, plotting a position, measuring distance and laying a course", "sea": true, "calendar": ["Nativity fast continues (day 21 of 43); tonight's hot cocoa is dairy-free (oat milk), and no marshmallows unless labelled vegan (most contain gelatin).", "Kiahk: Satur
