te their locations on a master sheet.", "Mark a 'ship' at the other end of the hall: two benches in a V for the bow, a chair for the helm, and a taped line for the rail; place the throw bag and ring buoy at the rail.", "Print the whistle-signal and MOB cards and the STOP poster for the wall.", "Practise the throw bag underhand throw yourself: hold the loose end, swing the bag underhand and release toward and slightly past the target.", "Prepare the snack on a separate table with a hand-wash reminder; confirm allergy list.", "Read Jonah chapter 2 aloud once so you are comfortable with the poetry."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Jonah's fast, Great Lent starting Mar 8), hand out whistles."}, {"time": "6:25", "min": 40, "what": "Practical: STOP and hug-a-tree, whistle signals, man-overboard steps, line and expanding-square searches, missing-scout scenario."}, {"time": "7:05", "min": 10, "what": "Spiritual: Jonah 2, the prayer from the belly of the fish and the God of second chances."}, {"time": "7:15", "min": 25, "what": "Activity: MOB Drill Relay with Oscar, then the Hidden-Object Grid Search; fasting-friendly snack at the end."}, {"time": "7:40", "min": 5, "what": "Closing: recap (STOP, three blasts, shout-point-throw-turn), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Lost, Overboard and Found", "intro": "Every year in Ontario people get lost in the bush and people fall out of boats, and most of them are found safe because someone knew a simple drill and did it calmly. Tonight we learn what to do if you are the lost one, what to do the second someone goes over the side, and how a patrol searches an area so nothing is missed. Practise these until they are boring; boring is what saves lives.", "steps": [{"title": "If you are lost: STOP and hug a tree", "min": 7, "detail": "Put up the STOP poster. S is Stop: the moment you realize you do not know where you are, stop walking. Most lost people make it worse by wandering. T is Think: when did you last know where you were? Which way did you come? Do not panic; sit down and breathe. O is Observe: listen for voices, roads, water; look at the sky and the ground; check what you have in your pockets and pack. P is Plan: usually the plan is to stay put, make yourself visible and warm, and signal. Hug-a-tree rules for young people: pick one tree and stay with it, because searchers look for you where you were last seen; carry a whistle and a large orange garbage bag every time you leave camp; put the bag on like a poncho (tear a hole for the face only, never over the head) to stay warm and dry and easy to see; make yourself big in a clearing if you hear a helicopter; answer every call, even a stranger's; and remember, nobody is angry at you, they only want you home. Demonstrate the garbage-bag poncho on a scout."}, {"title": "Whistle signals", "min": 5, "detail": "Hand out the whistles. A whistle carries much farther than a voice and never gets hoarse. Standard scout and wilderness signals: one long blast means 'Where are you?' or 'Attention'; two blasts mean 'Come to me' or 'I am here'; three blasts mean 'Help, emergency'. Three of anything is the distress signal everywhere: three fires, three flashes, three shouts. If you are lost, give three blasts, wait a full minute listening, and repeat; keep repeating even if you think no one hears, because the sound may reach a searcher who is not yet in earshot of your voice. Searchers reply with one blast so the lost person knows to keep signalling. Practise: patrols spread to corners of the hall; the leader gives a signal and each patrol responds with the correct reply. Then run a quick call-and-answer: leader blows three, everyone answers with one, and so on. Rule from tonight: whistles are for signals only, never for fun in the hall."}, {"title": "Man overboard: shout, point, throw, turn, recover", "min": 10, "detail": "Set the troop around the bench 'ship'. Explain that a person in cold Ontario water may have only minutes of useful movement (recall the 1-10-1 rule) and that a head in the waves disappears from view within seconds. The five steps, in order and at once. SHOUT: 'Man overboard, starboard side!' so the whole crew knows. POINT: one person becomes the spotter, keeps an arm and eyes fixed on the casualty, and does nothing else until recovery; if the spotter loses sight, everyone loses them. THROW: throw flotation immediately, a ring, a cushion, a throw bag, anything that floats, even if it lands short, because it marks the spot and gives the person something to grab. TURN: the helmsman turns the boat back, on a powerboat by cutting speed and circling, on a sailboat by tacking into a figure-8 so the boat returns slowly and under control; press the MOB button on the GPS if there is one and count heads. RECOVER: approach from downwind so the boat does not drift over the person, engine in neutral, bring them alongside, pull them in over the stern or with a sling, and treat for cold shock and hypothermia. Never jump in after them. Demonstrate once with a leader playing casualty, then each patrol runs it once."}, {"title": "Search patterns: line and expanding square", "min": 10, "detail": "Searching is organized, not random. Line (sweep) search: searchers stand shoulder to shoulder or a set spacing apart (arm's length for a small object, 3-5 m in open bush) in a straight line, with a leader at one end. The leader calls 'step' and the whole line moves together one pace, scanning the ground and low branches. Nobody rushes ahead; if someone finds a clue they call 'stop' and the line holds while it is checked. At the end of the area the line pivots and sweeps back beside the first strip. Demonstrate with one patrol sweeping half the hall for a dropped key ring. Expanding square: used from a last known point when you have few searchers. Start at the point, walk 1 unit north, 1 east, 2 south, 2 west, 3 north, 3 east, 4 south, 4 west, and so on, so the path spirals outward covering everything. The leader counts paces and calls the turns. Demonstrate with one scout walking it on the taped grid, using 1 m as the unit and a compass or the hall walls for direction. Mention that real search teams also use the sector search from a buoy and that on the water the pattern is steered by compass and timed legs."}, {"title": "Missing scout at camp: what everyone does", "min": 8, "detail": "Talk through the scenario: it is 4 pm at summer camp and a scout is not at the flagpole. Leaders: stay calm; do an immediate head count by patrol and confirm who is missing and when and where they were last seen; check the obvious first (tents, washroom, waterfront); call the missing scout's name and blow three whistle blasts, then listen; note the time; if not found within 15 minutes, call 911 and the camp office, because the Ontario Provincial Police and search teams would rather come early than late; assign a leader to stay at the last seen point; send searchers only in pairs, with whistles, water, a radio and a set time to return, never alone. The missing scout: STOP, stay put, whistle three blasts every few minutes, put on the garbage bag if cold, do not cross water or go downhill 'to find the road'. Quiz each patrol with one question each, for example 'Who is the spotter and what is their only job?', 'What are the three whistle blasts?', 'Why do searchers go in pairs?'."}], "tips": ["Repeat 'shout, point, throw, turn, recover' as a chant with hand actions: hands cupped at mouth, arm pointing, an underhand throw, a steering wheel turn, a pulling motion. Scouts remember actions better than words.", "For the spotter, stress that they do not help with the throw or the boat; their arm stays up the whole time. Test it by asking the spotter a distracting question during the drill.", "The expanding square is confusing the first time; write the sequence 1, 1, 2, 2, 3, 3 on the whiteboard and have scouts call the numbers as the walker goes.", "Some scouts will treat the whistles as toys. Collect any whistle blown without instruction and return it at closing.", "Keep the tone serious but not frightening. Emphasize that nearly everyone who stays put and signals is found within hours."], "safety": ["Oscar dummies are dragged, never thrown at people; keep the drag path clear of chairs.", "Throw bags are thrown underhand at a target on the floor, never at a person's head. Keep hands out of rope coils.", "The garbage-bag poncho must never go over a scout's head; tear the face hole first and demonstrate before anyone tries it. Bags away from small children.", "Line searches move at a walk. No running during searches in a crowded hall.", "Snack is fasting-friendly (vegan) this week; check the allergy list, and everyone washes hands after handling ropes and dummies."]}, "spiritual": {"title": "A Prayer from the Belly of the Fish", "ref": "Jonah 2:1-10", "verse": "I cried out to the LORD because of my affliction, And He answered me. Out of the belly of Sheol I cried, And You heard my voice. (Jonah 2:2) When my soul fainted within me, I remembered the LORD; And my prayer went up to You, Into Your holy temple.", "url": "https://www.biblegateway.com/passage/?search=Jonah+2%3A1-10&version=NKJV", "message": "This week the whole Coptic Church fasts with Jonah, three days, the same three days he spent inside the great fish. Think about where Jonah was. He had gone overboard in a storm, the exact emergency we drilled tonight, except there was no spotter pointing, no throw bag, no boat turning back. He sank, seaweed wrapped around his head, and then the darkness of the fish swallowed him. Jonah did the one thing a lost person must do. He stopped running. He thought about where he was and how he got there. And he called out. 'Out of the belly of Sheol I cried, and You heard my voice.' God had been searching for Jonah the whole time, like a patrol sweeping the ground, and the fish was not the punishment; the fish was the rescue boat. Three days later Jonah was on dry land with a second chance, and he went to Nineveh, and a whole city repented. Our Lord said this was the sign of His own death and Resurrection, three days in the tomb and then life. Jonah's fast is placed two weeks before Great Lent for a reason: it is our practice drill. Whatever storm you are in, whatever you have run from, God hears a prayer from the deepest place. Stop, remember the Lord, and cry out. He always turns the boat around.", "discussion": ["Jonah prayed only after he had sunk as far as he could go. Why do we often wait until things are at their worst before we really pray?", "The fish looked like the end but was actually the rescue. Can you think of a hard time that turned out to be God saving you from something worse?", "Nineveh was given a second chance and took it. Who do you know that needs a second chance from you this week?"], "prayer": "Lord Jesus, You heard Jonah's prayer from the belly of the fish and You hear every cry from the deep. When we are lost, teach us to stop, remember You and call out, and when others are in danger make us quick to shout, point, throw and turn back for them. Bless our fast this week and prepare our hearts for Great Lent, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "MOB Drill Relay and the Hidden-Object Grid Search", "setup": "Part 1 (13 minutes): the bench 'ship' at one end of the hall with the rail line taped 1 m in front of it; a 'sea' zone 8 m long marked with tape; two Oscar dummies. Each patrol crews the ship in turn while the others watch and score with a leader. Part 2 (12 minutes): the 6 by 6 taped grid with 15 hidden objects in the far corner; patrols search in timed turns with a leader holding the master list.", "materials": ["2 Oscar dummies with a drag rope", "2 throw bags or coiled 15 m ropes, 1 ring buoy or cushion", "Bench ship, helm chair, taped rail and sea zone", "Blindfold for the helmsman", "Stopwatch and score sheet", "15 hidden objects, master list, taped grid", "Whistles (each scout's own)"], "rules": ["MOB Drill Relay: the patrol takes positions on the ship: helmsman (blindfolded, seated at the helm chair), spotter, thrower, and two recovery crew. A leader tosses Oscar into the sea zone at a random spot and shouts nothing; the crew must notice. The clock starts when Oscar lands.", "The crew must, in order: SHOUT 'Man overboard' with the side (port or starboard); the spotter POINTS and keeps pointing until recovery; the thrower THROWS the throw bag or ring so it lands within 1 m of Oscar (one re-throw allowed); the helmsman TURNS by standing, saying 'Turning to starboard' or 'to port' toward the side the spotter names, and walking the chair around a full circle guided only by the spotter's voice; the recovery crew then drag Oscar to the rail by the rope and lift him over, saying 'Casualty aboard, check for hypothermia'. The clock stops at that call.", "Scoring: 2 points for each of the five steps done in the correct order and fully (10 max), 3 points if the throw lands within 1 m on the first try, 1 point if on the re-throw, and time bonus: under 45 seconds 3 points, under 60 seconds 2 points, under 90 seconds 1 point. Any step skipped or out of order scores 0 for that step. If the spotter ever drops their arm, minus 2.", "Each patrol runs the drill twice with roles rotated; best score counts.", "Grid Search: each patrol gets 2 minutes on the grid. The patrol leader must choose and announce a pattern (line search or expanding square from the marked 'last seen' square) and the patrol must actually follow it; the leader watching checks that the line moves together on 'step' or that the square sequence is walked. Objects found are handed to the leader; 1 point each. A patrol that abandons its pattern and free-searches loses 3 points. Objects are re-hidden in new spots between patrols using the master list.", "Highest combined total wins and receives first choice of the fasting-friendly snack."], "variations": ["Short on time: run the MOB drill once per patrol and shorten grid search turns to 90 seconds.", "Harder: the helmsman must call the recovery approach 'from downwind' and the leader announces a wind direction before the drill; the crew must bring Oscar in on the correct side.", "Easier: no blindfold on the helmsman and no time bonus; focus only on the five steps in order.", "Extension: combine with whistle signals; the lost 'object' in the grid is a scout crouched behind a chair who blows three blasts once, and the patrol must locate them by sound then signal back with one blast."]}, "tables": [{"caption": "Whistle signals", "headers": ["Signal", "Meaning", "Reply"], "rows": [["One long blast", "Where are you? / Attention", "Two blasts (I am here)"], ["Two blasts", "Come to me / I am here", "Move toward the sound"], ["Three blasts (repeated every minute)", "Help, emergency, I am lost or hurt", "One blast (we hear you, keep signalling), then move toward the sound"], ["Three of anything (fires, flashes, shouts)", "International distress signal", "Same as above"]]}, {"caption": "Man overboard: the five steps", "headers": ["Step", "Who", "What exactly"], "rows": [["1. Shout", "Whoever sees it", "'Man overboard, port/starboard side!' so all hands know"], ["2. Point", "One person, the spotter", "Arm and eyes locked on the casualty until they are aboard; no other job"], ["3. Throw", "Nearest crew", "Ring, cushion, throw bag, anything that floats, immediately, even if short"], ["4. Turn", "Helmsman", "Slow down and circle back (power), or tack into a figure-8 (sail); press MOB on GPS; count heads"], ["5. Recover", "Crew", "Approach from downwind, engine in neutral, bring alongside, lift over the stern or with a sling, treat for cold shock and hypothermia"]]}], "references": [{"label": "Wikipedia: Man overboard", "url": "https://en.wikipedia.org/wiki/Man_overboard", "why": "Standard MOB procedures and the figure-8 and quick-stop sailing manoeuvres."}, {"label": "YouTube search: man overboard drill sailing figure eight", "url": "https://www.youtube.com/results?search_query=man+overboard+drill+sailing+figure+eight", "why": "Short videos showing the turn and recovery on a real boat, good to play once before the drill."}, {"label": "YouTube search: hug a tree and survive lost child program", "url": "https://www.youtube.com/results?search_query=hug+a+tree+and+survive+lost+child+program", "why": "Explains the hug-a-tree rules and the garbage-bag poncho for young people."}, {"label": "Lifesaving Society", "url": "https://www.lifesaving.ca/", "why": "Canadian drowning-prevention facts and the reach-throw-don't-go message."}, {"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Required throwable flotation and distress signals for Canadian small boats."}, {"label": "Bible Gateway: Jonah 2 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Jonah+2&version=NKJV", "why": "Jonah's prayer for the spiritual lesson during Jonah's fast."}], "visual": null, "takeHome": "Put your whistle and a folded orange garbage bag in your coat pocket or day pack this week, show a parent the three-blast signal, and teach a younger sibling or friend the STOP rule."}, {"n": 23, "date": "2027-03-02", "term": "Winter", "title": "Camp Planning & Gear", "theme": "Packing a backpack, choosing a campsite, pitching a tent and running a camp so everyone sleeps warm", "sea": true, "calendar": ["Great Lent begins next Monday, Mar 8. From next week all food at meetings is vegan (fasting-friendly). Tonight is not a fast day.", "Spring camp planning: this is the meeting to hand out the camp gear list and the duty roster template so families can shop and pack over the next weeks.", "March Break is Mar 15-19; there is no meeting on Mar 16."], "objectives": ["Build a personal gear list for a two-night spring camp using the layered list and the ten essentials.", "Pack a backpack with correct weight distribution and adjust the hip belt, shoulder straps, load lifters and sternum strap.", "Choose a safe campsite using the five W's (water, wind, widowmakers, wood, wildlife) and Leave No Trace distances.", "Pitch and strike a dome tent as a patrol with assigned roles in under eight minutes.", "Explain how to sleep warm and fill in a patrol duty roster for a weekend camp."], "materials": [{"item": "Dome tents (3-4 person) with fly, poles, pegs and footprint", "qty": "1 per patrol (5)", "note": "borrow from the group's store or families; check all parts before the meeting"}, {"item": "Backpack, 50-65 L, with hip belt", "qty": "2", "note": "one for the demo, one for scouts to pack and repack"}, {"item": "Demo gear to pack: sleeping bag in a stuff sack, sleeping pad, rain jacket, fleece, water bottle, headlamp, first-aid kit, food bag (empty boxes), stove and pot, small tarp, toiletries bag", "qty": "1 set", "note": "use real items so the weight feels honest"}, {"item": "Large garbage bag or pack liner", "qty": "2", "note": "shows waterproofing the pack from inside"}, {"item": "Rubber mallet", "qty": "2", "note": "for tapping pegs into a mat indoors (pegs go into foam blocks or are just laid out on a hard floor)"}, {"item": "Foam blocks or thick cardboard sheets to hold pegs indoors", "qty": "8 per tent", "note": "pegs cannot go into a hall floor; pegs sit in foam so scouts practise the angle"}, {"item": "Printed gear list (personal and patrol), packing diagram, five W's card, duty roster template", "qty": "1 set per scout", "note": "scouts take these home"}, {"item": "Blindfolds", "qty": "2 per patrol", "note": "for the activity"}, {"item": "Stopwatch, whiteboard and markers", "qty": "1 each", "note": ""}], "prep": ["Pitch each tent yourself at home once to confirm nothing is missing (poles, fly, pegs, guylines) and to learn its clip or sleeve system; put a numbered tag on each tent bag.", "Pack the demo backpack badly on purpose (sleeping bag on top, stove at the bottom, water bottle in the middle) so scouts can find the mistakes.", "Photocopy the gear list, packing diagram, five W's card and duty roster template.", "Measure the hall and mark five tent 'sites' with tape, each about 4 m by 4 m, with space to walk between.", "Cut foam blocks or stack cardboard for the pegs, 8 per site.", "Write the camp dates, location and cost on the whiteboard for parents picking up.", "Assign one leader per two patrols to judge the tent pitch."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Great Lent starts Mar 8, no meeting Mar 16, spring camp dates)."}, {"time": "6:25", "min": 40, "what": "Practical: gear lists and the ten essentials, packing a backpack, campsite selection, pitching a tent, sleeping warm and the duty roster."}, {"time": "7:05", "min": 10, "what": "Spiritual: Hebrews 11:9-10, dwelling in tents and looking for the city with foundations."}, {"time": "7:15", "min": 25, "what": "Activity: Blindfold Tent-Pitch Race by patrol."}, {"time": "7:40", "min": 5, "what": "Closing: recap (heavy close and high, five W's, tent roles), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Ready for Camp: Pack, Site, Tent, Sleep", "intro": "A good camp is planned at home and in the hall long before anyone reaches the campsite. Tonight we build the gear list, learn to pack so the weight rides on your hips instead of your shoulders, pick a site that will not flood or drop a branch on you, pitch a tent as a team, and set up the duty roster so the patrol runs itself. Sea scouts who camp on a shoreline need all of this plus a weather eye.", "steps": [{"title": "Gear lists and the ten essentials", "min": 7, "detail": "Hand out the gear list. Personal gear comes in layers you learned in Lesson 15: base layer (synthetic or wool, no cotton), mid layer (fleece), shell (rain jacket and pants), plus toque, gloves, two pairs of wool socks, camp shoes, sleeping bag rated for the expected low temperature, sleeping pad, headlamp with spare batteries, bowl, mug, spoon, water bottle, toiletries, and a small personal first-aid kit. Patrol gear is shared and split up: tent, stove, fuel, pots, tarp, rope, first-aid kit, water container, wash basin. The ten essentials go on every trip, even a day hike: navigation (map and compass), light (headlamp), sun protection, first aid, knife, fire (lighter and matches in a bag), shelter (emergency blanket or garbage bag), extra food, extra water, extra clothes. Sea scouts add a whistle and, for any waterfront, a PFD. Ask each patrol to name one item they would forget and what would happen without it."}, {"title": "Packing a backpack", "min": 8, "detail": "Empty the badly packed demo pack in front of the troop and ask what is wrong. Then pack it properly while explaining. First, line the pack with a garbage bag or pack liner; packs are not waterproof. Bottom: sleeping bag in its stuff sack and camp clothes, light and bulky. Middle, against your back and between the shoulder blades: the heaviest items, food bag, stove, fuel, water, so the weight sits close to your spine and does not pull you backward. Outside of the middle zone: sleeping pad, tent body. Top: rain jacket and fleece so you can grab them fast. Lid pocket: headlamp, snacks, map, first-aid kit, toilet paper. Nothing dangling outside except a pad or wet shoes. Then fit it: loosen everything, put it on, buckle the hip belt so the pads sit on top of the hip bones, tighten it first (the hips carry 70-80 percent of the weight), then snug the shoulder straps, pull the load lifters to a 45-degree angle, and clip the sternum strap. Total weight for a scout your age should be no more than about 20 percent of body weight, ideally less."}, {"title": "Choosing a campsite: the five W's", "min": 6, "detail": "Hand out the five W's card. Water: close enough to fetch, but at least 60 m (200 ft) from lakes and streams to protect the shoreline and avoid flooding, and never in a dry creek bed or the low spot of a slope where rain will pool. Wind: some breeze keeps bugs down, but pitch behind a natural windbreak with the tent door facing away from the wind, and on a shoreline expect the wind to shift onshore in the afternoon. Widowmakers: look up; never camp under dead branches or leaning dead trees. Wood: fuel and a legal fire pit nearby if fires are allowed. Wildlife: avoid game trails, anthills, wasp nests and berry patches; cook and store food at least 60 m from tents. Add Leave No Trace: use existing sites and durable surfaces (gravel, dry grass, packed earth), not fresh moss or wildflowers. Show two photos or sketches of sites and have patrols vote which is safe and why."}, {"title": "Pitching a dome tent", "min": 10, "detail": "Gather everyone around one tent and demonstrate with four scouts helping. Step one: clear the site of sticks and stones and lay the footprint or groundsheet, folding any edge that sticks out beyond the tent so rain does not run underneath. Step two: unroll the tent body on top, door where you want it, and stake the four corners, pegs angled 45 degrees away from the tent, pushed in until only the hook shows. Step three: assemble the shock-corded poles by letting them fall into place, never snapping them together with force. Step four: lay the poles in an X over the tent, seat the pole ends in the corner grommets or pins, and raise the tent by clipping the body to the poles or feeding poles through the sleeves, working from the middle out. Step five: throw the fly over with its seams over the poles and the fly door over the tent door, buckle or clip the corners, and peg out the guylines with a taut-line hitch so the fly is tight and not touching the inner tent. Striking is the reverse: unclip, pull poles out (push, do not pull, through sleeves), shake out debris, roll toward the door so air escapes, and never store a wet tent."}, {"title": "Sleeping warm and the duty roster", "min": 9, "detail": "Sleeping warm: a pad matters as much as the bag, because the ground steals heat; use a closed-cell foam pad or an insulated air pad. Check the bag's temperature rating and add a fleece liner in spring. Before bed: eat a snack (your body burns food for heat), drink a little, go to the washroom (a full bladder wastes warmth), change into dry base layers and dry socks, wear a toque, and put tomorrow's clothes in the bag with you. Do not breathe inside the bag; moisture makes it cold. A bottle of hot water wrapped in a sock at your feet works wonders. Duty roster: put the template on the board. Duties rotate each meal so nobody is stuck: cooks (2), water and fire or stove (1), dishwashers (2, using the three-basin wash, rinse, sanitize system), camp tidy and gear check (1), and prayer leader who leads the Agpeya prayer and grace. The patrol leader fills the grid before camp and posts it in the tent. Each patrol fills in one sample day now."}], "tips": ["Let scouts make the packing mistakes on the demo pack and feel the difference; a pack with the stove at the bottom and the bag on top pulls backward and everyone notices.", "Assign tent roles before touching the tent: two on corners and pegs, one on poles, one on fly and guylines. Roles cut the pitch time in half.", "Insist on pegs at 45 degrees away from the tent; a peg straight down pulls out in the first gust.", "Say 'the fly must not touch the inner tent' every time; that is the difference between a dry night and a wet one.", "The duty roster is where patrol leaders learn to lead; let them fill it in, then check it."], "safety": ["Tent poles whip when released; keep faces clear when assembling shock-corded poles and never let scouts fence with them.", "Pegs are sharp: carry them in the bag, not loose in pockets, and use the mallet only on the foam blocks.", "Backpack fitting: never lift a loaded pack by one strap; lift onto a knee then swing on, or have a partner hold it.", "Keep tent sites 2 m apart so nobody trips on guylines; in the hall, lay guylines flat and mark them with tape."]}, "spiritual": {"title": "Dwelling in Tents, Looking for the City", "ref": "Hebrews 11:8-10", "verse": "By faith he dwelt in the land of promise as in a foreign country, dwelling in tents with Isaac and Jacob, the heirs with him of the same promise; for he waited for the city which has foundations, whose builder and maker is God.", "url": "https://www.biblegateway.com/passage/?search=Hebrews+11%3A8-10&version=NKJV", "message": "Tonight we packed and pitched tents, and next Monday Great Lent begins. The two belong together. Abraham was rich enough to build a palace, but he chose to live in tents his whole life, moving when God said move. A tent is light, quick to pitch, quick to strike. It says: I am passing through; my real home is somewhere else. Hebrews says Abraham 'waited for the city which has foundations, whose builder and maker is God.' Our Church has always understood this. St. Antony, St. Macarius and the desert fathers left comfortable houses in Egypt for caves and cells, travelling light so nothing would weigh down their hearts. Great Lent is our forty days of tent living. We eat simply, we pack fewer distractions, we carry only what we need, and we walk toward Pascha. Remember the packing lesson: heavy things close to your back and high, where they ride easily. In Lent, the heavy things, prayer, the Liturgy, confession, forgiveness, go closest to the centre. Everything else is lighter and can hang on the outside. And remember the five W's: choose your site carefully. Do not pitch your Lent under the dead branches of old habits. Pitch it close to the living water, in the Church, with your patrol around you. We are campers, not settlers. Travel light and keep your eyes on the city.", "discussion": ["Abraham lived in tents even though he could afford a house. What does it mean to live like a person who is 'passing through' while still doing well at school and at home?", "If Great Lent is a camping trip toward Pascha, what would you put in your pack and what would you leave behind this year?", "The desert fathers chose a hard site on purpose. Why do you think giving up comfort can bring us closer to God?"], "prayer": "Lord God of Abraham, You called Your servant to live in tents and to look for the city whose builder and maker is You. As we prepare for camp and for the holy fast of Great Lent, teach us to travel light, to carry You at the centre of our packs, and to pitch our lives beside Your living water. Bring us safely to the joy of Your Resurrection, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Blindfold Tent-Pitch Race", "setup": "Five taped tent sites around the hall, one tent bag per site with all parts inside, eight foam blocks per site for pegs. Each patrol stands at its site with two scouts blindfolded (the 'pitchers') and the rest as 'guides' who may speak but may not touch the tent, poles, pegs or the pitchers. One leader judges per two patrols with a stopwatch and the checklist.", "materials": ["1 dome tent per patrol, complete, in its bag", "2 blindfolds per patrol", "8 foam blocks or cardboard sheets per site", "Stopwatch per judge", "Judge checklist: footprint down, four corners pegged at 45 degrees, poles seated, body clipped, fly on with seams over poles and door aligned, fly not touching inner, guylines tensioned, all pegs in foam"], "rules": ["On the whistle, the two blindfolded pitchers open the bag and begin. Guides give spoken instructions only: 'left hand, pole end, push it into the grommet at your right knee.' Any guide who touches the tent or a pitcher adds a 30-second penalty.", "The tent must be pitched to the checklist: footprint, four corner pegs angled away and seated in the foam, poles in their grommets, body clipped or sleeved, fly on with the door aligned and not touching the inner tent, and at least two guylines tensioned with a taut-line hitch.", "When the patrol leader calls 'Tent up', the judge stops the clock and checks every item. Each missing or wrong item adds 1 minute to the time; the patrol may fix items blindfolded while the clock keeps running before calling 'Tent up' again.", "Round 2: swap in two new pitchers and strike the tent blindfolded: unclip, remove poles by pushing, fold poles, shake and roll the tent, everything back in the bag with the drawstring closed. Judge checks that all pegs are counted in.", "Lowest combined time (pitch plus strike, including penalties) wins. If time allows, the winning patrol demonstrates a sighted pitch for the whole troop and calls out the roles as they go."], "variations": ["Short on time: pitch only, no strike round; judges strike the tents after the meeting with help.", "Harder: guides may only use nautical directions (bow, stern, port, starboard) relative to the tent door, and the pitchers may not speak at all.", "Easier: only one pitcher is blindfolded and the other sighted pitcher may touch but not speak.", "Extension: after the race, each patrol packs the demo backpack in turn and the judge scores the packing zones (heavy in the middle close to the back, bag at the bottom, rain gear on top)."]}, "tables": [{"caption": "Backpack packing zones", "headers": ["Zone", "What goes there", "Why"], "rows": [["Bottom", "Sleeping bag, camp clothes, anything light and bulky", "Not needed until camp; light weight low does not pull you back"], ["Middle, against your back", "Food bag, stove and fuel, water, cook pot", "Heaviest items close to the spine and between the shoulder blades ride best"], ["Middle, away from your back", "Tent body, sleeping pad, tarp", "Medium weight fills the outer space"], ["Top", "Rain jacket, fleece, lunch", "Grab in seconds when the weather turns"], ["Lid pocket", "Headlamp, map, compass, first-aid kit, snacks, toilet paper, whistle", "Small essentials found without unpacking"], ["Outside", "Sleeping pad, wet shoes only", "Nothing swinging; snag and balance hazard"]]}, {"caption": "Sample patrol duty roster for one camp day", "headers": ["Duty", "Breakfast", "Lunch", "Supper", "What it includes"], "rows": [["Cooks (2)", "Scout A, B", "Scout C, D", "Scout E, F", "Menu, stove, cooking, serving"], ["Water and stove/fire (1)", "Scout C", "Scout E", "Scout A", "Fill and treat water, fuel check, fire safety"], ["Dishes (2)", "Scout D, E", "Scout F, A", "Scout B, C", "Three basins: wash, rinse, sanitize; strain grey water"], ["Camp tidy and gear check (1)", "Scout F", "Scout B", "Scout D", "Tents zipped, gear stowed, site clean, Leave No Trace"], ["Prayer leader (1)", "Scout E", "Scout A", "Scout C", "Leads Agpeya prayer and grace before the meal"]]}], "references": [{"label": "Scouts Canada: Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Camping skill stages that match what scouts should be able to do at this age; use it to set expectations."}, {"label": "Leave No Trace Canada", "url": "https://www.leavenotrace.ca/", "why": "The seven principles and the 60 m rule for campsite selection."}, {"label": "YouTube search: how to pack a backpack for camping weight distribution", "url": "https://www.youtube.com/results?search_query=how+to+pack+a+backpack+for+camping+weight+distribution", "why": "Visual walk-through of the packing zones and hip-belt fitting."}, {"label": "YouTube search: how to pitch a dome tent step by step", "url": "https://www.youtube.com/results?search_query=how+to+pitch+a+dome+tent+step+by+step", "why": "Watch once to see the pole X and fly steps on your own tent style."}, {"label": "Animated Knots: Taut-Line Hitch", "url": "https://www.animatedknots.com/taut-line-hitch-knot", "why": "The guyline hitch used in the tent pitch."}, {"label": "Bible Gateway: Hebrews 11 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Hebrews+11&version=NKJV", "why": "The faith chapter for the spiritual lesson."}], "visual": "tent-pitch", "takeHome": "Pack your own school bag or a family backpack using the packing zones, weigh it on a bathroom scale, work out what percentage of your body weight it is, and bring the number next week."}, {"n": 24, "date": "2027-03-09", "term": "Winter", "title": "How Sails Work", "theme": "Lift, points of sail, tacking and jibing, and trimming a sail so the wind does the work", "sea": true, "calendar": ["Great Lent began yesterday, Mar 8. All food at meetings is now vegan (fasting-friendly) until Pascha. No food is planned tonight.", "The Feast of the Cross falls on Friday, Mar 19, during Lent; mention it at closing.", "March Break next week: there is NO meeting on Mar 16. Next meeting is Mar 23."], "objectives": ["Name the parts of a sailing dinghy's rig and sail: mast, boom, mainsail, jib, halyard, sheet, head, tack, clew, luff, leech, foot, centreboard, rudder, tiller.", "Explain the difference between a sail pushing (downwind) and a sail lifting like a wing (across and upwind), and why the centreboard matters.", "Name the points of sail, the no-go zone and port and starboard tack, and set a card 'sail' correctly for each in front of a fan.", "Describe a tack and a jibe, give the commands, and explain why a jibe is more dangerous.", "Use telltales to trim a sail, and describe hiking out and easing the sheet to stop a capsize."], "materials": [{"item": "Box fan or a strong pedestal fan", "qty": "2", "note": "one for teaching, one for the race; extension cord taped to the floor"}, {"item": "Dinghy rig model: a 1 m dowel mast in a base, a 60 cm dowel boom, and a triangle of light fabric or paper as a mainsail, with a string sheet", "qty": "1", "note": "build in advance; a toy sailboat also works"}, {"item": "Card 'sails': stiff A4 card with a dowel or ruler taped along one edge", "qty": "1 per scout", "note": "scouts hold these to act out points of sail"}, {"item": "Compass rose taped on the floor, 3 m across, with the wind direction marked by an arrow from the fan", "qty": "1", "note": "masking tape; label N, E, S, W and 45-degree marks"}, {"item": "Strips of tissue paper or light ribbon for telltales, 15 cm", "qty": "30", "note": "tape to the model sail and to card sails"}, {"item": "Land-yacht building kits per patrol: corrugated cardboard 30 cm by 20 cm, 4 plastic bottle caps, 2 wooden skewers, 2 straws, a 30 cm dowel, A4 paper and card, tape, scissors (leader supervised)", "qty": "1 kit per patrol", "note": "wheels: push skewers through caps; straws as axle bearings taped under the deck"}, {"item": "Masking tape for the race track", "qty": "1 roll", "note": "4 m straight lanes on a smooth floor"}, {"item": "Printed points-of-sail diagram and tacking-commands card", "qty": "1 per patrol", "note": "from the visual and tables"}, {"item": "Stopwatch, tape measure", "qty": "1 each", "note": "race scoring"}], "prep": ["Build the rig model and the card sails. Tape a telltale on each side of the model sail near the front edge (luff).", "Build one land-yacht yourself so you know the kit works: cardboard deck, straws taped underneath as bearings, skewers through the straws with a bottle cap pressed on each end, a dowel mast taped upright, paper sail. Test it in front of the fan; it should roll at least 3 m.", "Tape the compass rose on the floor and set the teaching fan at the 'north' edge blowing south, so 'wind from the north' is real.", "Tape the 4 m race lanes on the smoothest part of the floor and set the race fan at the start line.", "Practise saying the tacking commands aloud: 'Ready about?' 'Ready.' 'Helm's a-lee.' and the jibe: 'Prepare to jibe.' 'Ready.' 'Jibe-ho.'", "Watch one short video on how sails generate lift (see references) so you can answer 'why' questions.", "Remind families about the Lenten fast and the no-meeting on Mar 16."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Great Lent, no meeting Mar 16, Feast of the Cross Mar 19)."}, {"time": "6:25", "min": 40, "what": "Practical: parts of the rig and sail, push vs lift, points of sail with the fan, tacking and jibing, sail trim and hiking out."}, {"time": "7:05", "min": 10, "what": "Spiritual: John 3:8, the wind and the Spirit, and Lent as tacking toward Pascha."}, {"time": "7:15", "min": 25, "what": "Activity: Cardboard Land-Yacht Race with fans."}, {"time": "7:40", "min": 5, "what": "Closing: recap (points of sail, no-go zone, let it out until it luffs), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Harnessing the Wind", "intro": "A sailboat with no engine can sail almost anywhere, even toward the wind, and it does it with a piece of cloth. That seems impossible until you understand that a sail is a wing, not a bag. Tonight we learn the names of the parts, how the wind pulls a boat forward, the points of sail every skipper thinks in, and the two turns that take you where you want to go. We will use a fan for wind and card sails for boats.", "steps": [{"title": "Parts of the rig and sail", "min": 7, "detail": "Point to each part on the model as you name it, and have scouts repeat. The mast stands up; the boom swings along the bottom of the mainsail. The mainsail is the big sail behind the mast; the jib is the smaller sail in front, on the forestay. Wires holding the mast up are the shrouds (sides) and forestay (front). A halyard is the rope that hauls a sail up; a sheet is the rope that pulls a sail in or lets it out (so 'sheet in' means pull in). The three corners of a sail: head (top), tack (front bottom, at the mast), clew (back bottom, at the end of the boom). The three edges: luff (front edge), leech (back edge), foot (bottom edge). Battens are stiffeners in the leech. Under the boat, the centreboard or daggerboard is a fin that stops the boat sliding sideways, and the rudder steers, moved by the tiller. Say: push the tiller toward the sail to turn away from the wind, pull it away from the sail to turn toward the wind. Quiz round-robin: 'What rope pulls in the mainsail?' 'Which corner is at the end of the boom?'"}, {"title": "Push vs lift: why a sail is a wing", "min": 8, "detail": "Turn on the fan. Hold the model with the wind straight behind and the sail out sideways: the sail fills like a parachute and the boat is pushed. That is running downwind, and it is the slow, simple case. Now turn the model so the wind comes across the side and pull the sheet so the sail makes a curved shape. Explain: air flowing around the curved sail is bent, the flow over the outside (leeward) curve speeds up and its pressure drops, and the air is thrown backward off the trailing edge. The result is a force called lift, pulling roughly at right angles to the sail, mostly sideways and a little forward. On its own that would just shove the boat sideways. The centreboard resists the sideways push, and the boat is squeezed forward, like a wet watermelon seed pinched between your fingers. Demo: hold a strip of paper by one end at your lips and blow across the top; the strip rises. Second demo: hold the card sail edge-on to the fan, then angle it 20 degrees and feel the pull. This is the same lift that holds up an aircraft wing."}, {"title": "Points of sail with the fan", "min": 9, "detail": "Scouts each take a card sail and stand on the floor compass rose with the fan as north wind. Walk through the points of sail, moving to each position and setting the card. Head to wind and about 45 degrees either side: the no-go zone; the sail just flaps (luffs) and the boat stops. Close-hauled, about 45 degrees off the wind: sail pulled in tight, almost along the centreline; this is as close to the wind as you can sail. Close reach, about 60 degrees: sail eased a little. Beam reach, wind directly on the side at 90 degrees: sail about halfway out; the fastest and easiest point for most dinghies. Broad reach, wind over the back corner at about 135 degrees: sail mostly out. Run, wind dead behind: sail all the way out at right angles, sometimes with the jib on the other side (goosewinged). Teach the trim rule: let the sail out until the luff starts to flutter, then pull it in just until it stops. Then tack names: starboard tack means the wind comes over the starboard side and the boom is out to port; port tack is the opposite. Starboard tack has right of way over port tack. Call out points and tacks and have scouts move to them, fastest patrol wins a point."}, {"title": "Tacking and jibing", "min": 8, "detail": "To go toward the wind you cannot sail straight, so you zigzag, sailing close-hauled on one tack, then turning through the no-go zone onto the other. That turn, bow through the wind, is a tack. Commands from the helm: 'Ready about?' Crew: 'Ready.' Helm: 'Helm's a-lee' (or simply 'Tacking'), and the tiller is pushed toward the sail. The boat turns, the sails flap for a moment, the boom comes across gently, everyone ducks and moves to the new high side, the jib sheet is released and pulled in on the new side, and the helm swaps hands on tiller and sheet. A jibe is turning the stern through the wind while sailing downwind. It is more dangerous because the boom is far out and the wind slams it across at full speed. Commands: 'Prepare to jibe.' 'Ready.' 'Jibe-ho.' Before jibing the crew sheets the main in toward the centre so the boom travels a short distance, everyone keeps heads well down, and the sheet is eased out on the new side after the boom crosses. An accidental jibe on a run is the number one way scouts get hit by the boom. Act it out: patrols sit in two lines as a boat, a leader is the boom (an arm), and they practise ducking and swapping sides on the commands."}, {"title": "Sail trim, telltales and hiking out", "min": 8, "detail": "Telltales are short ribbons on both sides of the sail near the luff. Show them on the model in the fan. When both stream straight back, the air is flowing smoothly on both sides and the sail is trimmed right. If the windward (inside) telltale lifts or flutters, you are pointing too close to the wind or the sail is too loose: bear away a little or sheet in. If the leeward (outside) telltale flutters, the sail is in too tight: ease the sheet or head up. Rule: 'if in doubt, let it out.' Heeling: when the wind pushes the sail over, the boat tips; a little heel is fine, a lot spills wind, slows you and can capsize the boat. The crew fights heel by hiking out: sitting on the windward rail, feet under the hiking straps, leaning back over the water to use body weight as ballast, just like the centre of gravity lesson. In a gust: hike harder, ease the mainsheet, and steer a little toward the wind to depower. Act it out on a bench: scouts sit on one edge and lean back on the command 'hike'."}], "tips": ["Keep the fan running for the whole lesson; scouts learn points of sail with their bodies far better than from a diagram.", "The single most useful sentence is 'let it out until it luffs, then pull it in until it stops.' Say it five times.", "Scouts confuse tack (the corner of the sail), tack (the turn) and tack (which side the wind is on). Point out that sailors live with this and say which one you mean.", "For the jibe, over-act the danger of the boom. A leader's arm swinging across at head height makes the point without hurting anyone.", "If the fan is weak, use two fans side by side, or run the points-of-sail drill with card sails in front of an open door on a windy night."], "safety": ["Tape the fan's extension cord flat to the floor and keep fingers away from the fan guard.", "Scissors and skewers in the land-yacht kits are leader-supervised; skewer points get a blob of tape once the wheels are on.", "The boom acting game uses an arm at head height moving slowly; no actual poles are swung.", "Bench 'hiking' is a lean, not a fall; a second scout holds the bench steady and nobody stands on it."]}, "spiritual": {"title": "The Wind Blows Where It Wishes", "ref": "John 3:1-8", "verse": "The wind blows where it wishes, and you hear the sound of it, but cannot tell where it comes from and where it goes. So is everyone who is born of the Spirit.", "url": "https://www.biblegateway.com/passage/?search=John+3%3A1-8&version=NKJV", "message": "Nobody in this hall has seen the wind tonight. You saw a card bend, a telltale stream, a little cardboard boat roll across the floor. The wind itself is invisible; you only know it by what it does. Jesus told Nicodemus, a serious religious teacher who came to Him at night, that the Holy Spirit is like that. You cannot see Him, but you see what He does: a heart that forgives, a scout who tells the truth when a lie would be easier, a whole Church singing at midnight in Kiahk. In the Coptic rite the priest breathes on the water at baptism and on the bread and wine at the Liturgy, because the Spirit is the breath and wind of God, the same Spirit who came like a rushing mighty wind at Pentecost. A sailor cannot make wind. What a sailor can do is raise the sail and trim it. Prayer, the Agpeya, fasting, the Liturgy, confession: these are how we raise the sail so that when the Spirit blows we move. Great Lent began yesterday. Remember that a boat cannot sail straight into the wind, but it still reaches the harbour by tacking, one leg at a time. Lent is fifty-five days of tacking toward Pascha. Some legs feel like you are going sideways. Keep the sail up, watch the telltales of your conscience, and trust the Wind.", "discussion": ["You cannot see the wind but you can see a sail fill. What are the 'telltales' that show the Holy Spirit is working in a person's life?", "A sailor cannot make wind but can raise the sail. What does 'raising the sail' look like for you during Great Lent?", "Tacking means you sometimes seem to be going the wrong way to reach your goal. When has something that felt like a detour turned out to be God's course for you?"], "prayer": "O Holy Spirit, Comforter, Wind of God, You blow where You wish and You fill every heart that raises its sail to You. Fill our sails this Lent, trim our lives by Your truth, and carry us safely through every tack and jibe to the harbour of Your Resurrection. Keep us from the boom of pride and steady us when we heel, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Cardboard Land-Yacht Race", "setup": "Patrols at their tables with one kit each. The race track is two taped 4 m lanes on the smoothest floor with the race fan at the start line blowing straight down the lanes (a 'run'). A second start position is marked with the fan turned 45 degrees to the lane for the 'reach' heat. One leader is race officer with the stopwatch and tape measure; one leader supervises scissors and skewers.", "materials": ["1 land-yacht kit per patrol (cardboard deck, 4 bottle caps, 2 skewers, 2 straws, dowel mast, paper and card, tape)", "Scissors (leader held)", "Box fan with taped cord", "Tape measure and stopwatch", "Score sheet", "Spare cardboard and caps for repairs"], "rules": ["Build phase (12 minutes): each patrol builds one land-yacht from the kit only. Wheels: tape the two straws across the underside of the deck, push a skewer through each straw, press a bottle cap onto each skewer end (a leader pre-pokes the cap holes). Mast: tape the dowel upright near the front third of the deck. Sail: any shape from the paper and card, taped to the mast; a boom of a skewer or rolled paper is allowed. The yacht must fit in a 30 cm by 30 cm square and must have a sail; no pushing, no rubber bands.", "Heat 1, the Run (2 minutes per patrol): the yacht is placed on the start line with the fan directly behind. On 'go' the fan is switched on (or uncovered) and the patrol may not touch the yacht. Score: distance travelled down the lane in 20 seconds, measured to the nearest 10 cm; 1 point per 20 cm, maximum 20 points. Two runs, best counts.", "Heat 2, the Reach: the fan is set at 45 degrees to the lane. The patrol may set their sail angle before the start (the lesson's trim rule applies). Score: distance travelled along the lane direction in 20 seconds, 1 point per 20 cm. A yacht that leaves the lane scores the distance at the point it left.", "Trim bonus: before each heat, the patrol leader must state the point of sail and how the sail is set ('broad reach, sail eased two-thirds out') and why. A correct statement earns 2 points from the race officer.", "Repairs are allowed between heats using only kit materials. Highest total wins; the winning patrol names its yacht and takes it home."], "variations": ["Short on time: 8-minute build and the Run heat only.", "Harder: add a 'tack' heat where the fan is set almost head-on (60 degrees off the lane); yachts that make forward progress score double, teaching that close-hauled works and head-to-wind does not.", "Easier: leaders pre-build the wheeled decks so patrols only design and trim the sail.", "Extension: let patrols add a cardboard 'centreboard' fin under the deck to see if it reduces sideways drift on the reach heat."]}, "tables": [{"caption": "Points of sail", "headers": ["Point of sail", "Wind direction (from the bow)", "Sail setting", "Notes"], "rows": [["No-go zone", "Straight ahead to about 45 degrees either side", "Sail flaps, no drive", "Boat stops; turn away from the wind to fill the sail"], ["Close-hauled", "About 45 degrees", "Pulled in tight, near the centreline", "Closest you can sail to the wind; boat heels most"], ["Close reach", "About 60 degrees", "Eased a little", "Fast and comfortable"], ["Beam reach", "90 degrees, directly on the side", "About halfway out", "Fastest point for most dinghies"], ["Broad reach", "About 135 degrees, over the back corner", "Mostly out", "Fast, less heel, watch for waves lifting the stern"], ["Run", "Dead astern, 180 degrees", "All the way out, jib may goosewing", "Slowest per wind strength; danger of accidental jibe"]]}, {"caption": "Tacking and jibing commands", "headers": ["Manoeuvre", "Which way the bow turns", "Helm says", "Crew says", "Crew does"], "rows": [["Tack", "Bow turns through the wind", "'Ready about?' then 'Helm's a-lee'", "'Ready'", "Duck, cross to the new high side, release old jib sheet, sheet in the new one"], ["Jibe", "Stern turns through the wind (downwind)", "'Prepare to jibe' then 'Jibe-ho'", "'Ready'", "Sheet the main in first, heads down, cross as the boom comes over, ease the main on the new side"]]}], "references": [{"label": "Wikipedia: Points of sail", "url": "https://en.wikipedia.org/wiki/Points_of_sail", "why": "Diagram and names of every point of sail; print it for the wall."}, {"label": "Wikipedia: Tacking (sailing)", "url": "https://en.wikipedia.org/wiki/Tacking_(sailing)", "why": "Explains the tack manoeuvre and beating to windward."}, {"label": "YouTube search: how do sails work lift explained", "url": "https://www.youtube.com/results?search_query=how+do+sails+work+lift+explained", "why": "Animated explanations of lift on a sail to watch before teaching step 2."}, {"label": "YouTube search: points of sail explained dinghy sailing", "url": "https://www.youtube.com/results?search_query=points+of+sail+explained+dinghy+sailing", "why": "Video walk-through of each point of sail on a real dinghy."}, {"label": "Sail Canada", "url": "https://www.sailing.ca/", "why": "The national body for learn-to-sail programs scouts can join in summer."}, {"label": "Bible Gateway: John 3:1-8 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+3%3A1-8&version=NKJV", "why": "Nicodemus and the wind for the spiritual lesson."}], "visual": "points-of-sail", "takeHome": "Next time you are outside in wind, face it, turn 45 degrees, 90 degrees and 180 degrees, name each point of sail out loud, and note which way you would have to hold a sail; write the wind direction and your three answers in your notebook."}, {"n": 25, "date": "2027-03-23", "term": "Spring", "title": "Tides, Currents & Dead Reckoning", "theme": "Reading the tide, allowing for current, and working out where you are with a compass, a clock and arithmetic", "sea": true, "calendar": ["Great Lent continues (began Mar 8). Any food must be vegan (fasting-friendly); none is planned tonight.", "The Feast of the Cross was Friday, Mar 19. Welcome everyone back after March Break (no meeting Mar 16).", "Spring term begins tonight. Annunciation is Apr 7; Palm Sunday Apr 25; Pascha May 2."], "objectives": ["Explain what causes tides, the difference between spring and neap tides, and read a tide table for a Canadian port.", "Define current, set and drift, and explain how current pushes a boat off its intended track.", "Use the speed-time-distance formula 60D = ST to solve for any of the three, including the six-minute rule.", "Explain dead reckoning and estimated position and plot a DR position from a course, speed and time.", "Make an entry in a ship's log with the correct columns."], "materials": [{"item": "Printed tide table for one day at a Canadian port (from tides.gc.ca), for example Halifax or Saint John", "qty": "1 per patrol", "note": "print in advance; choose a day with clearly different high and low heights"}, {"item": "Whiteboard and markers (three colours)", "qty": "1", "note": "for the vector triangle and formula"}, {"item": "Speed-time-distance worksheet with 6 questions and a blank triangle", "qty": "1 per scout", "note": "questions from the table in this lesson"}, {"item": "Calculators (or phones as calculators)", "qty": "1 per pair", "note": "the arithmetic is simple but speed matters in the activity"}, {"item": "Compasses (baseplate)", "qty": "1 per patrol", "note": "from Lesson 4"}, {"item": "Printed passage plan cards for the activity (one per patrol, different routes, same finish)", "qty": "5", "note": "see activity"}, {"item": "Masking tape and a marker for start points and the target X", "qty": "2 rolls", "note": "the hall becomes the sea"}, {"item": "Metronome app or a leader with a stopwatch calling 'step'", "qty": "1", "note": "sets the standard speed"}, {"item": "Tape measure, 10 m", "qty": "2", "note": "for scoring distance from the target"}, {"item": "Blank ship's log sheets", "qty": "1 per patrol", "note": "columns: time, course, speed, distance, wind, weather, remarks"}, {"item": "A toy boat and a sheet of paper (current demo)", "qty": "1", "note": "any small floating toy or a folded paper boat"}], "prep": ["Download and print a tide table page from tides.gc.ca for a port with big tides (Saint John, NB is ideal). Highlight two highs and two lows and their heights.", "Draw the speed-time-distance triangle on the whiteboard: D on top, S and T on the bottom, with 60 written beside D. Cover-up method: cover the letter you want and the other two show the calculation.", "Prepare the six worksheet questions and answers (see the table).", "Design the activity passage plans. Decide the hall scale: 1 nautical mile = 5 m, and the 'standard speed' is one pace per second where one pace is 0.5 m (so 1 knot = 0.5 m per 6 seconds; simpler: scouts convert distance to metres then to their own pace count). Mark one target X on the floor and choose five different start points so that all five routes finish on the X if done correctly.", "Walk each passage plan yourself with a compass and adjust the legs until they finish on the X.", "Mark the start points with tape and the patrol name; keep the target X covered with a sheet of paper until scoring.", "Print the blank log sheets and passage plan cards."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Great Lent, Annunciation, spring camp deposits)."}, {"time": "6:25", "min": 40, "what": "Practical: tides, current set and drift, 60D = ST with worked examples, dead reckoning and estimated position, keeping a log."}, {"time": "7:05", "min": 10, "what": "Spiritual: Psalm 27:14 and Ecclesiastes 3:1, waiting on the Lord and the seasons of Lent."}, {"time": "7:15", "min": 25, "what": "Activity: Dead-Reckoning Course in the hall with timed pacing and a hidden current."}, {"time": "7:40", "min": 5, "what": "Closing: recap (60D = ST, spring and neap, set and drift), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Where Am I? Tides, Currents and Dead Reckoning", "intro": "Before GPS, and today whenever a GPS battery dies, sailors find their position by dead reckoning: I know where I started, which way I steered, how fast and for how long, so I know roughly where I am. Add the push of tides and currents and you have the navigator's daily job. Tonight is a math lesson disguised as a sea lesson, and by the end you will be able to answer 'how long until we get there?' like a skipper.", "steps": [{"title": "Tides: spring, neap and the tide table", "min": 8, "detail": "Recall from Lesson 20: the moon's gravity pulls the ocean into two bulges, so most coasts get two high tides and two low tides a day, about 12 hours 25 minutes apart, which is why high tide comes about 50 minutes later each day. Tidal range is the height difference between high and low. At new and full moon the sun and moon line up and the range is biggest: spring tides (nothing to do with the season). At first and last quarter they pull at right angles and the range is smallest: neap tides. The rule of twelfths estimates the height between tides: in the six hours from low to high the tide rises one twelfth in the first hour, two in the second, three, three, two, one. So it rises fastest in the middle hours. Hand out the tide table. Have patrols find today's high and low times and heights and compute the range. Why it matters: a rock with 2 m of water at high tide is dry at low; a dock line tied tight at high tide snaps at low. The Great Lakes have almost no tide (a few centimetres), but the Bay of Fundy has up to 16 m (about 52 ft)."}, {"title": "Currents: set and drift", "min": 8, "detail": "A current is water moving horizontally: rivers, tidal streams in and out of harbours, and wind-driven currents on the Great Lakes. Two words: set is the direction the current flows toward, given as a compass direction (set 090 means flowing toward east); drift is its speed in knots. Demo: put the toy boat on the sheet of paper and slide the paper sideways while a scout 'steers' the boat straight ahead; the boat ends up somewhere else. Your heading is where the bow points; your course over the ground is where you actually go. If you steer north at 4 knots and the current sets east at 1 knot, after an hour you are 4 NM north and 1 NM east of where you think. Draw the vector triangle on the board: one arrow for heading and speed through the water, a second arrow from its tip for set and drift, and the third side closing the triangle is your true course and speed over the ground. To reach a point across a current, aim upstream, like a ferry crossing a river. Ask: 'Current sets west at 2 knots, you want to go north; which way do you point the bow?' (a little west of north)."}, {"title": "Speed, time and distance: 60D = ST", "min": 10, "detail": "A knot is one nautical mile per hour; one nautical mile is 1.852 km (about 1.15 statute miles). Because we work in minutes, the formula is 60 times Distance equals Speed times Time in minutes: 60D = ST. Show the triangle: cover the letter you want. Worked example 1, distance: at 6 knots for 30 minutes, D = S times T divided by 60 = 6 x 30 / 60 = 3 NM. Example 2, time: to cover 5 NM at 4 knots, T = 60 x D / S = 60 x 5 / 4 = 75 minutes. Example 3, speed: 2 NM in 20 minutes, S = 60 x D / T = 60 x 2 / 20 = 6 knots. The six-minute rule: in 6 minutes you cover one tenth of your speed in miles, so at 8 knots you go 0.8 NM in 6 minutes; navigators plot every 6 minutes for this reason. Hand out the worksheet; pairs solve the six questions in 4 minutes, then check answers together on the board. Stress units: speed in knots, time in minutes, distance in nautical miles, every time."}, {"title": "Dead reckoning and estimated position", "min": 8, "detail": "Dead reckoning (DR) is a position worked out from a known starting point, the course steered, the speed and the time run, ignoring current. On the board, draw a fix (a dot inside a circle with the time written beside it) and a course line at 090. At 6 knots, after 30 minutes the DR is 3 NM along the line; mark it with a dot and a half circle and the time, the standard symbol. Do the next 30 minutes the same way. An estimated position (EP) improves the DR by adding the set and drift arrow from the DR point; mark it with a dot in a small triangle. Explain why we bother: GPS fails, batteries die, and a navigator who has kept a DR knows within a mile where the boat is the moment the screen goes dark. Rules: plot a new DR at every course or speed change and at least every hour; compare with a GPS or a visual fix whenever you can, and restart the DR from each good fix. Link to Lesson 4: a bearing plus a pace count on land is exactly the same idea, and tonight's activity uses it."}, {"title": "Keeping a log", "min": 6, "detail": "Hand out the log sheets. The ship's log is the record that makes dead reckoning possible: if the log is honest, you can reconstruct the whole passage. Columns: time (24-hour), course steered (degrees), speed or log reading (the 'log' on a boat is an instrument that measures distance through the water), distance run, wind (direction and Beaufort force), weather and barometer, and remarks (buoys passed, sail changes, anyone seasick, an engine started). Entries go in every hour and at every course change, in pen, no erasing; cross out mistakes with one line. Show a sample entry: '1430, course 090, speed 5.5 kn, run 2.7 NM, wind SW 3, clear, barometer 1015 steady, passed green buoy K5 close to starboard.' Each patrol writes one entry for a made-up leg and one for a course change, then reads it aloud. The log is also a legal document after an incident, which is why it is kept carefully. Tell them the activity will require a log."}], "tips": ["Some scouts fear the math; keep the triangle on the board all night and let them use the cover-up method without shame. Success on the worksheet builds confidence quickly.", "Use the sliding paper demo twice; the idea that the water itself moves under the boat is the one that unlocks set and drift.", "Always say the units: 'knots, minutes, nautical miles'. Half the errors come from mixing hours and minutes.", "The DR symbols (circle for fix, half circle for DR, triangle for EP) are worth drawing large; scouts enjoy the secret code aspect.", "If the tide table confuses them, focus on one thing: find the highest number and the lowest number, and subtract."], "safety": ["During the pacing activity, scouts walk with a compass held at chest height and eyes up; no running and no walking backward.", "Keep the hall floor clear of chairs and bags along the routes; leaders stand at the walls, not in the paths.", "Any food this week is Lenten (vegan); none is planned, but check before any snack is offered."]}, "spiritual": {"title": "Wait on the Lord: A Time for Every Season", "ref": "Psalm 27:14; Ecclesiastes 3:1", "verse": "Wait on the LORD; Be of good courage, And He shall strengthen your heart; Wait, I say, on the LORD! (Psalm 27:14) To everything there is a season, A time for every purpose under heaven.", "url": "https://www.biblegateway.com/passage/?search=Psalm+27%3A14%3B+Ecclesiastes+3%3A1&version=NKJV", "message": "A skipper on the Bay of Fundy cannot argue with the tide. If the harbour dries out at low water, you wait six hours, and no amount of engine power changes that. Wise sailors plan around the tide table; foolish ones run aground fighting it. The Psalmist says, 'Wait on the LORD; be of good courage.' Waiting is not doing nothing. A sailor waiting for the tide checks the rigging, studies the chart, updates the log, and is ready the moment the water rises. Ecclesiastes says there is a time for every purpose under heaven, and our Church lives by that. The Coptic calendar is a tide table for the soul: seasons of fasting and seasons of feasting, Kiahk and Christmas, Lent and Pascha, each at its proper hour. We are now in the third week of Great Lent, a long ebb tide. It can feel slow, and the temptation is to give up the fast or to force things. Do not. Keep a good log: pray the Agpeya at its hours, come to the Liturgy, confess, and let God strengthen your heart. St. Antony waited twenty years in a deserted fort before God sent him the people he would guide. Dead reckoning teaches the same lesson: hold your course, keep your speed, trust the time, and the harbour appears. The flood tide of Pascha is coming, on schedule.", "discussion": ["A sailor cannot hurry the tide. What is something in your life right now where God is asking you to wait, and what can you do while you wait?", "The Church calendar has fasting seasons and feasting seasons. Why do you think God gave us both instead of one steady 'normal'?", "Dead reckoning means trusting your course when you cannot see land. When has faith felt like that for you, and what kept you on course?"], "prayer": "Lord, You set the seasons and the tides, and You ask us to wait on You with good courage. Strengthen our hearts in this Great Lent, keep us on the course You have given us when we cannot see the shore, and bring us in Your good time to the harbour of Your Resurrection. Teach us to keep an honest log of our lives before You, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Dead-Reckoning Course with a Hidden Current", "setup": "The hall floor is the sea. Scale: 1 nautical mile equals 5 m. Five taped start points around the hall walls, each labelled with a patrol name, all leading by different routes to the same target X in the centre (covered by a sheet of paper until scoring). One leader is the 'clock', calling 'step' once per second from the front so everyone paces at the same rhythm. Each patrol has a compass, a passage plan card, a calculator, a pencil and a log sheet.", "materials": ["5 passage plan cards (3-4 legs each, giving course in degrees, speed in knots and time in minutes only, never distance)", "1 compass per patrol", "Calculators, pencils, log sheets", "Masking tape for start points and the target X", "Tape measure", "Leader with stopwatch or metronome app"], "rules": ["Planning (6 minutes): the patrol converts each leg to a distance with 60D = ST, then to metres (1 NM = 5 m), then to paces using the pacing from Lesson 4 (a scout's own two-step pace count for 10 m, scaled). The navigator writes each leg in the log: course, speed, time, distance in NM, distance in metres, paces. Example leg: 'Steer 090 at 6 knots for 20 minutes' is 2 NM, 10 m.", "Passage (12 minutes): the whole patrol walks together in single file. The navigator holds the compass and sets each course; the pacer counts paces aloud; the log keeper writes the time each leg starts and ends (using the real clock) and any remarks. The patrol must stop at the end of each leg and take the next bearing before moving; no cutting corners.", "Hidden current: on one leg (marked on the card with a wave symbol), the leader announces a set and drift when the patrol reaches it, for example 'current sets 180 at 2 knots for this leg'. The patrol must add the current's push for that leg's time (2 knots for 15 minutes is 0.5 NM, or 2.5 m, toward 180) and walk that offset after the leg. A patrol that ignores the current will miss the X.", "Finish: the patrol places a tape marker with its name where it believes the X is, then the paper is lifted. Scoring: within 1 m of the X, 10 points; within 2 m, 7; within 3 m, 4; within 5 m, 1. Log quality: 3 points for a complete log with all legs, times and the current noted; 1 point if partial. Bonus 2 points for the fastest patrol that also scored within 2 m.", "Highest total wins the title 'Navigator of the Watch'. If two patrols tie, the closer marker wins."], "variations": ["Short on time: three-leg plans with no current, 4 minutes to plan, 8 to walk.", "Harder: give one leg as distance and speed only, so the patrol must find the time and walk it purely by the leader's 'step' count rather than by pacing.", "Easier: give the distances in metres on the card but still require the patrol to state the 60D = ST calculation aloud to the leader before starting.", "Extension: run a second passage in reverse, from the X back to the start, using reciprocal courses (add or subtract 180 degrees)."]}, "tables": [{"caption": "60D = ST worksheet with answers", "headers": ["Question", "Cover", "Calculation", "Answer"], "rows": [["1. Speed 6 knots for 30 minutes. Distance?", "D", "6 x 30 / 60", "3 NM"], ["2. Distance 5 NM at 4 knots. Time?", "T", "60 x 5 / 4", "75 minutes"], ["3. Distance 2 NM in 20 minutes. Speed?", "S", "60 x 2 / 20", "6 knots"], ["4. Speed 8 knots for 6 minutes. Distance?", "D", "8 x 6 / 60 (six-minute rule)", "0.8 NM"], ["5. Distance 12 NM at 5 knots. Time?", "T", "60 x 12 / 5", "144 minutes (2 h 24 min)"], ["6. Distance 4.5 NM in 45 minutes. Speed?", "S", "60 x 4.5 / 45", "6 knots"]]}, {"caption": "Tide and current words", "headers": ["Word", "Meaning", "Example"], "rows": [["Tidal range", "Height difference between high and low water", "Saint John, NB: about 7-8 m; Toronto: a few cm"], ["Spring tide", "Largest range, at new and full moon", "Sun and moon pulling in line"], ["Neap tide", "Smallest range, at first and last quarter", "Sun and moon pulling at right angles"], ["Rule of twelfths", "Tide rises 1, 2, 3, 3, 2, 1 twelfths in each of the six hours", "Fastest rise in hours 3 and 4"], ["Set", "Direction the current flows toward", "Set 090 means flowing toward east"], ["Drift", "Speed of the current in knots", "Drift 2 knots"], ["Heading", "Where the bow points", "Steering 000 (north)"], ["Course over ground", "Where the boat actually goes after current", "Heading 000 plus set 090 gives a track a little east of north"]]}], "references": [{"label": "Tide predictions Canada (tides.gc.ca)", "url": "https://www.tides.gc.ca/", "why": "Print a real tide table for the lesson and show how to read times and heights."}, {"label": "Wikipedia: Dead reckoning", "url": "https://en.wikipedia.org/wiki/Dead_reckoning", "why": "Background and the history of navigating without electronics."}, {"label": "Wikipedia: Rule of twelfths", "url": "https://en.wikipedia.org/wiki/Rule_of_twelfths", "why": "The 1-2-3-3-2-1 tide-height estimate with a worked example."}, {"label": "Wikipedia: Tide", "url": "https://en.wikipedia.org/wiki/Tide", "why": "Spring and neap tides and why the times shift 50 minutes a day."}, {"label": "YouTube search: speed time distance 60D=ST navigation", "url": "https://www.youtube.com/results?search_query=speed+time+distance+60D%3DST+navigation", "why": "Short tutorials on the formula and the six-minute rule with worked examples."}, {"label": "Bible Gateway: Psalm 27 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Psalm+27&version=NKJV", "why": "Full psalm for the spiritual lesson."}], "visual": null, "takeHome": "Time one car or bus trip this week, note the distance from a map app, work out the average speed with 60D = ST (using km instead of NM), and bring your three numbers next week."}, {"n": 26, "date": "2027-03-30", "term": "Spring", "title": "Paddling & Rowing Skills (on land)", "theme": "Canoe and kayak parts, sizing a paddle, the strokes that move and steer a boat, and the rowing stroke, all practised on benches", "sea": true, "calendar": ["Great Lent continues. Any food must be vegan (fasting-friendly); none is planned tonight.", "Annunciation is next Wednesday, Apr 7. Palm Sunday Apr 25, Holy Week Apr 26 to May 1, Pascha May 2.", "Summer paddling and regatta plans: this lesson prepares scouts for the on-water session; collect swim-ability forms if your council requires them."], "objectives": ["Name the main parts of a canoe, a kayak, a canoe paddle and a kayak paddle, and size a canoe paddle to their body.", "Perform the forward stroke with correct body position and torso rotation, and count the catch, power and recovery phases.", "Perform the J-stroke from the stern seat and explain why the canoe turns without it.", "Perform a draw, a pry and a forward sweep on command and say which way the boat moves for each.", "Describe the four phases of a rowing stroke and demonstrate the sequence on a bench.", "List the paddling safety rules (PFD, buddy, weather, cold water, stay low) and explain why we never stand in a canoe."], "materials": [{"item": "Canoe paddles (assorted lengths, 120-150 cm)", "qty": "10-12", "note": "borrow from the group, a camp or a paddling club; scouts share, alternating"}, {"item": "Kayak paddles (double-bladed)", "qty": "2-3", "note": "borrow; show feathered and unfeathered"}, {"item": "Broom handles or 1.5 m dowels as oars", "qty": "6", "note": "for the rowing stroke"}, {"item": "Benches (or paired chairs facing the same way) as 'canoes'", "qty": "1 per patrol plus 2 spares", "note": "a bench seats a bow and stern paddler; chairs work for kayaks"}, {"item": "Scooter boards (gym scooters) or furniture-moving sliders and folded blankets", "qty": "2 per patrol", "note": "for the land-canoe relay; check the floor allows sliding"}, {"item": "Printed stroke guide and safety card", "qty": "1 per patrol", "note": "from the visual and tables"}, {"item": "Masking tape for lanes and 'buoys' (pylons or cones)", "qty": "1 roll, 6 pylons", "note": "relay course"}, {"item": "PFDs (life jackets) for demonstration", "qty": "2", "note": "from Lesson 12; show fit again briefly"}, {"item": "Whistle and stopwatch", "qty": "1 each", "note": "for the command game and relay"}], "prep": ["Borrow the paddles a week ahead; a local canoe club or camp will usually lend them for a night. Wipe the shafts and check for splinters.", "Practise every stroke yourself sitting on a chair: forward, J-stroke (thumb down at the hip), draw, pry, sweep. Watch the J-stroke video in the references twice; it is the one leaders get wrong.", "Set benches in a row across the hall, all facing the same 'bow' direction, 2 m apart, with room to swing paddles.", "Tape two relay lanes 12 m long with a pylon at the far end of each for the turn.", "Test a scooter board or slider on the hall floor with a scout-sized load to make sure it slides and does not mark the floor.", "Print the stroke guide, the safety card and the command list for the game.", "Remind families about the Annunciation feast and collect any summer paddling forms."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Great Lent, Annunciation Apr 7, summer paddling plans)."}, {"time": "6:25", "min": 40, "what": "Practical: boat and paddle parts and sizing, forward stroke, J-stroke, draw, pry and sweep, rowing stroke phases, paddling safety."}, {"time": "7:05", "min": 10, "what": "Spiritual: Luke 5:4-5, 'Launch out into the deep' and 'nevertheless at Your word'."}, {"time": "7:15", "min": 25, "what": "Activity: Land-Canoe Relay on scooter boards and the Stroke Command Game."}, {"time": "7:40", "min": 5, "what": "Closing: recap (three points of contact, rotate not pull, thumb down for the J), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Paddle Strokes and the Rowing Stroke, Dry-Land Edition", "intro": "A canoe goes where the paddle sends it, and a paddler who only uses arms is tired in ten minutes. Tonight we learn the parts of the boats and paddles, how to hold and size a paddle, and the five strokes that move and steer a canoe, plus the rowing stroke used in a dinghy. We will do it all sitting on benche
