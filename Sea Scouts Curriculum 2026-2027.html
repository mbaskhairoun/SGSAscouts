<style>

}

  :root:not([data-theme="light"]){
    --ground:#0E171F; --surface:#16222D; --surface-2:#1E2C39; --line:#2C3B48; --line-strong:#4A5D6C;
    --ink:#E8ECE6; --text:#D6DDD8; --muted:#97A5AF;
    --sea:#6FB0D3; --sea-soft:#1C3646; --sea-ink:#BFE0F0;
    --gold:#D7AE55; --gold-soft:#3A2F14; --gold-ink:#F0DDA8;
    --red:#E0736A; --red-soft:#3F1F1C; --red-ink:#F5C2BC;
    --green:#7FBF93; --green-soft:#1D3325;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0E171F; --surface:#16222D; --surface-2:#1E2C39; --line:#2C3B48; --line-strong:#4A5D6C;
  --ink:#E8ECE6; --text:#D6DDD8; --muted:#97A5AF;
  --sea:#6FB0D3; --sea-soft:#1C3646; --sea-ink:#BFE0F0;
  --gold:#D7AE55; --gold-soft:#3A2F14; --gold-ink:#F0DDA8;
  --red:#E0736A; --red-soft:#3F1F1C; --red-ink:#F5C2BC;
  --green:#7FBF93; --green-soft:#1D3325;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--sea)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800;font-variation-settings:"wdth" 82}
h2{font-size:1.45rem;font-weight:700;font-variation-settings:"wdth" 85}
h3{font-size:1.1rem;font-weight:700;font-variation-settings:"wdth" 90}
h4{font-size:.95rem;font-weight:700}
p{margin:0 0 .8em}
ul,ol{margin:0 0 .8em;padding-left:1.3em}
li{margin:.25em 0}
code,.mono{font-family:var(--font-mono);font-size:.86em}
.eyebrow{font-family:var(--font-display);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:.5em .65em;border-bottom:1px solid var(--line)}
th{font-family:var(--font-display);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-strong)}
.tbl-wrap{overflow-x:auto;margin:.4em 0 1em}
.pill{display:inline-block;font-family:var(--font-display);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2em .6em;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.pill.sea{background:var(--sea-soft);color:var(--sea-ink);border-color:transparent}
.pill.land{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.church{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}

/* Shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:1.2rem 1rem 2rem}
.brand{display:flex;gap:.7rem;align-items:center;margin-bottom:1rem}
.brand svg{flex:none}
.brand .t{font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 80;color:var(--ink);font-size:1.05rem;line-height:1.1}
.brand .s{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:.15rem}
.side-tools{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.btn{font-family:var(--font-display);font-size:.78rem;font-weight:700;letter-spacing:.03em;padding:.45em .8em;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.nav-term{margin-top:1rem}
.nav-term .eyebrow{display:flex;justify-content:space-between;padding:0 .4rem .3rem}
.nav a{display:grid;grid-template-columns:2.2rem 1fr;gap:.5rem;align-items:baseline;padding:.32rem .45rem;border-radius:6px;text-decoration:none;color:var(--text);font-family:var(--font-display);font-size:.86rem;line-height:1.25}
.nav a .d{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--sea-soft);color:var(--sea-ink)}
.nav a.active .d{color:var(--sea-ink)}
.nav a .mark{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--sea);margin-left:.4em;vertical-align:middle}
.nav a .mark.land{background:var(--green)}
.nav .break{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);padding:.2rem .5rem;border-left:2px dashed var(--line-strong);margin:.2rem .5rem}
.main{padding:2rem clamp(1rem,4vw,3.5rem) 4rem;max-width:1100px}
.menu-btn{display:none}

/* Lesson header */
.lesson-head{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:start;padding-bottom:1.2rem;border-bottom:2px solid var(--ink);margin-bottom:1.5rem}
.weekno{font-family:var(--font-display);font-weight:800;font-variation-settings:"wdth" 75;font-size:3.6rem;line-height:.9;color:var(--sea);letter-spacing:-.02em}
.weekno small{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.2rem;font-variation-settings:"wdth" 100}
.lesson-head .meta{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin:.4rem 0 .6rem;font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.lesson-head .theme{font-style:italic;font-size:1.1rem;color:var(--muted);margin:0}
.calendar-notes{margin-top:.7rem;display:flex;flex-direction:column;gap:.35rem}
.calendar-notes div{display:flex;gap:.5rem;align-items:flex-start;font-size:.92rem;color:var(--gold-ink);background:var(--gold-soft);padding:.4rem .7rem;border-radius:6px}
.calendar-notes svg{flex:none;margin-top:.2rem}

/* Sections */
.sec{margin:0 0 2rem}
.sec-title{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.sec-title .n{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.band{border-left:4px solid var(--line-strong);padding-left:1rem}
.band.practical{border-color:var(--sea)}
.band.spiritual{border-color:var(--gold)}
.band.activity{border-color:var(--red)}
.band .tag{font-family:var(--font-display);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:.5rem;align-items:center;margin-bottom:.35rem}
.band.practical .tag{color:var(--sea)}
.band.spiritual .tag{color:var(--gold)}
.band.activity .tag{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem}
.card.soft{background:var(--surface-2);border-color:transparent}
.intro{font-size:1.05rem}
.steps{list-style:none;padding:0;margin:0;counter-reset:step}
.steps li{display:grid;grid-template-columns:3.2rem 1fr;gap:.8rem;padding:.8rem 0;border-top:1px solid var(--line);margin:0}
.steps li:first-child{border-top:none}
.steps .min{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);padding-top:.25rem;font-variant-numeric:tabular-nums}
.steps .min b{display:block;font-size:1.05rem;color:var(--ink)}
.steps h4{margin-bottom:.3rem;font-size:1rem}
.steps p{margin:0}
.verse{background:var(--gold-soft);border-radius:8px;padding:1rem 1.2rem;margin:.6rem 0 1rem;position:relative}
.verse blockquote{margin:0;font-style:italic;font-size:1.12rem;color:var(--gold-ink);line-height:1.5}
.verse cite{display:block;font-style:normal;font-family:var(--font-display);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-top:.5rem;color:var(--gold-ink)}
.verse a{color:inherit}
.message{max-width:68ch;font-size:1.02rem}
.prayer{border-top:1px dashed var(--line-strong);padding-top:.6rem;margin-top:.8rem;font-style:italic;max-width:68ch}
.rules{padding-left:1.4em}
.rules li::marker{font-family:var(--font-mono);color:var(--red);font-weight:600}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:.6rem;align-items:flex-start;margin:.35em 0}
.checklist input{margin-top:.35em;accent-color:var(--sea)}
.checklist li.done label{text-decoration:line-through;color:var(--muted)}
.takehome{display:flex;gap:.9rem;align-items:flex-start;background:var(--sea-soft);color:var(--sea-ink);padding:1rem 1.2rem;border-radius:8px}
.takehome .eyebrow{color:var(--sea-ink)}
.refs{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.6rem}
.refs li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;margin:0;font-size:.92rem}
.refs a{font-family:var(--font-display);font-weight:700;text-decoration:none;display:block;margin-bottom:.15rem}
.refs a:hover{text-decoration:underline}
.refs .why{color:var(--muted)}
.refs .host{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);word-break:break-all}
.pager{display:flex;justify-content:space-between;gap:1rem;border-top:2px solid var(--ink);padding-top:1rem;margin-top:2rem}
.pager a{text-decoration:none;font-family:var(--font-display);font-weight:700;color:var(--ink);max-width:45%}
.pager a small{display:block;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);font-weight:400}
.pager a:hover{color:var(--sea)}
.visual{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;margin:.6rem 0 1rem;overflow-x:auto}
.visual figcaption{font-family:var(--font-display);font-size:.8rem;color:var(--muted);margin-top:.5rem}
.visual svg{max-width:100%;height:auto;display:block;margin:0 auto}
.vis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.vis-grid .cell{text-align:center;font-family:var(--font-display);font-size:.8rem}
.vis-grid .cell svg{width:100%;height:auto}
.flag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:.6rem}
.flag-grid .cell{background:var(--surface-2);border-radius:6px;padding:.4rem;font-family:var(--font-display);font-size:.72rem;line-height:1.2;text-align:center}
.flag-grid .cell b{display:block;font-size:.9rem;margin:.25rem 0 .1rem}
.flag-grid .cell svg{width:100%;height:auto;border:1px solid var(--line);display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.tile{background:var(--surface-2);border-radius:8px;padding:1rem;text-align:center}
.tile .big{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--sea);font-variation-settings:"wdth" 80}
.tile .lbl{font-family:var(--font-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin:.3rem 0}
.tile p{font-size:.88rem;margin:0}

/* Overview */
.hero{padding:0 0 1.5rem;border-bottom:2px solid var(--ink);margin-bottom:1.5rem}
.hero .sub{font-size:1.12rem;color:var(--muted);max-width:60ch;margin-top:.6rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-top:1.2rem}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem}
.fact .v{font-family:var(--font-display);font-weight:800;font-size:1.4rem;color:var(--ink);font-variation-settings:"wdth" 82;line-height:1.1}
.fact .k{font-family:var(--font-display);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
.timeline{display:grid;grid-template-columns:5.5rem 3.2rem 1fr;gap:.4rem .8rem;font-size:.95rem;align-items:baseline}
.timeline .t{font-family:var(--font-mono);font-size:.85rem;color:var(--ink)}
.timeline .m{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.timeline .seg{padding-left:.6rem;border-left:4px solid var(--line-strong)}
.timeline .seg.p{border-color:var(--sea)}
.timeline .seg.s{border-color:var(--gold)}
.timeline .seg.a{border-color:var(--red)}
.year{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.year li{margin:0}
.year a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.7rem .85rem;text-decoration:none;color:var(--text);height:100%;border-top:3px solid var(--sea)}
.year a.land{border-top-color:var(--green)}
.year a:hover{box-shadow:var(--shadow)}
.year .wk{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between}
.year .tt{font-family:var(--font-display);font-weight:700;color:var(--ink);margin:.25rem 0 .15rem;line-height:1.2}
.year .th{font-size:.85rem;color:var(--muted);font-style:italic}
.year .cn{font-size:.75rem;color:var(--gold-ink);margin-top:.35rem;font-family:var(--font-display)}
.term-h{display:flex;align-items:baseline;gap:.8rem;margin:1.6rem 0 .7rem}
.term-h .mono{color:var(--muted)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:.5rem 0}
details summary{cursor:pointer;padding:.7rem 1rem;font-family:var(--font-display);font-weight:700;color:var(--ink)}
details .in{padding:0 1rem 1rem}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem}
.kit .card h4{margin-bottom:.4rem;color:var(--sea)}
.kit ul{font-size:.92rem;margin:0}
.all-mode .lesson{page-break-before:always;break-before:page;margin-bottom:4rem}
.all-mode .lesson:first-of-type{page-break-before:auto;break-before:auto}
.notice{background:var(--red-soft);color:var(--red-ink);padding:.7rem 1rem;border-radius:8px;font-size:.92rem}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:min(85vw,320px);transform:translateX(-100%);transition:transform .2s;z-index:20;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;position:sticky;top:.6rem;z-index:10;margin-bottom:1rem}
  .two,.tiles{grid-template-columns:1fr}
  .lesson-head{grid-template-columns:1fr}
  .weekno{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side{transition:none}}
@media print{
  .side,.menu-btn,.side-tools,.pager,.btn{display:none!important}
  .shell{display:block}
  .main{max-width:none;padding:0}
  body{background:#fff;color:#111;font-size:11.5pt}
  .lesson{page-break-before:always;break-before:page}
  .lesson:first-child{page-break-before:auto}
  .card,.visual,.refs li,.year a{box-shadow:none}
  a{color:inherit}
  .refs .host{display:block}
  .band{page-break-inside:avoid}
}
</style>

<script>
const LESSONS = [{"n": 1, "date": "2026-09-15", "term": "Fall", "title": "Welcome Aboard", "theme": "Who we are, how we speak, and how we sail together as one ship's company", "sea": true, "calendar": ["Nayrouz (Coptic New Year, Feast of the Martyrs) was Friday Sept 11. Greet scouts with a happy new Coptic year (1743 AM).", "Feast of the Cross is Sunday Sept 27. Next week's fire lesson will connect to it.", "First meeting of the year: parents may stay for the first 10 minutes. Have registration and medical forms ready."], "objectives": ["By the end scouts can say the Scout Promise from memory and name the four pairs of the Scout Law.", "By the end scouts can point to bow, stern, port, starboard, fore, aft, deck, galley and head on a boat diagram and in the hall.", "By the end scouts know their patrol name, patrol leader, and where their patrol falls in.", "By the end scouts can explain three troop expectations (uniform, respect, safety) in their own words."], "materials": [{"item": "Name tags and markers", "qty": "30", "note": "dollar store"}, {"item": "Printed Scout Promise and Scout Law cards", "qty": "1 per scout (25)", "note": "print from scouts.ca wording, laminate if possible so they last all year"}, {"item": "Large boat diagram (poster or projected) showing bow, stern, port, starboard, deck, galley, head", "qty": "1", "note": "draw on chart paper if no projector; a simple top-down outline works"}, {"item": "Red and green painter's tape or coloured paper", "qty": "1 roll each", "note": "mark port (red) and starboard (green) walls of the hall"}, {"item": "Patrol name cards with a nautical name and a blank crew list", "qty": "5", "note": "e.g., Anchors, Compass, Lighthouse, Dolphins, Mariners"}, {"item": "Attendance sheet, medical and consent forms", "qty": "1 set", "note": "leader binder"}, {"item": "Canadian flag and troop flag on stand", "qty": "1 each", "note": "for opening and closing"}], "prep": ["Arrive by 5:45 pm. Mark one long wall of the hall with red tape (PORT) and the opposite wall with green tape (STARBOARD). Mark the front of the hall BOW and the back STERN with paper signs.", "Decide patrol groupings in advance (mix grades and friend groups, 4-6 scouts per patrol) but let each patrol choose from a short list of nautical names.", "Print and cut the Promise and Law cards. Print the boat diagram or load it on a screen.", "Assign one leader to handle forms and parents at the door so the other leaders can start on time.", "Read the Captain's Coming rules below and choose 8 commands you will actually use. Practise calling them quickly."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by grade for tonight only, Canadian flag, Lord's Prayer, welcome, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: Scout Promise and Law, ship terms, form patrols, expectations"}, {"time": "7:05", "min": 10, "what": "Spiritual: Jesus calls the fishermen (Matthew 4:18-22)"}, {"time": "7:15", "min": 25, "what": "Activity: Captain's Coming (ship-shore command game)"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal by patrol"}], "practical": {"title": "Joining the Ship's Company", "intro": "Say: Welcome aboard. This year you are not just scouts, you are Sea Scouts. Sea Scouts have been part of Scouting since 1909, and everything we do this year, from knots to first aid to navigation, comes from life at sea. Tonight you learn the language of a ship, the promise every scout makes, and who your crew is.", "steps": [{"title": "Who we are and what a Sea Scout does", "min": 6, "detail": "Introduce every leader by name and role (Skipper for the head leader, Mates for the others, if you like the tradition). Explain the year in one breath: knots, fire, compass, first aid, weather, boats, signals, cooking, water safety, service, and a Sea Scout Olympics in May. Explain that we have no water at the hall, so we learn every sea skill with rope, models, games and video, and we get on the water at summer camp or a spring regatta. Ask: Who has been in a canoe, kayak, or sailboat? Who has never been on a boat? Both are fine. Then explain what makes this troop different: we are a church troop, so every meeting has a short spiritual lesson and we pray together. Ask scouts to say their name and one thing they hope to learn."}, {"title": "The Scout Promise and Scout Law", "min": 8, "detail": "Hand out the cards. Read the Promise aloud together twice, standing with the Scout sign (right hand raised, three middle fingers up, thumb over little finger): 'On my honour, I promise that I will do my best to do my duty to God and the King, to help other people at all times, and to carry out the spirit of the Scout Law.' Explain each phrase in one sentence: 'on my honour' means my word can be trusted; 'do my best' means effort, not perfection; 'duty to God' is why we pray here; 'the King' means our country and community; 'help other people' is the heart of Scouting. Then read the Scout Law: 'A Scout is helpful and trustworthy, kind and cheerful, considerate and clean, wise in the use of all resources.' Ask each pair of words to be explained by a different scout with an example from school or home. Tell scouts the Promise will be said at every opening, so they should know it by heart by next week."}, {"title": "Talk like a sailor: ship terms", "min": 10, "detail": "Show the boat diagram. Teach the terms with actions, and have scouts repeat and point. Bow: the front, pointed end (point to the front of the hall). Stern: the back. Port: the left side when you face the bow (red tape wall). Starboard: the right side when you face the bow (green tape wall). Memory trick: 'port' and 'left' both have four letters; port wine is red. Fore means toward the bow, aft means toward the stern, so 'go forward' or 'go aft' replaces 'go to the front or back.' Deck: the floor you stand on. Galley: the kitchen. Head: the toilet (named because on old sailing ships it was at the front, the 'head' of the ship, so waves washed it clean). Also teach: ship's company (everyone aboard, our whole troop), helm (the steering), and 'aye aye' (I understand and will do it). Explain why sailors use these words: on a boat 'left' depends which way you face, but port is always port, so orders are never confused. Quick drill: call a term, scouts point or move. Repeat faster."}, {"title": "Form patrols with nautical names", "min": 8, "detail": "Announce the pre-planned patrol groupings (4-6 scouts each) and send each group to a corner with a leader. Give each patrol two minutes to choose a nautical name from the list or invent one (rules: sea related, respectful, one or two words). Ideas: Anchors, Compass Rose, Lighthouse, Dolphins, Mariners, Kraken, Cutters, Corsairs, Clippers, Schooners. Explain the patrol system: the patrol is your crew for games, competitions, service projects and camp. Each patrol will have a Patrol Leader (PL) and an Assistant Patrol Leader (APL). For the first month the leaders will appoint temporary PLs, and the patrol will elect permanent PLs in October once everyone knows each other. Each patrol fills in its crew list card and chooses a patrol call (a short cheer or sound, kept clean and under three seconds). Have each patrol perform its call for the troop. Explain that from now on we fall in by patrol, PL at the right of the line."}, {"title": "Ship's company expectations", "min": 8, "detail": "Gather in a horseshoe. Explain expectations plainly and ask scouts to agree by raising the Scout sign. One: arrive on time in uniform (necker at minimum until full uniforms arrive). Two: when a leader raises the Scout sign, everyone goes silent and raises theirs, no exceptions. Three: respect for every person, the church building, and equipment; rope, compasses and first aid kits are shared tools, treated with care. Four: safety first, always. If a leader says stop, you stop. No running in the hall unless it is part of a game. Five: phones stay in bags during the meeting. Six: we pray together and speak respectfully about faith. Explain the consequence ladder: reminder, sit out one activity, conversation with parents. Then explain the fun side: patrol points are awarded every week for attendance, uniform, teamwork and games, and the top patrol at year end wins the Skipper's Trophy. Close by asking each patrol to shout their call."}], "tips": ["Keep the ship terms physical. Scouts remember port and starboard because they ran to the red or green wall, not because you said it.", "Do not spend long on the history of Scouting tonight. Save it for a rainy-day filler.", "Common mistake: mixing patrols so that one patrol has all the older scouts. Balance grades 7, 8 and 9 across every patrol.", "If a scout is shy about speaking, let them answer with a partner. Nobody is forced to speak alone on night one."], "safety": ["Collect medical forms and note allergies before any food is ever served this year.", "Walk the hall before the meeting: clear chairs and tables from the play area, check for wet floors, and locate the fire exits and first aid kit. Show scouts the exits.", "The command game involves quick movement. Insist on walking fast, not sprinting, and no sliding on the floor."]}, "spiritual": {"title": "Follow Me: Jesus Calls the Fishermen", "ref": "Matthew 4:18-22", "verse": "Then He said to them, \"Follow Me, and I will make you fishers of men.\" They immediately left their nets and followed Him.", "url": "https://www.biblegateway.com/passage/?search=Matthew+4%3A18-22&version=NKJV", "message": "Tonight we became a ship's company. Look at who Jesus chose for His first crew. Not scholars, not soldiers. Peter, Andrew, James and John were fishermen on the Sea of Galilee. They knew ropes and nets, they read the weather, they knew that on a boat everyone has a job and everyone's life depends on the person next to them. Jesus did not tell them to forget what they knew. He said, 'I will make you fishers of men.' He took their sea skills and gave them a new purpose. That is what Sea Scouts is in a church: the knots, the compass, the first aid, all of it is training to be useful, and useful people can serve God and others. Notice the word 'immediately.' They did not wait until they felt ready. Our own St. Mark brought the Gospel to Egypt by boat, landing in Alexandria, and the Coptic Church still calls itself the Church of St. Mark. Every one of us is being called tonight, just like those fishermen: come aboard, learn, and be ready to be sent. This week, when you say the Promise, hear Jesus saying 'Follow Me' at the same time.", "discussion": ["Why do you think Jesus chose fishermen instead of religious teachers for His first disciples?", "What skill do you already have that God could use to help other people?", "The fishermen left 'immediately.' What makes it hard for us to answer right away when we know the right thing to do?"], "prayer": "Lord Jesus, You called the fishermen from their boats and made them Your disciples. Call each of us tonight and make us a faithful crew that learns well, serves gladly, and follows You without delay. Bless our leaders, our families and this new year, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Captain's Coming (Ship and Shore)", "setup": "Clear the whole hall. The front wall is the BOW, the back wall is the STERN, the red-taped wall is PORT and the green-taped wall is STARBOARD. Scouts spread out in the middle 'on deck.' One leader is the Captain and calls commands; a second leader is the Judge who spots the last scout to obey. Scouts play as individuals, but every scout still in the game at the end earns points for their patrol.", "materials": ["Red and green tape already on the walls", "A whistle for the Captain", "A patrol points sheet and pen for the Judge"], "rules": ["Teach these commands one at a time, letting scouts practise each once before adding the next. Bow: walk quickly to the front wall. Stern: back wall. Port: red wall. Starboard: green wall.", "Captain's Coming: freeze at attention and salute (Scout salute, right hand, three fingers to the brow). Nobody may move until the Captain says 'At ease.' Anyone who moves is out.", "Man Overboard: find a partner instantly; one kneels on one knee and the other stands behind with a hand on their shoulder, both shading their eyes and scanning the sea. Any scout without a partner is out.", "Scrub the Deck: get down on hands and knees and pretend to scrub the floor. Hit the Deck: lie flat on your stomach. Climb the Rigging: pretend to climb a rope ladder on the spot.", "Three in a Boat: form groups of exactly three, sit in a line on the floor and row together. Scouts not in a group of three are out. Galley: mime stirring a big pot. Head: mime holding your nose.", "Once all commands are learned, play for real. The Captain calls commands fast and mixes them up. The last scout to obey each command, or anyone who does the wrong action, is out and sits along the STERN wall as 'shore crew.'", "Play until 3 to 5 scouts remain; they are the winners. Each surviving scout earns 2 patrol points. Play two or three rounds, letting a scout be the Captain in the last round.", "Judge's rule: if it is close, nobody is out. Keep it fast and fun, not strict."], "variations": ["Easier or younger: no eliminations, just call commands and award a point to the fastest patrol each time.", "Harder: add Fore and Aft (move one step toward bow or stern only), and 'Starboard bow' or 'Port stern' corners.", "Short on time: play a single round with only bow, stern, port, starboard and Captain's Coming."]}, "tables": [{"caption": "Ship terms every Sea Scout must know", "headers": ["Term", "Meaning", "Memory hook"], "rows": [["Bow", "Front of the boat", "You bow forward"], ["Stern", "Back of the boat", "Stern look behind you"], ["Port", "Left side facing the bow (red light)", "Port and left both have four letters; port wine is red"], ["Starboard", "Right side facing the bow (green light)", "Steering board was on the right on Viking ships"], ["Fore / Forward", "Toward the bow", "Before"], ["Aft", "Toward the stern", "After"], ["Deck", "The floor you stand on", "All hands on deck"], ["Galley", "The kitchen", "Galley grub"], ["Head", "The toilet", "It was at the head (front) of old ships"], ["Helm", "Steering position", "Take the helm"], ["Ship's company", "Everyone aboard, the whole troop", "One crew"]]}], "references": [{"label": "Scouts Canada: Scout Promise, Law and program", "url": "https://www.scouts.ca/", "why": "Official wording of the Promise and Law and general troop policies"}, {"label": "Scouts Canada: The Canadian Path", "url": "https://www.scouts.ca/programs/canadian-path/", "why": "The plan-do-review model and the four elements this year's program follows"}, {"label": "Matthew 4:18-22 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+4%3A18-22&version=NKJV", "why": "Read the full passage before the spiritual lesson"}, {"label": "YouTube search: parts of a boat bow stern port starboard for beginners", "url": "https://www.youtube.com/results?search_query=parts+of+a+boat+bow+stern+port+starboard+for+beginners", "why": "A 3 minute clip to show on a screen if you have one"}, {"label": "Wikipedia: Coptic calendar", "url": "https://en.wikipedia.org/wiki/Coptic_calendar", "why": "Background on Nayrouz and the Year of the Martyrs for the opening announcement"}], "visual": "boat-parts", "takeHome": "Learn the Scout Promise by heart and teach a family member the difference between port and starboard using something in your home (a car, the couch, a bathtub)."}, {"n": 2, "date": "2026-09-22", "term": "Fall", "title": "Knots 1: Foundation Knots", "theme": "Rope words, four knots every sailor knows, and why the right knot matters", "sea": true, "calendar": ["Feast of the Cross is this Sunday, Sept 27. Remind scouts to attend Liturgy; there is a procession with the cross in many churches.", "Second week: say the Scout Promise from memory at opening and award a patrol point to each patrol where everyone knows it."], "objectives": ["By the end scouts can point to the working end, standing part, bight and loop of a rope.", "By the end scouts can tie an overhand knot, a figure-8 stopper, a reef knot and a bowline without help.", "By the end scouts can say one job aboard a boat for each of the four knots.", "By the end scouts can spot a granny knot and explain why it is unsafe."], "materials": [{"item": "2 m length of 6 mm to 8 mm braided rope, ends melted or taped", "qty": "1 per scout (25) plus 5 spares", "note": "hardware store; soft polyester or nylon ties best. Reusable all year. About $40 for a 60 m spool"}, {"item": "Thick 12 mm rope, 3 m, for leader demonstrations", "qty": "1", "note": "big rope is easier to see from the back of the room"}, {"item": "Two colours of rope (or one end taped with coloured tape) for teaching the reef knot", "qty": "1 pair per patrol", "note": "colour makes 'right over left' obvious"}, {"item": "Printed knot cards (Animated Knots screenshots or hand drawings)", "qty": "1 set per patrol", "note": "optional; laminate"}, {"item": "Chairs or a coat rack to use as a 'rail' for the bowline around an object", "qty": "1 per patrol", "note": "hall chairs work"}, {"item": "Stopwatch or phone timer", "qty": "1", "note": "for the relay"}], "prep": ["Cut and seal all ropes before the meeting (melt the ends with a lighter outdoors, or wrap tightly with tape). Frayed rope ruins a knot lesson.", "Practise each of the four knots yourself at least ten times until you can tie them slowly while talking. Use the Animated Knots links below.", "Set up the room: patrols sit in circles on the floor or at tables, with one leader or older scout per patrol as the 'knot coach.'", "Write the four knot names and their jobs on chart paper or a whiteboard, hidden until step 6.", "Mark the relay lanes with tape: a start line and, 8 m away, a chair for each patrol."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise from memory, Lord's Prayer, attendance, Feast of the Cross reminder"}, {"time": "6:25", "min": 40, "what": "Practical: rope terms, overhand, figure-8, reef knot, bowline, knot jobs aboard"}, {"time": "7:05", "min": 10, "what": "Spiritual: the threefold cord (Ecclesiastes 4:12)"}, {"time": "7:15", "min": 25, "what": "Activity: patrol knot relay"}, {"time": "7:40", "min": 5, "what": "Closing: recap the four knots, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Four Knots Every Sailor Knows", "intro": "Say: On a boat, rope is everything. It holds the sails up, ties the boat to the dock, and can pull a person out of the water. A knot that slips can lose a boat or a life, and a knot that jams can leave you stuck when you need to let go fast. Tonight you learn four knots that sailors have used for hundreds of years, and you will use them every week this year.", "steps": [{"title": "Rope words", "min": 5, "detail": "Hand each scout a rope. Hold up the demo rope and teach the parts. Working end: the end you are using to tie the knot (wiggle it). Standing part: the long, still part of the rope that does not move, usually attached to something. Bight: a U-shaped bend in the rope where the rope does not cross itself (fold the rope and hold up the U). Loop: a circle where the rope crosses over itself. Tail: the short leftover end after the knot is tied. Say each word and have scouts hold up that part of their own rope. Do this three times, faster each time. Explain that all knot instructions use these words, so they must know them. Also teach 'dress the knot,' which means tidy it so the strands lie neatly, and 'set the knot,' which means pull it tight from all ends."}, {"title": "Overhand knot", "min": 5, "detail": "This is the simplest knot and the building block for many others. Demonstrate slowly with the big rope, facing the same way as the scouts so they are not mirrored. Step 1: hold the standing part in your left hand and the working end in your right. Step 2: make a loop by crossing the working end over the standing part. Step 3: pass the working end up through the loop from behind. Step 4: pull both ends to set it. Have every scout tie it three times, then untie it. Jobs aboard: a simple stopper to keep a rope end from fraying or sliding through a hole, and the first half of a reef knot. Warning: an overhand knot pulled hard in thin rope is very hard to untie and weakens the rope, so sailors prefer the figure-8 as a stopper."}, {"title": "Figure-8 stopper", "min": 6, "detail": "The figure-8 is the sailor's stopper knot. It is bigger than an overhand, so it will not pull through a block or pulley, and it unties easily even after a hard pull. Demonstrate: Step 1: make a loop by crossing the working end over the standing part (the same as starting an overhand). Step 2: instead of going through, bring the working end all the way around behind the standing part. Step 3: now pass the working end down through the first loop from the top. Step 4: pull the ends apart and look: the knot should look like the number 8. If it looks like a simple overhand, you skipped the trip around the back. Have scouts tie it five times. Use it on the ends of every sheet (sail control rope) on a sailboat so the rope cannot escape through the fitting, and on the end of a throw bag line."}, {"title": "Reef (square) knot", "min": 9, "detail": "The reef knot joins two ends of the same rope around something, like tying a bundle or a bandage. Give each pair of scouts two different coloured ropes, or tape one end. Chant the rule: 'right over left and under, left over right and under.' Step 1: hold one end in each hand. Step 2: cross the right end over the left and tuck it under, exactly like the first move of tying your shoes. Step 3: now the ends have swapped hands. Cross the (new) left end over the right and tuck it under. Step 4: pull all four parts to set it. Check: a correct reef knot is flat and symmetrical, and each working end lies beside its own standing part on the same side. If one end exits on top and the other exits below, you have tied a granny knot, which slips and jams. Show both side by side. Jobs aboard: tying reef points when shortening a sail (that is where the name comes from), tying a bandage, bundling gear. Never use it to join two ropes that will carry a load, because it can capsize and slip."}, {"title": "Bowline", "min": 10, "detail": "The bowline (say 'BOH-lin') makes a fixed loop that will not slip or tighten, and it unties easily after loading. It is the king of sailing knots: it is the loop you would throw to someone in the water. Teach the rabbit story. Step 1: hold the standing part in your left hand. About 40 cm from the end, make a small loop with the working end lying on top of the standing part. This loop is the rabbit hole and the standing part above it is the tree. Step 2: the rabbit (working end) comes up out of the hole, from underneath. Step 3: the rabbit goes around behind the tree (behind the standing part). Step 4: the rabbit goes back down the hole (down through the small loop). Step 5: hold the working end and the side of the big loop together in one hand, the standing part in the other, and pull to set. Check the loop: it should not tighten when you pull the standing part. Repeat until every scout can tie it around a chair leg. Leave a tail at least 10 rope diameters long."}, {"title": "Which knot for which job", "min": 5, "detail": "Reveal the chart. Ask patrols to match each knot to its job before you show the answers. Overhand: quick temporary stopper, first half of a reef knot. Figure-8: stopper on the end of sheets and lines so they cannot run out through a block. Reef knot: tying reef points on a sail, bundling, bandages, never for joining ropes under load. Bowline: a loop that never slips, for tying a sheet to a sail, tying a line to a ring, making a rescue loop, or tying a boat to a post. Then run a lightning quiz: call a job, patrols race to tie the right knot and hold it up. First correct patrol gets a point. Close by having every scout tie all four knots in a row while a coach checks. Any scout who cannot yet tie the bowline is paired with one who can for the relay."}], "tips": ["Stand beside or in front of scouts facing the same direction. Demonstrating face to face mirrors the knot and confuses them.", "Say the steps the same way every time. Scouts learn the words first, then the hands follow.", "The most common bowline error is starting with the working end under the standing part instead of on top. The knot then collapses. Check the first loop before they continue.", "The most common reef knot error is the granny knot (right over left twice). Use two colours so scouts can see the pattern.", "Let scouts who finish early become coaches. Teaching a knot is the best way to learn it."], "safety": ["No rope around anyone's neck, ever. Say this clearly at the start and enforce it.", "No whipping ropes or lassoing. Rope ends sting eyes.", "Keep the floor clear of loose rope during the relay so nobody trips.", "Rope burn: if a scout pulls rope fast through a hand, run cool water over the skin."]}, "spiritual": {"title": "A Threefold Cord", "ref": "Ecclesiastes 4:12", "verse": "Though one may be overpowered by another, two can withstand him. And a threefold cord is not quickly broken.", "url": "https://www.biblegateway.com/passage/?search=Ecclesiastes+4%3A9-12&version=NKJV", "message": "Look at the rope in your hands. It is not one strand. Peel it back and you find many thin fibres twisted together. One fibre snaps between your fingers, but twisted together they can hold a boat against the wind. King Solomon knew rope, and he wrote that a threefold cord is not quickly broken. What are the three strands in the life of a Christian? Our church fathers say: you, your brothers and sisters in Christ, and God Himself. When those three are twisted together, storms do not break you. This is why we have patrols. This is why we pray together at every meeting. St. Antony went alone into the desert, but even he gathered disciples around him and taught that a brother who helps his brother is like a strong city. Notice also that a good knot only holds when it is tied correctly. A granny knot looks almost right and still slips. Friendship without honesty, or prayer without real attention, is like that. This week, be a strand that other people can count on, and stay twisted tight with God through your prayers each morning and night.", "discussion": ["Who are the other two strands in your cord right now? Name a friend or family member and a way God is part of it.", "A granny knot looks right but slips. What is something that looks like friendship but does not hold under pressure?", "How could our patrol be a threefold cord this year for a scout who is having a hard week?"], "prayer": "Lord, You bind us together as one body in Your Church. Twist our hearts together with You and with each other so that we are not quickly broken. Teach our hands to be skilful and our friendships to be faithful, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Knot Relay", "setup": "Patrols line up single file behind a start line. 8 m in front of each patrol is a chair (the 'rail'). Each scout holds their own rope. A leader stands at each chair as the judge. Write the running order of knots on the whiteboard: 1 overhand, 2 figure-8, 3 reef knot, 4 bowline.", "materials": ["One rope per scout", "One chair per patrol", "Whiteboard with the knot order", "Timer, patrol points sheet"], "rules": ["On 'Go,' the first scout in each patrol runs to the chair and ties knot 1 (overhand) on the chair back. The judge checks it. If correct, the scout unties it, runs back and tags the next scout. If wrong, the judge says 'again' and the scout re-ties before returning.", "The second scout ties knot 2 (figure-8), the third ties knot 3 (reef knot, joining the two ends of their own rope around the chair back), the fourth ties knot 4 (bowline around a chair leg). The fifth scout starts again at knot 1.", "Every scout must complete at least one turn; patrols with fewer scouts keep cycling until every patrol has tied 10 knots in total.", "First patrol to complete 10 correct knots wins: 5 points. Second: 3 points. All others who finish: 1 point.", "Round 2 is 'Judge's choice': the judge calls a random knot as each scout arrives. Same scoring.", "Round 3 is 'Blind bowline': each scout ties a bowline with eyes closed. Judge counts the correct ones. Most correct wins 3 points.", "Scouts waiting in line must be silent when a teammate is tying; a patrol that shouts instructions is paused for 5 seconds."], "variations": ["Easier: leave the bowline out of round 1 and let the coach stand at the chair to prompt the rabbit story.", "Harder: add a chain of all four knots on one rope by a single scout, timed, best time per patrol.", "Short on time: run only round 1 and round 3."]}, "tables": [{"caption": "Foundation knots and their jobs aboard", "headers": ["Knot", "Type", "Used for", "Watch out"], "rows": [["Overhand", "Stopper", "Quick temporary stopper; first half of a reef knot", "Jams and weakens rope if pulled hard"], ["Figure-8", "Stopper", "End of sheets and lines so they cannot run through a block", "If it looks like an overhand, you skipped going behind the standing part"], ["Reef (square)", "Binding", "Reefing a sail, bundles, bandages, tying a package", "Never to join two ropes under load; granny knot slips"], ["Bowline", "Fixed loop", "Rescue loop, sheet to a sail, line to a ring or post", "Working end must start on top of the standing part; leave a long tail"]]}], "references": [{"label": "Animated Knots: Bowline", "url": "https://www.animatedknots.com/bowline-knot", "why": "Step by step photos to practise from before the meeting"}, {"label": "Animated Knots: Figure-8", "url": "https://www.animatedknots.com/figure-8-knot", "why": "Shows the trip around the back that beginners skip"}, {"label": "Animated Knots: Square (reef) knot", "url": "https://www.animatedknots.com/square-knot", "why": "Includes the granny knot comparison"}, {"label": "Animated Knots: Overhand knot", "url": "https://www.animatedknots.com/overhand-knot", "why": "The simplest starting point"}, {"label": "YouTube search: how to tie a bowline rabbit method", "url": "https://www.youtube.com/results?search_query=how+to+tie+a+bowline+rabbit+method", "why": "A short video to play on loop while patrols practise"}, {"label": "Ecclesiastes 4:9-12 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Ecclesiastes+4%3A9-12&version=NKJV", "why": "Full context for the threefold cord"}], "visual": "knot-uses", "takeHome": "Tie a bowline every day this week (on a doorknob, a backpack strap, a chair) until you can do it with your eyes closed, and show a parent the difference between a reef knot and a granny knot."}, {"n": 3, "date": "2026-09-29", "term": "Fall", "title": "Fire Safety and Fire Building", "theme": "The fire triangle, three fire-lays, and how to put a fire out before it puts you out", "sea": false, "calendar": ["Feast of the Cross was Sunday Sept 27. Ask who went to church and saw the procession with the cross and the 'Evlogimenos' hymn.", "Fire is a dry-land skill this week, but galley fires are the number one cause of fire aboard boats, so it is still a sea skill.", "Reminder: no live fire in the hall. All fire-lays are tabletop models. A single candle in a metal tray may be used for the extinguisher demo only if the church permits it."], "objectives": ["By the end scouts can name the three sides of the fire triangle and explain how removing any one puts a fire out.", "By the end scouts can build teepee, log cabin and lean-to fire-lays as tabletop models and say when each is used.", "By the end scouts can recite PASS for an extinguisher and Stop, Drop and Roll for clothing fires.", "By the end scouts can list three rules for stove and galley fire safety."], "materials": [{"item": "Wooden craft sticks (popsicle sticks)", "qty": "1 box of 300", "note": "dollar store; these are the 'logs'"}, {"item": "Wooden coffee stir sticks or toothpicks", "qty": "1 box", "note": "these are the 'kindling'"}, {"item": "Cotton balls or shredded paper", "qty": "1 bag", "note": "this is the 'tinder'"}, {"item": "Paper plates or foil trays as fire bases", "qty": "1 per patrol plus 6 for stations", "note": "reusable"}, {"item": "Modelling clay or sticky tack", "qty": "1 tub", "note": "helps sticks stand up in the teepee"}, {"item": "A real fire extinguisher (ABC dry chemical) to show, not discharge", "qty": "1", "note": "borrow the church hall one; put it back"}, {"item": "A picture or slide of the fire triangle and the three fire-lays", "qty": "1", "note": "draw on chart paper"}, {"item": "Judging score sheets", "qty": "5", "note": "one per patrol for the competition"}, {"item": "Small camp stove (unlit, no fuel canister attached) for the galley safety demo", "qty": "1", "note": "optional, borrow from a leader"}], "prep": ["Sort craft sticks, stir sticks and cotton balls into one bag per patrol (about 40 craft sticks, 30 stir sticks, 5 cotton balls each).", "Build one sample of each fire-lay yourself the night before so you know how long it takes (about 3 minutes each) and where the sticks fall over.", "Locate the hall's fire extinguisher, read the label, and check the pressure gauge needle is in the green. Ask church staff for permission to bring it to the front to show.", "Print or draw the fire triangle on chart paper with the words HEAT, FUEL, OXYGEN on the three sides.", "Confirm with church staff whether one tealight in a metal tray is permitted for a 30 second demonstration. If not, skip the candle and use the extinguisher mime only."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance, Feast of the Cross chat"}, {"time": "6:25", "min": 40, "what": "Practical: fire triangle, tinder-kindling-fuel, three fire-lays, PASS, galley safety, Stop Drop Roll"}, {"time": "7:05", "min": 10, "what": "Spiritual: the pillar of fire and the Cross as our guide (Exodus 13:21)"}, {"time": "7:15", "min": 25, "what": "Activity: judged fire-lay build competition"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Fire: Friend, Tool and Danger", "intro": "Say: Fire cooks our food at camp, keeps us warm, signals for help, and boils water so it is safe to drink. On a boat, a fire is the most dangerous emergency there is, because you cannot step outside. Tonight you learn how fire works, how to build one that lights on the first match, and exactly what to do when a fire goes wrong.", "steps": [{"title": "The fire triangle", "min": 6, "detail": "Show the triangle. A fire needs three things at the same time: heat (a match, a spark, a hot pan), fuel (wood, paper, gas, cloth, cooking oil) and oxygen (air). Take away any one side and the fire dies. Ask scouts to name how each side is removed. Remove heat: pour water on it, which cools the fuel below its burning temperature. Remove fuel: let the wood burn out, turn off the gas, pull unburned logs away. Remove oxygen: smother it with a pot lid, a fire blanket, sand, or a dry chemical extinguisher that coats the fuel. Ask: why does blowing on a small fire make it bigger, but blowing out a candle puts it out? (Blowing adds oxygen to a fire that has plenty of hot fuel, but on a tiny candle flame it blows the heat away faster than the wax can supply it.) Quick check: hold up one, two or three fingers and scouts shout the matching side."}, {"title": "Tinder, kindling, fuel and lighting a fire", "min": 6, "detail": "Fires are built in three sizes of fuel, and the biggest mistake beginners make is skipping a size. Tinder: anything that catches from a single match: dry grass, birch bark, cotton balls, dryer lint, thin paper, pencil shavings. It burns fast and hot for only seconds. Kindling: pencil-thin to thumb-thick dry sticks that snap cleanly. They catch from the tinder and burn long enough to light the fuel. Fuel: wrist-thick and larger wood that burns for a long time. Rule: gather three times as much as you think you need before you strike a match, because you cannot leave a fire to fetch more. Lighting: kneel with your back to the wind, strike the match away from your body, cup the flame, light the tinder at the bottom on the upwind side so the flame climbs through the kindling. Add fuel only when the kindling is burning well. Show the cotton ball (tinder), stir stick (kindling) and craft stick (fuel) so scouts know what the model pieces represent."}, {"title": "Three fire-lays as tabletop models", "min": 12, "detail": "Hand out patrol bags and trays. Build each lay together, step by step, while patrols copy. Teepee: put a cotton ball in the centre of the tray. Lean stir sticks around it in a cone, tips touching at the top, leaving a small door on one side for the match. Add a second layer of craft sticks around the outside, also leaning to the centre. Use a blob of clay to hold the first sticks. Best for: quick, hot fire, lighting in damp weather, boiling water fast; it collapses into coals. Log cabin: lay two craft sticks parallel about 6 cm apart, then two more across them to make a square. Keep stacking, each layer at right angles, four to five layers, and put a tiny teepee of stir sticks and cotton in the middle. Best for: long, steady cooking fire that needs little tending, holds a pot. Lean-to: push one craft stick into the clay at an angle like a ramp, put the cotton under it, then lean stir sticks against the ramp on the sheltered side. Best for: windy days; the ramp is a windbreak. Ask patrols to name the lay from a picture."}, {"title": "Fire extinguishers and PASS", "min": 6, "detail": "Bring out the hall extinguisher. Show the label: ABC means it works on A (ordinary things: wood, paper, cloth), B (flammable liquids: fuel, oil, grease) and C (electrical). Show the pressure gauge with the needle in the green. Teach PASS and have scouts mime it with a water bottle. P: Pull the pin. A: Aim the nozzle at the base of the fire, not the flames, because the fuel is at the bottom. S: Squeeze the handle. S: Sweep side to side across the base until the fire is out. Rules for using one: only fight a fire that is smaller than a wastebasket, always keep your back to an exit, and if it does not go out in a few seconds, leave and call 911. Never use water on a grease fire or an electrical fire; grease floats and spreads, and water conducts electricity. Cover a grease fire with a lid or use a fire blanket. If the church permits, light a tealight in a tray and have one scout demonstrate PASS by smothering it with a small pot lid instead of discharging the extinguisher."}, {"title": "Galley and stove fire safety", "min": 5, "detail": "On boats and at camp we cook on butane or propane stoves. Show the unlit stove. Rules: set up on a flat, stable surface with nothing flammable within one metre; never inside a tent; check the fuel connection is tight before lighting; light the match or lighter first, then turn on the gas, so gas does not build up; keep the flame low and never leave a lit stove; let it cool completely before changing the canister or packing it; store fuel canisters away from heat and never in the tent. Aboard a boat, add: turn off the gas at the bottle, not just the stove, when finished, because propane is heavier than air and pools in the bilge; keep a fire blanket within reach of the galley; never cook while the boat is heeling hard. Ask scouts to say the rules back in their own words. Explain that carbon monoxide is invisible and odourless, which is why stoves stay outside the tent."}, {"title": "If clothes catch fire: Stop, Drop and Roll", "min": 5, "detail": "Running fans the flames with oxygen. Teach and practise on the floor: Stop where you are. Drop to the ground and cover your face with your hands. Roll over and over until the flames are out, on your back, on your front, back again. If a friend is on fire, shout 'Stop, drop, roll,' and if you have a blanket or coat, wrap it around them to smother the flames, then get them to roll. After the fire is out: cool the burn with cool running water for at least 10 to 20 minutes, remove jewellery and loose clothing near the burn but never peel off cloth stuck to skin, cover with a clean cloth, and call 911 for any burn bigger than the person's palm, any burn on the face, hands or feet, or any burn that looks white or charred. Have every scout practise stop, drop and roll once on the floor, then a friend practises smothering with a jacket."}], "tips": ["Keep the fire-lay models small. Patrols that build huge ones run out of sticks and time.", "Say 'base of the fire' many times. Aiming at the flames is the most common extinguisher mistake.", "Do not skip the matches talk. Many grade 7 scouts have never struck a match, and they will at camp.", "If the room is noisy, have patrols build the lays in silence for one minute as a challenge."], "safety": ["No open flame in the hall except, with church permission, one tealight in a metal tray for under one minute with a leader holding a pot lid over it and a water bottle beside it.", "Do not discharge the extinguisher indoors. It is messy and must be recharged afterward.", "Stop, drop and roll is done on a clear floor away from chairs. One scout at a time per patrol.", "Explain that matches and lighters are leader-issued equipment at camp, never carried by scouts without permission."]}, "spiritual": {"title": "A Pillar of Fire and the Sign of the Cross", "ref": "Exodus 13:21", "verse": "And the LORD went before them by day in a pillar of cloud to lead the way, and by night in a pillar of fire to give them light, so as to go by day and night.", "url": "https://www.biblegateway.com/passage/?search=Exodus+13%3A21-22&version=NKJV", "message": "Tonight you learned that fire can be a tool that cooks and warms, or a danger that destroys. It depends on who is in control of it. When God led Israel out of Egypt, our own homeland, He went ahead of them as a pillar of fire at night. The fire did not burn them. It showed them the path through the desert and told them when to move and when to stop. Every fire-lay you built tonight needs a good structure and a good leader, or it either dies out or gets out of control. Our lives are the same. This past Sunday was the Feast of the Cross. Emperor Constantine saw a sign of the Cross in the sky, shining like fire, with the words 'In this sign, conquer.' For us the Cross is the pillar of fire: we make its sign before we pray, before we eat, before we sleep, and it guides us through every dark night. St. Verena, the Coptic saint who travelled to Switzerland, carried a lamp and a comb, healing the sick and lighting the way for others. Be like her this week. Let your life be a controlled, warm fire that guides people, not a wildfire that burns them.", "discussion": ["Where has God gone ahead of you like a pillar of fire, showing the way through something hard?", "We make the sign of the Cross many times a day. What do you think about when you make it? Is it a habit or a prayer?", "How can anger be like a fire that gets out of control? What is the 'extinguisher' for it?"], "prayer": "Lord, You led Your people through the wilderness by a pillar of fire, and You lead us today by the light of Your Cross. Keep us safe from every fire and every danger, and make us lights that guide others to You, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Fire-Lay Build Competition", "setup": "Each patrol gets a table or a floor space with a tray and a fresh bag of materials (40 craft sticks, 30 stir sticks, 5 cotton balls, one blob of clay). Two leaders are judges. Post the scoring rubric on the board so patrols know what is being judged.", "materials": ["One fresh material bag and tray per patrol", "Score sheets and pens for judges", "Timer", "Three picture cards (teepee, log cabin, lean-to) face down at the front"], "rules": ["Round 1 (6 minutes): a leader flips the first picture card. Every patrol builds that fire-lay. When the timer sounds, hands off.", "Judges score each build out of 10: correct shape (3 points), tinder at the centre and reachable by a match (2 points), kindling before fuel with air gaps (2 points), stability when the judge gently blows on it (2 points), and a patrol member can explain when this lay is used (1 point).", "Round 2 (6 minutes): flip the second card and repeat. Round 3 (6 minutes): flip the third card and repeat. Patrols may reuse sticks between rounds.", "Bonus round (4 minutes): the 'Storm Build.' Build the best lay for a windy, rainy day (lean-to is the best answer) while a leader waves a piece of cardboard as wind from one side. Stability is worth 5 points in this round.", "Add up all rounds. Highest total wins 5 patrol points, second 3, third 2, everyone else 1. Ties are broken by the fastest completed build in round 1.", "Any patrol that shouts, throws sticks, or takes another patrol's materials loses 2 points."], "variations": ["Easier: give patrols the picture card to keep on the table while they build.", "Harder: blindfold one builder per patrol; the rest of the patrol gives verbal instructions only.", "Short on time: run rounds 1 and 2 only and skip the storm build."]}, "tables": [{"caption": "Three fire-lays: how to build and when to use", "headers": ["Fire-lay", "How to build", "Best for", "Weakness"], "rows": [["Teepee", "Tinder in the centre, kindling leaned in a cone around it, fuel cone outside that, door left for the match", "Fast hot fire, damp wood, boiling water quickly", "Collapses as it burns; needs tending"], ["Log cabin", "Two parallel logs, two across, repeat 4-5 layers at right angles, small teepee of tinder and kindling inside", "Long steady cooking fire, supports a pot or grill", "Slower to catch; uses more wood"], ["Lean-to", "One stick angled as a ramp, tinder beneath, kindling leaned against the ramp on the sheltered side", "Windy days; the ramp is a windbreak", "Small; must be fed as it grows"]]}, {"caption": "Put it out: which method removes which side of the triangle", "headers": ["Method", "Removes", "Use on"], "rows": [["Water", "Heat", "Wood, paper, cloth (never grease or electrical)"], ["Pot lid or fire blanket", "Oxygen", "Grease fire in a pan, small clothing fire"], ["Turn off the gas valve", "Fuel", "Stove or propane fire"], ["ABC dry chemical extinguisher", "Oxygen (coats the fuel) and breaks the chain reaction", "Almost any small fire; aim at the base"], ["Sand or dirt", "Oxygen", "Campfire, fuel spill"]]}], "references": [{"label": "Wikipedia: Fire triangle", "url": "https://en.wikipedia.org/wiki/Fire_triangle", "why": "Clear explanation of heat, fuel and oxygen for the leader's background"}, {"label": "YouTube search: how to build a teepee log cabin lean to campfire", "url": "https://www.youtube.com/results?search_query=how+to+build+a+teepee+log+cabin+lean+to+campfire", "why": "Short videos showing all three lays with real wood"}, {"label": "YouTube search: PASS fire extinguisher training", "url": "https://www.youtube.com/results?search_query=PASS+fire+extinguisher+training", "why": "Shows the pull, aim, squeeze, sweep motion clearly"}, {"label": "Canadian Red Cross first aid tips", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Burn first aid steps to quote in step 6"}, {"label": "Scouts Canada Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Camping skills badge requirements for fire lighting that this lesson covers"}, {"label": "Exodus 13:21-22 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Exodus+13%3A21-22&version=NKJV", "why": "Read the passage before the spiritual lesson"}], "visual": "fire-triangle", "takeHome": "Find the fire extinguisher and smoke alarm in your home, check the extinguisher gauge is in the green, and teach your family PASS and Stop, Drop and Roll at dinner."}, {"n": 4, "date": "2026-10-06", "term": "Fall", "title": "Compass and Map Basics", "theme": "Finding north, taking a bearing, and walking it without getting lost", "sea": false, "calendar": ["Thanksgiving is Monday Oct 12. Remind scouts there is a meeting next Tuesday Oct 13 as usual (First Aid 1).", "Patrol Leader elections happen tonight during the opening if the leaders feel patrols have settled. Otherwise hold them next week."], "objectives": ["By the end scouts can name the parts of a baseplate compass and explain what the red needle points to.", "By the end scouts can name the 8 main compass points and their degrees (N 0, NE 45, E 90, SE 135, S 180, SW 225, W 270, NW 315).", "By the end scouts can take a bearing to an object and follow a given bearing across the hall.", "By the end scouts can orient a map to north and know their own pace count for 20 m."], "materials": [{"item": "Baseplate compasses (Silva or similar)", "qty": "1 per 2 scouts (12) plus 2 spares", "note": "reusable kit; about $12 each; can be shared between patrols"}, {"item": "Large compass rose printed or drawn on chart paper", "qty": "1", "note": "with degrees marked every 45"}, {"item": "Simple map of the church hall drawn to scale (1 cm = 1 m) with north arrow and symbols for doors, stage, kitchen, washrooms", "qty": "1 per patrol", "note": "draw it once, photocopy"}, {"item": "Masking tape and a 20 m measured line on the floor", "qty": "1 roll", "note": "for pacing"}, {"item": "Measuring tape 20 m or longer", "qty": "1", "note": "to lay out the pacing line and the treasure hunt"}, {"item": "Numbered cones or paper markers", "qty": "10", "note": "treasure hunt waypoints"}, {"item": "Treasure hunt clue cards (bearing and pace count per leg) and a small prize", "qty": "1 set per patrol", "note": "prepare in advance; candy prize must be nut-free and check allergy list"}, {"item": "Pencils and pace count cards", "qty": "25", "note": ""}], "prep": ["Find where magnetic north is in the hall with a compass before scouts arrive, standing away from steel beams, speakers and radiators. Mark it with an N on the wall with tape. Then mark E, S and W walls.", "Draw the hall map to scale with a north arrow that matches the real magnetic north you found. Photocopy 5 copies.", "Lay a 20 m tape line on the floor for pacing with a start and finish mark.", "Walk the treasure hunt course yourself with a compass and write each leg as a bearing and a distance in metres (5 legs, each 5 to 15 m). Give each patrol a different starting point but the same legs in a different order so patrols do not follow each other. Put a token (a coloured card) at each patrol's final point.", "Check each compass: the needle should swing freely and settle within 3 seconds. Set bezels back to 0."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance, PL elections if ready"}, {"time": "6:25", "min": 40, "what": "Practical: compass parts, points and degrees, taking and following a bearing, map symbols and orienting, pacing"}, {"time": "7:05", "min": 10, "what": "Spiritual: Your word is a lamp to my feet (Psalm 119:105)"}, {"time": "7:15", "min": 25, "what": "Activity: indoor bearing treasure hunt with pace counts"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Never Lost: Compass and Map", "intro": "Say: Before GPS, every sailor and every explorer found their way with a needle that points north. Phones die, batteries freeze, and out of cell range the map on your phone is a grey square. A compass never runs out of power. Tonight you learn to read one, take a bearing, and follow it, which is exactly how a sailor steers a course at sea.", "steps": [{"title": "Parts of the compass", "min": 7, "detail": "Give one compass to each pair. Name each part and have scouts touch it. Baseplate: the clear plastic base with a ruler on the edge. Direction-of-travel arrow: the big arrow on the baseplate that points away from you; you always point this where you want to go. Compass housing or bezel: the round dial that turns, marked 0 to 360 degrees. Magnetic needle: the red end always points to magnetic north (test it: everyone turn in a circle and watch the red end keep pointing the same way). Orienting arrow: the outlined arrow inside the housing, sometimes called the shed, because we 'put red in the shed.' Orienting lines: the parallel lines inside the housing that line up with map grid lines. Index line: the fixed mark at the top of the housing where you read the bearing. Explain that magnets, phones, steel tables and speakers pull the needle, so hold the compass flat and away from your body and from metal. Show what happens when you hold it next to a phone."}, {"title": "Compass points and degrees", "min": 6, "detail": "Show the compass rose. There are 360 degrees in a circle. North is 0 (or 360), east is 90, south is 180, west is 270. Memory phrase for going clockwise: Never Eat Soggy Waffles. The four intercardinal points sit halfway between: northeast 45, southeast 135, southwest 225, northwest 315. Sailors go further to 16 or 32 points (north-northeast, and so on), but 8 is enough tonight. Drill: call a point, scouts turn their whole body to face it using the marked walls; then call a degree number and scouts turn. Then reverse it: a leader faces a direction and scouts shout the degrees. Explain that a 'bearing' is simply the direction to something, given as a number of degrees from north. 'The lighthouse bears 090' means it is due east of you. Ships steer by bearing: the helmsman is told 'steer 225' and keeps the compass on that number."}, {"title": "Taking a bearing", "min": 8, "detail": "Taking a bearing means finding out what direction an object is from you. Demonstrate, then pairs practise on the hall clock, the exit sign, the stage. Step 1: hold the compass flat in front of you at waist height, with the direction-of-travel arrow pointing straight at the object. Step 2: without moving the baseplate, turn the housing until the red end of the needle sits inside the orienting arrow. 'Put red in the shed.' Step 3: read the number at the index line. That is the bearing to the object. Each pair takes bearings to three objects and writes them down; pairs compare numbers, which should be within 5 degrees. If they are far apart, someone was not pointing the arrow straight, or was near metal. Also teach the back bearing: add or subtract 180 to get the direction back to where you started (if the exit bears 040, the way back is 220). Sailors take bearings to lighthouses and headlands to fix their position on a chart, which you will do in December."}, {"title": "Following a bearing", "min": 7, "detail": "Following a bearing is the reverse: you are given a number and must walk in that direction. Step 1: turn the housing so the bearing you want (say 120) is at the index line. Step 2: hold the compass flat and turn your whole body, not the compass, until red is in the shed. Step 3: the direction-of-travel arrow now points the way; look up, pick an object on that line (a chair, a mark on the wall), and walk to it. Step 4: at the object, put red in the shed again, pick a new object, and repeat. Never walk staring at the compass; you will drift and bump into things. Practise: each pair is given three bearings in turn (for example 090, 200, 315) and must walk 5 paces on each, then check where they ended against a leader's mark. Explain that this is why a ship's compass sits in front of the helm: the helmsman keeps the lubber line on the course number and looks at the horizon."}, {"title": "Map symbols and orienting the map", "min": 6, "detail": "Hand out the hall maps. Every map has a north arrow, a scale, and a legend of symbols. Point out the hall's symbols: doors, stage, kitchen, washrooms, pillars. On a real topographic map, blue is water, green is forest, brown lines are contour lines showing hills (lines close together mean steep), black squares are buildings, dashed lines are trails. Orienting the map means turning it so that north on the map points at real north, so everything on the map lines up with what you see. Step 1: set the compass to 0 (north at the index line). Step 2: lay the compass on the map with the edge of the baseplate along the north arrow. Step 3: turn the map and compass together until red is in the shed. Now the stage on the map is in the same direction as the real stage. Patrols do it, then a leader checks by asking them to point at the kitchen using only the map. Mention that real maps need a correction for declination (in southern Ontario magnetic north is about 10 degrees west of true north), which we will cover in the chart lesson."}, {"title": "Pacing", "min": 6, "detail": "A pace count lets you measure distance with your legs. Each scout walks the 20 m tape line at a normal walk, counting every time the right foot lands (a double step). Do it twice and average. Most scouts this age get 12 to 15 double steps per 20 m. Write it on the pace card: 'My pace: 13 per 20 m.' To walk 10 m, walk half your count. To walk 40 m, walk double. Point out that pace changes going uphill, in snow, or when tired, so at camp you recount on a known 100 m. Sailors do the same thing with speed and time instead of steps, which we will learn in the spring as dead reckoning. Quick contest: a leader calls '15 metres, bearing 270' and pairs walk it; the pair closest to the leader's chalk mark wins a point. This is exactly the treasure hunt that follows."}], "tips": ["Say 'red in the shed' fifty times tonight. It is the one phrase that makes compasses click.", "The most common error is turning the compass instead of the body when following a bearing. Have scouts hold the compass against their belly with both hands so it must move with them.", "Steel in the floor or walls can throw a needle by 20 degrees in some halls. If bearings are inconsistent, move the exercise to the middle of the room.", "Pairs work better than individuals with compasses: one reads, one walks, then swap."], "safety": ["Scouts following bearings are looking up, not down. Clear all chairs and bags from the floor first.", "Nobody walks a bearing with eyes on the compass; sight an object, then walk.", "Prizes must be nut-free and checked against the allergy list."]}, "spiritual": {"title": "A Lamp to My Feet", "ref": "Psalm 119:105", "verse": "Your word is a lamp to my feet And a light to my path.", "url": "https://www.biblegateway.com/passage/?search=Psalm+119%3A105&version=NKJV", "message": "Tonight you learned that a compass needle always points the same way, no matter which way you turn. You can be spun around, blindfolded, lost in fog, and the red needle still says north. The Psalmist says God's word is like that: a lamp to my feet and a light to my path. Notice it is a lamp to the feet, not a floodlight over the whole forest. God usually shows us the next step, not the whole journey, just as you followed a bearing tonight one object at a time. Notice also what pulled the needle off course: a phone, a steel table, a speaker. Small things nearby can bend the needle by twenty degrees, and you would walk confidently in the wrong direction. That is what sin does; it does not feel like being lost, it feels like being sure. So we check our bearing against God's word every day. Our Coptic Church gives us the Agpeya, the book of the hours, so that morning, noon and night we read the Psalms and reset the needle. Pope Kyrillos VI lived by these hours in a windmill outside Cairo and never lost his way. Keep your lamp lit this week: read one Psalm each night before bed.", "discussion": ["What are the 'magnets' in your life that pull your needle away from God without you noticing?", "Why do you think God gives us a lamp for the next step instead of showing the whole path?", "Which Agpeya hour or prayer could you realistically add this week to reset your bearing?"], "prayer": "Lord, Your word is a lamp to our feet and a light to our path. When we are turned around and unsure, point us always back to You, and give us the courage to take the next step You show us, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Bearing Treasure Hunt", "setup": "Each patrol receives a clue card with 5 legs written as a bearing and a distance, for example 'Leg 1: 090 for 12 m.' Each patrol starts at a different numbered cone so they do not bump into each other. The legs lead to a final spot where a coloured token is hidden under a chair or taped under a table. Each patrol has one compass, the compass carrier rotates every leg, and a different scout is the pacer every leg using their own pace count.", "materials": ["One compass per patrol", "Clue cards (5 legs each)", "Pace cards from the lesson", "Numbered starting cones", "Hidden tokens (one per patrol) and a prize box", "Timer"], "rules": ["On 'Go,' patrols read leg 1, set the bearing on the compass, put red in the shed, sight an object, and the pacer walks the distance using their own pace count while the rest follow silently.", "At the end of each leg the patrol stops, rotates the compass to the next scout and the pacing to another scout, and reads the next leg. Every scout must carry the compass at least once.", "Patrols must not use walls, doors or other patrols as hints. Leaders watch for shortcuts; a patrol caught following another patrol restarts from its cone.", "When a patrol reaches the final spot, they search within 2 m for their coloured token and bring it to the leader. The leader records the time.", "Scoring: first patrol to bring its correct token wins 5 points, second 3, third 2, all others who finish 1. A patrol that brings the wrong colour must return it and keep searching.", "If time remains, run a second course in reverse: each patrol walks the back bearings (add or subtract 180) from its token back to its cone."], "variations": ["Easier: shorten legs to 5 to 8 m and use only the 8 main points (090, 180, 225).", "Harder: add a leg where the clue is 'the bearing to the exit sign plus 90' so patrols must take a bearing first.", "Short on time: 3 legs per patrol only."]}, "tables": [{"caption": "The 8 compass points and their degrees", "headers": ["Point", "Abbreviation", "Degrees", "Opposite (back bearing)"], "rows": [["North", "N", "0 / 360", "S 180"], ["Northeast", "NE", "45", "SW 225"], ["East", "E", "90", "W 270"], ["Southeast", "SE", "135", "NW 315"], ["South", "S", "180", "N 0"], ["Southwest", "SW", "225", "NE 45"], ["West", "W", "270", "E 90"], ["Northwest", "NW", "315", "SE 135"]]}], "references": [{"label": "YouTube search: how to use a baseplate compass take a bearing red in the shed", "url": "https://www.youtube.com/results?search_query=how+to+use+a+baseplate+compass+take+a+bearing+red+in+the+shed", "why": "Short clear demonstration to watch before teaching"}, {"label": "Wikipedia: Compass rose", "url": "https://en.wikipedia.org/wiki/Compass_rose", "why": "The 8, 16 and 32 point roses used at sea"}, {"label": "Scouts Canada Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Trail skills stages for compass and map that this lesson covers"}, {"label": "Psalm 119:105 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Psalm+119%3A105&version=NKJV", "why": "The verse for the spiritual lesson"}, {"label": "Coptic Reader app", "u
