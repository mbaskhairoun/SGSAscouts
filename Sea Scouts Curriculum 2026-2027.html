day night praises are running at church; tonight ends with a short Kiahk hymn.", "Last meeting before the holiday break. Confirm with families: no meetings Dec 22 and Dec 29; next meeting Jan 5. Coptic Christmas is Thursday Jan 7."], "objectives": ["Explain what a nautical chart shows that a road map does not: soundings, chart datum, depth contours, hazards and aids to navigation.", "Read and write a position in latitude and longitude (degrees and minutes) and plot it on a practice chart.", "Measure distance in nautical miles with dividers using the latitude scale only.", "Use the compass rose to find a true course and convert it to magnetic using the printed variation.", "Draw and label a course line between two positions."], "materials": [{"item": "Practice chart, leader-drawn on A3 or two taped letter sheets (see prep for how to draw it)", "qty": "1 per patrol plus 1 spare (6)", "note": "photocopy; reusable if scouts plot in pencil"}, {"item": "Dividers (or geometry-set compasses with a second point instead of a pencil)", "qty": "1 per patrol", "note": "school geometry sets work"}, {"item": "30 cm rulers", "qty": "2 per patrol", "note": "two rulers walked side by side replace parallel rules"}, {"item": "Protractors, pencils, erasers", "qty": "1 protractor, 4 pencils, 2 erasers per patrol", "note": ""}, {"item": "Printed position cards for the plotting race", "qty": "1 set per patrol", "note": "positions listed in the activity"}, {"item": "Dairy-free hot cocoa: cocoa powder, sugar, oat milk, pinch of salt, cinnamon", "qty": "300 mL cocoa, 300 mL sugar, 5 L oat milk", "note": "about 20 servings of 250 mL; check the cocoa label is dairy-free"}, {"item": "Kettle or urn, large pot or thermal dispenser, whisk, ladle, paper cups", "qty": "1 set, 30 cups", "note": "hall kitchen"}, {"item": "Kiahk hymn text printed or on Coptic Reader", "qty": "1 per patrol", "note": "see activity"}], "prep": ["Draw the practice chart: on A3 paper draw a rectangle 27 cm wide by 18 cm tall. Along the left and right edges mark latitude every 1 cm from 44 degrees 00 minutes N at the bottom to 44 degrees 18 minutes N at the top (1 cm = 1 minute = 1 nautical mile). Along the top and bottom edges mark longitude every 1 cm from 079 degrees 30 minutes W at the right edge to 079 degrees 57 minutes W at the left edge (longitude numbers grow to the west). Draw faint grid lines every 5 minutes.", "Add features to the chart: a shoreline with tan land along the left 5 cm and a marina at 44 09 N, 079 55 W; an island 3 cm across near 44 12 N, 079 40 W with a rock symbol (a small asterisk) just south of it and a wreck symbol; scattered soundings in metres (2, 4, 7, 12, 25) with shallow water shaded blue in the top right corner; three lateral buoys drawn as small diamonds labelled R2, G1, G3; a lighthouse (a magenta teardrop) at 44 03 N, 079 33 W; a compass rose in an empty area with an outer true ring and an inner magnetic ring rotated 10 degrees to the west and the label VAR 10 W (2026).", "Photocopy 6 charts. Plot the activity positions yourself and write the answer key (shape, total distance, course).", "Read the Wikipedia nautical chart article and watch one video from the YouTube search on plotting a position so you can demonstrate with confidence.", "Make the cocoa base before the meeting: mix cocoa, sugar and salt dry; heat the oat milk in the hall kitchen at 7:00 and whisk in the dry mix. Keep below boiling and serve at 7:30.", "Print or load a Kiahk hymn text on Coptic Reader (for example the Sunday Theotokia verse Rejoice O Mary, or the Kiahk psali refrain) and check with the church cantor for a simple tune."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (holiday break, Christmas Jan 7), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: what a chart shows, latitude and longitude, plotting a position, dividers and distance, compass rose and variation, plotting a course."}, {"time": "7:05", "min": 10, "what": "Spiritual: the Magi followed the star (Matthew 2:1-12); Kiahk and Christmas."}, {"time": "7:15", "min": 25, "what": "Activity: chart plotting race, then Kiahk praises with dairy-free hot cocoa."}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, Merry Christmas, dismissal."}], "practical": {"title": "Reading and Plotting on a Nautical Chart", "intro": "A road map shows you the road; a nautical chart shows you what is under the water, which is what sinks boats. Charts tell you the depth, where the rocks and wrecks are, where the buoys and lighthouses stand, and how to describe exactly where you are so a rescuer can find you. Tonight you learn to read a chart, plot a position, measure distance and lay a course, the skills every navigator uses before the first line is thrown off.", "steps": [{"title": "What a chart shows", "min": 7, "detail": "Hand out the practice charts. Point out the colours: tan is land, blue is shallow water, white is deeper water, green (on real charts) is bottom that dries at low tide. The small numbers scattered on the water are soundings, the depth in metres on Canadian charts (older ones use feet or fathoms; always check the title block). Depths are measured from chart datum, roughly the lowest normal water level, so the real depth is usually a little more, never less. Depth contour lines join equal depths, like elevation lines on a land map. Symbols to learn tonight: an asterisk is a rock, a small ship shape or the letters Wk is a wreck, a diamond with R or G is a lateral buoy (last week's lesson), a magenta teardrop is a light, an anchor is an anchorage, and a magenta line is a ferry or recommended track. On a real chart the full symbol list is a booklet called Chart No. 1."}, {"title": "Latitude and longitude", "min": 8, "detail": "Latitude lines run left to right and measure how far north or south of the equator you are, from 0 at the equator to 90 at the pole; Ontario sits around 44 degrees N. Longitude lines run top to bottom and measure how far east or west of Greenwich, England you are; Ontario is around 079 degrees W. Each degree is divided into 60 minutes, written with a small apostrophe, and minutes into tenths. Position is always written latitude first: 44 degrees 09.5 minutes N, 079 degrees 42.0 minutes W. Show the scales printed on the chart edges: latitude on the left and right edges, longitude on the top and bottom. The golden rule: one minute of latitude equals one nautical mile (1852 m, about 1.15 statute miles), so the latitude scale is your distance ruler. Longitude minutes shrink as you go north (at 44 N they are only about 0.72 nautical miles), so never measure distance on the longitude scale. Quiz: which way do the longitude numbers grow on our chart? (To the west, leftwards.)"}, {"title": "Plotting a position", "min": 8, "detail": "Demonstrate on the spare chart taped to the wall, then patrols copy. To plot 44 degrees 09.0 minutes N, 079 degrees 42.0 minutes W: find 09 on the latitude scale at the side, lay one ruler horizontally at that mark and draw a light pencil line across; find 42 on the longitude scale at the top, lay the ruler vertically and draw a light line down; where the lines cross is the position. Mark it with a small dot inside a circle and write the time beside it, for example 1830. The reverse, reading a position: place the ruler horizontally through the point to the side scale for latitude, then vertically to the top scale for longitude, estimating tenths of a minute. Have each patrol plot two positions: the marina and a spot 3 minutes east of the island, and read out the position of the lighthouse. Check each patrol's plot before moving on."}, {"title": "Measuring distance with dividers", "min": 6, "detail": "Open the dividers so one point is on the marina and the other on the lighthouse. Without changing the spread, lift the dividers to the latitude scale on the side of the chart at about the same latitude, put one point on a whole minute mark and read how many minutes the other point spans; that number is the distance in nautical miles. If the spread is longer than the scale or your dividers, set the dividers to exactly 5 minutes (5 nautical miles) and walk them along the course line, counting, then measure the leftover. Speed on the water is in knots, one knot being one nautical mile per hour, so a boat doing 5 knots covers that 5 mile leg in one hour. Patrols measure marina to lighthouse and marina to island and write the answers on the chart margin."}, {"title": "Compass rose and variation", "min": 6, "detail": "Find the compass rose. The outer ring is TRUE north (the North Pole, which the chart grid lines point to). The inner ring is MAGNETIC north, where your compass needle points, and on our chart it is rotated 10 degrees to the west, printed as VAR 10 W. Variation changes with location and slowly with time; Toronto is currently around 10 degrees W. To convert: variation west, magnetic best (bigger), so add west variation to a true course to get magnetic; variation east, magnetic least, so subtract. Example: a true course of 090 with 10 W variation is 100 magnetic, the number you would steer on the boat compass. Practise three conversions as a patrol quiz: 045 T, 180 T, 350 T (answers 055, 190, 000). Mention the old sailors' phrase True Virgins Make Dull Company, add whiskey: True, Variation, Magnetic, Deviation, Compass, and that deviation (the boat's own metal) is a topic for later."}, {"title": "Plotting a course", "min": 5, "detail": "Draw a straight pencil line from the marina to the lighthouse. To find its direction, walk two rulers: lay ruler A along the course line, hold ruler B against it, then slide A along B, then B along A, keeping them touching, until one ruler passes through the centre of the compass rose. Read the true bearing on the outer ring in the direction you are travelling. Then convert to magnetic. Label the line the navigator's way: the course above the line as C 112 M, and the speed or distance below it, for example 6.5 NM. Check the line for hazards: does it cross the rock south of the island or the blue shallows? If yes, add a waypoint and plot two legs. Patrols plot marina to lighthouse, label it, and one scout reads the course aloud."}], "tips": ["Pencil only, light lines, so charts can be erased and reused.", "Common mistake: reading longitude from the side scale. Repeat: sides for latitude and distance, top and bottom for longitude only.", "Have scouts say a position aloud in the radio format from lesson 21 preview: four four degrees, zero nine decimal five minutes north.", "If dividers are short, teach the walking method early; it is what real navigators do on long legs.", "Keep one leader circulating to check plots within 2 mm; small errors become big ones on a course line."], "safety": ["Dividers have sharp points; carry them closed and keep them on the table.", "Cocoa is hot; a leader ladles it, cups are filled two-thirds, and scouts sit to drink.", "Check the cocoa and oat milk labels for allergens (oats may be processed with wheat; some cocoa mixes contain milk)."]}, "spiritual": {"title": "They Followed the Star", "ref": "Matthew 2:1-12", "verse": "When they heard the king, they departed; and behold, the star which they had seen in the East went before them, till it came and stood over where the young Child was. When they saw the star, they rejoiced with exceedingly great joy.", "url": "https://www.biblegateway.com/passage/?search=Matthew+2%3A1-12&version=NKJV", "message": "The Magi were the navigators of their day. They studied the sky the way you studied a chart tonight, and when a new star rose in the east they did what a good navigator does: they took a bearing on it and set out. It was a long voyage, months across desert, with hazards on the way. Herod was the rock under the surface, smiling on the chart but deadly, and God warned them in a dream to plot a new course home. What made the journey possible was a fixed point in the sky. A chart is only useful because the North Pole does not move; a star is only useful because it holds still. Christ is that fixed point. Kings, fashions and opinions drift like buoys that have dragged their anchors, but He is the same yesterday, today and forever. In Kiahk the Church stays up on Saturday nights singing praises, watching for that star. On the night of January 6 we will gather for the Nativity liturgy, and like the Magi we will bring what we have: not gold, but a fast well kept and a heart that made the journey. The Magi rejoiced with exceedingly great joy when the star stopped over the house. Set your course on Him and you will know that joy.", "discussion": ["The Magi needed a fixed star. What is your fixed point when everything around you is moving?", "Herod looked friendly but was a hidden rock. How do you spot hidden hazards in your own life before you hit them?", "The Magi brought gifts. What gift, other than money, will you bring to Christ at the Nativity liturgy this year?"], "prayer": "Lord Jesus, star of Bethlehem and fixed point of our lives, guide our course through this fast and bring us rejoicing to Your Nativity. Keep us clear of hidden rocks and lead us home by a safer road. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Chart Plotting Race and Kiahk Praises with Hot Cocoa", "setup": "Part A (15 minutes): each patrol at a table with a fresh practice chart, dividers, two rulers, protractor and pencils. Hand each patrol a sealed envelope with the position cards. A leader judge sits at the front with the answer key. Part B (10 minutes): chairs in a semicircle, hymn text on the screen or handouts, cocoa ladled by a leader from the hall kitchen.", "materials": ["Practice charts, dividers, rulers, protractors, pencils", "Position card envelopes", "Answer key and scoresheet", "Hot cocoa, cups, ladle", "Kiahk hymn text (Coptic Reader or print)"], "rules": ["On Go, patrols open the envelope. Card 1 lists six positions to plot in order: A 44 04.0 N 079 52.0 W; B 44 14.0 N 079 52.0 W; C 44 14.0 N 079 46.0 W; D 44 09.0 N 079 46.0 W; E 44 14.0 N 079 40.0 W; F 44 04.0 N 079 40.0 W. Plot each with a dot in a circle and letter.", "Join A to B to C to D to E to F with straight lines. Question 1: what shape or letter appears? (A boxy letter shape; the judge's key shows it.) 2 points for each correctly plotted position within 2 mm, 3 points for naming the shape.", "Question 2: measure the total length of the route A to F with dividers on the latitude scale. Within 1 nautical mile of the key: 5 points; within 2: 2 points.", "Question 3: find the true course from A to B and convert it to magnetic using the rose. Within 3 degrees of the key on both numbers: 5 points; true only: 2 points.", "Question 4: does any leg pass within 1 nautical mile of the rock or the blue shallows? Name the leg. 3 points for the correct answer with a reason.", "The first patrol to hand in a complete sheet earns 3 bonus points, second 2, third 1, but only if all six positions are plotted. Judges check each patrol's chart at the front.", "Maximum 31 points. Winning patrol are the Navigators of the Watch and get first cocoa.", "Part B: everyone sits with cocoa. A leader or cantor explains that Kiahk is the month of praises to the Theotokos before the Nativity. Sing one simple hymn or refrain twice through, for example the English verse Rejoice O Mary, the handmaiden and mother, for the angels praise Him who is in your arms, or a Kiahk psali refrain the cantor suggests, following the text on Coptic Reader. Finish by wishing each other a blessed Nativity."], "variations": ["Easier: give only four positions and skip the course conversion.", "Harder: give the positions as a radio message read aloud once by the judge, so patrols must write them down correctly before plotting; or add a second route with a waypoint to avoid the rock.", "Short on time: plot the six points and name the shape only, then go to cocoa."]}, "tables": [{"caption": "Common chart symbols on Canadian charts", "headers": ["Symbol", "Meaning", "Action for a small boat"], "rows": [["Small number on the water (e.g. 4)", "Sounding: depth in metres below chart datum", "Compare with your boat's draft; avoid anything under 1 m"], ["Blue tint", "Shallow water (usually under 10 m on lake charts)", "Slow down, watch for rocks"], ["Green tint", "Bottom that dries at low water", "Stay out unless you know the tide"], ["Tan", "Land", "Obviously avoid"], ["Asterisk or + with dots", "Rock, awash or underwater", "Give at least 100 m clearance"], ["Wk or a small hull outline", "Wreck", "Keep clear; may have parts near the surface"], ["Diamond with R or G and a number", "Lateral buoy (red or green)", "Red right returning"], ["Magenta teardrop with Fl", "Lighthouse or light, with its flash pattern", "Use as a landmark for bearings"], ["Anchor symbol", "Anchorage", "Safe place to anchor"], ["Compass rose", "True (outer) and magnetic (inner) directions with variation", "Read courses here"]]}, {"caption": "Dairy-free hot cocoa (fasting-friendly)", "headers": ["Ingredient", "Per 250 mL cup", "For 20 cups"], "rows": [["Unsweetened cocoa powder (check label: no milk)", "15 mL", "300 mL"], ["Sugar", "15 mL", "300 mL"], ["Salt", "pinch", "2 mL"], ["Oat milk (or soy or almond, allergy permitting)", "250 mL", "5 L"], ["Cinnamon (optional)", "pinch", "5 mL"], ["Method", "Mix dry ingredients, whisk into hot (not boiling) oat milk until smooth", "Keep warm in a pot or dispenser, whisk before serving"]]}], "references": [{"label": "Wikipedia: Nautical chart", "url": "https://en.wikipedia.org/wiki/Nautical_chart", "why": "Overview of soundings, datum, symbols and compass rose to read before the meeting."}, {"label": "Wikipedia: Latitude", "url": "https://en.wikipedia.org/wiki/Latitude", "why": "Explains degrees and minutes and why a minute of latitude is a nautical mile."}, {"label": "YouTube search: how to plot a position on a nautical chart", "url": "https://www.youtube.com/results?search_query=how+to+plot+a+position+on+a+nautical+chart+dividers+parallel+rules", "why": "Watch a demonstration of dividers and walking rulers to copy in steps 3 to 6."}, {"label": "Tide predictions Canada", "url": "https://www.tides.gc.ca/", "why": "Shows how chart datum relates to real water levels; useful for the question of why real depth differs from the chart."}, {"label": "Coptic Reader app", "url": "https://www.copticreader.com/", "why": "Kiahk praises text and Nativity hymns for the closing sing."}, {"label": "Bible Gateway: Matthew 2:1-12 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+2%3A1-12&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": "compass-rose", "takeHome": "Find your home's latitude and longitude on a phone map, write it in degrees and minutes the navigator's way, and bring it to the first meeting in January; attend the Nativity liturgy on the night of January 6."}, {"n": 15, "date": "2027-01-05", "term": "Winter", "title": "Winter Survival & Layering", "theme": "Dress right, spot frostbite and hypothermia, pack for winter camp, and shelter in the snow", "sea": false, "calendar": ["Nativity fast continues through tonight (day 42 of 43). Tomorrow, Jan 6, is the Paramoun and the Nativity liturgy is held in the evening; Coptic Christmas is Thursday Jan 7. Any snack tonight must be vegan.", "Wish scouts a blessed Nativity; attendance may be lower this week, so keep patrols flexible.", "Winter camp or a winter day hike is coming; tonight's gear list is the packing list for it."], "objectives": ["Explain the three-layer system (base, mid, shell), choose the right fabric for each, and say why cotton kills.", "Recognize frostnip, superficial and deep frostbite and give the correct first aid, including what NOT to do.", "Recall the signs of hypothermia from lesson 12 and the first steps of treatment.", "Produce a complete winter camp gear list for one night in a tent or cabin.", "Describe how a quinzee, a snow trench and a tarp lean-to are built and how to stay warm through a night at minus 15 degrees C."], "materials": [{"item": "Clothing piles for the layering race: cotton hoodie, cotton t-shirt, jeans, polyester or merino long-sleeve base layer, long underwear, fleece jacket, wool sweater, puffy insulated jacket, rain shell or windproof shell, snow pants, wool socks, cotton socks, toque, balaclava or neck gaiter, mitts, thin gloves, scarf, running shoes, winter boots, sunglasses", "qty": "1 full set per patrol (5); leaders and families bring", "note": "label each patrol's bin"}, {"item": "Winter sleeping bag (rated minus 10 or lower), closed-cell foam pad, inflatable pad", "qty": "1 each", "note": "demo"}, {"item": "Hard plastic 1 L water bottle (Nalgene style), headlamp, spare batteries, chemical hand warmers", "qty": "1 each", "note": "demo"}, {"item": "Two identical socks, one cotton and one wool, and a bowl of water", "qty": "1 set", "note": "cotton kills demo"}, {"item": "Tarp 3 m by 3 m, 10 m of cord, two chairs or poles", "qty": "1 set", "note": "lean-to demo"}, {"item": "Printed gear list and frostbite table", "qty": "1 per scout", "note": "from the tables below"}, {"item": "Stopwatch, scoresheet", "qty": "1", "note": ""}, {"item": "Nativity hymn lyrics printed or on Coptic Reader", "qty": "1 per patrol", "note": "optional hymn"}], "prep": ["Read the layering and frostbite sections of the Canadian Red Cross first aid tips page and the Wikipedia Hypothermia article (links in references).", "Collect the five clothing bins; make sure each has both good and bad choices (cotton items, running shoes) so the race tests judgement.", "Wet the cotton sock and the wool sock 15 minutes before the meeting and keep them in separate bags for the fabric demo.", "Watch one video from the YouTube search on building a quinzee so you can describe it step by step.", "Print the gear list and frostbite table, one per scout, and a large copy for the wall.", "Rig the tarp lean-to at the side of the hall before the meeting (ridge line between two chairs or a chair and a pillar, one side pegged low with weights).", "Load the Nativity hymn on Coptic Reader or print the words; ask the cantor for the simplest tune."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (Nativity liturgy tomorrow night), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: layering system, cotton kills demo, frostbite and hypothermia, winter gear list, emergency shelters, staying warm at night."}, {"time": "7:05", "min": 10, "what": "Spiritual: born in a manger (Luke 2:7-12), Christ's humble shelter."}, {"time": "7:15", "min": 25, "what": "Activity: Dress the Leader layering race, then an optional Nativity hymn."}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, blessed Nativity, dismissal."}], "practical": {"title": "Staying Warm and Alive in an Ontario Winter", "intro": "In Ontario the cold is not an inconvenience, it is a hazard that can take fingers and lives. But people camp happily at minus 20 every winter because they know three things: how to dress in layers, how to read the early warning signs on their own bodies, and how to shelter and sleep warm. Tonight you learn all three so that winter camp is an adventure and not an emergency.", "steps": [{"title": "The layering system", "min": 9, "detail": "Hold up each item as you build a scout from the skin out. BASE layer, next to the skin: its job is to wick sweat away, so it must be synthetic (polyester, polypropylene) or merino wool, snug but not tight, top and bottom. MID layer, the insulation: fleece, wool sweater, or a puffy jacket with down or synthetic fill; it traps warm air, and you can wear two thin mids instead of one thick one. SHELL, the outside: windproof and water-resistant or waterproof, ideally breathable, with pit zips or a loose fit so sweat escapes. Snow pants are the shell for your legs. Extremities: a toque (you lose heat from any bare skin, and the head is usually the bare part), a neck gaiter or balaclava, mitts over thin liner gloves (mitts are warmer than gloves), and two pairs of socks, a thin liner and a wool sock, in boots with room to wiggle toes. The trick is to keep adjusting: take a layer off before you sweat and put it on the moment you stop moving. Be bold, start cold at the trailhead."}, {"title": "Cotton kills: the fabric test", "min": 6, "detail": "Bring out the two wet socks. Pass the wet cotton sock and the wet wool sock around; ask which feels colder against the wrist. Cotton absorbs up to 25 times its weight in water, loses almost all of its insulation when wet, and dries slowly, so a sweaty cotton t-shirt under a jacket becomes a cold wet towel wrapped around your chest the moment you stop walking. That is how hikers get hypothermia at plus 5 degrees. Wool still insulates when damp and synthetics dry fast. Hold up the jeans and the hoodie: comfortable at home, dangerous on a winter trail. Rule for camp: no cotton next to the skin, no jeans, no cotton socks. Ask each patrol to find every cotton item in their bin and hold it up; they will need to know for the race."}, {"title": "Frostbite and hypothermia signs", "min": 8, "detail": "Frostbite is frozen skin, usually fingers, toes, nose, ears and cheeks, in three stages. Frostnip: skin red, cold, tingling or stinging; warm it now (hands in armpits, cover the face) and it recovers fully. Superficial frostbite: skin white or greyish and waxy, numb, stiff on top but soft underneath. Deep frostbite: skin white, blue or blotchy, hard like wood, no feeling, blisters later. Treatment: get out of the cold, remove wet clothing, rings and watches, and warm the part gently in water at 37 to 39 degrees C (elbow test: warm, not hot) for 20 to 30 minutes, or skin to skin against a warm belly or armpit. Never rub it, never use snow, never use a fire, stove or heating pad on numb skin, never pop blisters, and do not thaw a foot the person must still walk on, since refreezing is worse than staying frozen. Cover loosely with a dry dressing and get medical care. Review hypothermia from lesson 12: the umbles (mumbles, stumbles, fumbles, grumbles) mean stop, shelter, dry layers, warm sweet drink; shivering that stops, confusion or sleepiness means call 911 and handle gently."}, {"title": "Winter camp gear list", "min": 6, "detail": "Hand out the gear list and walk the sleep system with the demo gear. Sleeping bag rated at least 10 degrees below the coldest expected night; a bag rated minus 10 is a three-season bag in Ontario in January, so add a fleece liner or a second bag. Two pads, a closed-cell foam pad under an inflatable, because the ground steals more heat than the air; the pads together need an R-value of about 4 or more. Dedicated dry sleep clothes that never leave the bag: base layer, wool socks, toque. Hard plastic 1 L bottle for a hot water bottle at night. Headlamp with spare batteries kept in an inside pocket, since cold kills batteries. Insulated water bottle stored upside down so any ice forms at the bottom, not in the lid. Extra mitts and socks in a dry bag, sunglasses (snow blindness is real), lip balm, high-fat snacks, a whistle, and a small foam pad to sit on. Ask patrols to name the three most forgotten items (answers: spare mitts, headlamp batteries, sit pad)."}, {"title": "Emergency shelters", "min": 6, "detail": "Show the tarp lean-to rigged at the side: a ridge line tied between two anchors about chest high, the tarp draped over with the back edge pegged or weighted low, the open side facing away from the wind, and insulation (boughs, a foam pad, a pack) under the sleeper; a small fire with a reflector wall in front turns it into a warm shelter. Quinzee: pile snow into a mound about 2 m high and 3 m across, let it sit two to three hours so it hardens (called sintering), push 30 cm sticks in all over as thickness gauges, then dig in from the downwind side with a low door and hollow out until you hit the sticks, leaving walls 30 cm thick. Make a sleeping platform higher than the door so cold air sinks to the entrance, and punch a fist-sized vent hole in the roof. Never dig alone; a buddy stays outside in case of collapse, and never use a stove inside. Snow trench: dig a body-length trench 1 m deep, roof it with skis or branches and a tarp, and cover with snow. Snow insulates so well that a quinzee stays near 0 degrees at minus 25 outside."}, {"title": "Staying warm at night", "min": 5, "detail": "Teach the bedtime routine as a checklist. Eat a fatty, high-calorie snack before bed (nuts, dark chocolate, peanut butter) because digestion makes heat. Go to the washroom before bed; a full bladder wastes heat. Do 30 seconds of jumping jacks to warm up, but stop before you sweat. Change into the dry sleep clothes and put the day's damp base layer in a bag, not in the sleeping bag. Fill the hard plastic bottle with hot water, check the lid, and put it in a sock at your feet or between your thighs. Wear the toque, cinch the hood, but keep your mouth and nose outside the bag so breath moisture does not soak the insulation. Put tomorrow's boots liners, mitts and batteries inside the bag or between the pads. If you wake up cold, do sit-ups inside the bag, eat, or add a layer; if too hot, open the zipper a little rather than sweating."}], "tips": ["Let scouts touch every fabric; the difference between fleece and cotton is obvious in the hand and forgotten in a lecture.", "Common mistake: too many layers at the start of a hike, then a sweaty base layer. Repeat be bold, start cold.", "For frostbite, the memory line is warm water, no rubbing, no fire.", "If time is short, cut the shelter step to the quinzee only and show the video at the next meeting.", "Use scouts' own stories of cold hands at the bus stop or on the rink to make the frostnip stage real."], "safety": ["The hot water bottle in a sleeping bag must have a screw lid checked twice; teach this even in the hall.", "The lean-to demo uses cord at chest height: mark it with a bandana so nobody walks into it.", "Layering race: no running, and shoes and boots stay untied to prevent tripping; nobody pulls clothing over another scout's face.", "Frostbite warm-water treatment must never exceed 39 degrees C; teach the elbow test."]}, "spiritual": {"title": "No Room in the Inn", "ref": "Luke 2:7-12", "verse": "For there is born to you this day in the city of David a Savior, who is Christ the Lord. And this will be the sign to you: You will find a Babe wrapped in swaddling cloths, lying in a manger.", "url": "https://www.biblegateway.com/passage/?search=Luke+2%3A7-12&version=NKJV", "message": "Tonight you learned how to dress a scout in layers and how to build a shelter out of snow so that no one freezes. In two nights the Church will celebrate the birth of the One who made the snow, and He was born with almost none of that. There was no room in the inn, so Mary wrapped Him in swaddling cloths, the simplest layers a poor family had, and laid Him in a manger, a feeding trough in a stable, an emergency shelter shared with animals. The angel told the shepherds this was the sign: not a palace, but a Baby in a manger. He came into the cold with us. Soon after, the Holy Family fled to Egypt, our own land, as refugees, and the Coptic Church still remembers every place they sheltered. When you shiver at winter camp, remember that Christ knows exactly what cold is. And when you see someone without proper layers this winter, a classmate with no mitts, a man on the street with wet shoes, remember that the King of Heaven was once a baby in a barn, and let the warmth you have overflow. Tomorrow night we go to the Nativity liturgy. Bring Him the shelter of your heart; He is used to humble rooms.", "discussion": ["Why do you think God chose a stable instead of a palace for His birth?", "The Holy Family fled to Egypt with nothing. Who around you is out in the cold this winter, and what can your patrol do about it?", "What does it mean to give Christ room in the inn of your life this Christmas?"], "prayer": "Lord Jesus, born in a manger and sheltered in Egypt, You know our cold and our need. Keep us warm and safe this winter, make room in our hearts for You, and bless the whole troop with a joyful Nativity. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Dress the Leader and a Nativity Hymn", "setup": "Each patrol stands in a line 8 m from its labelled clothing bin, with a leader (or a volunteer scout wearing a t-shirt and shorts over their uniform) standing beside the bin as the mannequin. A judge with the scoresheet watches each bin. Chairs at the side for the hymn afterwards.", "materials": ["5 clothing bins with the full mixed set of good and bad items", "5 leaders or volunteers to be dressed", "Stopwatch and scoresheet", "Nativity hymn text"], "rules": ["On Go, scouts run one at a time to the bin; each scout may put ONE item on the leader, then tag the next scout. The goal is a complete, correct winter layering system head to toe in the shortest time.", "Items must go on in a sensible order: base before mid before shell. An item put on out of order (for example a fleece before the base layer top) must be removed and redone by the same scout, which costs time.", "The race for a patrol ends when the patrol leader shouts Ready for winter and the judge confirms the leader has at least: base top and bottom, mid layer, shell top, snow pants, toque, neck cover, mitts or gloves, wool socks, boots. Time is recorded.", "Scoring: correct fabric choices earn 2 points each (synthetic or wool base, fleece or wool or puffy mid, windproof shell, wool socks, mitts, toque, boots, neck cover, snow pants, sunglasses bonus). Any cotton item on the leader is minus 3 each. Running shoes instead of boots minus 3. Gloves without mitts minus 1. Missing required item minus 2.", "Time bonus: fastest patrol 5 points, then 4, 3, 2, 1.", "After scoring, the judge asks each patrol one question: name a sign of frostnip, or when to take a layer off. A correct answer earns 2 points.", "Highest total wins the title Winter Wardens. Then everyone helps sort the bins back.", "Part B (7 minutes, optional): sit together and sing one Nativity hymn twice through with the words on screen, for example the Coptic hymn Ni-ethnos tirou (All the nations rejoice), or an English carol such as O Come All Ye Faithful, then close with Merry Christmas in Arabic (Eid milad majid) and Coptic (Pikhristos aftonf is for Easter, so tonight just Ekhrestos ghenete, Christ is born)."], "variations": ["Easier: remove the cotton decoys and score on completeness and speed only.", "Harder: the dresser must work with mitts on, or the leader must be dressed for a specific scenario (snowshoeing uphill, or standing still at a bus stop) and the judge scores whether the layers match the activity.", "Short on time: one round with a 3 minute cap and no hymn."]}, "tables": [{"caption": "Frostbite stages and first aid", "headers": ["Stage", "What you see and feel", "What to do", "Never"], "rows": [["Frostnip", "Red, cold, tingling or stinging skin on nose, ears, cheeks, fingers", "Warm with hands or armpits, cover the area, add layers; recovers fully", "Ignore it; it is the warning"], ["Superficial frostbite", "White or grey waxy patches, numb, top layer stiff but soft underneath", "Shelter, remove wet items and rings, warm in 37 to 39 degrees C water 20 to 30 min or skin to skin, cover loosely, seek care", "Rub, use snow, use direct heat, refreeze"], ["Deep frostbite", "White, blue or blotchy, hard like wood, no feeling, blisters later", "Shelter, insulate the part, do not thaw if refreezing is possible or walking is required, get to hospital", "Rub, pop blisters, walk on a thawed foot"]]}, {"caption": "Winter camp gear list (one night, tent or cabin)", "headers": ["Category", "Items"], "rows": [["Base layers", "Synthetic or merino long-sleeve top and bottoms (2 sets, one kept dry for sleeping), liner socks"], ["Mid layers", "Fleece jacket, wool sweater or puffy jacket, fleece pants"], ["Shell", "Windproof or waterproof jacket, snow pants"], ["Extremities", "Toque, balaclava or neck gaiter, liner gloves plus mitts, spare mitts, 3 pairs wool socks, winter boots, sunglasses, lip balm"], ["Sleep system", "Sleeping bag rated minus 20 (or minus 10 plus liner), closed-cell foam pad plus inflatable pad, dry sleep clothes, hard plastic hot water bottle"], ["Light and safety", "Headlamp, spare batteries kept warm, whistle, hand warmers, small first aid kit, sit pad"], ["Food and water", "Insulated bottle stored upside down, high-fat snacks, spoon and bowl"], ["Do not bring", "Cotton t-shirts, hoodies, jeans, cotton socks, running shoes"]]}], "references": [{"label": "Canadian Red Cross first aid tips", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Frostbite and hypothermia first aid steps in the Canadian standard."}, {"label": "Wikipedia: Hypothermia", "url": "https://en.wikipedia.org/wiki/Hypothermia", "why": "Stages, signs and treatment background for the review in step 3."}, {"label": "Wikipedia: Frostbite", "url": "https://en.wikipedia.org/wiki/Frostbite", "why": "Pictures of the stages so the leader recognizes what white waxy skin looks like."}, {"label": "YouTube search: how to build a quinzee snow shelter", "url": "https://www.youtube.com/results?search_query=how+to+build+a+quinzee+snow+shelter", "why": "A short build video to watch before teaching step 5, or to show on screen."}, {"label": "Scouts Canada: Outdoor Adventure Skills", "url": "https://www.scouts.ca/programs/canadian-path/outdoor-adventure-skills.html", "why": "Winter skills badge requirements for layering, shelters and winter camping."}, {"label": "Bible Gateway: Luke 2:7-12 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Luke+2%3A7-12&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": null, "takeHome": "Lay out your own winter camp layers on your bed using the gear list, remove every cotton item, take a photo, and bring the list with checkmarks to the next meeting; and attend the Nativity liturgy tomorrow night."}, {"n": 16, "date": "2027-01-12", "term": "Winter", "title": "First Aid 2: Wounds, Burns, Fractures", "theme": "Stop the bleeding, cool the burn, splint the break, and carry the casualty out", "sea": false, "calendar": ["Christmas season: the Nativity fast is over; Coptic Christmas was Jan 7. Tonight is not a fast day.", "Theophany (Epiphany) is next Tuesday, Jan 19, with the Paramoun on Jan 18; next week's meeting may be shortened or moved, confirm with the priest.", "Collect any updated medical forms from families for the new term."], "objectives": ["Control severe bleeding with direct pressure and a pressure bandage, and know when a tourniquet is used.", "Give first aid for thermal, chemical and electrical burns, including cooling for 10 to 20 minutes and what never to put on a burn.", "Treat a sprain with RICE and check circulation, sensation and movement before and after any bandage.", "Recognize a fracture, improvise a splint, and tie an arm sling and an elevated sling with a triangular bandage.", "Build a blanket-and-pole stretcher and move a casualty safely as a team with one person in charge."], "materials": [{"item": "Troop first aid kit (gauze pads, roller bandages, adhesive dressings, tape, scissors, tweezers)", "qty": "1", "note": "reusable"}, {"item": "Triangular bandages", "qty": "2 per patrol (10)", "note": "reusable; or cut 1 m squares of cotton diagonally"}, {"item": "Elastic tensor bandages", "qty": "1 per patrol", "note": "sprain wrap"}, {"item": "SAM splint or rolled magazines, newspaper, cardboard strips, sticks", "qty": "1 splint kit per patrol", "note": "improvised splint materials"}, {"item": "Nitrile gloves (non-latex)", "qty": "1 box", "note": "everyone gloves up for the bleeding drill"}, {"item": "Plastic cling wrap", "qty": "1 roll", "note": "burn dressing demo"}, {"item": "Bowl of cool water and a towel", "qty": "1", "note": "burn cooling demo"}, {"item": "Wool or fleece blankets", "qty": "1 per patrol (5)", "note": "stretchers"}, {"item": "Broom handles, hockey sticks or 1.5 m poles", "qty": "2 per patrol (10)", "note": "stretchers; check for splinters"}, {"item": "Duffle bag or backpack weighted to 10 to 15 kg (books, sand)", "qty": "1 per patrol", "note": "the casualty for the relay"}, {"item": "Paper cups of water", "qty": "10", "note": "smooth-carry test"}, {"item": "Chairs, a skipping rope, rolled gym mat, masking tape", "qty": "obstacle course set", "note": ""}, {"item": "Red washable marker or stage make-up", "qty": "1", "note": "optional wounds for realism"}], "prep": ["Read the Canadian Red Cross first aid tips on bleeding, burns and bone and joint injuries (link in references) and review the recovery position from lesson 5.", "Practise tying the arm sling and the elevated sling on a family member until you can do each in under a minute.", "Practise the blanket stretcher fold with two poles and test it with a leader lying on it; make sure the poles are long enough (1.5 m or more).", "Weight five duffle bags to 10 to 15 kg and label them CASUALTY.", "Lay out the obstacle course at one end of the hall: two chairs to zigzag, a skipping rope tied between chair backs at 1 m to duck under, a rolled mat as a log to step over, and a taped finish box 2 m by 1 m.", "Print the first aid summary table, one per patrol.", "Check the troop medical list for latex allergies and asthma."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, announcements (Theophany next week), attendance."}, {"time": "6:25", "min": 40, "what": "Practical: bleeding control, burns, sprains and RICE, fractures with splints and slings, blanket stretcher, moving a casualty."}, {"time": "7:05", "min": 10, "what": "Spiritual: the paralytic lowered by his friends (Luke 5:17-26)."}, {"time": "7:15", "min": 25, "what": "Activity: stretcher-carry obstacle relay with scored first aid at each end."}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Wounds, Burns, Fractures and Carrying a Casualty", "intro": "In October you learned to check the scene, call for help and keep someone breathing. Tonight you learn what to do about the injuries a Sea Scout actually sees: a cut hand from a knife or a fish hook, a burn from a stove or a rope, a twisted ankle on a rocky shore, and a broken wrist from a fall. Then you learn to get that person out, because at camp the ambulance cannot drive to the tent.", "steps": [{"title": "Bleeding control", "min": 8, "detail": "Everyone puts on gloves. Steps for a bleeding wound: expose the wound, place a clean gauze pad or cloth over it and press hard with the flat of your hand, keep pressing for a full 10 minutes without lifting to peek, and if blood soaks through add more pads on top, never remove the first one. Then wrap a roller bandage firmly over the pad to make a pressure bandage and check the fingers or toes beyond it stay pink and warm. If an object such as a fish hook or glass is embedded, do not pull it out; pad around it and bandage over the pads. For life-threatening bleeding from an arm or leg that pressure cannot stop, a tourniquet goes 5 to 8 cm above the wound, not over a joint, tightened until bleeding stops, with the time written on it, and 911 called. Nosebleed: sit, lean forward, pinch the soft part of the nose for 10 to 15 minutes. Practise in pairs: one presses a folded gauze on a partner's forearm, wraps a roller bandage and checks circulation."}, {"title": "Burns", "min": 7, "detail": "Burns are graded by depth. Superficial (first degree): red, painful, no blisters, like sunburn. Partial thickness (second degree): blisters, very painful, wet looking. Full thickness (third degree): white, leathery or charred, may be painless because nerves are destroyed. First aid, demonstrate with the bowl: stop the burning (remove from heat, put out flames with stop-drop-roll), then cool the burn under cool, not icy, running water for at least 10 minutes and up to 20; this is the single most important step and it still helps an hour later. Remove jewellery and loose clothing near the burn but never peel off clothing stuck to the skin. Cover loosely with a clean non-fluffy dressing or plastic cling wrap laid on, not wrapped tight. Never use ice, butter, toothpaste, oil or ointment, and never pop blisters. Call 911 for burns to the face, airway, hands, feet or groin, any burn bigger than the casualty's palm, any full thickness burn, all electrical burns, and chemical burns, which are flushed with running water for 20 minutes or more after brushing off dry powder. Watch for shock: keep the casualty warm, since a big burn loses heat fast."}, {"title": "Sprains and RICE", "min": 5, "detail": "A sprain is a stretched or torn ligament at a joint, usually the ankle; a strain is a pulled muscle. Both are treated with RICE for the first 48 hours. R, rest: stop using it. I, ice: a wrapped ice pack or bag of snow for 20 minutes on, then off for at least 20, never directly on skin. C, compression: an elastic tensor bandage wrapped from the toes upward in overlapping spirals, snug but not tight. E, elevation: raise the ankle above heart level on a pack. Before and after any bandage or splint check CSM: Colour (pink, not white or blue), Sensation (can they feel a touch on the toes), Movement (can they wiggle them); if any fails, loosen the bandage. If the casualty cannot bear weight, the joint looks deformed, or the pain is severe, treat it as a fracture. Practise the tensor wrap on a partner's ankle in the patrol and do the CSM check aloud."}, {"title": "Fractures, splints and slings", "min": 9, "detail": "Signs of a fracture: deformity, swelling, pain, inability to use the limb, or bone through the skin (cover it, never push it back). The rule: splint it where it lies, do not straighten it. A splint must be rigid, padded, and long enough to immobilize the joints above and below the break. Demonstrate on a forearm: lay a rolled magazine or SAM splint under the forearm from elbow to fingertips, pad the gaps with a bandana, tie with two triangular bandages folded into strips above and below the break, never over it, then check CSM. Arm sling: lay the open bandage with one end over the uninjured shoulder and the point at the injured elbow, arm across the chest with the hand a little higher than the elbow, bring the lower end up over the injured shoulder, tie at the side of the neck (never on the spine), and pin the point at the elbow. Elevated sling for a hand or collarbone injury: hand on the opposite shoulder, bandage laid over the arm with the point past the elbow, bottom end tucked under the arm and around the back, tied at the uninjured shoulder. Every scout ties one of each on a partner."}, {"title": "Improvised stretcher", "min": 6, "detail": "Lay a blanket flat. Place one pole across it about one third of the way from one long edge. Fold the short third of the blanket over the pole. Lay the second pole on top of the folded blanket about 40 cm from the first pole, parallel. Fold the remaining large flap of blanket over the second pole so both poles are wrapped. The casualty's weight on the blanket pins the folds so it cannot unwind. Test it: a leader lies on it and four scouts lift 10 cm off the floor for five seconds before anyone trusts it. Other improvisations: two jackets zipped up with the sleeves turned inside and poles pushed through the sleeves; a tarp rolled around poles the same way as the blanket; or a door. Rules: the stretcher is tested before every use, the casualty's head goes at the end that is carried higher going uphill, and the casualty is strapped or held so they cannot roll off. Each patrol builds one and tests it with a leader's weight."}, {"title": "Moving a casualty", "min": 5, "detail": "Move a casualty only if they are in danger (fire, cold water, traffic) or help cannot reach them; a suspected spine injury (fall from height, neck pain, tingling) is not moved unless there is immediate danger. One person is the head, in charge, at the casualty's head, and gives every command. Loading: log-roll the casualty as a unit onto the stretcher, three people on one side keeping head, shoulders and hips in line. Lifting: carriers crouch with straight backs, grip the poles, and the head calls Ready, lift on three: one, two, three, then Ready, walk on three. Carry feet first on flat ground so the casualty can see where they are going, head first uphill, and keep the stretcher level. Lowering uses the same count. For short emergency moves without a stretcher: the clothes drag (grip the collar, protect the head with your forearms, drag in a straight line), the blanket drag, and the two-person four-hand seat for a conscious casualty who can hold on. Practise the commands with the empty stretcher in each patrol."}], "tips": ["Keep it hands-on: every step has a partner drill, and scouts remember what their hands did.", "Use the phrase press, pad, wrap for bleeding and cool, cover, call for burns.", "Common sling mistake: knot on the spine or hand lower than the elbow; check both.", "Have the smallest scouts act as casualties for slings and splints, and a leader for the stretcher test.", "Praise loud clear commands during the stretcher drill; a quiet team leader drops casualties."], "safety": ["No real cutting, burning or ice; all injuries are pretend. Washable marker only for wounds.", "Gloves for everyone during the bleeding drill; check for latex allergy and use nitrile.", "Scouts do not carry each other in the relay; the casualty is the weighted duffle. Any live casualty demonstration uses a leader on the stretcher with at least four carriers and a fifth spotter, lifted no higher than knee height.", "Check poles for splinters and tape any rough ends; no hockey sticks with blades.", "Lift with legs, backs straight; anyone with a back problem judges instead of carrying."]}, "spiritual": {"title": "Carried by Friends", "ref": "Luke 5:17-26", "verse": "And when they could not find how they might bring him in, because of the crowd, they went up on the housetop and let him down with his bed through the tiling into the midst before Jesus. When He saw their faith, He said to him, \"Man, your sins are forgiven you.", "url": "https://www.biblegateway.com/passage/?search=Luke+5%3A17-26&version=NKJV", "message": "Tonight you built a stretcher and learned that it takes four people, working together on one command, to carry one person to safety. The Gospel gives us the first stretcher team. A paralyzed man could not reach Jesus, so four friends carried him on his bed. When the crowd blocked the door they did not give up; they climbed onto the roof, opened the tiles and lowered him down. Notice what Luke says next: when Jesus saw THEIR faith, He forgave the man's sins and then healed his legs. The man was carried by the faith of his friends. Our Church teaches that this is exactly what the Church is: a hospital, and we are the stretcher-bearers for each other. When a friend is too weak to pray, you pray for him. When someone has fallen, you do not lecture him, you carry him to Christ, to confession, to the Liturgy, to the priest. St. Mark brought the Gospel to Egypt and Egypt carried it to the world the same way, one person bringing another. In first aid the rule is that you never move a casualty alone; in the spiritual life it is the same. Who is on your stretcher this week? And who is carrying you?", "discussion": ["The four friends could not get through the door, so they went through the roof. What obstacle stops you from bringing a friend to Christ, and what is your roof?", "Jesus forgave sins before He healed legs. Why do you think He did it in that order?", "Who has carried you in a hard time, and have you thanked them?"], "prayer": "Lord Jesus, Physician of our souls and bodies, You healed the paralytic because his friends carried him to You. Make us faithful stretcher-bearers for one another, give our hands skill to help the injured, and carry us when we cannot walk. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Stretcher-Carry Obstacle Relay", "setup": "Each patrol has a blanket, two poles, a weighted duffle casualty, a triangular bandage, a roller bandage and a gauze pad at the start line. The course runs 20 m: zigzag around two chairs, duck under the skipping rope at 1 m, step over the rolled mat log, and finish inside the taped box, then return by the same route. A leader is the casualty judge at the start with the scoresheet; a second leader times.", "materials": ["5 blankets and 10 poles", "5 weighted duffle bags (10 to 15 kg)", "Triangular and roller bandages, gauze", "Paper cups of water", "Obstacle course: chairs, skipping rope, rolled mat, tape", "Stopwatch and scoresheet"], "rules": ["On Go, the patrol first performs the first aid the judge names on the duffle, treating it as a casualty: round 1 a bleeding forearm (pad, press, pressure bandage) and round 2 a broken forearm (splint with two ties and an arm sling on the bag's strap). The judge signs off before the stretcher may be built; a wrong step means fix it first.", "Build the blanket-and-pole stretcher correctly (the judge checks the fold), load the casualty, and place a full paper cup of water on top of the casualty.", "Four carriers lift on the team leader's count and carry the casualty through the course and back. The remaining scouts walk alongside as spotters and may swap in with a carrier only when the stretcher is on the floor.", "The stretcher must be set down on the floor, with a count, before ducking under the rope and lifted again after; carrying it under at knee height is allowed only if all four carriers crouch together.", "Time stops when the stretcher is lowered inside the taped box at the start. Penalties: casualty slides or falls off 30 s; cup spilled more than half 15 s; a carrier runs 10 s; no verbal count on a lift or lower 10 s; touching an obstacle 5 s.", "Scoring: fastest adjusted time 10 points, then 8, 6, 4, 2. Plus 5 points if the judge saw a correct first aid treatment on the first attempt, 3 if fixed once. Plus 3 points for a stretcher that passed the fold check first time.", "Run two rounds (bleeding, then fracture) with different carriers. Highest total wins the title Stretcher Party."], "variations": ["Easier: no cup of water and a straight 15 m course.", "Harder: carriers wear mitts to simulate winter, or the team leader is blindfolded and must run the lift by voice alone; add a leg splint stage using a rolled blanket between the legs.", "Short on time: one round only, fracture stage, course one way."]}, "tables": [{"caption": "First aid quick reference", "headers": ["Injury", "Do", "Do not", "Call 911 when"], "rows": [["Severe bleeding", "Gloves, pad, direct pressure 10 min, add pads, pressure bandage, check CSM", "Lift the pad to look, remove embedded objects", "Bleeding does not stop, spurting, embedded object, signs of shock"], ["Burn", "Cool under cool running water 10 to 20 min, remove jewellery, cover loosely with clean dressing or cling wrap", "Ice, butter, toothpaste, ointments, pop blisters, remove stuck clothing", "Face, airway, hands, feet, groin, larger than the palm, full thickness, electrical, chemical"], ["Sprain or strain", "Rest, Ice 20 min on and off, Compression with tensor, Elevation; check CSM", "Ice on bare skin, tight wrap, keep playing", "Cannot bear weight, deformity, severe pain"], ["Fracture", "Splint in position found, joint above and below, pad, tie above and below the break, sling, check CSM", "Straighten the limb, push bone back in, move a suspected spine injury", "Always for open fractures, thigh, hip, spine, head or if far from help"], ["Moving a casualty", "Only if in danger; one leader gives the count; log-roll; test the stretcher; feet first on flat ground", "Move a suspected spine injury without danger, lift with a bent back", "Any casualty who cannot walk"]]}], "references": [{"label": "Canadian Red Cross first aid tips", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Canadian standard steps for bleeding, burns, sprains and fractures used in this lesson."}, {"label": "Wikipedia: Recovery position", "url": "https://en.wikipedia.org/wiki/Recovery_position", "why": "Quick review of lesson 5 for a casualty who becomes unconscious."}, {"label": "Wikipedia: Triangular bandage", "url": "https://en.wikipedia.org/wiki/Triangular_bandage", "why": "Diagrams of the arm sling and elevated sling folds."}, {"label": "YouTube search: how to make a blanket and pole stretcher", "url": "https://www.youtube.com/results?search_query=how+to+make+improvised+blanket+pole+stretcher+first+aid", "why": "Two-minute demonstration of the blanket fold to watch before the meeting."}, {"label": "YouTube search: how to tie an arm sling triangular bandage", "url": "https://www.youtube.com/results?search_query=how+to+tie+an+arm+sling+triangular+bandage", "why": "Step-by-step sling video for the leader's practice."}, {"label": "Bible Gateway: Luke 5:17-26 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Luke+5%3A17-26&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": null, "takeHome": "Find the first aid kit at home, check that it has gauze, a roller bandage and a triangular bandage, tell your parents where the nearest burn treatment is (cool running water for 10 to 20 minutes), and teach one person the arm sling."}, {"n": 17, "date": "2027-01-19", "term": "Winter", "title": "Water & the Environment", "theme": "Where our water comes from, how to test it, how to protect it, and how to filter it", "sea": true, "calendar": ["Today is the Feast of Theophany (Epiphany), Jan 19: the baptism of Christ and the Laqqan, the blessing of the water. The Paramoun was yesterday and the Theophany liturgy is usually the evening of Jan 18 or the morning of Jan 19. Confirm with the priest whether the meeting runs, is shortened, or joins the church celebration.", "Theophany is a major feast; no fasting today. A simple snack is fine.", "Snow and ice are on the ground: remind scouts that road salt and melting snow carry pollution into local creeks and the Great Lakes."], "objectives": ["Define a watershed, name the five Great Lakes and trace where water from your neighbourhood goes.", "Describe the water cycle (evaporation, transpiration, condensation, precipitation, runoff, infiltration).", "Test water for turbidity, pH and temperature with simple tools and say what the results mean for fish.", "Recite the seven Leave No Trace principles with one example each.", "Explain how plastic reaches the lakes and how to make water safe to drink (filter, then boil or treat)."], "materials": [{"item": "Empty 2 L plastic bottles, cut in half by a leader", "qty": "1 per patrol (5) plus 2 spare", "note": "ask families to save them"}, {"item": "Aquarium gravel, coarse sand, fine sand, activated charcoal (aquarium filter carbon)", "qty": "500 mL of each per patrol", "note": "pet store and hardware store; reusable if rinsed"}, {"item": "Coffee filters, cotton cloth squares, cheesecloth, cotton balls, elastic bands", "qty": "3 filters, 2 cloths, 5 cotton balls, 3 elastics per patrol", "note": ""}, {"item": "Muddy water: 5 L of tap water mixed with 500 mL of garden soil and a handful of leaves", "qty": "1 bucket", "note": "mix at the meeting"}, {"item": "Clear plastic cups and clear jars", "qty": "4 cups, 2 jars per patrol", "note": "before and after samples"}, {"item": "pH test strips (aquarium or pool strips)", "qty": "1 pack (50 strips)", "note": "dollar store or pet store"}, {"item": "Test samples in labelled jars: tap water, tap water with 15 mL vinegar, tap water with 5 mL baking soda, tap water with 15 mL salt, muddy water", "qty": "1 set", "note": "for the pH and turbidity station"}, {"item": "Digital or aquarium thermometer", "qty": "1", "note": ""}, {"item": "Printed turbidity card: a page of text in three sizes to read through the sample", "qty": "1 per patrol", "note": "see step 3"}, {"item": "Map of the Great Lakes and Ontario watersheds (drawn on flip chart or printed from Wikipedia)", "qty": "1 large", "note": ""}, {"item": "Leave No Trace principle cards, 7 cards with the principle on one side and an example on the back", "qty": "1 set per patrol", "note": "from the table below"}, {"item": "Tarps, towels, paper towel, garbage bags, funnel", "qty": "1 set", "note": "the floor will get wet"}], "prep": ["Read the Wikipedia Great Lakes article and the Leave No Trace Canada principles page (links in references), and watch one video from the YouTube search on building a bottle water filter.", "Cut the bottles: remove the bottom third; the top (neck) section inverted becomes the filter, the bottom section the collection cup. Tape any sharp edges.", "Build one filter at home to learn the layer order and how long it takes to run (a slow filter can take 5 minutes for 500 mL).", "Make the five labelled test jars and check the pH strips on them so you know the expected colours.", "Draw the Great Lakes on the flip chart with the outlet to the St. Lawrence and mark your church's town; find which creek or river near the church drains toward Lake Ontario (or your lake).", "Print the turbidity cards (a paragraph of text in 18, 14 and 10 point) and the LNT cards.", "Lay tarps under the filter tables and put the muddy water bucket on a tarp with a ladle."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in, Scout Promise, Lord's Prayer, Theophany greeting, attendance."}, {"time": "6:25", "min": 40, "what": "Practical: watersheds and the Great Lakes, water cycle, water quality tests, Leave No Trace, plastics, making water safe."}, {"time": "7:05", "min": 10, "what": "Spiritual: the baptism of Christ (Matthew 3:13-17), Theophany and the blessing of water."}, {"time": "7:15", "min": 25, "what": "Activity: build a bottle water filter; clearest water wins."}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Guardians of the Water", "intro": "Sea Scouts live on the water, so we are the first people who should understand it and protect it. Ontario sits beside the largest system of fresh water on the planet, and every drop that hits your driveway ends up in it. Tonight, on the feast when the Church blesses the water, you learn where water comes from, how to tell if it is healthy, how to leave a campsite cleaner than you found it, and how to turn muddy water into clear water.", "steps": [{"title": "Watersheds and the Great Lakes", "min": 8, "detail": "A watershed is all the land that drains to one river, lake or bay; think of a bathtub, where every drop on the sides ends up at the drain. Show the flip chart. Ontario has two giant drains: most of southern Ontario drains to the Great Lakes and then down the St. Lawrence River to the Atlantic, while northern Ontario drains to Hudson Bay. Name the five lakes with the memory word HOMES: Huron, Ontario, Michigan, Erie, Superior; from west to east the water flows Superior, Michigan and Huron (joined), Erie, over Niagara Falls, Ontario, and out. Superior is the largest and deepest, Erie the shallowest and warmest, Ontario the smallest by area, and Michigan the only one entirely in the USA. Together they hold about one fifth of the world's fresh surface water, and more than 40 million people drink from them. Trace on the map from your church's storm drain to the local creek to the lake, then ask: what did you pour down that drain this week? Everything that goes down a storm drain is untreated."}, {"title": "The water cycle", "min": 5, "detail": "Draw the cycle as a loop and have scouts call the steps. The sun heats lakes and the ocean and water EVAPORATES as vapour; trees and plants release water too, called TRANSPIRATION. The vapour rises, cools and CONDENSES into clouds (last term's cloud lesson). Clouds drop PRECIPITATION as rain or snow. On the ground the water either RUNS OFF over the surface into creeks, carrying whatever is on the surface with it, or INFILTRATES into the soil to become groundwater, which feeds wells and springs and slowly returns to the lakes. Point out two Ontario facts: snow is stored water, so a spring melt is the biggest runoff event of the year and carries a winter's worth of road salt and dog waste into the creeks; and the same water has been cycling since creation, so the water in your cup has been a cloud, a glacier and possibly the Jordan River."}, {"title": "Testing water quality", "min": 9, "detail": "Set the five labelled jars on a table and run three tests as a demonstration with scouts doing the hands-on parts. TURBIDITY, the cloudiness: hold the turbidity card behind a clear cup of each sample and record the smallest text size you can read through it; a scientist uses a Secchi disk lowered into the lake until it disappears. Cloudy water blocks sunlight, clogs fish gills and warms faster. PH: dip a strip for two seconds, wait, and match the colour. Pure water is 7; healthy Ontario lakes are 6.5 to 8.5; the vinegar jar will read about 3 (acid rain is below 5.6 and kills fish eggs); the baking soda jar will read about 8.5. TEMPERATURE: cold water holds more dissolved oxygen, which is why trout need cold streams and warm shallow water in August can suffocate fish. The salt jar looks clear but tastes wrong: road salt is invisible pollution that scientists measure with a conductivity meter. Have each patrol write the three readings for the tap water and the muddy water on a card; they will use the same turbidity card to judge their filters."}, {"title": "Leave No Trace: the seven principles", "min": 8, "detail": "Give each patrol the seven cards and two minutes to put them in order and think of a camp example, then go through them. 1, Plan ahead and prepare: know the rules, weather and route, repackage food to reduce garbage. 2, Travel and camp on durable surfaces: stay on trails, camp on rock, gravel or existing sites, at least 60 m from water. 3, Dispose of waste properly: pack it in, pack it out, including orange peels; use outhouses or dig a cathole 15 to 20 cm deep and 60 m from water; strain dishwater and scatter it. 4, Leave what you find: no carving, no taking rocks, plants or artifacts. 5, Minimize campfire impacts: use a stove or an existing fire ring, keep fires small, burn only dead wood from the ground, put it out cold to the touch. 6, Respect wildlife: observe from a distance, never feed, store food in a bear hang or barrel. 7, Be considerate of other visitors: keep noise down, let others pass, keep pets controlled. Quiz: which principle protects the water most directly? (Number 3, and camping 60 m away in number 2.)"}, {"title": "Plastics in our waterways", "min": 5, "detail": "Hold up a plastic bottle. Scientists estimate that roughly 10,000 tonnes of plastic enter the Great Lakes every year, and most of it does not float where you can see it; it breaks into microplastics smaller than a grain of rice that fish, birds and eventually people swallow. The main sources are litter that washes down storm drains, bags and bottles blown from bins, cigarette filters, and tiny fibres shed from fleece in the washing machine. A plastic bottle takes centuries to break down. What a Sea Scout does: refuse single-use plastic (bring a reusable bottle to every meeting), reduce, reuse, recycle correctly (rinse and check the local rules), and remove, which means shoreline cleanups; the troop can join one in the spring through the Great Canadian Shoreline Cleanup. Fishing line and balloons are especially deadly to birds and turtles; cut line into short pieces before binning it."}, {"title": "Making water safe to drink", "min": 5, "detail": "Set expectations before the activity: the bottle filter you are about to build removes mud, leaves and colour, but NOT bacteria, viruses or parasites like Giardia (beaver fever), so filtered water is still not safe to drink. In the backcountry the order is: collect from the cleanest source (moving water, away from shore), pre-filter through cloth to remove sediment, then disinfect by one of three methods: boil at a rolling boil for one minute (Health Canada guidance; longer at high altitude); use a certified backpacking filter or purifier rated for bacteria and protozoa, following the manufacturer's instructions; or add water treatment tablets or drops and wait the full time on the label, usually 30 minutes, longer for cold water. Sunlight UV in a clear bottle for six hours is a survival backup. Never drink untreated lake water at camp, no matter how clear it looks; clear does not mean clean, as the salt jar proved."}], "tips": ["Let scouts pour, dip and read the strips themselves; the leader only records.", "Common mistake in the filter: fine material at the bottom and gravel on top is backwards; gravel goes on top to catch big bits first, fine sand and charcoal near the neck.", "For the storm drain question, walk to a window and point at the nearest drain in the parking lot.", "Keep the LNT step fast and competitive; the cards do the teaching.", "Tie the whole lesson back to Theophany: the Church blesses water because it is holy; scouts protect it because it is holy."], "safety": ["Nobody drinks any water in this lesson, filtered or not; label the collection cups DO NOT DRINK.", "A leader cuts the bottles; scouts handle only taped edges.", "Tarps on the floor, towels ready; wipe spills at once to prevent slips.", "pH strips and charcoal are non-toxic but not for mouths; wash hands after the activity.", "Vinegar sample: keep away from eyes."]}, "spiritual": {"title": "Theophany: The Water Made Holy", "ref": "Matthew 3:13-17", "verse": "When He had been baptized, Jesus came up immediately from the water; and behold, the heavens were opened to Him, and He saw the Spirit of God descending like a dove and alighting upon Him. And suddenly a voice came from heaven, saying, \"This is My beloved Son, in whom I am well pleased.", "url": "https://www.biblegateway.com/passage/?search=Matthew+3%3A13-17&version=NKJV", "message": "Today is Theophany, the day Christ went down into the Jordan River to be baptized by John. He had no sin to wash away; John himself said so. So why did He go into the water? The Fathers of our Church say He went in to bless the water, to make it holy for our baptism. That is why, at the Laqqan tonight or last night, the priest blessed a basin of water and the people were sprinkled with it and took it home. Tonight you learned that water cycles endlessly; the same water that was in the Jordan when the heavens opened is still moving through clouds and lakes. You also learned that clear water is not always clean, and that a filter takes out the mud but cannot make water safe. Baptism is the filter that goes deeper: it removes what no test strip can see. Each of us was lowered three times into blessed water as a baby and came up a new person, with the same voice from heaven saying, This is My beloved child. A Sea Scout protects the water because God made it and Christ sanctified it. And a Christian protects his baptism the same way: keep it clean, keep it moving, and remember whose voice named you.", "discussion": ["Why do you think Jesus, who had no sin, chose to be baptized?", "Filtered water can look clean but still be unsafe. What in your life looks fine on the outside but needs deeper cleaning?", "If the water is holy because Christ blessed it, how should that change the way you treat a creek, a lake or even a tap?"], "prayer": "Lord Jesus Christ, You went down into the Jordan and sanctified the waters for our salvation. Renew in us the grace of our baptism, make us faithful guardians of the water You created, and let us hear the Father's voice calling us His beloved children. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Bottle Water Filter Challenge", "setup": "Each patrol at a table on a tarp with the cut bottle (neck section inverted into the base section), the layer materials, cloth, elastics, two clear cups and a turbidity card. The muddy water bucket sits on a central tarp with a ladle and a measuring cup; a leader serves exactly 500 mL to each patrol. A judge with the turbidity card, a stopwatch and the scoresheet sits at the front.", "materials": ["Cut 2 L bottles", "Gravel, coarse sand, fine sand, activated charcoal", "Coffee filters, cloth, cotton balls, elastics", "Muddy water, measuring cup, ladle", "Clear cups, turbidity cards", "Stopwatch, scoresheet, towels"], "rules": ["Patrols have 8 minutes to design and build their filter. Suggested order from the neck upward: cotton balls or a coffee filter pushed into the neck and secured with cloth and an elastic over the mouth, then 3 cm activated charcoal, 4 cm fine sand, 4 cm coarse sand, and 4 cm gravel on top. Patrols may change the order and thicknesses; that is the experiment.", "Before pouring, the patrol must run 250 mL of clean tap water through to rinse the charcoal dust out, discarding it. The judge checks that the collection cup is labelled DO NOT DRINK.", "On the judge's Go, each patrol pours its 500 mL of muddy water slowly into the top. Timing starts at the first pour and stops when dripping stops or at 6 minutes, whichever comes first.", "The judge collects a clear cup from each patrol and tests it against the turbidity card: reads the 10 point text: 10 points; reads 14 point: 7 points; reads 18 point: 4 points; cannot read any: 1 point. Same card, same light, same distance for all.", "Volume recovered, measured in the cup: over 350 mL: 3 points; 250 to 350: 2 points; under 250: 1 point.", "Speed: the first patrol to finish dripping earns 2 points, the second 1.", "Design explanation: the patrol presenter has 30 seconds to explain why they ordered the layers as they did; the judge awards up to 3 points for a correct explanation (big particles first, charcoal removes colour and smell, fine layers last).", "Bonus question worth 2 points: Is this water safe to drink, and what would you do next? (No; boil for one minute or treat.) Highest total, maximum 20, wins the title Water Guardians. Everyone rinses gravel and sand for reuse and packs the tarp."], "variations": ["Easier: give every patrol the same fixed layer order and score only clarity and volume.", "Harder: allow a second run of the same water back through the filter and score the improvement, or restrict each patrol to only three materials.", "Short on time: build in 5 minutes with the suggested order, one pour, clarity score only."]}, "tables": [{"caption": "Leave No Trace: seven principles with camp examples", "headers": ["Principle", "Camp example"], "rows": [["1. Plan ahead and prepare", "Check the forecast, know the rules, repackage food into reusable containers to cut garbage"], ["2. Travel and camp on durable surfaces", "Stay on the trail, camp on rock or existing sites at least 60 m from water"], ["3. Dispose of waste properly", "Pack it in, pack it out; cathole 15 to 20 cm deep and 60 m from water; strain dishwater"], ["4. Leave what you find", "No carving trees, no collecting rocks, shells or plants"], ["5. Minimize campfire impacts", "Use a stove or existing fire ring, small fire, dead wood only, out cold"], ["6. Respect wildlife", "Watch from a distance, never feed, bear hang or barrel for food"], ["7. Be considerate of other visitors", "Quiet after dark, yield the trail, control pets"]]}, {"caption": "Simple water quality readings and what they mean", "headers": ["Test", "Healthy range", "What a bad reading means"], "rows": [["Turbidity (cloudiness)", "Can read fine print through the sample; Secchi depth over 2 m in a lake", "Silt from erosion or runoff; blocks light, clogs gills, warms water"], ["pH", "6.5 to 8.5", "Below 6: acid rain or mine runoff, fish eggs die; above 9: algae or pollution"], ["Temperature", "Cold streams under 20 degrees C for trout", "Warm water holds less oxygen; fish kills in August shallows"], ["Dissolved oxygen (concept)", "High in cold moving water", "Low oxygen from warmth, algae or sewage suffocates fish"], ["Conductivity (concept)", "Low in clean fresh water", "Road salt and fertilizer raise it; invisible in the cup"]]}], "references": [{"label": "Wikipedia: Great Lakes", "url": "https://en.wikipedia.org/wiki/Great_Lakes", "why": "Facts and a map for the flip chart: sizes, flow order and share of the world's fresh water."}, {"label": "Leave No Trace Canada", "url": "https://www.leavenotrace.ca/", "why": "The official seven principles with Canadian examples to print for the cards."}, {"label": "Wikipedia: Water cycle", "url": "https://en.wikipedia.org/wiki/Water_cycle", "why": "Diagram of the cycle for step 2."}, {"label": "Invasive species Ontario", "url": "https://www.invadingspecies.com/", "why": "Background on how pollution and invaders threaten Ontario lakes; links to the spring conservation lesson."}, {"label": "YouTube search: DIY water filter plastic bottle sand gravel charcoal", "url": "https://www.youtube.com/results?search_query=diy+water+filter+plastic+bottle+sand+gravel+charcoal+science", "why": "Watch a build to learn layer order and how fast the water runs."}, {"label": "Bible Gateway: Matthew 3:13-17 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+3%3A13-17&version=NKJV", "why": "Full passage for the spiritual lesson."}], "visual": null, "takeHome": "Find the storm drain nearest your house, figure out which creek and lake it drains to, and go one full week without a single-use plastic bottle; report both at the next meeting."}, {"n": 18, "date": "2027-01-26", "term": "Winter", "title": "Science of Ships: Buoyancy & Stability", "theme": "Why a steel ship floats, why a canoe tips, and how sailors keep the weight low", "sea": true, "calendar": ["Ordinary week in the Coptic calendar (Theophany was Jan 19). Tuesday is not a fast day, though no food is planned tonight.", "Jonah's fast is coming Feb 22-24; tonight's spiritual lesson starts the story of Jonah, which the Church reads during that fast.", "Reminder for parents: winter camp gear list from Lesson 15 is due back with names filled in."], "objectives": ["Explain Archimedes' principle in one sentence and show it with a basin of water and a lump of clay.", "Define displacement, freeboard, centre of gravity, centre of buoyancy and ballast, and point to each on a sketch of a boat.", "Explain why a boat rights itself when the centre of buoyancy moves outboard of the centre of gravity, and why it capsizes when it does not.", "Read a load line (Plimsoll mark) and a Canadian capacity plate and say why overloading a boat is dangerous.", "Apply the ideas by designing a clay cargo boat that carries the most marbles."], "materials": [{"item": "Clear plastic storage tubs, about 20 L, half filled with water", "qty": "2", "note": "set on tables lined with towels; dollar store"}, {"item": "Modelling clay (plasticine, non-drying)", "qty": "150 g per patrol plus 200 g for demos (about 1 kg total)", "note": "reusable; craft store; weigh portions in advance"}, {"item": "Glass marbles, standard 16 mm", "qty": "150 (about 3 bags)", "note": "reusable; choking hazard, keep away from small siblings"}, {"item": "Kitchen scale", "qty": "1", "note": "to give each patrol exa
