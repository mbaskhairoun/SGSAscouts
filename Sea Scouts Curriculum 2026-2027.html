rl": "https://www.copticreader.com/", "why": "The Agpeya hours on a phone for the take-home Psalm reading"}], "visual": "compass-rose", "takeHome": "At home, find which wall of your bedroom faces north (use a phone compass if you have no real one), then read one Psalm from the Agpeya each night facing east, the way the Church prays."}, {"n": 5, "date": "2026-10-13", "term": "Fall", "title": "First Aid 1: Life-Saving Basics", "theme": "Check, Call, Care: what to do in the first three minutes of an emergency", "sea": false, "calendar": ["Thanksgiving was yesterday, Monday Oct 12. Open with a quick round: each scout names one thing they are thankful for.", "Note for leaders: this lesson teaches awareness and basic steps. It is not a certification. Encourage scouts to take a Red Cross or St. John Ambulance course; many are open at age 12."], "objectives": ["By the end scouts can explain Check, Call, Care and give the four things to tell a 911 operator.", "By the end scouts can place a partner in the recovery position.", "By the end scouts can perform back blows and abdominal thrusts on a partner (simulated, no force) for choking.", "By the end scouts can show correct hand position, depth and rate for hands-only CPR and describe what an AED does."], "materials": [{"item": "CPR manikin (borrow from a leader, the church, or a local lifeguard)", "qty": "1 or 2", "note": "if none, use firm pillows or a folded sleeping bag per patrol"}, {"item": "Firm pillows or rolled towels for chest compression practice", "qty": "1 per patrol", "note": "from leaders' homes"}, {"item": "AED trainer or a printed picture of an AED with pads placement", "qty": "1", "note": "ask the church where its real AED is located and show scouts"}, {"item": "Gym mats or blankets for the floor", "qty": "5", "note": "recovery position practice"}, {"item": "Scenario cards for the activity stations", "qty": "5", "note": "written in advance, see activity"}, {"item": "Fake wound stickers or red marker, and a roll of gauze", "qty": "1 kit", "note": "optional, makes casualties fun"}, {"item": "Troop first aid kit", "qty": "1", "note": "show scouts where it lives at every meeting"}, {"item": "Speaker or phone to play a 100 to 120 beats per minute song", "qty": "1", "note": "for CPR rhythm"}], "prep": ["Watch a current Red Cross hands-only CPR video and a choking video the night before so your demonstration matches current Canadian guidance.", "Find the church's AED and note its location. If the church has none, print a photo and pad diagram.", "Write the 5 scenario cards for the activity and brief one leader or older scout per station as the casualty and judge.", "Lay out mats in 5 patrol areas with a pillow at each.", "Cue a 100 to 120 bpm song (search 'CPR songs 100 bpm' for a playlist; Stayin' Alive is the classic)."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance, Thanksgiving round"}, {"time": "6:25", "min": 40, "what": "Practical: scene safety and check, calling 911, recovery position, choking, hands-only CPR, AED"}, {"time": "7:05", "min": 10, "what": "Spiritual: the Good Samaritan (Luke 10:30-37)"}, {"time": "7:15", "min": 25, "what": "Activity: first aid scenario stations with scoring"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "The First Three Minutes", "intro": "Say: In an emergency the ambulance takes about eight minutes in the city and much longer at camp or on the water. What you do in the first three minutes decides whether someone lives. You do not need to be a doctor. You need to know a few steps and have the courage to start. Tonight you learn Check, Call, Care, and three skills that save lives.", "steps": [{"title": "Scene safety and Check", "min": 6, "detail": "The first rule is that you do not become the second casualty. Before touching anyone, Check the scene: is there traffic, fire, electrical wires, deep water, ice, an aggressive person? If it is not safe, do not go in; call 911 and keep others back. Then Check the person. Tap their shoulders firmly and shout 'Are you okay?' If they answer, they are breathing and have a pulse; ask what happened. If they do not respond, look at the chest for 5 to 10 seconds to see if it rises and falls normally. Gasping is not normal breathing. Demonstrate on a leader lying on a mat: check scene, tap and shout, look at the chest. Then scouts practise in pairs, saying each step out loud. Teach the word 'consent': if the person is awake, tell them your name and ask if you can help. Also, put on gloves from the first aid kit if there is blood. Show the gloves in the troop kit."}, {"title": "Call: how to talk to 911", "min": 6, "detail": "If the person is unresponsive, or badly hurt, Call 911 right away, or point at one specific person and say 'You, in the red shirt, call 911 and come back and tell me what they said.' Pointing at one person matters, because a crowd assumes someone else will call. Put the phone on speaker so your hands are free. Tell the operator, in this order: where you are (address, or the nearest intersection, campsite name, or the lake and landmark), what happened, how many people are hurt, and their condition (awake or not, breathing or not, bleeding). Then answer questions and do not hang up until they tell you to; they will coach you through CPR. In Ontario 911 works from any cell phone, even without a plan. At camp, know the site address before an emergency; it is usually posted at the office. Practise: pairs role play a call, one as the operator asking the four questions, one as the caller. Swap. Explain that from a boat you would use a VHF radio on channel 16, which we learn in February."}, {"title": "Recovery position", "min": 7, "detail": "If a person is unresponsive but breathing normally, put them on their side so their tongue and any vomit cannot block the airway. Demonstrate on a leader, then patrols practise on mats with a partner. Step 1: kneel beside the person. Step 2: take the arm nearest to you and place it straight out at a right angle, elbow bent, palm up, like waving. Step 3: take the far arm, bring it across the chest, and hold the back of that hand against the cheek nearest you. Step 4: with your other hand, bend the far knee up so the foot is flat on the floor. Step 5: keeping the hand pressed to the cheek, pull on the far knee to roll the person toward you onto their side. Step 6: tilt the head back slightly so the airway stays open, and check that the top knee is bent to stop them rolling further. Step 7: keep checking breathing every minute until help arrives. Every scout must both do it and be the casualty."}, {"title": "Choking: back blows and abdominal thrusts", "min": 8, "detail": "Someone who is coughing hard is still breathing; encourage them to keep coughing and do nothing else. If they cannot cough, speak, or breathe, and grab their throat, act now. Step 1: ask 'Are you choking? Can I help?' Step 2: stand slightly behind and to the side, support their chest with one hand, lean them forward, and give 5 sharp back blows between the shoulder blades with the heel of your hand. Step 3: if still choking, stand behind them, wrap your arms around the waist, make a fist and put the thumb side just above the belly button and below the ribs, grab the fist with your other hand, and pull sharply inward and upward, 5 times. Step 4: alternate 5 back blows and 5 abdominal thrusts until the object comes out or the person collapses. If they collapse, call 911 and start CPR. Practise in pairs with ZERO force: hands in the right places only, saying the steps. For a pregnant person or someone very large, thrusts go on the chest instead. If you are alone and choking, push your own belly over a chair back."}, {"title": "Hands-only CPR", "min": 9, "detail": "If a person is unresponsive and not breathing normally, their heart has likely stopped. CPR pushes blood to the brain until a shock can restart the heart. Demonstrate on the manikin, then each patrol practises on the manikin or a firm pillow. Step 1: kneel beside the chest. Step 2: put the heel of one hand in the centre of the chest, on the lower half of the breastbone, and the other hand on top with fingers laced. Step 3: straighten your arms, lock your elbows, and get your shoulders directly over your hands. Step 4: push hard and fast: at least 5 cm (2 inches) deep, at 100 to 120 pushes per minute, and let the chest come all the way back up between pushes. Step 5: do not stop until an AED arrives, the person moves, or a paramedic takes over. If you get tired, switch with someone every 2 minutes. Play the song and have everyone push to the beat for one full minute on their pillow. It is exhausting; that is the point. Rescue breaths are taught in a full course; hands-only is what we teach tonight."}, {"title": "AED overview", "min": 4, "detail": "An AED, automated external defibrillator, is a box that checks the heart and, if needed, gives an electric shock to restart a normal rhythm. They are in arenas, malls, schools, and our church (show where). They are made for untrained people: turn it on and it talks you through every step. Steps: turn it on; bare the chest and wipe it dry; stick one pad on the upper right chest below the collarbone and the other on the lower left side below the armpit, exactly like the picture on the pads; plug in the connector if needed; when it says 'analysing,' make sure nobody touches the person; if it says 'shock advised,' shout 'Clear' and press the flashing button; then start CPR again immediately. Never use it on someone lying in water; pull them onto dry ground first. Ask two scouts to mime the whole sequence on the manikin while a third plays the AED voice."}], "tips": ["Keep demonstrations short and get scouts' hands moving. First aid is learned by doing.", "For CPR on pillows, watch for bent elbows and slow rates. Count out loud with them: 1, 2, 3, 4.", "Some scouts get nervous or giggly around 'dead' casualties. That is normal; a bit of humour is fine, mockery is not.", "The most common recovery position mistake is forgetting to bend the far knee before rolling; the person flops onto their back."], "safety": ["Never do real abdominal thrusts or back blows on a person who is not actually choking. Hands in position only.", "Chest compressions are done only on manikins or pillows, never on a person.", "Check that no scout has a back or neck injury before recovery position practice; they can be the rescuer only.", "Wipe the manikin face with an alcohol wipe between patrols if anyone puts their face near it."]}, "spiritual": {"title": "Go and Do Likewise", "ref": "Luke 10:30-37", "verse": "So which of these three do you think was neighbor to him who fell among the thieves?\" And he said, \"He who showed mercy on him.\" Then Jesus said to him, \"Go and do likewise.", "url": "https://www.biblegateway.com/passage/?search=Luke+10%3A30-37&version=NKJV", "message": "Tonight we learned Check, Call, Care. Jesus told a story about a man beaten and left half dead on the road from Jerusalem to Jericho. A priest walked past. A Levite, a temple helper, walked past. Both were religious, both were busy, both probably had good excuses. Then a Samaritan came, a man the crowd would have despised, and he did exactly what you practised tonight. He checked: he went to him and saw his wounds. He cared: he bandaged them, poured oil and wine, which were the first aid kit of his day. He called for help: he carried him to an inn and paid for his care. The priest and the Levite knew the law of God. The Samaritan did it. Our Church honours St. Luke, who wrote this story, as a physician, and many Coptic saints like St. Abba Kyrillos VI were known for bringing the sick to healing through prayer and practical care together. First aid is loving your neighbour with your hands. The courage to kneel down and start is the hardest part, and it is a spiritual act. Jesus finishes with three words for you: go and do likewise.", "discussion": ["What excuses do we make for walking past someone who needs help, at school or on the street?", "The Samaritan was a stranger and an outsider. Who might we be surprised to be helped by, or to help?", "Would you have the courage to start CPR in front of a crowd? What would make it easier?"], "prayer": "Lord Jesus, You are the Good Samaritan who found us wounded and carried us to safety. Give us eyes that notice, hands that are ready, and hearts that do not walk past. Bless all paramedics, nurses and doctors, and make us merciful neighbours, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Emergency Stations", "setup": "Set up 5 stations around the hall, each with a leader or older scout who acts as the casualty and then scores the patrol. Patrols rotate every 4 minutes on a whistle. Each patrol has a Patrol Leader who must assign roles (who checks, who calls, who cares) out loud within 10 seconds of arriving. Casualties act realistically but do not fight the rescuers.", "materials": ["5 scenario cards", "Mats, pillows, manikin, AED picture", "Fake wound stickers, gauze", "Score sheet per station (out of 10)", "Whistle and timer"], "rules": ["Station 1, Collapsed at the dock: the casualty is unresponsive but breathing. Correct answer: check scene, tap and shout, check breathing, send someone to call 911, recovery position, monitor. 10 points for all steps in order.", "Station 2, Choking at the galley: the casualty clutches their throat and cannot speak. Correct answer: ask 'are you choking,' 5 back blows, 5 abdominal thrusts (positions only, no force), repeat, someone calls 911. Extra 2 points if they say what to do if the casualty collapses.", "Station 3, Not breathing on the trail: casualty unresponsive and not breathing. Correct answer: check scene, tap and shout, call 911 by pointing at a specific person, hands-only CPR on the pillow beside the casualty at the right rate and depth for 1 minute, send for the AED. Judge scores hand position, straight arms, rate.", "Station 4, The 911 call: the casualty has fallen off a ladder and is awake with a painful leg. One scout must make a mock call to the judge, who plays the operator. Score 2 points each for location, what happened, how many, condition, and staying on the line.", "Station 5, Unsafe scene: the casualty lies next to a 'live wire' (a rope on the floor) with a sign saying DOWNED POWER LINE. Correct answer: do NOT approach, keep everyone 10 m back, call 911, wait. Any scout who touches the casualty loses all 10 points for the station.", "Total the 5 station scores per patrol. Highest wins 5 patrol points, second 3, others 1. Announce the scores and the best answer for each station at the end so everyone learns."], "variations": ["Easier: post the correct steps on a card at each station face down; patrols may flip it for a 3 point penalty.", "Harder: add a second casualty at station 3 so the patrol must decide who gets CPR first (the one not breathing).", "Short on time: run 3 stations (1, 2, 3) with rotations of 5 minutes."]}, "tables": [{"caption": "Check, Call, Care summary", "headers": ["Step", "What you do", "Key words"], "rows": [["Check the scene", "Look for danger to you: traffic, fire, wires, water, ice", "If unsafe, do not go in"], ["Check the person", "Tap shoulders, shout, look at chest 5-10 seconds", "Responsive? Breathing normally?"], ["Call", "911 on speaker, or point at one person to call", "Where, what, how many, condition; stay on the line"], ["Care: breathing but unresponsive", "Recovery position, monitor", "Arm out, hand to cheek, knee up, roll, tilt head"], ["Care: choking", "5 back blows, 5 abdominal thrusts, repeat", "Above the navel, inward and upward"], ["Care: not breathing", "Hands-only CPR, get AED", "Centre of chest, 5 cm deep, 100-120 per minute"]]}], "references": [{"label": "Canadian Red Cross first aid tips and resources", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Current Canadian steps for CPR, choking and recovery position; read before teaching"}, {"label": "Wikipedia: Recovery position", "url": "https://en.wikipedia.org/wiki/Recovery_position", "why": "Diagrams of the arm and knee placement"}, {"label": "Wikipedia: Cardiopulmonary resuscitation", "url": "https://en.wikipedia.org/wiki/Cardiopulmonary_resuscitation", "why": "Background on depth, rate and why compressions matter"}, {"label": "YouTube search: hands only CPR Canadian Red Cross", "url": "https://www.youtube.com/results?search_query=hands+only+CPR+Canadian+Red+Cross", "why": "A 2 minute demonstration to play during the CPR step"}, {"label": "Lifesaving Society", "url": "https://www.lifesaving.ca/", "why": "Courses scouts can take after age 12, and water-related first aid"}, {"label": "Luke 10:30-37 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Luke+10%3A30-37&version=NKJV", "why": "The full parable for the spiritual lesson"}], "visual": "recovery-position", "takeHome": "Put a family member in the recovery position at home (gently, on a carpet), write your home address and nearest intersection on a card by the phone, and find out where the nearest AED to your school is."}, {"n": 6, "date": "2026-10-20", "term": "Fall", "title": "Knots 2: Hitches and Lashings", "theme": "Tying rope to things, and tying poles to each other to build something strong", "sea": true, "calendar": ["Confirm Patrol Leaders and Assistants are elected; PLs lead the lashing builds tonight.", "Halloween is next week (Oct 31). Announce that next week's weather lesson has an optional spooky theme; no costumes needed."], "objectives": ["By the end scouts can tie a clove hitch, two half hitches, and a round turn and two half hitches around a post.", "By the end scouts can tie a square lashing that holds two spars at a right angle without slipping.", "By the end each patrol can join spars with lashings to build a small flagpole or tripod that stands up.", "By the end scouts can say which hitch to use for tying a boat to a dock post."], "materials": [{"item": "2 m rope per scout from Knots 1", "qty": "25", "note": "reusable kit"}, {"item": "Lashing cord, 3 mm to 4 mm, cut into 4 m lengths", "qty": "4 per patrol (20)", "note": "sisal or polyester; about $15 for a spool"}, {"item": "Spars: broom handles, 2.5 cm dowels or bamboo poles, 1 m to 1.5 m long", "qty": "4 per patrol (20)", "note": "hardware store dowels about $4 each; reusable all year for pioneering"}, {"item": "Short spars, 40 cm to 60 cm, for chair and ladder rungs", "qty": "4 per patrol", "note": "cut from a longer dowel"}, {"item": "Chairs or a portable coat rack as hitch posts", "qty": "1 per patrol", "note": "hall chairs"}, {"item": "Two 4 L water jugs for the strength test", "qty": "2", "note": "filled"}, {"item": "Printed lashing diagram (Animated Knots screenshot)", "qty": "1 per patrol", "note": "laminate"}], "prep": ["Practise a square lashing yourself until it takes under 3 minutes and does not slip when you twist the spars. Practise the three hitches too.", "Cut and seal all lashing cords. Bundle 4 cords and 4 long spars and 4 short spars per patrol.", "Build a demonstration flagpole (two spars joined with two square lashings at the overlap) before the meeting and leave it at the front.", "Plan strength test rules with the other leaders. A leader, not a scout, applies the weight to any structure.", "Clear a 3 m by 3 m floor space per patrol."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: clove hitch, two half hitches, round turn and two half hitches, square lashing, build a flagpole or tripod"}, {"time": "7:05", "min": 10, "what": "Spiritual: rebuilding the wall together (Nehemiah 4:6)"}, {"time": "7:15", "min": 25, "what": "Activity: patrol chair or ladder lashing challenge with strength test"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Hitches Hold, Lashings Build", "intro": "Say: Last time you tied knots in a rope. Tonight you tie rope to things. A hitch fastens a rope to a post, a ring or a rail, which is how a boat stays at the dock. A lashing fastens two poles together, which is how scouts build towers, bridges, tables and flagpoles in the field with nothing but rope and wood. Tonight you build something that stands.", "steps": [{"title": "Clove hitch", "min": 8, "detail": "The clove hitch is the fastest way to tie a rope to a post and the start of every lashing. Each scout stands at a chair with their rope. Method around a post: Step 1: pass the working end around the chair leg. Step 2: bring it across in front of the standing part, making an X. Step 3: go around the leg a second time, just below the first wrap. Step 4: tuck the working end under the second wrap, right beside the X, so both ends come out from under the crossing pointing in opposite directions. Pull the standing part; the wraps should bite. Second method, for dropping over a post top: make two loops in the rope, both the same way, slide the second loop behind the first, and drop both over the post. Show that a clove hitch can roll loose if the pull changes direction, so aboard a boat it is used for fenders on a rail and to start lashings, but not to hold a boat overnight. Practise both methods five times."}, {"title": "Two half hitches", "min": 6, "detail": "A half hitch is an overhand knot tied around the standing part. Two of them make a knot that grips a post and tightens under load, and it is easy to untie. Step 1: pass the working end around the post. Step 2: bring the working end over the standing part and up through the gap between the rope and the post; that is one half hitch. Step 3: do exactly the same thing again, going the same direction, a little further along the standing part; that is the second half hitch. Step 4: snug both hitches up against the post. Check: the two hitches should look like a clove hitch tied around the standing part instead of around the post. If the second hitch went the opposite way, the knot is a cow hitch and can slip. Use: tying a line to a ring, hanging a tarp, tying off a tent guy line. Practise five times."}, {"title": "Round turn and two half hitches", "min": 6, "detail": "This is the sailor's knot for tying a boat to a dock post or a ring, because the round turn takes the strain while you tie the hitches. Step 1: pass the working end around the post twice, so the rope goes fully around and comes back to the start; that is the round turn. Step 2: tie two half hitches on the standing part exactly as before. Step 3: snug up. Demonstrate why the round turn matters: have one scout pull hard on the standing part while another ties the hitches. With a single pass the rope slips through their hands; with a round turn the friction holds it. This knot can be tied and untied while the rope is under load, which is essential on a dock in wind. It also does not jam. Have pairs practise with one pulling as a 'boat' and one tying. Use: mooring lines, tying a fender, securing a load."}, {"title": "Square lashing", "min": 12, "detail": "Square lashing joins two spars that cross at a right angle. Demonstrate with two spars held by a helper, then each patrol pairs tie one. Step 1: tie a clove hitch on the vertical spar just below where the horizontal spar will cross. Twist the short tail around the standing part so it is out of the way. Step 2: lay the horizontal spar across, on top of the clove hitch. Step 3: wrapping turns. Take the cord over the horizontal spar, behind the vertical, over the horizontal on the other side, behind the vertical again. Pull hard each pass. Do three or four wraps, each one laid outside the previous on the vertical spar and inside on the horizontal, so they do not pile up. Step 4: frapping turns. Now go around between the spars, over the wraps, two or three times, pulling as tight as you can; this tightens everything. Step 5: finish with a clove hitch on the horizontal spar, snug against the wraps, and tuck the tail. Test: grab both spars and try to twist; a good lashing does not move. If it slips, the wraps or frapping were loose."}, {"title": "Build a flagpole or tripod", "min": 8, "detail": "Show the demonstration flagpole: two long spars overlapping by about 40 cm, joined with two square lashings, one at each end of the overlap. Explain that two lashings spaced apart stop the join from bending; one lashing acts as a hinge. Each patrol builds its own extension pole: lay two spars side by side overlapping 40 cm, tie a square lashing at each end of the overlap (the spars are parallel rather than crossing, so wrap around both and frap between them; this is really a form of shear lashing, and it works the same way). Stand the pole up and tie a necker at the top as a flag. If a patrol finishes early, teach the tripod: lay three spars side by side, tie a clove hitch on one outer spar, weave the cord over and under all three spars six or seven times, frap between each pair, finish with a clove hitch, then stand the spars up and spread the legs. Every patrol must have a standing structure before the spiritual lesson."}], "tips": ["Tight is everything in lashing. Tell scouts to pull each wrap 'until the cord squeaks.' Loose wraps cannot be fixed by frapping.", "The most common square lashing error is wrapping in the wrong order (behind the horizontal instead of over). Chant 'over the top, behind the post' with them.", "Two half hitches must go the same direction. Have scouts check the second hitch by comparing it to the first before pulling tight.", "Let PLs run their patrol's build. Leaders coach from behind, not in front."], "safety": ["Spars are carried vertically, never swung. No sword fighting with dowels, or the scout sits out.", "Check dowel ends for splinters before handing them out; sand or tape rough ends.", "No one stands on any structure until a leader has tested it. Leaders apply weight, scouts do not.", "Rope burn and pinched fingers happen during frapping; pull with the whole hand, not two fingers."]}, "spiritual": {"title": "The People Had a Mind to Work", "ref": "Nehemiah 4:6", "verse": "So we built the wall, and the entire wall was joined together up to half its height, for the people had a mind to work.", "url": "https://www.biblegateway.com/passage/?search=Nehemiah+4%3A6&version=NKJV", "message": "Tonight each patrol built something that one scout could not have built alone. Someone held the spars, someone wrapped, someone frapped, someone checked it. That is how the wall of Jerusalem was rebuilt. When Nehemiah came back to a ruined city, he did not build the wall himself. Chapter 3 lists family after family, each one building the section in front of their own house: priests, goldsmiths, perfume makers, even the daughters of one man. Enemies mocked them and said a fox could knock it down. The people kept working, and the wall went up because 'the people had a mind to work.' A lashing works the same way. The wrapping turns hold, but it is the frapping turns, the ones that pull the wraps together, that make it strong. In a patrol, in a church, the frapping is the friendship and the prayer that pulls everyone tight. Our Coptic monasteries were built this way: St. Antony's disciples, St. Pachomius' communities, each brother with a job, all lashed together by a rule of prayer. This week, notice the section of the wall in front of your own house, your family, your class, your patrol, and build it.", "discussion": ["What is the 'section of the wall' in front of your house right now? What needs building or fixing that only you can do?", "The builders were mocked while they worked. How do you keep going when people laugh at you for doing something good?", "Which scout in your patrol was the 'frapping turn' tonight, pulling everyone together? Tell them."], "prayer": "Lord, You gave Nehemiah's people a mind to work and joined their wall together. Join us together too, patrol by patrol, so that what we build in Your name stands strong. Give us willing hands and humble hearts, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Build a Chair or Ladder: Lashing Challenge", "setup": "Each patrol has 4 long spars, 4 short spars, and 6 lashing cords in a 3 m square of floor. Two leaders are the engineers who test structures. Write the two challenge options on the board. Patrols choose one: a ladder (two long spars with 3 short rungs, square lashed) or a chair (a square frame seat lashed to two A-frames). PLs lead; every scout must tie at least one lashing.", "materials": ["Spars and cords per patrol", "Two filled 4 L water jugs", "Score sheets", "Timer"], "rules": ["Patrols have 15 minutes to build. When the timer ends, hands off.", "Strength test for a ladder: a leader lays the ladder flat on two chairs and hangs both water jugs (about 8 kg) from the middle rung for 10 seconds. Pass: 5 points. Then a leader stands the ladder against the wall and pushes firmly on each rung. No slipping: 3 more points.", "Strength test for a chair: a leader (not a scout) sits on the chair gently for 5 seconds. Holds: 8 points. If it is not safe to sit, a leader presses down with both hands: 4 points if nothing slips.", "Quality points: judges check three lashings per structure at random. Each lashing that does not twist when the spars are grabbed and turned earns 1 point (max 3).", "Teamwork points: 2 points if every scout tied at least one lashing, verified by asking each scout to point at theirs.", "Highest total wins 5 patrol points, second 3, others 1. Announce the strongest structure and let that patrol explain their build to the troop.", "Disqualification: any structure that used tape, knots other than lashings, or borrowed cord from another patrol."], "variations": ["Easier: everyone builds a ladder; give the lashing diagram to keep on the floor.", "Harder: build a tripod stand that holds a full water jug hanging from the apex by a bowline.", "Short on time: 10 minute build with 2 rungs only."]}, "tables": [{"caption": "Hitches and lashings: when to use each", "headers": ["Knot", "Job aboard or at camp", "Strength", "Warning"], "rows": [["Clove hitch", "Fenders on a rail, starting a lashing, quick tie to a post", "Medium", "Can roll loose if the pull changes direction"], ["Two half hitches", "Line to a ring, tarp corners, guy lines", "Good", "Both hitches must go the same way"], ["Round turn and two half hitches", "Mooring a boat to a post or ring, securing under load", "Strong", "Take the full round turn before the hitches"], ["Square lashing", "Joining two spars at right angles: ladders, tables, frames", "Very strong when tight", "Loose wraps cannot be fixed by frapping"], ["Tripod lashing", "Three spars for a washstand, a pot hanger, a signal tower", "Strong", "Weave the wraps; do not just circle all three"]]}], "references": [{"label": "Animated Knots: Clove hitch", "url": "https://www.animatedknots.com/clove-hitch-knot", "why": "Both tying methods with step photos"}, {"label": "Animated Knots: Two half hitches", "url": "https://www.animatedknots.com/two-half-hitches-knot", "why": "Shows the same-direction rule clearly"}, {"label": "Animated Knots: Round turn and two half hitches", "url": "https://www.animatedknots.com/round-turn-and-two-half-hitches-knot", "why": "The mooring knot"}, {"label": "Animated Knots: Square lashing", "url": "https://www.animatedknots.com/square-lashing-knot", "why": "Wrapping and frapping sequence to practise before the meeting"}, {"label": "Animated Knots: Tripod lashing", "url": "https://www.animatedknots.com/tripod-lashing-knot", "why": "For patrols that finish early"}, {"label": "Nehemiah 4:6 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Nehemiah+4%3A6&version=NKJV", "why": "The verse; read chapter 3 too for the list of builders"}], "visual": null, "takeHome": "Tie a round turn and two half hitches to a railing or a bike rack every day this week, and lash two broom handles or sticks together at home with a square lashing that does not twist."}, {"n": 7, "date": "2026-10-27", "term": "Fall", "title": "Weather at Sea", "theme": "Reading the sky, the wind and the forecast before you leave the dock", "sea": true, "calendar": ["Halloween is Saturday Oct 31. Optional spooky theme: dim the lights for the cloud-in-a-jar demo and call cumulonimbus 'the monster cloud.' Keep it light; no horror content.", "Remembrance Day is Nov 11; the signals lesson on Nov 10 will honour the navy. Ask scouts to bring a poppy donation next week if they can.", "Nativity fast begins Nov 25; announce it now so families can plan."], "objectives": ["By the end scouts can name and identify 6 cloud types from pictures and say what weather each predicts.", "By the end scouts can describe Beaufort force 0 to 8 by what the water and trees look like and know when a small boat should stay ashore.", "By the end scouts can read a marine forecast from weather.gc.ca and pick out wind direction, wind speed, waves and warnings.", "By the end scouts can explain the red sky rhyme, offshore versus onshore wind, and the flash-to-bang lightning rule."], "materials": [{"item": "Cloud photo cards (10 types) printed in colour", "qty": "1 set per patrol plus 1 large set", "note": "print from the NWS JetStream cloud page or a search; label the backs"}, {"item": "Beaufort scale chart (printed or drawn)", "qty": "1 large", "note": "force 0 to 12 with wind speed and sea state"}, {"item": "A printed marine forecast for Lake Ontario or the nearest Great Lake from weather.gc.ca/marine, printed the morning of the meeting", "qty": "1 per patrol", "note": "print the text forecast and the warnings page"}, {"item": "Cloud in a jar kit: large glass jar with lid, hot water in a thermos, a plate, ice cubes, hairspray or a match", "qty": "1", "note": "leader handles hot water; hairspray is the safer option indoors"}, {"item": "Flashlight and a bowl of water for wind demos", "qty": "1", "note": "optional"}, {"item": "Weather bingo cards and markers, or charades slips for Beaufort forces", "qty": "1 per scout / 1 set", "note": "make the night before"}, {"item": "Small prizes (nut-free, allergy checked)", "qty": "a few", "note": ""}], "prep": ["Print the marine forecast and any marine warnings for your nearest Great Lake on the morning of Oct 27 so it is real and current.", "Print and label cloud photos. Check each one yourself against the NWS JetStream page so you are confident naming them.", "Test the cloud in a jar at home once. Boil water, fill the jar a third, put the plate of ice on top, wait 20 seconds, lift the plate, spray hairspray for one second, replace the plate. A cloud should swirl inside.", "Write 12 Beaufort charades slips (force number plus a description) and, if using bingo, make 25 cards with cloud names, Beaufort forces and forecast words in a 4 by 4 grid.", "Check the sky on your way in; if there are visible clouds, note them and start the lesson by asking scouts what they saw."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance, what did you see in the sky tonight"}, {"time": "6:25", "min": 40, "what": "Practical: cloud types, what clouds predict and the red sky rhyme, Beaufort scale, reading a marine forecast, wind direction and lightning safety"}, {"time": "7:05", "min": 10, "what": "Spiritual: Jesus calms the storm (Mark 4:35-41)"}, {"time": "7:15", "min": 25, "what": "Activity: cloud in a jar demo, then Beaufort charades or weather bingo"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Reading the Sky", "intro": "Say: Every sailor is a weather forecaster, because on the water there is nowhere to hide. The wind that is perfect at noon can flip a small boat at three o'clock. The clouds tell you six to twelve hours ahead what is coming, and the forecast tells you what the experts think. Tonight you learn to read both, and the one rule that matters most: when in doubt, do not go out.", "steps": [{"title": "Cloud types: high, middle and low", "min": 10, "detail": "Hand out cloud cards. Clouds are named by height and shape. Latin words: cirrus means curl of hair, cumulus means heap, stratus means layer, nimbus means rain, alto means middle. High clouds (above 6 km, made of ice): cirrus, thin white wisps like horse tails, mean fair weather now but a change in 24 to 48 hours; cirrostratus, a thin milky sheet that makes a halo around the sun or moon, means rain is likely within a day; cirrocumulus, small white ripples like fish scales, the 'mackerel sky.' Middle clouds (2 to 6 km): altostratus, a grey sheet through which the sun looks like a dim coin, rain coming soon; altocumulus, grey and white patches or rolls, if seen on a warm humid morning expect afternoon thunderstorms. Low clouds (below 2 km): stratus, a flat grey blanket, drizzle and fog; stratocumulus, lumpy grey rolls, little rain; nimbostratus, dark thick blanket, steady rain for hours. Have patrols sort their cards into high, middle, low."}, {"title": "Cumulus, cumulonimbus, and the red sky rhyme", "min": 6, "detail": "Two clouds get their own step because they decide whether you sail. Cumulus: puffy white cotton balls with flat bottoms, the fair-weather cloud. If they stay small and scattered, enjoy the day. If they start growing taller than they are wide by late morning, watch out. Cumulonimbus: the thunderstorm cloud, a towering dark mass that reaches up to 12 km and spreads into a flat anvil top. It brings lightning, sudden violent gusts, hail and downpours. A cumulonimbus building anywhere in the sky means get off the water now, not in twenty minutes. Then teach the rhyme: 'Red sky at night, sailor's delight; red sky in morning, sailors take warning.' Weather in Ontario mostly moves west to east. A red sunset means clear air to the west, where tomorrow's weather comes from. A red sunrise means the clear air has already passed east and clouds are arriving from the west. Ask scouts to say the rhyme back and explain it."}, {"title": "The Beaufort scale", "min": 8, "detail": "Admiral Beaufort of the British navy made a scale in 1805 so sailors could describe wind by what they saw, without instruments. Show the chart and act out each force with the scouts. Force 0, calm: sea like a mirror, smoke rises straight up. Force 1, light air: ripples, smoke drifts. Force 2, light breeze, 6 to 11 km/h: small wavelets, leaves rustle, you feel it on your face. Force 3, gentle breeze, 12 to 19: large wavelets with a few whitecaps, flags extend; perfect learning wind for a small sailboat. Force 4, moderate breeze, 20 to 28: small waves, frequent whitecaps, dust and paper blow around; the upper limit for beginner canoes and dinghies. Force 5, fresh breeze, 29 to 38: moderate waves, many whitecaps, small trees sway; small craft stay ashore. Force 6, strong breeze, 39 to 49: large waves, spray, whistling wires, umbrellas turn inside out; small craft warning. Force 7, near gale: whole trees move, walking is hard. Force 8, gale, 62 to 74: twigs break off trees, high waves. Up to force 12, hurricane, over 118 km/h. Quick quiz: describe a scene, patrols shout the force."}, {"title": "Reading a marine forecast", "min": 8, "detail": "Hand out the printed forecast. Environment Canada issues marine forecasts for each Great Lake, split into areas (for example Lake Ontario has western, central and eastern parts). Read it together. Winds are given in knots (1 knot is 1.85 km/h) and by the direction the wind comes FROM: 'southwest 15 knots' blows from the southwest toward the northeast. Convert: 15 knots is about 28 km/h, which is Beaufort 4. Waves are given in metres: 'waves 1 metre' is rough for a canoe. Look for the warning words: 'strong wind warning' means 20 to 33 knots, small boats stay home; 'gale warning' means 34 to 47 knots; 'storm warning' is worse. Also read visibility, fog, and thunderstorm risk. Then read the time: forecasts say 'winds increasing to 20 knots late this afternoon,' so a morning paddle could be fine and the trip back could be dangerous. Rule: check the forecast the night before and again the morning of, and if the words 'warning' or 'thunderstorm' appear, the trip is off. Each patrol reports the wind, waves and warnings for its area in one sentence."}, {"title": "Wind direction and lightning safety", "min": 8, "detail": "Wind direction on the water matters more than speed. An onshore wind blows from the water toward the land: waves pile up on the beach, but if you get tired the wind pushes you home. An offshore wind blows from the land out over the water: the water near shore looks calm and flat because the land blocks the waves, but once you paddle out the wind grows and pushes you away from shore. Offshore wind is the number one trap for paddlers. Demonstrate with a bowl of water and a flashlight (or a straw): blow across the water away from the 'shore' and watch how the ripples grow further out. Lightning: count the seconds between the flash and the thunder and divide by 3 to get kilometres (divide by 5 for miles). If it is under 30 seconds, the storm is within 10 km and you must be off the water. Wait 30 minutes after the last thunder before going back out. On land: avoid tall isolated trees, get off ridges, crouch low on the balls of your feet if caught in the open, and never shelter under a mast."}], "tips": ["Use the actual forecast for that day. Scouts pay attention when it is real.", "Cloud names are hard; focus on recognizing cirrus, cumulus, stratus and cumulonimbus first, then the others.", "Act out the Beaufort scale with sound and motion. Scouts remember force 6 as 'umbrella inside out' for years.", "If the spooky theme helps, cumulonimbus is 'the monster' and offshore wind is 'the trap.' Keep it playful."], "safety": ["Hot water for the cloud in a jar stays in a thermos until the demo and is handled by a leader only. Scouts stay 1 m back.", "Use hairspray, not a match, for the demo indoors, and spray only one second away from faces.", "Charades involve mime, not running or pushing.", "Remind scouts: the lightning and wind rules are not suggestions. At camp, a leader's call to leave the water is final."]}, "spiritual": {"title": "Peace, Be Still", "ref": "Mark 4:35-41", "verse": "Then He arose and rebuked the wind, and said to the sea, \"Peace, be still!\" And the wind ceased and there was a great calm.", "url": "https://www.biblegateway.com/passage/?search=Mark+4%3A35-41&version=NKJV", "message": "The Sea of Galilee sits in a bowl between hills, and cold wind pours down the valleys in the evening without warning. Peter and Andrew were experienced fishermen; they knew the sky like you are learning to. And still a storm caught them, the waves filled the boat, and they were terrified. Where was Jesus? Asleep on a cushion in the stern. Notice that He was not worried, and notice what the disciples did: they woke Him and cried out. That is prayer. He stood, said three words, and the sea went flat like the Beaufort force 0 you saw tonight. Then He asked them, 'Why are you so fearful? How is it that you have no faith?' He did not scold them for being in a storm, only for forgetting who was in the boat. Reading the weather is wisdom, and God expects us to use it; we check the forecast and we stay ashore when the warnings are up. But storms still come: sickness, a family fight, a failed test, fear at night. St. Athanasius was exiled five times and wrote, 'It is a cloud; it will pass.' When your storm hits, wake Jesus. He is in your boat, and He is not worried.", "discussion": ["What storm has caught you by surprise this year, even though you thought you were prepared?", "Why do you think Jesus was able to sleep in the storm? What does that tell us about Him?", "What is the difference between reading the weather carefully and living in fear of it?"], "prayer": "Lord Jesus, You slept in the stern while the storm raged, and with a word You made the sea calm. Be in our boat this week. Give us wisdom to read the sky and faith to call on You when the waves rise, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Cloud in a Jar, then Beaufort Charades", "setup": "Part 1 (5 minutes): patrols gather in a semicircle 1 m from a table at the front, lights dimmed. A leader performs the cloud in a jar. Part 2 (20 minutes): patrols sit in their areas facing the front. One patrol at a time sends an actor to draw a Beaufort slip and mime it; the other patrols guess the force number. A leader keeps score on the board.", "materials": ["Cloud in a jar kit (jar, thermos of hot water, plate, ice, hairspray)", "12 Beaufort charades slips (force 0 to 8 twice, plus 'offshore wind,' 'cumulonimbus,' 'red sky in morning')", "Score board and marker", "Timer"], "rules": ["Cloud in a jar: pour hot water into the jar to one third. Swirl it. Put the plate of ice on top for 20 seconds; explain that warm moist air is rising and meeting cold air above, exactly how clouds form over a lake. Lift the plate, spray hairspray for one second (the particles give the water droplets something to stick to, like dust in the sky), replace the plate. A cloud swirls inside. Lift the plate and it escapes. Ask: what three things did we need? (Moisture, cooling, particles.)", "Charades: the actor draws a slip and has 60 seconds to mime it silently. They may show waves with their arms, trees, smoke, umbrellas, flags, or anything on the Beaufort chart, but no numbers or letters.", "Guessing patrols confer, then the PL raises a hand. First patrol to give the exact force number wins 2 points. Being off by one earns 1 point. The actor's patrol earns 1 point if anyone guesses correctly within the minute.", "Special slips (offshore wind, cumulonimbus, red sky in morning) are worth 3 points and the guessing patrol must also say what a sailor should do about it.", "Rotate so every patrol sends at least two actors. Highest total wins 5 patrol points, second 3, others 1.", "If using weather bingo instead: a leader reads clues ('this cloud makes a halo,' 'force with frequent whitecaps') and scouts mark the matching square. First full row wins, then first full card."], "variations": ["Easier: let actors make sounds (whistling, wind noises) as well as mime.", "Harder: guessers must also give the wind speed range in km/h for the force.", "Short on time: skip charades and play three rounds of bingo."]}, "tables": [{"caption": "Cloud types and what they tell a sailor", "headers": ["Cloud", "Height", "Looks like", "Means"], "rows": [["Cirrus", "High", "Thin white wisps, horse tails", "Fair now; change within 24-48 hours"], ["Cirrostratus", "High", "Milky sheet, halo around sun or moon", "Rain likely within a day"], ["Cirrocumulus", "High", "Small white ripples, mackerel sky", "Unsettled; often ahead of a front"], ["Altostratus", "Middle", "Grey sheet, sun like a dim coin", "Rain coming in hours"], ["Altocumulus", "Middle", "Grey-white patches or rolls", "Warm humid morning: thunderstorms by afternoon"], ["Stratus", "Low", "Flat grey blanket", "Drizzle, fog, poor visibility"], ["Stratocumulus", "Low", "Lumpy grey rolls with gaps", "Dry or light showers"], ["Nimbostratus", "Low", "Dark thick blanket", "Steady rain for hours"], ["Cumulus", "Low", "Puffy cotton balls, flat bottoms", "Fair weather; watch if they grow tall"], ["Cumulonimbus", "Low to very high", "Towering dark mass, anvil top", "Thunderstorm, gusts, hail. Get off the water now"]]}, {"caption": "Beaufort scale for small craft", "headers": ["Force", "Name", "Wind km/h", "Water and land signs", "Small boat advice"], "rows": [["0", "Calm", "under 1", "Mirror sea, smoke rises straight", "No wind to sail"], ["1", "Light air", "1-5", "Ripples, smoke drifts", "Fine"], ["2", "Light breeze", "6-11", "Small wavelets, leaves rustle", "Fine, ideal for beginners"], ["3", "Gentle breeze", "12-19", "Few whitecaps, flags extend", "Good learning wind"], ["4", "Moderate breeze", "20-28", "Frequent whitecaps, paper blows", "Upper limit for beginner canoes and dinghies"], ["5", "Fresh breeze", "29-38", "Many whitecaps, small trees sway", "Small craft stay ashore"], ["6", "Strong breeze", "39-49", "Large waves, spray, umbrellas turn inside out", "Small craft warning"], ["7", "Near gale", "50-61", "Whole trees move, hard to walk", "No small boats"], ["8", "Gale", "62-74", "Twigs break, high waves", "Gale warning"]]}], "references": [{"label": "NWS JetStream: Clouds", "url": "https://www.weather.gov/jetstream/clouds", "why": "Photos and descriptions of each cloud type to print for cards"}, {"label": "NWS: Beaufort wind scale", "url": "https://www.weather.gov/mfl/beaufort", "why": "Full table of forces with sea and land descriptions"}, {"label": "Environment Canada marine forecasts", "url": "https://weather.gc.ca/marine/", "why": "Print the current Great Lakes forecast and warnings for the reading exercise"}, {"label": "Wikipedia: Beaufort scale", "url": "https://en.wikipedia.org/wiki/Beaufort_scale", "why": "History of Admiral Beaufort and the scale"}, {"label": "YouTube search: cloud in a jar experiment hairspray", "url": "https://www.youtube.com/results?search_query=cloud+in+a+jar+experiment+hairspray", "why": "Watch the demo once before doing it live"}, {"label": "Mark 4:35-41 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Mark+4%3A35-41&version=NKJV", "why": "The full passage for the spiritual lesson"}], "visual": "cloud-types", "takeHome": "Every day this week look up, name the cloud type you see, and check the next day whether it predicted the weather correctly; keep a 7 day cloud log to show your patrol."}, {"n": 8, "date": "2026-11-03", "term": "Fall", "title": "Ship Shapes: Boat Parts and Buoyancy", "theme": "Kinds of boats, how their hulls are shaped, and why 100,000 tonnes of steel floats", "sea": true, "calendar": ["Remembrance Day is next Wednesday Nov 11. Next week's meeting (Nov 10) is Remembrance themed; ask scouts to wear a poppy.", "Nativity fast begins Nov 25 (three weeks away). Galley cooking on Nov 24 will be fasting-friendly."], "objectives": ["By the end scouts can name and describe 6 types of vessels from canoe to ship and say who uses each.", "By the end scouts can explain displacement versus planing hulls and monohull versus catamaran.", "By the end scouts can point to the keel, rudder and tiller on a diagram and explain what each does.", "By the end scouts can explain why a boat floats using the word displacement and demonstrate it with clay."], "materials": [{"item": "Boat diagram (from lesson 1) plus a side view showing keel, rudder, tiller, hull, mast", "qty": "1 large", "note": "chart paper or projector"}, {"item": "Photo cards of vessel types: canoe, kayak, sailing dinghy, keelboat, powerboat, tugboat, cargo ship, catamaran, ferry", "qty": "1 set per patrol", "note": "print in colour, label the backs"}, {"item": "Clear plastic tub or bucket of water, 20 cm deep", "qty": "2", "note": "one for the demo, one for the activity; towels underneath"}, {"item": "Modelling clay (non-drying, such as plasticine)", "qty": "1 block per patrol plus 1 for the demo", "note": "dollar store"}, {"item": "Aluminum foil, 30 cm by 30 cm squares", "qty": "3 per patrol (15) plus spares", "note": "one roll"}, {"item": "Coins or washers, all the same size (pennies if you have them, otherwise nickels or 1 cm steel washers)", "qty": "200", "note": "hardware store washers are about $8 per box"}, {"item": "Towels and a mop", "qty": "4 and 1", "note": "water will spill"}, {"item": "A small toy boat or a hollow plastic container, and a solid steel bolt", "qty": "1 each", "note": "for the float or sink demo"}], "prep": ["Fill both tubs with water in the kitchen and carry them to the hall on a cart or with two people. Put towels under them.", "Test the clay demo at home: a ball of clay sinks, the same clay shaped into a bowl floats. Test a foil boat so you know 30 cm squares hold about 40 to 80 washers when shaped well.", "Print vessel photo cards and check the labels. Draw the side-view boat diagram with keel, rudder and tiller.", "Set up patrol tables around the room with foil, clay and a cup of 40 washers each. Keep the water tubs on one central table with a leader stationed there.", "Prepare a 10 question review quiz on paper for step 5."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, attendance, poppy reminder"}, {"time": "6:25", "min": 40, "what": "Practical: types of vessels, hull types, keel rudder and tiller, why boats float (displacement demo), review quiz"}, {"time": "7:05", "min": 10, "what": "Spiritual: Noah's obedience and preparation (Genesis 6:14-22)"}, {"time": "7:15", "min": 25, "what": "Activity: foil boat challenge, most coins before sinking"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Why Boats Float and How They Are Shaped", "intro": "Say: A canoe weighs 30 kg. A cargo ship weighs 100,000 tonnes and is made of steel. Both float. Tonight you find out why, and you learn the family tree of boats, from the kayak you will paddle at camp to the freighters on Lake Ontario. Once you understand the shape of a hull, you can tell what a boat is for just by looking at it.", "steps": [{"title": "Types of vessels", "min": 8, "detail": "Hand out photo cards and go through them. Canoe: open boat, pointed at both ends, paddled kneeling or sitting with a single-blade paddle, carries gear, the classic Canadian boat. Kayak: closed deck, you sit low with legs forward, double-blade paddle, fast and stable in waves. Sailing dinghy: small open sailboat with a centreboard that lifts up, 2 to 5 m long, what Sea Scouts learn to sail on (Laser, Optimist, 420). Keelboat: a sailboat with a heavy fixed keel underneath, 6 m and up, can have a cabin, can cross oceans. Powerboat: engine driven, from a 4 m aluminum fishing boat with an outboard to a cabin cruiser. Tugboat, ferry, freighter and Coast Guard cutter are ships: a ship is big enough to carry a boat. Old saying: you can put a boat on a ship, but not a ship on a boat. Ask patrols to sort their cards into paddle, sail, power, and ship. Ask which they have been on."}, {"title": "Hull types", "min": 8, "detail": "The hull is the body of the boat that sits in the water, and its shape tells you how it moves. Displacement hull: a rounded or V-shaped hull that pushes water aside and sits in the water at all speeds. Canoes, kayaks, sailboats, tugs and freighters are displacement hulls. They are efficient and steady but have a top speed set by their length; a longer hull can go faster. Planing hull: a flatter bottom that, with enough engine power, climbs up and skims across the top of the water. Speedboats, personal watercraft and many fishing boats plane. Fast, but they slam in waves and burn fuel. Monohull: one hull, the usual shape; it heels (leans) in wind. Catamaran: two narrow hulls joined by a deck; very stable, does not heel much, fast, and needs shallow water only. Hold a card up and have scouts call out displacement or planing, monohull or catamaran. Explain that a flat-bottomed boat is stable at first but tips suddenly, while a round-bottomed canoe feels tippy but recovers, which is why you kneel low in a canoe."}, {"title": "Keel, rudder and tiller", "min": 8, "detail": "Show the side-view diagram. Keel: the backbone of the boat running along the bottom from bow to stern. On a sailboat the keel (or the lift-up centreboard on a dinghy) does two jobs: it stops the wind from pushing the boat sideways, and its weight keeps the boat upright. A keelboat can be knocked flat by a gust and its heavy keel will pull it back up. Rudder: the flat blade at the stern that hangs down into the water. Turn the rudder and the water pushes against it, swinging the stern the other way and turning the bow. A rudder only works when water is flowing past it, so a stopped boat cannot steer. Tiller: the stick attached to the top of the rudder that the helmsman holds. Key rule: push the tiller to the left (port) and the boat turns right (starboard); push it toward the side you want the boat to go away from. Bigger boats use a wheel, which turns the normal way. Have scouts stand, hold an imaginary tiller behind them, and turn their bodies the correct way on the command 'tiller to port' or 'tiller to starboard.'"}, {"title": "Why boats float: displacement", "min": 10, "detail": "Gather around the demo tub. Drop in the steel bolt: it sinks. Drop in the plastic container: it floats. Now the clay. Roll a ball of clay and drop it in: it sinks. Shape the same clay into a wide bowl with thin walls and set it on the water: it floats. Ask why. The clay weighs exactly the same. What changed is how much water it pushes aside. When something goes into water it pushes water out of the way, called displacing it, and the water pushes back up with a force equal to the weight of the water displaced. This is Archimedes' principle, found by a Greek scientist in his bath 2,200 years ago. The ball displaces less than its own weight, so it sinks. The bowl displaces more than its own weight, so it floats. A steel ship is a giant hollow bowl. Add washers to the bowl one at a time and watch it sink lower until water reaches the rim. Every boat has a painted load line marking safe loading."}, {"title": "Review quiz", "min": 6, "detail": "Patrols sit together with one answer sheet. Read 10 quick questions; patrols write answers; swap sheets to mark. Questions: 1. Which paddle has two blades? (Kayak.) 2. A boat that climbs on top of the water at speed has what kind of hull? (Planing.) 3. Two hulls joined by a deck is called what? (Catamaran.) 4. What is the backbone along the bottom of the boat? (Keel.) 5. What does the keel stop the boat from doing? (Sliding sideways; also keeps it upright.) 6. Push the tiller to port and the boat turns which way? (Starboard.) 7. Why does a stopped boat not steer? (No water flowing past the rudder.) 8. Why does a ball of clay sink but a bowl of clay float? (The bowl displaces more water than its weight.) 9. Whose principle is that? (Archimedes.) 10. What is the painted line on a hull that shows safe loading? (Load line.) Winning patrol earns 2 points. Use wrong answers to reteach quickly."}], "tips": ["Keep the vessel cards moving; do not lecture on each one for long. Sorting and calling out keeps everyone involved.", "The tiller rule confuses everyone at first. Have them physically turn their bodies; it sinks in when the body does it.", "For the clay demo, make the bowl walls thin and the shape wide. A deep narrow cup tips over and fills.", "Use the word 'displaces' at least ten times so it sticks before the activity."], "safety": ["Water tubs stay on a stable table with towels underneath; nobody carries them alone.", "Wipe spills immediately; a wet hall floor is a slip hazard during the activity.", "Washers and coins are small; count them out and back in, and keep them away from younger siblings if any are present.", "Foil edges can be sharp; fold them over rather than tearing."]}, "spiritual": {"title": "Thus Noah Did", "ref": "Genesis 6:14-22", "verse": "Thus Noah did; according to all that God commanded him, so he did.", "url": "https://www.biblegateway.com/passage/?search=Genesis+6%3A14-22&version=NKJV", "message": "Tonight you learned that a boat floats because of its shape, and that shape has to be right before it touches the water. The first boat in the Bible was designed by God Himself. He told Noah the material, gopher wood; the length, 300 cubits, about 135 m, longer than a football field; the width and height; the pitch to seal it inside and out; the door, the window, the three decks. The ratio of length to width, six to one, is the same ratio shipbuilders still use for stable cargo ships today. Noah had never seen rain like this, never seen a flood, and he built for around a hundred years while his neighbours laughed. Genesis says it simply: according to all that God commanded him, so he did. Not most of it. All of it. The Church Fathers call the ark a picture of the Church, and the Coptic Church has an ark on its altar. Inside, safe; outside, the flood. Noah's obedience was not exciting; it was measuring, cutting, sealing, day after day. That is what your training is: knots, first aid, hull shapes, done carefully now, before the storm. When the rain comes, it is too late to start building. Prepare now, obey in the small things, and the ark floats.", "discussion": ["God gave Noah exact measurements. Why do you think obedience in details matters, and not only in big decisions?", "Noah built for years with no flood in sight. What is something you should be preparing for now that you cannot see yet?", "The ark is a picture of the Church. What does it mean to be 'inside' rather than 'outside'?"], "prayer": "Lord, You gave Noah the shape of the ark and he built it exactly as You said. Give us the same obedience in small things, and keep us safe inside Your Church, the ark of salvation, until the storm passes, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Foil Boat Challenge", "setup": "Each patrol works at its own table with three 30 cm foil squares, a block of clay (optional ballast), and a cup of 40 washers or coins. The two water tubs are on a central table with a leader at each as the loading officer. Patrols design at their tables and bring boats to the tub for testing. Post the rules on the board.", "materials": ["Foil squares (3 per patrol)", "200 identical washers or coins", "Two water tubs, towels", "Score board and marker", "Timer"], "rules": ["Round 1, design (5 minutes): each patrol shapes one foil boat from a single 30 cm square. Only foil may be used; no tape, no clay in round 1. Discuss: wide and shallow displaces more water than tall and narrow, but the sides must be high enough to keep water out.", "Round 1, loading: the patrol brings its boat to a tub. The loading officer floats it and the patrol adds washers one at a time, spreading them evenly, counting out loud. The score is the number of washers in the boat when it sinks or takes on water over the rim, minus the last one. Record it on the board.", "Round 2, redesign (5 minutes): using the second foil square, the patrol improves its design based on what they saw. Load and score again. Best of the two rounds counts.", "Round 3, ballast challenge (5 minutes): using the third square plus a piece of clay no bigger than a walnut, build a boat that stays stable when the loading officer makes waves by tapping the tub side. Score is washers held during 5 seconds of waves.", "Scoring: highest total across the best of rounds 1 and 2 plus round 3 wins 5 patrol points, second 3, others 1. Bonus 2 points for the patrol that can explain, using the word displacement, why the winning shape held the most.", "A boat that is touched by a hand or the tub wall during loading is refloated and the count restarts from the washers already aboard."], "variations": ["Easier: give each patrol a demonstration of a good shape (flat, wide, 3 cm walls) before round 1.", "Harder: boats must also carry a 'crew' (a plastic figure or a marble) that must not slide out.", "Short on time: rounds 1 and 2 only, with a 3 minute design time."]}, "tables": [{"caption": "Vessel types at a glance", "headers": ["Vessel", "Power", "Hull", "Typical size", "Used for"], "rows": [["Canoe", "Single-blade paddle", "Displacement, open", "4-5 m", "Lakes, rivers, tripping with gear"], ["Kayak", "Double-blade paddle", "Displacement, closed deck", "3-5 m", "Waves, touring, whitewater"], ["Sailing dinghy", "Sail, lift-up centreboard", "Displacement or light planing", "2-5 m", "Learning to sail, racing"], ["Keelboat", "Sail, fixed heavy keel", "Displacement monohull", "6-15 m", "Cruising, offshore"], ["Powerboat", "Outboard or inboard engine", "Planing (most)", "4-12 m", "Fishing, waterskiing, patrol"], ["Catamaran", "Sail or power", "Two hulls", "5-30 m", "Stability, speed, ferries"], ["Ship (freighter, ferry, cutter)", "Engine", "Displacement", "50-300 m", "Cargo, passengers, Coast Guard"]]}], "references": [{"label": "Wikipedia: Buoyancy", "url": "https://en.wikipedia.org/wiki/Buoyancy", "why": "Archimedes' principle explained for the leader's background"}, {"label": "YouTube search: why do ships float displacement Archimedes for kids", "url": "https://www.youtube.com/results?search_query=why+do+ships+float+displacement+Archimedes+for+kids", "why": "A short animation to reinforce step 4"}, {"label": "YouTube search: displacement hull vs planing hull explained", "url": "https://www.youtube.com/results?search_query=displacement+hull+vs+planing+hull+explained", "why": "Video of both hull types moving so scouts can see the difference"}, {"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Load capacity plates and why overloading a boat is dangerous"}, {"label": "Paddle Canada", "url": "https://www.paddlecanada.com/", "why": "Canoe and kayak types and programs in Canada"}, {"label": "Genesis 6:14-22 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Genesis+6%3A14-22&version=NKJV", "why": "The full ark instructions for the spiritual lesson"}], "visual": "boat-parts", "takeHome": "In the sink or bathtub, show a family member the clay ball versus clay bowl demo (or use foil) and explain displacement in your own words; then find and photograph the load line on any boat picture online."}, {"n": 9, "date": "2026-11-10", "term": "Fall", "title": "Signals: Morse Code and Semaphore", "theme": "Remembrance week: sending a message when you cannot shout, the way the navy did", "sea": true, "calendar": ["Remembrance Day is tomorrow, Wednesday Nov 11. Wear poppies. Hold a one minute silence at the opening after the Lord's Prayer, then recite 'They shall grow not old, as we that are left grow old.'", "The Coptic Church remembers its own martyrs on every feast; connect Remembrance with the courage of St. George and St. Mina in the spiritual lesson.", "Nativity fast starts in two weeks (Nov 25)."], "objectives": ["By the end scouts can explain what the Royal Canadian Navy did in the Battle of the Atlantic and why we remember.", "By the end scouts can send and receive SOS and at least 6 letters in Morse code with a flashlight.", "By the end scouts can send and receive their own initials and at least 8 letters in flag semaphore.", "By the end scouts can decode a short message from a Morse or semaphore chart."], "materials": [{"item": "Semaphore flags: two per scout, made from 30 cm square red and yellow paper or cloth stapled to 40 cm dowels or paint stirrers", "qty": "2 per scout (50)", "note": "make as a leader craft the week before; dollar store paper, paint stirrers are free at hardware stores"}, {"item": "Flashlights", "qty": "1 per patrol (5)", "note": "leaders' own"}, {"item": "Printed Morse code alphabet chart", "qty": "1 per scout (25)", "note": "print the table in this lesson"}, {"item": "Printed semaphore alphabet chart with stick figures", "qty": "1 per scout (25)", "note": "print from the Wikipedia Flag semaphore page"}, {"item": "Message cards (short words and phrases) for the relay", "qty": "10", "note": "see activity"}, {"item": "Poppies and a photo of HMCS Sackville or a corvette", "qty": "1 photo", "note": "search 'HMCS Sackville' on Wikipedia for a public image"}, {"item": "Whiteboard and marker", "qty": "1", "note": ""}], "prep": ["Make or assign the semaphore flags a week ahead. Two flags per scout, opposite corners red and yellow if possible (the real Oscar flag pattern), but plain colours are fine.", "Learn the Morse for SOS and for the letters E, T, A, N, I, M, S, O and your own initials so you can demonstrate confidently. Learn semaphore A through G (the first circle) with your arms in a mirror.", "Print charts. Write 10 message cards, 3 to 6 letters each, all capitals: SOS, HELP, SHIP, PORT, SAIL, ANCHOR, LEST WE FORGET, NAVY, MARK, PEACE.", "Read the Wikipedia page on the Battle of the Atlantic and note three facts: it ran from 1939 to 1945, Canada's navy grew from 13 ships to over 400, and about 2,000 Canadian sailors and 1,600 merchant seamen died.", "Arrange the hall so patrols can stand at opposite ends, about 15 m apart, with a clear line of sight."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, flag, Scout Promise, Lord's Prayer, one minute silence and Act of Remembrance, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: Remembrance and the RCN, Morse basics and SOS, flashlight Morse practice, semaphore alphabet, semaphore practice"}, {"time": "7:05", "min": 10, "what": "Spiritual: greater love, St. George and the martyrs' courage (John 15:13)"}, {"time": "7:15", "min": 25, "what": "Activity: semaphore and Morse message relay across the hall"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Sending a Message Without a Voice", "intro": "Say: At sea, the wind steals your voice and radios fail or must stay silent so the enemy cannot hear. For two hundred years sailors have sent messages with flags by day and lights by night. In the Second World War, Canadian sailors crossing the Atlantic used exactly these signals to keep convoys alive. Tonight, on the eve of Remembrance Day, you learn to send and read them.", "steps": [{"title": "Remembrance: Canada's navy and the Battle of the Atlantic", "min": 7, "detail": "Show the photo of a corvette. Tell the story in plain words. When the Second World War began in 1939, the Royal Canadian Navy had only 13 warships and about 3,500 sailors. Britain needed food, fuel and weapons from North America, and German submarines, U-boats, were sinking the ships that carried them. Canada built small, tough escort ships called corvettes, about 60 m long, in shipyards from Halifax to Collingwood on Georgian Bay, and crewed them with young men, many of them teenagers from farms who had never seen the ocean. They escorted convoys of merchant ships across the North Atlantic in freezing storms, hunting submarines. By 1945 the RCN had over 400 ships and 100,000 people, the fourth largest navy in the world. About 2,000 Canadian sailors and 1,600 merchant seamen died. Convoys kept radio silence, so ships talked with signal lamps and flags, the skills you learn tonight. Ask: why do we wear a poppy? Read 'In Flanders Fields' by John McCrae, a Canadian doctor, or the first verse."}, {"title": "Morse code basics and SOS", "min": 8, "detail": "Hand out the Morse chart. Samuel Morse invented the code in the 1830s for the telegraph. Every letter is a pattern of short signals (dots, spoken 'dit') and long signals (dashes, 'dah'). A dash is three times as long as a dot. Leave a short gap between letters and a longer gap between words. Start with the easiest: E is one dot. T is one dash. I is two dots. M is two dashes. S is three dots. O is three dashes. A is dot dash. N is dash dot. Now SOS: three dots, three dashes, three dots, sent as one continuous pattern. Explain that SOS does not stand for anything; it was chosen in 1906 because it is easy to send and impossible to mistake. It is the universal distress call. Have the whole troop tap SOS on their knees, then say it 'dit dit dit, dah dah dah, dit dit dit.' Write the words from step 3 on the board in Morse and have patrols decode them with their charts."}, {"title": "Morse with a flashlight", "min": 8, "detail": "Each patrol gets a flashlight and stands 5 m from a wall. Teach the light technique: a dot is a quick on-off (say 'one' in your head), a dash is on for a count of three, and you pause a count of three between letters and seven between words. Cover the lens with your hand rather than using the switch, because it is faster and quieter. Practise as a patrol: the PL sends SOS to the wall and the patrol reads it aloud. Then each scout sends one letter from their chart and the patrol guesses. Then dim the room lights, put two patrols facing each other across the hall, and send E, T, S, O, and finally SOS between them. Explain how ships still use this today: an Aldis lamp on the bridge, and at night a flashlight from a small boat in trouble sends SOS toward shore. Six flashes of anything (light, whistle, shouts) repeated every minute is also a recognized distress signal in Canada."}, {"title": "Semaphore alphabet", "min": 10, "detail": "Hand out flags and charts. Semaphore uses two flags held at positions like hands on a clock. The signaller faces the receiver. Teach the first circle of seven letters, each made with one flag while the other stays straight down. A: right arm down and out at 45 degrees. B: right arm straight out, horizontal. C: right arm up at 45 degrees. D: right arm straight up. E: left arm up at 45 degrees. F: left arm horizontal. G: left arm down and out at 45 degrees. Have every scout do A to G three times, calling the letters. The second circle keeps the right arm at the A position while the left arm moves: H left horizontal across the body, I left high across the body, K left straight up, L left high, M left horizontal, N left low. Show the rest on the chart: O to S start from B; T, U, Y from C; J and V from D; W and X from E; Z from F. Rest: both flags down and crossed. Error: both flags waved up and down."}, {"title": "Semaphore practice", "min": 7, "detail": "Pairs stand 5 m apart with charts. One sends the other's initials letter by letter, holding each letter still for two seconds and returning to the rest position between letters; the receiver calls the letter. Swap. Then send three-letter words from the board (SEA, MAN, BAD, CAB) one letter at a time. Teach the receiver's job: read the flags as if looking at a clock and translate right-to-left, since the sender's right arm appears on the receiver's left; the chart on the Wikipedia page is drawn from the receiver's view. Common mistakes: arms not straight (bent elbows make B look like C), flags drooping, and forgetting to return to rest between letters so double letters cannot be seen. Finish with the whole troop in a line sending L-E-S-T W-E F-O-R-G-E-T together, one letter at a time, as a leader calls them out."}], "tips": ["Keep arms straight and hold each letter still. Speed comes later; clarity is everything.", "The first circle A to G is the whole key. Once scouts have that, the rest is 'right arm at A plus left arm somewhere.'", "Flashlight Morse in a lit room is hard to see. Dim the lights for step 3.", "Use the Remembrance theme to keep focus: the sailors who used these signals were only a few years older than these scouts."], "safety": ["Semaphore flags on sticks are never swung near faces; scouts stand at least 2 m apart when signalling.", "Do not shine flashlights directly into anyone's eyes.", "When the lights are dimmed, no moving around the hall; stay in your patrol area.", "The relay involves walking, not running, between stations."]}, "spiritual": {"title": "Greater Love", "ref": "John 15:13", "verse": "Greater love has no one than this, than to lay down one's life for his friends.", "url": "https://www.biblegateway.com/passage/?search=John+15%3A13&version=NKJV", "message": "Tomorrow at eleven o'clock, Canada goes silent. We remember young sailors on corvettes in the North Atlantic who kept sending their signals while U-boats hunted them, and who died so that food and medicine could reach people they would never meet. Jesus said there is no greater love than laying down your life for your friends, and He proved it on the Cross. Our Church was built by people who did the same. St. George was a Roman officer who refused to deny Christ and was tortured for seven years before he was killed. St. Mina was an Egyptian soldier who left the army rather than worship the emperor, then walked into the stadium to declare his faith. The Coptic Church counts its years from the Year of the Martyrs because so many died under Diocletian. Tonight you learned to send a message without a voice. The martyrs, and the sailors we honour tomorrow, sent the clearest message of all with their lives: some things are worth more than my own safety. You will probably not be asked to die for your faith. You will be asked, this week, to be brave in small ways: to stand up for someone being mocked, to admit a mistake, to say you are a Christian when it is awkward. That is how the message gets through.", "discussion": ["Why do you think Jesus said laying down your life is the greatest love, rather than something like kindness or honesty?", "St. George and St. Mina were soldiers. What do a soldier's courage and a Christian's courage have in common? How are they different?", "What is one small brave thing you could do this week that would 'signal' your faith without words?"], "prayer": "Lord Jesus, You laid down Your life for us, and Your martyrs St. George and St. Mina followed You with courage. Give rest to all who died serving this country, comfort those who still grieve, and make us brave to signal Your love in everything we do, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Convoy Message Relay", "setup": "Each patrol splits into two halves at opposite ends of the hall, 15 m apart: the Ship station and the Shore station. A leader (the Admiral) stands at a central table with the message cards. Each Ship station has two semaphore flags and a flashlight; each Shore station has a chart, paper and pencil. Lights are dimmed slightly so flashlights show but flags are still visible.", "materials": ["Semaphore flags and a flashlight per Ship station", "Charts, paper, pencils per Shore station", "10 message cards", "Score board and timer"], "rules": ["Round 1, Semaphore (8 minutes): a runner from each Ship station walks to the Admiral, reads one message card, and walks back. The Ship station sends the word by semaphore, one letter at a time, returning to rest between letters. Shore writes down what they read and sends a runner to the Admiral with the answer. Correct spelling earns 3 points; one letter wrong earns 1 point. Then Ship and Shore swap roles for the next card.", "Round 2, Morse (8 minutes): same as round 1 but sent by flashlight only. Words are shorter (SOS, SEA, NET, TEN, SIT). Correct earns 3 points, one letter wrong earns 1.", "Round 3, Silent Convoy (6 minutes): the Admiral gives every Ship station the same 5 letter word at once. Patrols may send by either method. First correct answer delivered to the Admiral earns 5 points, second 3, third 1.", "Ships and Shores may not shout, wave charts, or use gestures other than the official signals. A patrol caught shouting a letter has that message voided.", "Highest total wins 5 patrol points, second 3, others 1. Bonus 2 points for any patrol that can send the phrase LEST WE FORGET completely in semaphore for the troop at the end.", "Runners walk. Any runner who runs sends the message back to the start."], "variations": ["Easier: allow the receiving station to hold up a letter card and ask 'again?' once per message for free.", "Harder: messages are full phrases with spaces, and the Shore station must reply with a one word acknowledgement in the same method.", "Short on time: round 1 and round 3 only."]},
