 Pascha response 'Thok Te Ti Gom' and explain its meaning.", "Serve a fellow scout in a small, humble way without being asked twice."], "materials": [{"item": "Sample ship's log page (draw the columns from the table on a large sheet) and one blank log sheet per patrol", "qty": "1 per patrol", "note": "columns: date/time, position or place, course, speed, wind, weather, sea state, remarks, signature"}, {"item": "Reflection journal sheet with the prompts from step 2, or a small notebook per scout", "qty": "1 per scout (25)", "note": "notebooks are a good year-end gift, about $1 each"}, {"item": "Pens and pencils", "qty": "25", "note": ""}, {"item": "The troop's rope kit: every rope used this year", "qty": "all", "note": "for inspection"}, {"item": "Whipping twine and scissors", "qty": "2 sets", "note": "for repairing frayed ends (Lesson 19)"}, {"item": "Troop first-aid kit, plus the printed contents checklist from the table", "qty": "1", "note": "a restock list goes to the group treasurer"}, {"item": "Review station cards: one knot card, one compass card, one first-aid card, one semaphore card, one chart card, with a question and the answer folded underneath", "qty": "1 set", "note": "quiet self-check, no scoring"}, {"item": "Compass, 2 m rope pieces, triangular bandage, semaphore flags, a simple chart or map", "qty": "1 each", "note": "props for the stations"}, {"item": "Printed lyrics and translation of 'Thok Te Ti Gom' (from the table), plus a phone or speaker with a recording", "qty": "1 per scout", "note": "Coptic Reader app or a YouTube search recording"}, {"item": "Shoe-shine kit: soft cloths, small brushes, neutral shoe polish or leather balm, damp wipes for running shoes", "qty": "1 kit per patrol", "note": "dollar store; polish only on leather shoes"}, {"item": "Basin, towel, and paper towels", "qty": "1 per patrol", "note": "for cleaning shoes and hands"}, {"item": "A cross or icon of Christ washing the disciples' feet, and a candle in a safe holder", "qty": "1", "note": "set on a small table at the front"}], "prep": ["One week before: confirm with Abouna and the church board whether the hall is free and whether to run the full 90 minutes, the 60-minute version, or move the meeting. Email families the decision by Sunday.", "Print the log sheet, reflection sheets, first-aid checklist, and hymn lyrics. Listen to the hymn several times using Coptic Reader or the YouTube search so you can lead it; ask a deacon from the church to lead the singing if possible.", "Gather every rope the troop owns into one bin. Deliberately include one rope with a frayed end and one with a damaged core if you have them, so scouts can find real faults.", "Open the first-aid kit and remove two items (for example the gloves and one triangular bandage) so the scouts' check finds real gaps. Replace them after.", "Set up five quiet review stations around the walls with a card and a prop at each. Set the small table at the front with the icon, cross, and candle.", "Prepare the shoe-shine kits and cover the tables with newspaper.", "Brief the leaders on tone: quiet voices, no whistles, no competition, and the leaders take part in the shoe shine too."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in quietly, no flag drill this week, Lord's Prayer, the leader explains why tonight is different (Holy Tuesday), attendance"}, {"time": "6:25", "min": 40, "what": "Practical: the ship's log, personal reflection journaling, quiet review stations, rope inspection, first-aid kit restock"}, {"time": "7:05", "min": 10, "what": "Spiritual: Christ washes the disciples' feet (John 13:1-17) and the Bridegroom parables (Matthew 25)"}, {"time": "7:15", "min": 25, "what": "Activity: learn 'Thok Te Ti Gom', then servant-leadership shoe shine for one another"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal to the Pascha service if it is on tonight"}], "practical": {"title": "The Ship's Log: Looking Back Before We Sail On", "intro": "Every ship keeps a log: an honest record of where it has been, what happened, and what condition it is in. Holy Week is the Church's time to stop, remember, and look at ourselves honestly. Tonight we keep the troop's log, look back over the year's skills quietly, and put our gear in order for the summer.", "steps": [{"title": "What a ship's log is", "min": 6, "detail": "Show the sample log page. A ship's log (deck log) is a legal record kept by the officer of the watch. Each entry records date and time (24-hour clock), position (latitude and longitude, or a place name in harbour), course steered, speed, wind direction and force (Beaufort), weather and visibility, sea state, barometer reading, and 'remarks': anything that happened, such as sail changes, a person overboard drill, a vessel sighted, an injury, or a prayer said at sea. Entries are written in ink, never erased (a mistake is struck through with one line and initialled), and signed at the end of each watch. Why: if something goes wrong, the log is the evidence; it also lets the next watch know exactly what happened. Ask patrols to write tonight's first entry on their patrol log sheet: '2027-04-27, 1815, St. [church] hall, all hands present except ..., weather ..., remarks: Holy Tuesday, quiet meeting.' The patrol leader signs. Keep these sheets; they start the troop's summer log."}, {"title": "Personal reflection journaling", "min": 8, "detail": "Give out the journals or sheets and ask for silence. Read the prompts slowly, one at a time, allowing about 90 seconds each; scouts write, they do not discuss. Prompt 1: 'Write your own log entry for this Sea Scout year: three skills I could not do in September that I can do now.' Prompt 2: 'A moment this year when I helped someone in the troop, and a moment when I let someone down.' Prompt 3: 'Holy Week is about Christ serving and giving Himself for us. One way I can serve at home this week without being asked.' Prompt 4: 'One skill I want to be trusted with on the water this summer, and what I need to practise to earn it.' Prompt 5: 'A short prayer in my own words for the troop.' Tell them nothing will be collected or read out; the journal is theirs. Leaders write too. Close by inviting anyone who wishes to share one line from prompt 1 or 4 only."}, {"title": "Quiet review stations", "min": 12, "detail": "Patrols rotate through five wall stations, about two minutes each, in silence or whispers, checking themselves with the answer under the card. Station 1, Knots: 'Tie a bowline, a clove hitch, and a sheet bend; name one use of each aboard.' Station 2, Compass: 'Set a bearing of 225 degrees and point to it; what direction is that?' (southwest). Station 3, First aid: 'Show the recovery position on a partner; say the three steps of check, call, care.' Station 4, Semaphore: 'Signal S, O, S and your patrol's first letter with the flags.' Station 5, Chart: 'On this chart, point to the compass rose, a depth sounding, and the symbol for a rock; say what latitude lines run.' Leaders drift between stations and quietly help anyone stuck, but do not score. The point is for each scout to know honestly what they have kept and what has slipped, and to note it on the last line of their journal: 'Skill I need to refresh before summer: ...'."}, {"title": "Rope inspection and care", "min": 7, "detail": "Tip the rope bin onto the floor and give each patrol three or four ropes. Teach the inspection: run the whole rope slowly through your hands, feeling and looking at every centimetre. Retire a rope if you find: cuts or broken strands; heavy fuzz or chafe that has worn away more than a quarter of the diameter; glazed, hard, or shiny patches (heat damage from friction); a lump or a flat spot where the core is damaged (in braided rope, if the core shows through the cover); stiffness, mildew smell, or chalky fading from sun; or if it has held a shock load such as a fall. A rope with only a frayed end can be saved: cut the frayed part off square and put on a common whipping (Lesson 19) or a tight tape wrap for the night. Wash dirty rope in fresh water with mild soap, rinse, and dry in the shade, never in a dryer. Coil every rope neatly and hang it, or store in the bin away from sunlight and chemicals. Each patrol sorts its ropes into three piles: good, repair tonight, retire, and explains each decision to a leader."}, {"title": "First-aid kit restock", "min": 7, "detail": "Lay out the troop kit and give a patrol the printed checklist. Read each item aloud while a scout finds it and checks the quantity and the expiry date (many wipes, ointments, and cold packs have dates). Standard contents for a troop kit: nitrile gloves (several pairs), CPR face shield, at least 25 adhesive bandages of mixed sizes, sterile gauze pads 5 x 5 cm and 10 x 10 cm, two roller gauze bandages, medical tape, two or three triangular bandages with safety pins, antiseptic wipes, tweezers, blunt scissors, instant cold pack, emergency foil blanket, elastic tension bandage, saline eyewash, hand sanitizer, a pencil and incident report forms, and a list of emergency numbers. Anything used this year (there will be gaps) goes on the restock list with the quantity. Write the list on the flip chart, and the patrol leader hands it to the treasurer. Remind: kits go in a waterproof bag on the water, and everyone must know where the kit is at camp."}], "tips": ["Keep your own voice low all night; the scouts will match you.", "Do not skip the journaling because it feels slow. Many scouts have never been given ten silent minutes to think, and some will remember it for years.", "If a scout is not comfortable writing, let them draw a log page or list words.", "The rope with the hidden core damage is the best teaching moment; let them find it by feel.", "In the 60-minute version, do steps 1, 2, 4, and 5 only and shorten each by a minute."], "safety": ["Candle only in a stable holder on the front table, away from paper and ropes, and put out before the shoe shine.", "Scissors for whipping are used seated; whipping twine cut by leaders for younger scouts.", "Shoe polish is for leather only and kept off skin and eyes; use wipes for running shoes. Ventilate the hall if using polish.", "No snack tonight; scouts may drink water. Be sensitive to those fasting until sunset."]}, "spiritual": {"title": "The Servant King and the Bridegroom", "ref": "John 13:1-17; Matthew 25:1-13", "verse": "If I then, your Lord and Teacher, have washed your feet, you also ought to wash one another's feet. For I have given you an example, that you should do as I have done to you.", "url": "https://www.biblegateway.com/passage/?search=John+13%3A1-17&version=NKJV", "message": "Tonight is Holy Tuesday. In church this week we hear over and over, 'Behold, the Bridegroom comes at midnight; blessed is the servant whom He shall find watching.' Jesus told the parable of the ten virgins on this day: five had oil in their lamps and were ready when the Bridegroom came, five had let their lamps run dry. Tonight you checked the troop's ropes and the first-aid kit for the same reason: a crew that is not ready is a crew in danger. Holy Week asks, is your lamp full? Then, on Thursday, Jesus does something no king had ever done. He takes off His outer clothes, ties a towel around His waist, and washes the feet of His disciples, including the feet of Judas who would betray Him a few hours later. Peter protests; Jesus insists. Then He says, 'I have given you an example, that you should do as I have done to you.' The Sea Scout motto, Be Prepared, and the Scout Promise, to help other people at all times, meet here. Being prepared is not just gear; it is a ready heart. Helping others is not just big rescues; it is kneeling to do a small, humble job for someone who may not thank you. In a few minutes you will clean each other's shoes. It will feel a bit awkward. Good. It felt awkward to Peter too. Do it as if for Christ.", "discussion": ["Jesus washed Judas's feet knowing what he would do. What does that tell us about how we should treat people who have hurt us?", "The five wise virgins could not share their oil. What is the 'oil' in your life that nobody else can keep full for you?", "What is the hardest part of serving someone in a humble way, and why do you think Christ chose this example the night before He died?"], "prayer": "Lord Jesus Christ, who on this holy night taught us to watch for the Bridegroom, and who knelt to wash the feet of Your disciples, fill our lamps with Your grace and make us glad to serve one another. Bring us through Your Passion to the joy of Your Resurrection. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Thok Te Ti Gom and the Servant's Shoe Shine", "setup": "Part 1 (10 min): scouts stand in a semicircle facing the front table with the icon and candle; give out the lyric sheets. A deacon or leader leads; play the recording once first. Part 2 (15 min): tables covered with newspaper, one shoe-shine kit per patrol; put out the candle before starting. Each scout pairs with someone from their own patrol they do not usually sit with; the patrol leader pairs with the youngest scout, and every leader pairs with a scout.", "materials": ["Lyric sheets with transliteration and translation (table below)", "Phone or speaker with a recording of the hymn", "Shoe-shine kits: cloths, brushes, neutral polish or leather balm, damp wipes", "Basins, towels, paper towels, newspaper", "Hand sanitizer"], "rules": ["Hymn: explain that 'Thok te ti-gom' is sung twelve times at each hour of the Pascha, four times in each of three languages in many churches, and that the words are the Church's confession that all power belongs to Christ even as He goes to the Cross. Play the recording once while scouts follow the sheet with a finger.", "Teach line by line: the leader sings 'Thok te ti-gom nem pi-o-ou' and scouts echo; then 'nem pi-esmou nem pi-amahi sha eneh, Amen'; then the ending 'Emmanouil Pen-nouti Pen-ouro'. Repeat each line three times, then sing the whole verse together twice, slowly and quietly.", "Add the second ending 'Pa-chois Isos Pi-ekhristos' and the third 'Ta-gom nem pa-esmou pe Epchois, af-shopi ni ev-ou-sotiria ef-ouab', then sing the full sequence once. Finish by explaining that on Bright Saturday and at the Resurrection the tune changes from mournful to joyful; if time allows, listen to a clip of the joyful tune.", "Shoe shine: each scout removes one shoe at a time and hands it to their partner. The partner wipes the shoe clean, brushes off dirt, and for leather applies a small amount of polish with the cloth in circles and buffs with the brush; for running shoes, uses damp wipes on the uppers and a dry cloth. Then they return it and say, 'May the Lord bless your steps.' Swap roles. No jokes about smell, no refusing, no rushing.", "While shoes are being cleaned, the leader reads John 13:3-9 aloud once, slowly, then leaves silence.", "Finish: everyone washes hands, tidies the kit, and returns to the semicircle for one last quiet 'Thok te ti-gom' with the candle relit. No winners, no points tonight.", "60-minute version: teach only the first verse with the first ending (5 min) and do the shoe shine in 10 min, one shoe each."], "variations": ["If a deacon is available, learn the hymn in Coptic and English, and let him explain the Pascha book.", "If the church prefers no polish in the hall, do a 'foot-washing style' service instead: each scout carries the other's chair, bag, and coat to the door at the end, and cleans the other's section of the hall.", "If most scouts already know the hymn, learn the response 'Amen, Amen, Amen. Ke tou logou' or the Good Friday 'Omonogenis' first line instead, with Abouna's guidance.", "Invite scouts to attend the Pascha service together in uniform immediately after; sit as a troop and sing what you learned."]}, "tables": [{"caption": "Thok Te Ti Gom (Pascha response), transliteration and meaning", "headers": ["Coptic (transliterated)", "English meaning"], "rows": [["Thok te ti-gom nem pi-o-ou nem pi-esmou nem pi-amahi sha eneh, Amen.", "Thine is the power, the glory, the blessing, and the majesty, forever. Amen."], ["Emmanouil Pen-nouti Pen-ouro.", "Emmanuel our God and our King."], ["(repeat first line) Pa-chois Isos Pi-ekhristos.", "My Lord Jesus Christ."], ["(repeat first line) Ta-gom nem pa-esmou pe Epchois, af-shopi ni ev-ou-sotiria ef-ouab.", "The Lord is my strength and my praise, and He has become my holy salvation."]]}, {"caption": "Troop first-aid kit checklist", "headers": ["Item", "Minimum quantity", "Check"], "rows": [["Nitrile gloves (pairs)", "6", "Present, not cracked"], ["CPR face shield", "2", "Present"], ["Adhesive bandages, mixed sizes", "25", "Count, expiry"], ["Sterile gauze pads 5 x 5 cm and 10 x 10 cm", "10 each", "Sealed, expiry"], ["Roller gauze and medical tape", "2 rolls each", "Present"], ["Triangular bandages with safety pins", "3", "Count"], ["Antiseptic wipes", "20", "Expiry"], ["Tweezers, blunt scissors", "1 each", "Present"], ["Instant cold pack", "2", "Expiry, not hardened"], ["Emergency foil blanket", "2", "Sealed"], ["Elastic tension bandage", "2", "Present"], ["Saline eyewash", "1", "Expiry"], ["Incident report forms, pencil, emergency numbers", "5 forms", "Present, numbers current"]]}], "references": [{"label": "Coptic Reader app", "url": "https://www.copticreader.com/", "why": "The full Pascha book with the text and audio of 'Thok Te Ti Gom' in Coptic, English, and Arabic."}, {"label": "YouTube search: Thok te ti gom Pascha hymn Coptic", "url": "https://www.youtube.com/results?search_query=thok+te+ti+gom+pascha+hymn+coptic", "why": "Recordings to play and learn the tune; also search the joyful Bright Saturday tune for contrast."}, {"label": "St-Takla.org", "url": "https://st-takla.org/", "why": "Holy Week readings, the meaning of Holy Tuesday, and the rites of the Pascha in the Coptic Church."}, {"label": "Canadian Red Cross: First aid tips and resources", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Recommended kit contents to compare with the checklist."}, {"label": "Animated Knots: Common Whipping", "url": "https://www.animatedknots.com/common-whipping-knot", "why": "Repairing frayed rope ends found during inspection."}, {"label": "Bible Gateway: John 13:1-17 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+13%3A1-17&version=NKJV", "why": "The foot-washing passage to read aloud during the shoe shine."}], "visual": null, "takeHome": "Attend at least one Pascha service this week and, without telling anyone, do one hidden act of service at home each day until the Resurrection; write each one in your journal's log."}, {"n": 31, "date": "2027-05-04", "term": "Spring", "title": "Safe Boating Prep", "theme": "Christ is Risen! The operator card, required equipment, and the pre-departure routine", "sea": true, "calendar": ["BRIGHT WEEK (May 2 to 8): Christ is Risen! Truly He is Risen! (Ekhrestos Anesti! Alithos Anesti!) Open with the Resurrection greeting three times. No fasting all week; the Holy Fifty Days run to Pentecost (Jun 20), no fasting on Wednesdays or Fridays either.", "Red eggs are the traditional Coptic and Orthodox Easter food. Hard-boil and dye them red on Monday; bring two per scout plus spares. Check egg allergies; keep plastic eggs with a small treat inside for anyone allergic.", "Celebration snack allowed: cheese, cookies, and juice. Check allergies.", "Safe Boating Awareness Week in Canada is usually the third week of May; this lesson sets up Lesson 33 (self-rescue) and the summer regatta."], "objectives": ["Explain who needs a Pleasure Craft Operator Card, the age and horsepower limits for young operators, and the penalty for operating without proof.", "List the Transport Canada required safety equipment for a pleasure craft up to 6 m and one of 6 to 9 m, and for a canoe or kayak.", "Run a pre-departure checklist and fill in a float plan for a day trip.", "Describe four fuel and engine safety rules including the one-third fuel rule and the bilge blower.", "State the Canadian law on alcohol, cannabis, and boating and why Ontario treats it like impaired driving."], "materials": [{"item": "Transport Canada Safe Boating Guide, printed equipment tables (pages on minimum equipment by boat length)", "qty": "1 per patrol", "note": "download from the reference link; the tables are the core of the lesson"}, {"item": "Real safety equipment for show and tell: PFD, buoyant heaving line (15 m), whistle, bailer, watertight flashlight, paddle, small anchor with line, expired flare for display only (or a photo), 5BC fire extinguisher, magnetic compass, navigation light", "qty": "1 each", "note": "borrow from boating families; an expired flare is display only and never fired"}, {"item": "Scavenger hunt cards: 30 cards naming pieces of equipment (including decoys such as 'cell phone', 'bucket with a hole', 'pool noodle', 'expired flare', 'road flare', 'sunscreen')", "qty": "1 set", "note": "index cards; hide around the hall"}, {"item": "Boat assignment cards: '4.5 m aluminum fishing boat, 25 hp outboard, portable fuel tank, day trip on a lake'; '7.5 m sailboat with inboard diesel, overnight'; '4.8 m canoe, two paddlers, river day trip'; '5.5 m bowrider, fixed fuel tank, evening cruise returning after sunset'", "qty": "1 per patrol", "note": "each patrol gets a different boat"}, {"item": "Blank float plan forms (fields listed in step 4)", "qty": "1 per patrol", "note": "print or hand-write on paper"}, {"item": "Hard-boiled red eggs", "qty": "2 per scout plus 10 spares (60)", "note": "dye with red food colouring and vinegar, or onion skins; keep refrigerated until used"}, {"item": "Plastic eggs with a small treat", "qty": "5", "note": "for scouts with egg allergy"}, {"item": "Napkins, garbage bag, and a bowl for shells", "qty": "1 set", "note": ""}, {"item": "Celebration snack: cheese, crackers, cookies, juice", "qty": "for 25", "note": "Bright Week; check allergies"}, {"item": "Whiteboard or flip chart and markers", "qty": "1", "note": ""}], "prep": ["Read the Transport Canada Safe Boating Guide sections on the Pleasure Craft Operator Card, minimum safety equipment, and float plans. Print the equipment tables for each patrol. Verify the current guide, because the regulations are updated from time to time.", "Collect the show-and-tell equipment from boating families and lay it on a table under a sheet, to be revealed item by item.", "Write the scavenger hunt cards and hide them around the hall before scouts arrive, some obvious and some hard (under chairs, behind the flag stand). Keep a list of where each card is.", "Hard-boil and dye the eggs on Monday. Bring them in a cooler.", "Learn the Resurrection greeting in Coptic, Greek, and English and practise the red-egg game so you can explain it in 30 seconds.", "Ask a parent with a PCOC and a boat to attend and share two real stories: one pre-departure check that saved a trip, and one time the weather changed.", "Print the float plan forms and prepare a sample filled-in float plan on the flip chart."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in by patrol, 'Christ is Risen!' 'Truly He is Risen!' three times, flag, Scout Promise, Lord's Prayer, announcements, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: operator card, required equipment by boat size, pre-departure checklist, float plan, fuel and engine safety, alcohol and the law"}, {"time": "7:05", "min": 10, "what": "Spiritual: the Risen Christ on the shore, breakfast with the disciples (John 21:9-13)"}, {"time": "7:15", "min": 25, "what": "Activity: red-egg cracking tournament, then the safety-equipment scavenger hunt by boat type, then celebration snack"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "Before You Leave the Dock", "intro": "Most boating deaths in Canada happen on calm days in small boats, to people who were not wearing a lifejacket and had not planned for anything to go wrong. Tonight you learn what the law requires on board, and, more importantly, the habit of checking everything before you cast off. A Sea Scout who does the pre-departure routine every single time will be the safest person on the lake.", "steps": [{"title": "The Pleasure Craft Operator Card", "min": 6, "detail": "Since September 15, 2009, anyone who operates a pleasure craft fitted with any motor, even a small electric trolling motor, must carry proof of competency on board, normally the Pleasure Craft Operator Card (PCOC). There is no minimum age for the card. You earn it by passing a Transport Canada accredited test, usually online, after a short course; it is good for life. Operating without proof of competency can bring a fine of $250. There are also age and power limits, regardless of the card: under 12 years old, and not directly supervised by someone 16 or older, you may operate no more than 10 hp (7.5 kW); age 12 to 15 without direct supervision, no more than 40 hp (30 kW); under 16, you may never operate a personal watercraft (Sea-Doo type), even with an adult on board. Canoes, kayaks, and sailboats without motors do not need the card, but the operator is still responsible for carrying the required equipment. Ask: who here is 12 to 15? Explain what they could legally drive this summer with the card and a parent's boat, and encourage them to write the test before camp."}, {"title": "Required equipment by boat size", "min": 12, "detail": "Hand out the printed tables and reveal each real item as you name it. Pleasure craft up to 6 m (about 20 ft), which covers most fishing boats, runabouts, and dinghies: one Canadian-approved lifejacket or PFD of the right size for every person on board; one buoyant heaving line at least 15 m long; one manual propelling device (paddle or oars) or an anchor with at least 15 m of rope, cable, or chain; one bailer or manual bilge pump (not needed if the boat cannot hold enough water to capsize it, or has sealed compartments); one sound-signalling device such as a whistle or horn; navigation lights if you operate after sunset, before sunrise, or in fog; one magnetic compass (not needed if the boat is under 8 m and you stay within sight of navigation marks); a radar reflector under some conditions; one watertight flashlight or three Canadian-approved flares of type A, B, or C (flares are not needed on a lake or river where you are never more than one nautical mile from shore); and one 5BC fire extinguisher if the boat has an inboard engine, a fixed fuel tank, or a fuel-burning cooking, heating, or fridge appliance. Boats over 6 m up to 9 m add: a reboarding device (ladder) if the freeboard is over 0.5 m; the heaving line can be replaced by a lifebuoy tied to 15 m of buoyant line; a 10BC extinguisher if inboard, fixed tank, or appliance; a watertight flashlight AND six flares of type A, B, C, or D (no more than two type D smoke); plus the compass, sound device, lights, and radar reflector. Human-powered boats (canoes, kayaks, rowboats): a PFD for each person, a 15 m buoyant heaving line, a bailer or pump, a sound-signalling device, and navigation lights if out after sunset. Explain flare types: A is a rocket parachute, B multi-star, C hand-held, D smoke; flares expire four years after the date stamped on them. Then have each patrol read its boat card and, using the table, list its required equipment on paper (this list is used in the scavenger hunt)."}, {"title": "Pre-departure checklist", "min": 7, "detail": "Write the checklist on the board and have scouts copy it into their journals; they will use it at camp. Weather: check the marine forecast at weather.gc.ca and look at the sky; know when you will turn back. Boat: drain plug in (say it twice, it is the number one embarrassing mistake), hull and engine visually checked, bilge dry, battery charged, lights working, kill-switch lanyard attached to the operator. Fuel: full tank, and follow the one-third rule: one third to get there, one third to get back, one third in reserve. Equipment: run through the required list from step 2, PFDs on everyone and zipped, whistle on each PFD, heaving line ready, bailer clipped in, paddle aboard, flashlight works, chart and compass, VHF or a phone in a waterproof bag. People: everyone knows where the kit is, how to stop the engine, and what to do if someone falls in (Lesson 22). Load: weight balanced, not over the capacity plate limit, nobody sitting on the gunwales or bow. Float plan filed. Finally, a prayer before pushing off; every Coptic boat crew can say the Lord's Prayer in ten seconds."}, {"title": "The float plan", "min": 6, "detail": "A float plan is a written note of your trip left with a responsible person on shore who will call for help if you are overdue. Show the sample on the flip chart and fill in a blank one with a patrol: name and phone of the operator; number of people on board and their names; boat description (type, length, colour, name, licence or registration number, engine); safety and signalling equipment carried (radio type and channel, flares, PFDs); departure point and time; route and stops; destination and expected return time; vehicle and trailer description and where they are parked; and the instruction: 'If we have not called by [time], call the Joint Rescue Coordination Centre or 911 and give them this plan.' The person holding the plan must be told when you are safely back, or they will send a search. At camp, the float plan is the sign-out sheet on the dock, and no boat leaves without it. Each patrol now fills in a float plan for its assigned boat card, inventing sensible details; leaders check them for missing fields."}, {"title": "Fuel, engine, and carbon monoxide", "min": 5, "detail": "Fuel safety: refuel on the dock, engine off, everyone off the boat, no smoking, no phones, portable tanks filled on the dock not in the boat, and wipe up every spill because gasoline vapour is heavier than air and sinks into the bilge. Boats with inboard gasoline engines have a bilge blower: run it for at least four minutes before starting, and do the sniff test at the engine hatch. Outboards: check the fuel line is connected and the vent is open on portable tanks. Engine safety: the operator wears the kill-switch lanyard so the engine stops if they fall; turn the engine off, not just to neutral, whenever anyone is in the water near the boat, because propellers cause terrible injuries. Carbon monoxide from any engine is invisible and odourless; never let anyone sit on the swim platform or 'teak surf' behind a running boat, and ventilate cabins. Ask: what is wrong with this picture? (Describe a scout filling a tank inside the boat while the engine idles and a friend swims off the stern.)"}, {"title": "Alcohol, cannabis, and the law", "min": 4, "detail": "Be direct. Under the Criminal Code of Canada, operating a boat while impaired by alcohol or drugs is the same offence as impaired driving: criminal record, fines, possible jail, and in Ontario the same driver's licence suspension you would get in a car. Ontario police also lay charges in the warn range (0.05 to 0.08 blood alcohol). It is illegal in Ontario to have open alcohol on a boat unless the boat has permanent sleeping, cooking, and toilet facilities and is anchored or docked. Alcohol on the water is worse than on land because sun, wind, motion, and dehydration multiply its effect. About 40 percent of boating deaths in Canada involve alcohol. A Sea Scout will one day be a passenger in a boat with an adult who has been drinking; decide now what you will say and do: refuse to go, call a parent, and never take the tiller yourself to 'help'. Cannabis follows the same rules. Ask the guest parent to share their two stories to close the practical."}], "tips": ["Show and tell works: let scouts hold the heaving line, blow the whistle once, and feel the weight of the extinguisher.", "The equipment tables are dense; teach them through the four boat cards so scouts apply them instead of memorising.", "Scouts remember 'drain plug in' if you tell a real story of a boat sinking at the ramp.", "Keep the alcohol talk factual and calm; several scouts will have seen adults drink on boats."], "safety": ["The display flare must be expired and is never fired or handled by scouts. A photo is a fine substitute.", "Fire extinguisher stays with the pin in; scouts may lift it but not discharge it.", "Red-egg game: eggs are food, hard-boiled the day before and refrigerated; egg-allergic scouts use the plastic eggs. Wash hands before the snack.", "Keep the hunt at walking pace; no climbing on chairs or the stage."]}, "spiritual": {"title": "Breakfast on the Shore", "ref": "John 21:9-13", "verse": "Then, as soon as they had come to land, they saw a fire of coals there, and fish laid on it, and bread. Jesus said to them, 'Bring some of the fish which you have just caught.'", "url": "https://www.biblegateway.com/passage/?search=John+21%3A9-13&version=NKJV", "message": "Christ is Risen! Truly He is Risen! This is the greatest week of the year, and the Church does not fast, does not kneel, and sings the Resurrection hymn in every service until Pentecost. Look at what the Risen Lord does in John 21. He does not appear in a blaze of glory on a mountain. He stands on a beach at dawn, with a small charcoal fire, cooking breakfast for seven tired, wet fishermen who had failed Him a few days before. He had already prepared the fire, the fish, and the bread before they came ashore. Tonight you learned pre-departure checklists and float plans, the quiet preparation that nobody sees but that keeps a crew alive. Jesus is the God of quiet preparation. Before you ever call on Him, He has already laid the fire. Notice too that He says, 'Bring some of the fish which you have just caught.' He does not need their fish, but He wants their work included in His meal. Your skills, your checklists, your summer on the water: He wants them brought to His fire. Peter, who denied Him three times by a charcoal fire in the high priest's courtyard, now meets Him by another charcoal fire and will be asked three times, 'Do you love Me?' The Resurrection is God's float plan for the world: He said when He would return, and He kept His word. Nobody who trusts Him is ever overdue.", "discussion": ["Jesus prepared breakfast before the disciples arrived. Where have you seen God prepare something for you before you knew you needed it?", "Why do you think Jesus asked for their fish when He already had fish on the fire? What 'fish' can you bring Him this summer?", "Peter failed by one charcoal fire and was restored by another. Is there a failure from this year you need to bring to the Risen Christ?"], "prayer": "Risen Lord Jesus, who stood on the shore and fed Your disciples, prepare the way before us on every water we sail this summer. Make us careful, honest, and ready, and bring every crew home. Christ is Risen, truly He is Risen. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Red Eggs and the Great Equipment Hunt", "setup": "Part 1 (8 min): patrols stand in circles; each scout holds one red egg; allergic scouts hold plastic eggs and act as patrol referees. Part 2 (14 min): patrols keep their boat card and the equipment list they wrote in the practical; 30 equipment cards are hidden around the hall; one leader holds the answer key. Part 3 (3 min): snack table opens.", "materials": ["Red eggs, 2 per scout plus spares", "Plastic eggs with treats for allergic scouts", "Bowl for shells, napkins", "30 hidden equipment cards (including decoys)", "Boat cards and each patrol's written equipment list", "Score sheet and answer key", "Celebration snack"], "rules": ["Red-egg tradition: the red shell is the blood of Christ and the egg is the tomb; cracking it open is the Resurrection breaking the tomb. Before each tap, the tapper says 'Christ is Risen!' and the holder answers 'Truly He is Risen!'", "Round 1, patrol: pair up. One scout holds their egg pointed end up in a fist so only the tip shows; the other taps it once with the pointed end of their own egg. Whichever egg cracks loses that end. Then swap so the other scout taps. If both ends of an egg are cracked, that scout is out. Winners keep pairing off until one champion per patrol remains (about 4 min). Eat your cracked egg (peel over the bowl).", "Round 2, troop: the patrol champions play off in the same way in front of everyone until one troop champion remains. Champion's patrol earns 5 points toward the hunt. Second egg is for eating or for a rematch at the end.", "Equipment hunt: on 'Go', patrols search the hall for the hidden cards. A patrol may pick up any card but may keep only cards that are required for THEIR boat card. When a patrol has all of its required items, it shouts 'Ready to sail!' and the leader checks.", "Scoring: +2 for every correct required item held; -2 for every decoy or non-required item held ('cell phone' is not a required signalling device; 'road flare' and 'expired flare' do not count; 'pool noodle' is not a PFD); -3 for every required item missing when checked. +5 bonus if the patrol's float plan from the practical is complete with every field filled.", "Cards left on the floor after 'Ready to sail!' must be returned to the leader; a patrol that hides cards from another patrol loses 5 points.", "Highest total wins and chooses the first snack. Everyone then says the Resurrection greeting and eats."], "variations": ["Short on time: skip Round 2 of the eggs and end the hunt after 8 minutes, scoring what each patrol holds.", "Harder: after the hunt, patrols must lay out their cards in the order of the pre-departure checklist and explain one item to the guest parent.", "Easier: post the equipment table on the wall and let patrols consult it during the hunt.", "Bright Week bonus: any scout who can say 'Christ is Risen' in Coptic, Greek, Arabic, and English earns 1 point for their patrol."]}, "tables": [{"caption": "Minimum safety equipment, Transport Canada (confirm with the current Safe Boating Guide)", "headers": ["Item", "Up to 6 m", "Over 6 m to 9 m", "Canoe, kayak, rowboat"], "rows": [["Approved PFD or lifejacket, right size, per person", "Yes", "Yes", "Yes"], ["Buoyant heaving line, at least 15 m", "Yes", "Yes, or a lifebuoy on 15 m of buoyant line", "Yes"], ["Reboarding device", "No", "Yes if freeboard over 0.5 m", "No"], ["Paddle or oars, OR anchor with 15 m line", "Yes", "Yes", "Paddles are the propulsion"], ["Bailer or manual bilge pump", "Yes (unless it cannot hold enough water to capsize)", "Yes", "Yes (same exemption)"], ["Sound-signalling device (whistle or horn)", "Yes", "Yes", "Yes"], ["Navigation lights", "If out after sunset, before sunrise, or in fog", "Yes", "If out after sunset or in fog"], ["Magnetic compass", "Yes, unless under 8 m and within sight of navigation marks", "Yes", "Not usually required"], ["Radar reflector", "Under certain conditions", "Under certain conditions", "Under certain conditions"], ["Watertight flashlight and flares", "Flashlight OR 3 flares (A, B, or C); flares not needed within 1 nautical mile of shore on lakes and rivers", "Flashlight AND 6 flares (A, B, C, or D; max 2 D)", "Not usually required"], ["Fire extinguisher", "5BC if inboard engine, fixed fuel tank, or fuel-burning appliance", "10BC if inboard, fixed tank, or appliance", "No"]]}, {"caption": "Young operator limits (with a PCOC)", "headers": ["Age", "Without direct supervision", "Personal watercraft"], "rows": [["Under 12", "Up to 10 hp (7.5 kW)", "Never"], ["12 to 15", "Up to 40 hp (30 kW)", "Never"], ["16 and over", "Any power", "Allowed with card"]]}], "references": [{"label": "Transport Canada: Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "The official source for the operator card rules, the minimum equipment tables by boat length, flare types, and the float plan template. Print the tables."}, {"label": "Canadian Safe Boating Council", "url": "https://csbc.ca/", "why": "Safe Boating Awareness Week materials, cold water and lifejacket campaigns, and alcohol statistics."}, {"label": "Environment Canada: Marine weather forecasts", "url": "https://weather.gc.ca/marine/", "why": "The forecast page scouts should check as the first item of any pre-departure checklist."}, {"label": "Wikipedia: Personal flotation device", "url": "https://en.wikipedia.org/wiki/Personal_flotation_device", "why": "Background on PFD types and standards to answer questions."}, {"label": "Coptic Orthodox Church Network", "url": "https://www.copticchurch.net/", "why": "Resurrection feast readings and the meaning of the red egg tradition and the Holy Fifty Days."}, {"label": "Bible Gateway: John 21:9-13 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=John+21%3A9-13&version=NKJV", "why": "The breakfast on the shore passage."}], "visual": null, "takeHome": "With a parent, write a float plan for a real or imaginary day trip on a nearby lake and check whether the family's or a friend's boat carries every item on the equipment list; bring the float plan next week."}, {"n": 32, "date": "2027-05-11", "term": "Spring", "title": "Signal Flags, Bells & Nautical Time", "theme": "Speaking without words: the International Code of Signals, ship's bells, and the 24-hour clock", "sea": true, "calendar": ["Holy Fifty Days (May 2 to Jun 20): no fasting, including Wednesdays and Fridays. Open with 'Christ is Risen! Truly He is Risen!'", "Mother's Day was Sunday May 9; have scouts write a signal-flag message to their mother as a bonus.", "Ascension is Jun 10 and Pentecost Jun 20; the year-end lesson is May 25, two weeks away. Collect summer camp forms."], "objectives": ["Recognise at least 12 International Code of Signals alphabet flags by colour and pattern and give the single-flag meaning of A, B, C, D, N, O, P, U, V, W.", "Spell a short word with flag cards and decode a hoist from a chart.", "Explain the ship's watch system and strike the correct number of bells for a given time.", "Convert between 12-hour and 24-hour time and say a 24-hour time correctly.", "Make a proper log entry using 24-hour time and standard columns."], "materials": [{"item": "Printed colour chart of the 26 alphabet flags (print from the Wikipedia article in the references)", "qty": "1 per patrol plus 1 large for the wall", "note": "colour printing matters; laminate for reuse"}, {"item": "Blank white index cards 10 x 15 cm and markers in red, blue, yellow, black", "qty": "26 cards and 4 markers per patrol", "note": "patrols colour their own flag deck during the practical"}, {"item": "Pre-made hoist message strips (leader prepares 8 messages using flag pictures or letter sequences, see activity)", "qty": "1 set", "note": "hand-drawn on paper is fine"}, {"item": "Ship's bell or a hand bell; if none, a metal pot and a spoon", "qty": "1", "note": "borrow from the church or a cadet unit"}, {"item": "Large analog clock face (paper plate with hands) and a 24-hour time table", "qty": "1", "note": "for the time drill"}, {"item": "Patrol flag blanks: 30 x 45 cm felt or cotton rectangles, fabric markers or felt scraps and glue, 60 cm dowel per patrol", "qty": "1 per patrol", "note": "about $4 per patrol at a craft store"}, {"item": "Log sheets (same columns as Lesson 30)", "qty": "1 per patrol", "note": ""}, {"item": "Snack: no fast, cookies and juice", "qty": "for 25", "note": "check allergies"}], "prep": ["Print the alphabet flag chart in colour, one per patrol and one poster-size for the wall. Study the table in this lesson until you can name 15 flags on sight.", "Prepare 8 message strips for the decoding race: 3 single-flag meanings (e.g., O; A; V), 2 two-flag hoists (NC = distress, AC = I am abandoning my vessel), and 3 spelled words (e.g., HELP, PORT, SCOUT). Draw the flags or write the letters with the colour pattern beside them.", "Practise striking bells: pairs of strikes with a pause, 'ding-ding, ding' for three bells. Learn the dog watch exception.", "Cut the patrol flag blanks and gather fabric markers and dowels.", "Make a 24-hour clock poster: two columns, 1 pm = 1300 through midnight = 0000.", "Set up the room with a decoding table at one end and the craft table at the other."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in, 'Christ is Risen!', flag, Scout Promise, Lord's Prayer, announcements, attendance; strike two bells (1815 is not a bell time, so explain that after the lesson)"}, {"time": "6:25", "min": 40, "what": "Practical: alphabet flags and single-flag meanings, spelling and hoists, ship's bells and watches, 24-hour time and the log"}, {"time": "7:05", "min": 10, "what": "Spiritual: let your light shine (Matthew 5:14-16)"}, {"time": "7:15", "min": 25, "what": "Activity: flag message decoding race, then make a patrol flag"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, strike the bell, dismissal"}], "practical": {"title": "Flags, Bells, and the Ship's Clock", "intro": "Long before radio, ships talked to each other with coloured flags, and they still do. A single flag can mean 'man overboard' or 'keep clear, diver down', and every mariner in the world understands it. Tonight you learn the flag alphabet, how a ship keeps time with bells, and how to write it all in the log like a real watch officer.", "steps": [{"title": "The International Code of Signals alphabet flags", "min": 12, "detail": "Put the poster on the wall. The International Code of Signals (ICS) gives each letter a flag and a phonetic name (the same NATO alphabet from Lesson 21). Each flag also has a meaning when flown alone. Teach them in groups. Emergencies: O (Oscar, red and yellow diagonal halves) man overboard; V (Victor, white with a red X) I require assistance; W (Whiskey, blue border, white, red centre) I require medical assistance; U (Uniform, red and white quarters) you are running into danger; F (Foxtrot, white with a red diamond) I am disabled, communicate with me. Keep clear group: A (Alfa, white and blue swallowtail) diver down, keep well clear at slow speed; B (Bravo, red swallowtail) I am carrying dangerous goods; D (Delta, yellow, blue, yellow bands) keep clear, I am manoeuvring with difficulty; H (Hotel, white and red halves) I have a pilot on board; G (Golf, yellow and blue vertical stripes) I require a pilot. Answers: C (Charlie, blue, white, red, white, blue bands) yes; N (November, blue and white checks) no. Movement: E (Echo, blue over red) I am altering course to starboard; I (India, yellow with a black circle) altering course to port; M (Mike, blue with a white X) my vessel is stopped; S (Sierra, white with a blue square) I am going astern; L (Lima, yellow and black quarters) stop your vessel instantly; K (Kilo, yellow and blue halves) I wish to communicate with you. Harbour: P (Papa, blue with a white square, the Blue Peter) all persons report aboard, vessel about to sail; Q (Quebec, plain yellow) my vessel is healthy, I request free pratique (permission to enter port); Y (Yankee, yellow and red diagonal stripes) I am dragging my anchor; Z (Zulu, four coloured triangles) I require a tug. Two-flag hoist NC means distress. While you teach, each patrol colours its 26 cards from the chart, writing the letter and meaning on the back."}, {"title": "Spelling and reading a hoist", "min": 8, "detail": "A hoist is a group of flags flown together on one halyard, read from the top down. Single flags carry the meanings above; groups of letters spell code words or, in modern practice, plain words such as a boat's name. Ships also fly the answering pennant (red and white vertical stripes) to show 'I understand', and numeral pennants for numbers. Rules for the hall: read top to bottom; a single flag means its message, not its letter; three or more letters are spelled words unless told otherwise. Demonstrate with the wall poster: hold up O alone ('man overboard!'), then hold up S, O, S as a spelled word (not a real flag signal, but fun), then P alone ('everyone back to the boat, we sail in an hour'). Each patrol now uses its coloured cards to spell its patrol name, then a leader walks around, points at a random card, and the patrol must call out the letter, the phonetic name, and the single-flag meaning. Then patrols send a three-card 'hoist' to the patrol beside them to decode, held up in a vertical line by three scouts."}, {"title": "Ship's bells and the watch system", "min": 8, "detail": "Sailors before clocks divided the day into watches of four hours and marked every half hour with the bell. The watches: First watch 2000 to 0000; Middle watch 0000 to 0400; Morning watch 0400 to 0800; Forenoon watch 0800 to 1200; Afternoon watch 1200 to 1600; and two short dog watches, First Dog 1600 to 1800 and Last Dog 1800 to 2000, so that the crew's watch times rotate each day. Bells: one bell at the first half hour of a watch, two at the hour, three at the next half hour, and so on, up to eight bells at the end of a four-hour watch. Strike them in pairs: 'ding-ding' for two, 'ding-ding, ding' for three. So 0430 is one bell, 0500 two bells, 0730 seven bells, 0800 eight bells. The dog watches are the exception: 1630 one bell, 1700 two, 1730 three, 1800 four bells; then 1830 one bell, 1900 two, 1930 three, and 2000 eight bells (a tradition since the Royal Navy's 1797 mutiny, when five bells in the dog watch was the signal to rise). At New Year, sixteen bells are struck at midnight. Practise: leader calls a time, a scout strikes it; then reverse, leader strikes, patrols write the time. Our meeting starts at 1815, which is between bells; the closing at 1945 is between three and eight bells of the Last Dog."}, {"title": "24-hour time and the log", "min": 8, "detail": "Ships, aircraft, and the Canadian Armed Forces use the 24-hour clock so that no time is ever confused. Midnight is 0000 ('zero hundred'), 1 am is 0100 ('oh one hundred'), noon is 1200, 1 pm is 1300 (add 12 to any pm hour), 6:15 pm is 1815 ('eighteen fifteen'), and 11:59 pm is 2359. Write it with four digits and no colon in the log. Drill: show the paper clock at a pm time and have patrols write the 24-hour form; then say '2140' and have them show it on the clock (9:40 pm). Common errors: writing 2400 (use 0000 of the next day), and dropping the leading zero (0730 not 730). Now the log: give each patrol a log sheet and dictate three events to record in 24-hour time with the standard columns from Lesson 30: '1830, hall, wind calm, weather clear, remarks: flag Oscar hoisted, MOB drill (simulated)'; '1900, remarks: three bells struck, log inspected'; '1945, remarks: colours lowered, all hands dismissed.' Patrol leader signs each entry. Check that the entries are neat, in ink, and that any mistake is struck through with one line and initialled, never scribbled out."}, {"title": "Quick fire review", "min": 4, "detail": "Rapid patrol quiz to lock it in, one point each, no score kept beyond bragging rights. Hold up a card: 'Letter? Meaning?' (O, man overboard; A, diver down; N, no; C, yes; P, about to sail; V, I require assistance.) Then: 'Strike three bells.' 'What time is 1730 in the Afternoon watch?' (Not the Afternoon watch, it is the First Dog watch; three bells.) 'Say 9:05 pm in 24-hour time.' (2105, 'twenty-one oh five'.) 'Which two flags mean distress?' (N over C.) 'What does the answering pennant mean?' (I understand.) Finish by asking each patrol to name the flag they would hoist if a scout fell off the dock at camp (O) and to say what they would do next (shout, point, throw, from Lesson 22)."}], "tips": ["Do not try to make scouts memorise all 26 meanings; the emergency and keep-clear groups (A, B, D, O, U, V, W) plus C, N, and P are enough for the Sea Scout level.", "Colouring the cards is not busywork; it is how the patterns stick. Insist on the correct colours.", "Strike bells in pairs with a clear pause; scouts hear 'ding-ding, ding' far more easily than three even strikes.", "Teach 24-hour time as 'add 12 after noon'; most scouts get it in one drill."], "safety": ["Markers are washable; cover the tables. Fabric glue only under leader supervision.", "The bell is struck by one scout at a time with a leader beside it; a hand bell swung wildly can hit a face.", "Dowels for patrol flags are carried point down and never used as swords."]}, "spiritual": {"title": "A Signal Everyone Can Read", "ref": "Matthew 5:14-16", "verse": "Let your light so shine before men, that they may see your good works and glorify your Father in heaven.", "url": "https://www.biblegateway.com/passage/?search=Matthew+5%3A14-16&version=NKJV", "message": "Christ is Risen! A signal flag works only because it is hoisted where everyone can see it and because it means the same thing to everyone. Nobody flies flag Oscar inside the cabin. Jesus says the same about His disciples: 'You are the light of the world. A city that is set on a hill cannot be hidden. Nor do they light a lamp and put it under a basket.' A Christian is a signal hoisted in public. Your classmates, your teammates, the people at the dock this summer, all read you. The question is what your flag says. When you are honest when it costs you, when you are kind to the kid nobody sits with, when you make the sign of the cross before you eat in the school cafeteria, you are flying a hoist that says something clear: 'There is a God, and He is good.' Notice the goal in the verse: not that they may see you and praise you, but 'that they may see your good works and glorify your Father in heaven.' The flag is not about the flag. St. Mark came to Alexandria as one man with a message, and within a few generations Egypt was full of Christians. He did not hide his light. The Holy Fifty Days are the Church's brightest season; the lights stay on, the fast is lifted, and we sing the Resurrection everywhere. Hoist your signal. Make it readable. Let it point past you to Him.", "discussion": ["What 'flag' do people read when they look at you at school? Would they know whose you are?", "Some signals are for danger and some are for help. How can a Christian be a signal that says 'help is here' to someone who is struggling?", "Jesus says the point is that people glorify the Father, not us. How do you shine without showing off?"], "prayer": "Risen Lord Jesus, Light of the world, hoist Your light in us where everyone can see it. Make our lives a clear signal that points past ourselves to You, and give us the courage of St. Mark to never hide it. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Decode the Hoist and Raise Your Colours", "setup": "Part 1 (12 min): patrols sit at their tables with their coloured flag deck and the printed chart face down. The leader stands at the front with the 8 message strips and a stopwatch. Part 2 (13 min): move to the craft table; each patrol receives one flag blank, a dowel, markers, felt, and glue.", "materials": ["8 message strips (3 single flags, 2 two-flag hoists, 3 spelled words)", "Each patrol's coloured flag deck and chart", "Whiteboard or paper for answers", "Patrol flag blanks, dowels, fabric markers, felt scraps, fabric glue, scissors", "Stopwatch and score sheet"], "rules": ["Decoding race, Round 1 (charts closed): the leader holds up a message strip. Patrols have 20 seconds to write the meaning (for a single flag) or the word (for a spelled hoist) and hold it up together. Correct answer earns 3 points; a correct letter but wrong meaning earns 1.", "Round 2 (charts open): three harder strips, including the two-flag hoists NC (I am in distress and require immediate assistance) and AC (I am abandoning my vessel). 2 points each, 15 seconds.", "Round 3, send a signal: each patrol builds a three-card hoist from its own deck that spells a word or gives a single-flag warning, and holds it up vertically. The patrol to its right decodes it in 20 seconds for 2 points; the sending patrol earns 1 point if the hoist is correctly built (right colours, read top to bottom).", "Bell bonus: between rounds the leader strikes bells and names the watch; first patrol to write the correct time in 24-hour form earns 1 point (e.g., three bells, Afternoon watch = 1330).", "Patrol flag: design must include the patrol's nautical name, one signal flag letter for the patrol's initial in correct colours, and a symbol of the patrol. Attach to the dowel with glue or by folding and stapling a sleeve. Flags are judged at the year-end Olympics for neatness, correct signal flag colours, and creativity (10 points), so unfinished flags go home to be completed.", "Highest decoding score chooses where the patrol flags will hang in the hall."], "variations": ["Short on time: run Rounds 1 and 3 only and pre-cut the felt letters for the patrol flags.", "Harder: send hoists across the hall using semaphore (Lesson 9) to spell the letters, then decode the meaning from the flag chart.", "Easier: allow charts open in every round and give 30 seconds.", "Mother's Day bonus: each scout spells a three-letter message to their mother in flags on a card to take home (e.g., the flags for M, O, M with meanings written beside them)."]}, "tables": [{"caption": "International Code of Signals alphabet flags and single-flag meanings", "headers": ["Letter / name", "Flag pattern", "Single-flag meaning"], "rows": [["A Alfa", "Swallowtail, white hoist half, blue fly half", "I have a diver down; keep well clear at slow speed"], ["B Bravo", "Red swallowtail", "I am taking in, discharging, or carrying dangerous goods"], ["C Charlie", "Horizontal bands blue, white, red, white, blue", "Yes (affirmative)"], ["D Delta", "Horizontal bands yellow, blue, yellow", "Keep clear of me; I am manoeuvring with difficulty"], ["E Echo", "Blue over red", "I am altering my course to starboard"], ["F Foxtrot", "White with a red diamond", "I am disabled; communicate with me"], ["G Golf", "Six vertical stripes yellow and blue", "I require a pilot"], ["H Hotel", "Vertical halves white (hoist) and red", "I have a pilot on board"], ["I India", "Yellow with a black circle", "I am altering my course to port"], ["J Juliett", "Horizontal bands blue, white, blue", "I am on fire and have dangerous cargo; keep well clear"], ["K Kilo", "Vertical halves yellow (hoist) and blue", "I wish to communicate with you"], ["L Lima", "Quarters yellow and black", "You should stop your vessel instantly"], ["M Mike", "Blue with a white diagonal cross", "My vessel is stopped and making no way"], ["N November", "Blue and white checkerboard", "No (negative)"], ["O Oscar", "Diagonal halves red and yellow", "Man overboard"], ["P Papa", "Blue with a white centre square (Blue Peter)", "In harbour: all persons report on board, vessel about to sail"], ["Q Quebec", "Plain yellow", "My vessel is healthy; I request free pratique"], ["R Romeo", "Red with a yellow upright cross", "No single-flag meaning assigned"], ["S Sierra", "White with a blue centre square", "I am operating astern propulsion"], ["T Tango", "Vertical bands red, white, blue", "Keep clear of me; I am engaged in pair trawling"], ["U Uniform", "Quarters red and white", "You are running into danger"], ["V Victor", "White with a red diagonal cross", "I require assistance"], ["W Whiskey", "Blue border, white, red centre", "I require medical assistance"], ["X X-ray", "White with a blue upright cross", "Stop carrying out your intentions and watch for my signals"], ["Y Yankee", "Diagonal stripes yellow and red", "I am dragging my anchor"], ["Z Zulu", "Four triangles yellow, blue, red, black", "I require a tug"]]}, {"caption": "Ship's watches and bells", "headers": ["Watch", "Hours", "Bells at each half hour"], "rows": [["Middle", "0000 to 0400", "1 (0030), 2, 3, 4, 5, 6, 7, 8 (0400)"], ["Morning", "0400 to 0800", "1 (0430) up to 8 (0800)"], ["Forenoon", "0800 to 1200", "1 (0830) up to 8 (1200)"], ["Afternoon", "1200 to 1600", "1 (1230) up to 8 (1600)"], ["First Dog", "1600 to 1800", "1 (1630), 2 (1700), 3 (1730), 4 (1800)"], ["Last Dog", "1800 to 2000", "1 (1830), 2 (1900), 3 (1930), 8 (2000)"], ["First", "2000 to 0000", "1 (2030) up to 8 (0000)"]]}], "references": [{"label": "Wikipedia: International maritime signal flags", "url": "https://en.wikipedia.org/wiki/International_maritime_signal_flags", "why": "Colour images of every flag to print as the chart, plus the single-flag meanings and numeral pennants."}, {"label": "Wikipedia: Ship's bell", "url": "https://en.wikipedia.org/wiki/Ship%27s_bell", "why": "The bell and watch system, the dog watch exception, and traditions like sixteen bells at New Year."}, {"label": "Wikipedia: NATO phonetic alphabet", "url": "https://en.wikipedia.org/wiki/NATO_phonetic_alphabet", "why": "The flag names (Alfa, Bravo, Charlie) match this alphabet from Lesson 21."}, {"label": "YouTube search: international code of signals flags explained", "url": "https://www.youtube.com/results?search_query=international+code+of+signals+flags+explained", "why": "A short video showing real ships flying single-flag signals."}, {"label": "YouTube search: ship's bell watches explained navy", "url": "https://www.youtube.com/results?search_query=ship%27s+bell+watches+explained+navy", "why": "Hear the bells struck in pairs so you can copy the rhythm."}, {"label": "Bible Gateway: Matthew 5:14-16 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Matthew+5%3A14-16&version=NKJV", "why": "The light of the world passage."}], "visual": "signal-flags", "takeHome": "Write tomorrow's schedule (school, dinner, bed) entirely in 24-hour time on your fridge, and be able to name flags A, B, C, N, O, P, U, and V on sight at the year-end Olympics."}, {"n": 33, "date": "2027-05-18", "term": "Spring", "title": "Ready for the Water: Self-Rescue & Capsize", "theme": "Stay with the boat: capsize, righting, re-entry, and summer sun safety", "sea": true, "calendar": ["Holy Fifty Days continue (no fasting until Pentecost, Jun 20). Open with 'Christ is Risen!'", "Victoria Day long weekend is May 22 to 24. Many families open cottages and launch boats this weekend; remind scouts that May water in Ontario is still cold (often under 15 C) and that Lesson 12's 1-10-1 rule applies. Lifejackets on.", "Year-end Sea Scout Olympics is next week, May 25. Bring patrol flags finished, and collect the last summer camp and regatta forms tonight.", "Announce the date and location of the swim check for summer camp or the regatta, and that scouts who have not passed it will stay in the shallow area and wear a PFD at all times."], "objectives": ["Describe the swim check standard they will be asked to meet and how to prepare for it.", "Recite and perform the six-step capsize procedure, starting with 'stay with the boat'.", "Explain how to right a capsized canoe and a small sailing dinghy, including what to do if the dinghy turtles.", "Demonstrate the body positions for climbing into a canoe from the water with a buddy counterbalancing.", "List the signs of heat exhaustion and heat stroke and the first-aid response, and name four sun-safety rules."], "materials": [{"item": "Benches or rows of three chairs as 'boats', one per patrol", "qty": "5", "note": "a gym mat under each helps for the re-entry practice"}, {"item": "A real canoe or sailing dinghy if the church parking lot allows one on a trailer, or a large printed picture of each", "qty": "1", "note": "a parent's canoe brought for 30 minutes makes this lesson"}, {"item": "PFDs of assorted sizes", "qty": "6", "note": "borrow from the group; scouts wear them during the drill"}, {"item": "Whistles (pea-less)", "qty": "1 per patrol leader", "note": "attached to PFDs"}, {"item": "Throw bag or 15 m heaving line", "qty": "2", "note": "from Lesson 12"}, {"item": "Balance beam: 2.4 m length of 2x4 lumber laid flat (or two, end to end), plus a 4 m strip of masking tape as a backup 'plank'", "qty": "2", "note": "use the wide face up; never elevate it"}, {"item": "'Gear' for the plank: a filled 1 L water bottle, a coiled rope, a bailer, a paddle", "qty": "1 set per lane", "note": ""}, {"item": "Stopwatch, score sheets", "qty": "2", "note": ""}, {"item": "Laptop or phone with speaker to show righting videos", "qty": "1", "note": "queue the YouTube searches in the references before the meeting"}, {"item": "Sun-safety kit: SPF 30+ sunscreen, wide-brim hat, polarized sunglasses, UV shirt, 1 L water bottle", "qty": "1 set", "note": "for show and tell"}, {"item": "Snack: no fast, watermelon or orange slices (also a hydration lesson)", "qty": "for 25", "note": "check allergies"}], "prep": ["Confirm the swim check standard used by your camp or regatta and write it on the flip chart. If none is specified, use the Lifesaving Society Swim to Survive standard from the references.", "Queue two short videos: a canoe-over-canoe or Capistrano flip righting, and a small dinghy righting from the centreboard. Watch them yourself so you can pause and narrate.", "Arrange with a parent to bring a canoe on a roof rack to the parking lot for 20 minutes, weather permitting, so scouts can practise the re-entry position on a real gunwale on the grass. If not possible, use benches indoors.", "Lay out the balance beam lanes at one end of the hall on a non-slip floor, with the gear at the start and a bucket at the end.", "Write the six capsize steps on cards, one word per card, for the drill: STAY, COUNT, HOLD, CLIMB, SIGNAL, RIGHT.", "Assign leaders: one calls the capsize drill, one judges the plank, one supervises the outdoor canoe if used."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in, 'Christ is Risen!', flag, Scout Promise, Lord's Prayer, Victoria Day and cold water reminder, attendance"}, {"time": "6:25", "min": 40, "what": "Practical: swim check expectations, capsize procedure, righting a canoe and a dinghy, re-entry from the water, sun and heat safety, summer prep"}, {"time": "7:05", "min": 10, "what": "Spiritual: Be strong and of good courage (Joshua 1:9)"}, {"time": "7:15", "min": 25, "what": "Activity: capsize drill with benches as boats, then walk-the-plank balance challenge"}, {"time": "7:40", "min": 5, "what": "Closing: recap, take-home challenge, closing prayer, dismissal"}], "practical": {"title": "When the Boat Goes Over", "intro": "Every canoeist and sailor capsizes eventually, and most of the time it is a laugh. The people who drown are the ones who panic, let go of the boat, and swim for a shore that is farther than it looks. Tonight you drill what to do until it is automatic, so that this summer, when your boat goes over, your body already knows the answer.", "steps": [{"title": "The swim check and how to pass it", "min": 6, "detail": "Before anyone goes on the water at camp or a regatta, they do a swim check in a supervised area. Show the standard on the flip chart. The Lifesaving Society's Swim to Survive standard, which many camps use, is: roll or jump into deep water, tread water for one minute, then swim 50 metres (any stroke, without stopping or touching the bottom). Some camps add: put on a PFD in the water, or swim 25 m wearing one. Explain that it is not a race and not about speed; it is about staying calm after an unexpected entry. To prepare: practise treading water with a slow, wide 'eggbeater' or scissor kick and hands sculling flat, not thrashing; practise floating on the back with the chin up; swim 50 m twice a week at a pool until it feels easy. A scout who does not pass is not shamed: they wear a PFD at all times, stay in the shallow zone, and can retest. Everyone wears a PFD in a boat regardless. Ask who has a pool or community centre nearby and pair up swim buddies for the next two weeks."}, {"title": "The capsize procedure", "min": 8, "detail": "Lay the six word cards on the floor and teach each. 1, STAY: stay with the boat. A capsized canoe or dinghy floats, it is much bigger and easier for rescuers to see than a head in the water, and it holds you up. Never swim for shore unless it is very close, because distances over water are deceiving and cold water steals your strength (Lesson 12). 2, COUNT: count heads and call every name out loud; make sure everyone is up and breathing; someone may be under the hull or tangled in a line. 3, HOLD: hold onto the boat, a gunwale, or the grab line, and keep your PFD zipped; if you had no PFD on, get one now. 4, CLIMB: get as much of your body out of the water as you can, onto the overturned hull, to slow heat loss and be more visible. 5, SIGNAL: three long whistle blasts, arm waving over your head, or flag Oscar if a boat nearby can see it; calm and repeated. 6, RIGHT: right the boat if you have the skill and energy, then re-enter and bail; if not, stay on the hull and wait for the safety boat. Practise saying the six words as a chant, then pointing to each card while a leader tells a story of a capsize and the patrol shouts the step that is needed next."}, {"title": "Righting a canoe", "min": 8, "detail": "Play the video, pausing to narrate. Method A, shakeout (one or two paddlers, calm water): from the side, push down on the near gunwale and pull up on the far one to roll the canoe upright; it will be full of water; then grip the centre of one gunwale, push it under and lift in one motion to slosh water out, repeating three or four times until it floats high enough to bail. Method B, Capistrano flip (two swimmers): both duck under the overturned canoe into the air pocket, one at each end, hold the gunwales, tread water hard and on 'three' thrust the canoe up and over to one side together; it lands upright and mostly empty. Method C, canoe-over-canoe rescue (a second canoe): the rescuers pull the overturned canoe across their own gunwales at the centre, drain it, flip it upright, slide it back into the water, and steady it while the swimmers climb in. Key points for all: keep your feet away from the boat's underside so a foot does not get trapped, do not tie yourself to anything, and always keep one hand on the canoe. Have each patrol act out the Capistrano count with a bench: two scouts under 'the hull', 'one, two, three, lift'."}, {"title": "Righting a sailing dinghy and re-entering from the water", "min": 8, "detail": "Dinghy righting (video): first, everyone accounted for and clear of the sails and lines so nobody is trapped under the sail. Second, release the mainsheet so the sail does not fill the moment the boat comes up. Third, swim to the centreboard (daggerboard), pull it fully down if it slid in, and climb onto it near the hull, standing with your weight on it and holding the gunwale or a righting line; lean back and let your weight lever the mast out of the water. As the boat comes up, grab the gunwale and slide in, or use the scoop method: one crew lies inside the cockpit on the low side and is scooped in as the boat rights. If the boat has turtled (mast pointing straight down), first stand on the opposite gunwale and pull the centreboard to bring the mast to the surface, then right it normally, ideally with the bow into the wind. Re-entering a canoe from the water: come to the centre of the canoe, buddy on the opposite side leaning out to counterbalance with their hands on the far gunwale, kick hard like a dolphin, reach across the near gunwale to the far one, pull your chest over the gunwale, then twist and roll your hips in. Never pull straight up on the near gunwale, it flips the boat onto you. Practise the body positions on the benches or on the parking-lot canoe on the grass: chest over, twist, roll, buddy leaning out."}, {"title": "Sun, heat, and summer preparation", "min": 10, "detail": "Show the sun kit. Rules: sunscreen SPF 30 or higher on all exposed skin 20 minutes before going out and again every two hours and after swimming; a wide-brim hat with a chin strap; sunglasses (polarized cut glare off the water and help you see rocks); a long-sleeve UV shirt is better than sunscreen; drink about 500 mL of water every hour in the heat, more when paddling; water reflects sun, so you burn faster in a boat than on land. Heat exhaustion: heavy sweating, cool clammy skin, weakness, dizziness, nausea, headache, cramps. Response: stop, shade, loosen clothing, sip cool water or a sports drink, cool the skin with wet cloths, rest; it should improve in 30 minutes. Heat stroke is an emergency: hot skin (dry or sweaty), confusion, slurred speech, staggering, fainting, body temperature over 40 C. Call 911, move to shade, cool the person aggressively with water and fanning, ice packs at the neck, armpits, and groin, and give nothing to drink if they are confused. Summer prep checklist for camp or regatta: medical form and consent signed, swim check passed, PFD that fits (zip it, lift the shoulders, it should not ride up over the chin), whistle on the PFD, water shoes or old runners, hat, sunscreen, two water bottles, rain jacket, dry bag with a change of clothes, a labelled bag, and no phone in the boat unless in a waterproof case tied to the boat. Hand out the gear list and forms."}], "tips": ["Chant the six steps every time the patrol lines up tonight; by closing, every scout should say them without the cards.", "Video beats description for righting. Pause at the moment the crew stands on the centreboard and ask 'why is the mainsheet loose?'", "If you got a real canoe outside, the re-entry position on the grass is the single most useful minute of the year; make sure the youngest scouts try it.", "Tie heat safety to the snack: watermelon is 90 percent water."], "safety": ["Benches used as boats stay on the floor; no standing on benches or chairs.", "The balance beam is a flat 2x4 on the floor, never raised; use masking tape if the floor is slippery.", "If a canoe is on the grass outside, one leader supervises, the canoe is on flat ground, and scouts approach one at a time from the side; no rocking it with someone inside.", "Any scout with a history of fainting or heat illness should be noted in the medical forms before camp.", "Fruit snack: cut on a clean board; check allergies."]}, "spiritual": {"title": "Be Strong and of Good Courage", "ref": "Joshua 1:9", "verse": "Have I not commanded you? Be strong and of good courage; do not be afraid, nor be dismayed, for the LORD your God is with you wherever you go.", "url": "https://www.biblegateway.com/passage/?search=Joshua+1%3A9&version=NKJV", "message": "Christ is Risen! Tonight's first rule was 'stay with the boat.' When the water is cold and the shore looks close, panic says 'swim for it', and panic is wrong. The people who survive are the ones who hold on to what floats and wait for rescue. God says something very similar to Joshua. Moses has died, Joshua must lead a whole nation across a river in flood, and God does not give him a strategy. He gives him a command: 'Be strong and of good courage; do not be afraid, nor be dismayed, for the LORD your God is with you wherever you go.' Courage is not the absence of fear. It is holding on to what will not sink when you are afraid. The Church Fathers called the Church the ark, the boat that carries us through the flood of this world. When life capsizes, and it will, through illness, a family crisis, a failure, the answer is the same as on the lake: stay with the boat. Stay in the Church, stay in prayer, stay with your patrol of believers, count heads and make sure nobody is left under the hull, signal for help without shame. St. Athanasius was exiled five times and never let go of the truth; he stayed with the boat. The Risen Christ walked out of a sealed tomb. Nothing that capsizes you is bigger than that. Be strong and of good courage.", "discussion": ["What is the difference between courage and not being afraid? Can you be scared and brave at the same time?", "The Church is called the ark. What does 'stay with the boat' look like when life goes wrong for a teenager?", "Joshua was told 'do not be dismayed'. What discourages you most about the summer ahead, and how does 'the LORD your God is with you wherever you go' answer it?"], "prayer": "Risen Lord Jesus, You are with us wherever we go, on the water and on land. Make us strong and of good courage, teach us to hold on to You when we are afraid, and keep every scout safe this summer. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Capsize Drill and Walk the Plank", "setup": "Part 1 (13 min): each patrol has a bench 'boat' in the middle of the hall, with the patrol 'aboard' (sitting on it in a line), wearing the PFDs available (rotate so everyone wears one at least once), a whistle on the patrol leader, and a throw bag placed 5 m away as the 'safety boat'. A leader is the drill caller with a stopwatch. Part 2 (12 min): two balance beam lanes at the end of the hall, gear at the start, bucket at the end, a judge at each lane.", "materials": ["Benches or chair rows, one per patrol", "PFDs, whistles, throw bags", "Six step cards per patrol (STAY, COUNT, HOLD, CLIMB, SIGNAL, RIGHT)", "Balance beams (flat 2x4s) or tape lines", "Gear items per lane: 1 L bottle, coiled rope, bailer, paddle", "Stopwatch, score sheets"], "rules": ["Capsize drill: on 'CAPSIZE!', every scout slides off the bench to the floor on the same side (the water) and shouts 'Capsize!'. The drill caller starts the clock.", "Step 1 STAY and 2 COUNT: within 10 seconds one scout must call out every patrol member's name and each must answer 'Here!'; nobody may move more than one arm's length from the bench. 5 points if complete in 10 seconds, 3 if in 20.", "Step 3 HOLD: every scout has one hand on the bench and the PFD wearers zip up; 2 points if all hands are on within 5 seconds of the count.", "Step 4 CLIMB: the patrol lifts one designated 'cold' scout to lie across the top of the bench (the hull) with both feet off the floor, keeping the bench stable; 3 points, minus 1 if the bench tips.", "Step 5 SIGNAL: the patrol leader gives three long whistle blasts and one scout waves both arms overhead; 2 points. A leader at the 'safety boat' then tosses the throw bag underhand toward the patrol; a scout must catch or grab the line while keeping one hand on the boat; 3 points.", "Step 6 RIGHT: two scouts go to opposite sides of the bench, call 'one, two, three, lift' and turn the bench over (the Capistrano count), then everyone climbs back 'aboard' one at a time using the chest-over, twist, roll re-entry with a buddy counterbalancing on the far side; 5 points for correct technique on every scout, judged. Stop the clock. Fastest complete drill with all points earns 5 bonus points. Run the drill twice; best run counts.", "Walk the plank (12 min): one scout at a time walks the length of the beam carrying one gear item, drops it in the bucket, and walks back. Then the next scout, with the next item. A foot touching the floor means start that length again. Score: 1 point per successful length, 3 bonus if the whole patrol finishes in under 4 minutes. Round 2: the paddle must be carried overhead with both hands and the bottle balanced on the palm. Judges keep it silly, not scary.", "Total the drill and plank points. Winning patrol leads the six-step chant at closing."], "variations": ["Short on time: one run of the capsize drill and a single plank length per scout.", "Harder: run the capsize drill with the lights dimmed and the drill caller reading a 'wind and waves' scenario; add a fifth item to the plank.", "Easier: skip the throw bag catch and allow one hand on a chair beside the beam for balance.", "If a real canoe is on the grass outside and weather allows, replace Step 6 with real re-entry practice on the grass, one patrol at a time, with t
