ctly the same clay"}, {"item": "Measuring cup (1 L) and a small bowl", "qty": "1 each", "note": "overflow demonstration"}, {"item": "Empty 500 mL water bottles with caps", "qty": "4", "note": "stability demo; one filled with 100 mL of sand or gravel"}, {"item": "Sand or aquarium gravel", "qty": "about 300 g", "note": "ballast for the bottle demo"}, {"item": "Old towels and paper towels", "qty": "6 towels, 1 roll", "note": "spills happen"}, {"item": "Whiteboard, markers, printed boat cross-section sketch", "qty": "1 board, 1 sketch per patrol", "note": "sketch shows hull with G, B and waterline"}, {"item": "Quiz cards (5 scenarios, see step 5)", "qty": "1 set per patrol", "note": "print in advance"}], "prep": ["Fill both tubs about half full with room-temperature water and place them on towel-lined tables, away from electrical outlets.", "Weigh 150 g clay portions, one per patrol, and wrap each in plastic so they stay soft. Keep a separate 200 g lump for the demonstrations.", "Test the demo yourself: roll a golf-ball-sized lump of clay (it sinks), then shape the same lump into a bowl with thin walls (it floats). Practise so it works first time.", "Prepare the ballast bottle: put 100 mL of sand in one bottle and cap it. Leave a second bottle empty and a third bottle half full of water (for the free-surface demo).", "Draw the boat cross-section on the whiteboard before the meeting: hull shape, waterline, a dot labelled G (centre of gravity) above a dot labelled B (centre of buoyancy).", "Print the five quiz-card scenarios (step 5) and the load line table for each patrol.", "Assign one leader to be the 'harbour master' who runs the loading of marbles during the activity."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Jonah's fast dates, winter camp forms)."}, {"time": "6:25", "min": 40, "what": "Practical: Archimedes demo, displacement and load lines, centre of gravity vs centre of buoyancy, ballast and capsizing, scenario quiz."}, {"time": "7:05", "min": 10, "what": "Spiritual: Jonah 1, the cargo thrown overboard and the God who is Lord of the storm."}, {"time": "7:15", "min": 25, "what": "Activity: Clay Cargo Boat Challenge, most marbles afloat wins."}, {"time": "7:40", "min": 5, "what": "Closing: recap the four key words (displacement, freeboard, G, ballast), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Why Ships Float and Why Boats Tip", "intro": "A steel ship weighs thousands of tonnes, yet it floats, while a steel bolt sinks straight away. Tonight we find out why, using a basin of water and a lump of clay. The same science tells a sea scout where to sit in a canoe, why we never stand up in a small boat, and why every boat has a limit on how much it can carry.", "steps": [{"title": "Archimedes: the water pushes back", "min": 8, "detail": "Hold up a golf-ball-sized lump of clay and ask 'float or sink?' Drop it in the tub; it sinks. Now shape the same lump into a bowl with thin walls and set it on the water; it floats. Same clay, same weight, so what changed? Explain: anything put in water pushes water out of the way (this is called displacement). The water pushes back upward with a force equal to the weight of the water that was pushed aside. That upward push is buoyancy. The ball only displaces a little water, so the push is small and it sinks. The bowl spreads its weight over a large hollow shape, displaces much more water, and the push equals its weight before it goes under. Show the overflow demo: fill the measuring cup to the brim over a bowl, lower the clay bowl in, and point to the spilled water. Fresh water weighs 1 kg per litre, so a 1 tonne boat must push aside 1000 L of water to float."}, {"title": "Displacement, freeboard and load lines", "min": 7, "detail": "Say: a floating boat always displaces water equal to its own weight, cargo included. Add three marbles to the clay bowl and point out it sits lower; the distance from the waterline to the top edge is called freeboard. Every marble reduces freeboard, until a small wave or a tilt lets water over the edge. Big ships have a load line, also called the Plimsoll mark, painted on the side: a circle with a horizontal line, plus a ladder of letters (TF, F, T, S, W, WNA). The ship is loaded until the correct letter touches the water. Salt water is denser than fresh water, so the ship floats higher in the sea; that is why the F (fresh) line is above the S (summer) line. Canadian small boats have a capacity plate near the helm listing the maximum number of people and total kilograms. Overloading is one of the main causes of drownings in small boats in Canada."}, {"title": "Centre of gravity vs centre of buoyancy", "min": 9, "detail": "Point to the whiteboard sketch. G, the centre of gravity, is the single point where the whole weight of the boat and everything in it seems to act; all the weight pulls straight down from G. B, the centre of buoyancy, is the centre of the underwater part of the hull; all the upward push acts through B. Upright, B sits directly under G, so the forces cancel and the boat is steady. Now tilt the sketch: the underwater shape changes, more hull goes under on the low side, so B moves toward the low side. Buoyancy pushing up at B, outboard of G pulling down, creates a twist that rolls the boat back upright. This is the righting moment, and it is why boats come back from a heel. But if G is high, tilting swings G outboard past B, the twist now works the other way, and over she goes. Have scouts stand feet together on tiptoe with arms up (high G), then squat with feet wide (low G); a gentle nudge on the shoulder shows which is stable."}, {"title": "Ballast and why boats capsize", "min": 8, "detail": "Float the empty bottle upright in the tub; it flops over because G is high and B is low. Float the sand bottle; it stands upright because the weight is at the bottom. That weight is ballast. Old sailing ships carried stones; keelboats carry a lead keel that can be a third of the boat's weight, which is why they come back even from 90 degrees. Canoes and dinghies have no keel, so the crew is the ballast: kneel or sit low, stay centred, keep three points of contact when moving, and never stand. Now the half-full water bottle: tilt it slowly and watch the water rush to the low side. That is the free surface effect, and it is why bilge water or a loose load is dangerous; it moves G toward the low side at the worst moment. List the causes of capsize: overloading, everyone on one side, standing up, waves taken beam-on, water sloshing inside, and heavy gear stowed high."}, {"title": "Scenario quiz by patrol", "min": 8, "detail": "Give each patrol the five quiz cards and two minutes per card to agree on an answer, then take answers round-robin. Card 1: three scouts stand up in a canoe at the same time; what happens and why (G rises above the righting range, capsize). Card 2: a fishing boat has a capacity plate of 4 persons, 340 kg; six scouts want to go; what do you say (no, overloaded, freeboard too low). Card 3: a dinghy heels 30 degrees in a gust; where does B move and what should the crew do (B moves to the low side, crew hike to the high side and ease the sail). Card 4: a ship loads cargo in Montreal (fresh water) then sails into the salty Atlantic; does it float higher or lower (higher). Card 5: a canoe has 5 cm of water sloshing in the bottom; is that a problem (yes, free surface effect, bail it out). Award a point per correct explanation, then announce the cargo boat challenge."}], "tips": ["The clay bowl must have thin walls and a wide, flat bottom. If it sinks in your practice run, thin the walls and make it wider, not taller.", "Scouts often think 'heavy things sink'. Keep repeating: it is not the weight, it is the weight compared with the water pushed aside.", "Use your own body as the model whenever you can: tiptoe with arms up versus a squat is the picture they will remember.", "Keep the vocabulary to five words: displacement, freeboard, centre of gravity (G), centre of buoyancy (B), ballast. Write them on the board and point to them every time you say them.", "If a patrol finishes the quiz early, ask them to sketch where they would sit if a two-person canoe carried one heavy adult and one small scout (heavy person nearer the centre, gear forward to trim level)."], "safety": ["Water tubs go on towel-lined tables away from power outlets and extension cords. Mop spills immediately; wet hall floors are slippery.", "Marbles are a choking hazard and a slip hazard. Count them out and back in, and keep them in bowls, not pockets.", "Modelling clay is not food. Wash hands after the activity, especially before any snack.", "During the tiptoe versus squat demonstration, nudge shoulders gently and only with a leader doing the nudging."]}, "spiritual": {"title": "Cargo Overboard: Jonah and the Lord of the Storm", "ref": "Jonah 1:1-17", "verse": "But the LORD sent out a great wind on the sea, and there was a mighty tempest on the sea, so that the ship was about to be broken up. Then the mariners were afraid, and every man cried out to his god, and threw the cargo that was in the ship into the sea, to lighten the load.", "url": "https://www.biblegateway.com/passage/?search=Jonah+1%3A4-5&version=NKJV", "message": "Tonight you learned that a boat can only carry so much. When the load is too heavy and the freeboard is gone, the next wave comes over the side. The sailors in Jonah's ship knew this. When the storm hit, they threw the cargo overboard to lighten the ship. It was the right seamanship, but it did not calm the sea, because the real weight on that ship was not in the hold. It was a prophet running from God, asleep in the lowest part of the boat. Jonah had been told to go to Nineveh and he went the opposite way. His disobedience was the hidden ballast in the wrong place, and the whole crew was in danger because of it. Notice what happens next. Jonah tells the truth, 'I fear the LORD, the God of heaven, who made the sea and the dry land,' and he accepts the consequence. The sea grows calm, and the pagan sailors end up praying to the true God. Our Coptic Church reads the whole book of Jonah during Jonah's fast in a few weeks, three days of repentance before Great Lent. Ask yourself: what cargo am I carrying that God is asking me to throw overboard? A grudge, a habit, a lie? Sin sits high and heavy, and it makes us tip. Repentance lowers our centre of gravity and lets God steady the boat.", "discussion": ["The sailors threw the cargo overboard but the storm continued. What was the real problem on that ship, and what does that teach us about fixing the outside when the inside is wrong?", "Jonah was asleep in the bottom of the boat during the storm. Have you ever tried to ignore something you knew God wanted you to do? What happened?", "Why do you think the Church chose the book of Jonah as the reading for the three-day fast just before Lent?"], "prayer": "Lord Jesus, You made the sea and the dry land, and the wind and waves obey Your voice. Help us to throw overboard every heavy sin that tips our hearts, and to keep You as the ballast that holds us steady when storms come. Give us the courage of Jonah when he finally said yes to You, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Clay Cargo Boat Challenge", "setup": "Two water tubs on towel-lined tables at the front of the hall, one 'harbour master' leader at each tub with a bowl of marbles and a score sheet. Patrols work at their own tables. Each patrol receives exactly 150 g of clay (weighed on the scale in front of them so everyone sees it is fair), a paper towel to build on, and a pencil and paper for a design sketch.", "materials": ["150 g of modelling clay per patrol", "150 marbles in two bowls", "Kitchen scale", "Two water tubs, towels, paper towels", "Score sheet and pencil for each harbour master", "Stopwatch or phone timer"], "rules": ["Round 1 build (8 minutes): each patrol shapes all of its clay into one boat. The boat must be one piece of clay only, no other materials, and must fit inside a 15 cm by 15 cm square drawn on the paper towel. Everyone in the patrol must touch the clay at least once.", "Loading: the patrol carries its boat to a tub and floats it. The harbour master adds marbles one at a time, placing each where the patrol leader points. The patrol may not touch the boat once loading starts.", "A marble counts only if the boat is still floating with no water over the edge after the marble is placed and the harbour master counts to three. When water comes over the edge or the boat sinks, loading stops. Score equals the number of marbles that were aboard before the sinking marble.", "Round 2 redesign (6 minutes): patrols dry the clay with a paper towel, rebuild using what they learned, and load again. Round 2 score replaces Round 1 if it is higher.", "Bonus points: 3 points if the patrol leader can explain their design using the words displacement, freeboard and centre of gravity correctly; 2 points for the most level (trimmed) boat as judged by the harbour master; 1 point for naming the boat in a nautical style.", "Highest total wins. Ties are broken by a sudden-death round with a 60-second rebuild."], "variations": ["Short on time: one round only, 8 minutes to build, and loading is done by each patrol at the same time at both tubs.", "Harder: after loading, the harbour master makes three small waves by pushing the water with a hand; the boat must survive the waves to keep its score.", "Easier for younger scouts: allow two attempts within Round 1 without a timer, and give a hint card that says 'wide, flat, thin walls, keep the marbles low and spread out'.", "Extension: challenge patrols to predict their marble count before loading; award 2 bonus points if the prediction is within 5 marbles."]}, "tables": [{"caption": "Load line (Plimsoll mark) letters on a ship's side", "headers": ["Letters", "Meaning", "Why the line is where it is"], "rows": [["TF", "Tropical Fresh water", "Warm fresh water is the least dense, so the ship sits lowest; highest line"], ["F", "Fresh water", "Fresh water (rivers, Great Lakes) is less dense than sea water"], ["T", "Tropical sea water", "Warm sea water, calmer seas, ship may load a little deeper"], ["S", "Summer sea water", "The standard reference line"], ["W", "Winter sea water", "Rougher seas in winter, so more freeboard is required"], ["WNA", "Winter North Atlantic", "The stormiest waters; the most freeboard and the lowest permitted loading"]]}, {"caption": "Five words every sea scout should know tonight", "headers": ["Word", "One-line meaning", "Where you see it"], "rows": [["Displacement", "The water a boat pushes aside; equal to the boat's total weight", "Ship sizes are given in tonnes of displacement"], ["Freeboard", "Height from the waterline to the top of the hull", "Shrinks every time you add cargo or people"], ["Centre of gravity (G)", "The point where all the weight acts, pulling down", "Rises when you stand up or stow gear high"], ["Centre of buoyancy (B)", "The centre of the underwater part of the hull, pushing up", "Moves to the low side when the boat heels"], ["Ballast", "Weight placed low to keep G low", "Lead keel, stones, water tanks, or a kneeling paddler"]]}], "references": [{"label": "Wikipedia: Buoyancy", "url": "https://en.wikipedia.org/wiki/Buoyancy", "why": "Clear statement of Archimedes' principle with diagrams the leader can copy onto the whiteboard."}, {"label": "Wikipedia: Ship stability", "url": "https://en.wikipedia.org/wiki/Ship_stability", "why": "Background on centre of gravity, centre of buoyancy and righting moment; read the first sections only."}, {"label": "YouTube search: why do ships float Archimedes principle demonstration", "url": "https://www.youtube.com/results?search_query=why+do+ships+float+archimedes+principle+demonstration", "why": "Short demo videos to preview the clay and overflow experiments before trying them live."}, {"label": "YouTube search: ship stability centre of gravity centre of buoyancy explained", "url": "https://www.youtube.com/results?search_query=ship+stability+centre+of+gravity+centre+of+buoyancy+explained", "why": "Animated explanations of how B moves when a ship heels; pick a 3-5 minute video to show if a projector is available."}, {"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Official wording on capacity plates and overloading for Canadian small boats."}, {"label": "Bible Gateway: Jonah 1 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Jonah+1&version=NKJV", "why": "Full chapter for the spiritual lesson; read verses 1-17 aloud if time allows."}], "visual": null, "takeHome": "Find a picture of a big ship online or in a book, locate its load line mark, and bring a sketch of it next week with the letters labelled."}, {"n": 19, "date": "2027-02-02", "term": "Winter", "title": "Knots 3: Bends, Hitches & Rope Care", "theme": "Joining ropes, gripping poles, tensioning lines, and looking after the rope that looks after you", "sea": true, "calendar": ["Ordinary week in the Coptic calendar. Tuesday is not a fast day.", "Presentation of Christ in the Temple is Feb 15 (also Family Day); Jonah's fast Feb 22-24. Mention both so families can plan.", "Groundhog Day today: a light-hearted tie-in to weather forecasting from Lesson 7 if you want an icebreaker."], "objectives": ["Tie a sheet bend (single and double), a rolling hitch, a taut-line hitch, a trucker's hitch and a cleat hitch, and say when each is used aboard or at camp.", "Coil a rope neatly for stowage and finish a rope end with a common whipping.", "Name the three common rope materials (nylon, polyester, polypropylene) and give one strength and one weakness of each.", "List five rope-care rules and inspect a rope for damage.", "Tie the bowline, reef knot and clove hitch from earlier lessons blindfolded."], "materials": [{"item": "Braided rope, 6 mm, 3 m lengths", "qty": "1 per scout (25)", "note": "reusable from Lesson 2; hardware store"}, {"item": "Thinner cord, 3-4 mm, 2 m lengths", "qty": "1 per scout (25)", "note": "for the sheet bend, different thickness matters"}, {"item": "Whipping twine (waxed polyester) or strong cotton string", "qty": "1 spool", "note": "cut 60 cm pieces per scout; chandlery or hardware store"}, {"item": "Scissors or a safe cutting tool", "qty": "3 (leaders only)", "note": "for trimming whipping ends"}, {"item": "Short samples of nylon, polyester and polypropylene rope, about 30 cm each", "qty": "1 set per patrol", "note": "polypropylene is the yellow floating rope; label each sample with masking tape"}, {"item": "Dock cleats (plastic or aluminium) screwed to a plank, or sturdy chair legs as substitutes", "qty": "1 per patrol", "note": "a 15 cm cleat costs about $8; screw two to a 1 m board"}, {"item": "Broom handles or 1 m dowels", "qty": "1 per patrol", "note": "for the rolling hitch and taut-line practice"}, {"item": "Blindfolds (bandanas or sleep masks)", "qty": "10", "note": "for the activity"}, {"item": "Printed knot-uses table", "qty": "1 per patrol", "note": "from the tables section"}, {"item": "A small bucket of water and a pinch of salt", "qty": "1", "note": "optional: show how nylon absorbs water and stiffens"}], "prep": ["Practise every knot yourself the night before using the Animated Knots pages in the references. Tie each one at least ten times; you will be teaching by demonstration.", "Cut whipping twine into 60 cm pieces, one per scout, plus spares.", "Screw two cleats to a board per patrol, or identify sturdy chair legs and mark the 'cleat' with tape.", "Tape the ends of all practice ropes so they do not fray, and lay out patrol kits: ropes, cords, a pole, a cleat board, a rope-sample set and the printed table.", "Set up one leader per two patrols as a roaming checker with a sign-off sheet listing the six knots and each scout's name.", "Prepare a damaged rope sample (a rope with a cut strand, a glazed melted spot and a stiff kinked section) for the inspection demo."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Presentation feast, Jonah's fast)."}, {"time": "6:25", "min": 40, "what": "Practical: rope types and care, sheet bend, rolling hitch, taut-line and trucker's hitches, cleat hitch, coiling and whipping."}, {"time": "7:05", "min": 10, "what": "Spiritual: Colossians 3:12-14, love is the bond that holds everything together."}, {"time": "7:15", "min": 25, "what": "Activity: Blindfold Knot Challenge followed by Knot Tag."}, {"time": "7:40", "min": 5, "what": "Closing: recap which knot for which job, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Six Working Knots and Rope Care", "intro": "By now you can tie a bowline, a reef knot and a clove hitch. Tonight we add the knots that a working boat crew uses every day: a bend to join two ropes, hitches that grip poles and hold tension, and the cleat hitch that ties a boat to the dock. We will also learn to coil and whip rope, because a crew that cannot look after its rope will not have rope when it matters.", "steps": [{"title": "Rope materials and rope care", "min": 6, "detail": "Pass around the three samples. Nylon: strongest, stretches about 20 percent under load, which is good for anchor and dock lines because it absorbs shock; it soaks up water and weakens slightly when wet. Polyester: almost as strong, very little stretch, resists sun and chafe well; the standard for sheets and halyards that control sails. Polypropylene: the yellow rope that floats; cheapest and weakest, breaks down in sunlight, but perfect for throw bags and ski lines because it will not sink under a swimmer. Rope care rules: rinse salt and sand out with fresh water, dry fully before stowing, keep out of direct sun, never step on rope (grit works into the fibres), never drag rope over sharp edges, coil it after use, and inspect it. Show the damaged sample: cut strands, a glazed melted patch from friction, and a hard kinked spot. Any of these means retire the rope from load-bearing work."}, {"title": "Sheet bend and double sheet bend", "min": 7, "detail": "Use: joining two ropes, especially of different thickness; it is the knot a reef knot must never be used for. Each scout takes the thick rope and the thin cord. Say and show: 'Make a bight (a U-shape) in the thicker rope and hold it in your left hand with the open end pointing right. Take the working end of the thin cord and pass it up through the bight from underneath. Now take it around the back of the bight, going behind both legs. Bring it to the front and tuck it under itself, under its own standing part, right where it first came up through the bight. Pull the standing parts to tighten.' Check: both short ends should be on the same side of the knot. If they are on opposite sides you have a left-handed sheet bend, which can slip. For the double sheet bend, take a second turn around the bight before the final tuck; use it when the ropes are very different in size or slippery."}, {"title": "Rolling hitch", "min": 6, "detail": "Use: gripping a pole or another rope so it can be pulled along its length without sliding, for example to take the strain off a jammed sheet, or to tie a fender to a rail. Scouts use the pole. Say and show: 'Pass the working end around the pole. Cross over the standing part and take a second full turn around the pole beside the first, on the side toward the direction you will pull. Now cross over the standing part again and finish with a single half hitch on the far side, tucking the end under.' It looks like a clove hitch with an extra turn. Pull the standing part in the direction of the two turns and the hitch bites; pull the other way and it slides. Have each scout tie it, then test by loading the standing part while a partner holds the pole. Repeat with the hitch tied around another rope instead of the pole."}, {"title": "Taut-line hitch and trucker's hitch", "min": 9, "detail": "Taut-line hitch, for tent guylines that need adjusting: 'Pass the rope around the tent peg (use the chair leg). Bring the working end back toward the tent and wrap it twice around the standing part, inside the loop, working toward the peg. Then take one more wrap on the tent side of those two turns, outside the loop, and tuck it under itself. Dress it neatly.' Slide the hitch along the standing part to tighten the line; under load it grips and holds. Trucker's hitch, for pulling a line really tight, like a ridge line or a load on a roof rack: 'Tie a small fixed loop in the standing part about a metre from the anchor (a slippery half hitch works, a figure-8 loop is stronger). Pass the working end around the anchor, bring it back up through the loop, and pull down. You now have a 3-to-1 pulley. Hold the tension and lock it with two half hitches around the standing parts just below the loop.' Warn: it can pull hard enough to break thin cord."}, {"title": "Cleat hitch", "min": 6, "detail": "Use: securing a boat to a dock cleat, or a halyard to a mast cleat. Demonstrate on the cleat board. 'Lead the line to the far horn of the cleat first, so the line comes in at an angle and does not jam. Take one full turn around the base of the cleat, under both horns. Now make a figure-8: over the top of the near horn, across the middle, under and over the far horn. Finish with a locking hitch: form an underhand loop in the working end, flip it over the near horn so the end is pinned under itself, and the end should lie parallel to the last crossing, not across it.' A correct cleat hitch has one round turn, one figure-8 and one locking hitch; more wraps just make it slower to release in an emergency. Common error: the locking loop flipped the wrong way, so the end crosses the figure-8 instead of lying beside it. Everyone ties it three times, once with eyes closed."}, {"title": "Coiling rope and common whipping", "min": 6, "detail": "Coiling: hold the rope end in your left hand. With your right hand, reach out an arm's length along the rope and lay a loop into your left hand, giving the rope a small clockwise twist each time so laid rope lies flat; braided rope prefers alternate over-and-under loops so it does not kink. When about a metre remains, wrap the working end around the coil three times near the top, push a bight through the top of the coil, fold it over the top and pull the end tight. This is a gasket coil; it hangs on a hook and unclips in seconds. Whipping stops a cut rope end from fraying. Lay the 60 cm twine along the rope with a bight (loop) pointing toward the rope's end, tail hanging past it. Wrap tight turns over both the twine and the rope, working toward the end, until the whipping is as long as the rope is thick. Pass the working end through the bight, then pull the other tail so the bight drags the end under the wraps. Trim both ends."}], "tips": ["Teach one knot fully (say it, show it slowly, show it again, scouts tie it, check it) before moving on. Do not rush the sheet bend; it is the one they will use most.", "Say the same words every time. Scouts learn knots as a spoken rhythm, so 'up through, around behind, under itself' should sound identical each demonstration.", "Pair strong knot-tiers with scouts who struggle. A scout who can teach the knot has truly learned it.", "The taut-line hitch and the rolling hitch are cousins; point out that both are 'two turns then a half hitch' and the difference is what they are tied around.", "For the cleat hitch, chalk a big figure-8 on the board around the cleat so the path is obvious.", "If whipping runs long, finish it as the first activity station instead."], "safety": ["Never put a loop of rope around a neck, wrist or finger during tension games; the trucker's hitch pulls hard.", "Only leaders use scissors or knives to cut twine and rope. Cut away from the body.", "Keep loose rope off the floor between exercises; it is a trip hazard in a crowded hall.", "If you melt rope ends with a lighter to seal them, do it outside or in a ventilated area, leader only, with a metal tray underneath, and let the end cool before touching."]}, "spiritual": {"title": "The Bond of Perfection", "ref": "Colossians 3:12-14", "verse": "Bearing with one another, and forgiving one another, if anyone has a complaint against another; even as Christ forgave you, so you also must do. But above all these things put on love, which is the bond of perfection.", "url": "https://www.biblegateway.com/passage/?search=Colossians+3%3A12-14&version=NKJV", "message": "Tonight you tied a sheet bend, a knot whose only job is to join two ropes that are different: a thick one and a thin one, a stiff one and a soft one. Tied properly, they pull together as one line, and the load flows through the join without slipping. Tied wrongly, with the ends on opposite sides, it looks fine until you load it, and then it lets go. St. Paul tells the Colossians that love is 'the bond of perfection', the knot that joins people who are different. In a troop we are not all the same rope. Some of us are loud, some quiet, some strong at knots, some strong at first aid. Paul lists the things that make the bond hold: tender mercies, kindness, humility, meekness, longsuffering, bearing with one another, forgiving one another. Forgiveness is the tuck under itself that locks the knot. Without it, the join looks fine on a calm day and slips in the first storm. Our fathers the desert monks lived this. St. Antony and his disciples were different men from different towns, joined by love and forgiveness into one community that has lasted seventeen centuries. This week, as we approach the Presentation of Christ and Jonah's fast, ask: is there someone in my patrol, my family or my school where my knot with them has slipped? Retie it with forgiveness.", "discussion": ["A sheet bend joins two ropes of different sizes. Who in your life is a 'different rope' from you, and what does love and forgiveness look like in that friendship?", "Paul says forgive 'even as Christ forgave you'. Why is remembering that we are forgiven the key to forgiving others?", "A badly tied knot only fails under load. When does a friendship get 'loaded', and how do we make sure it holds?"], "prayer": "Lord, You have joined us together in one troop and one Church, though we are all different. Put on us Your love, the bond of perfection, and teach us to forgive one another as You have forgiven us. Keep our knots with each other tight and true when the load comes, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Blindfold Knot Challenge and Knot Tag", "setup": "Part 1 (12 minutes): patrols line up in single file facing a table with a pole and a cleat board. One leader per patrol acts as judge with the sign-off sheet. Part 2 (13 minutes): clear the centre of the hall. Mark a 'safe zone' at each end with tape. Each scout keeps one 3 m rope tucked in a back pocket or belt like a tail.", "materials": ["Blindfolds, 2 per patrol", "3 m rope and 2 m cord per scout", "Pole and cleat board per patrol", "Judge sheet listing: bowline, reef knot, clove hitch, sheet bend, rolling hitch, cleat hitch", "Whistle for the leader running Knot Tag", "Deck of knot cards (six cards, one knot name each, repeated three times)"], "rules": ["Blindfold Knot Challenge: the first scout in each patrol is blindfolded, the judge draws a knot card and reads the name, and the scout must tie it by feel within 45 seconds. A correct, dressed knot scores 2 points; a recognizable knot with one fault scores 1; the patrol may coach with words only (no touching) for a 1-point penalty.", "The blindfold passes to the next scout, and so on until everyone has tied at least one knot. The sheet bend must be tied with the two different ropes; the cleat hitch and rolling hitch use the board and pole.", "Knot Tag: every scout has a rope tail. Two scouts start as 'It'. When It pulls a tail, the tagged scout must go to the nearest safe zone, where a leader names a knot from the deck. The scout ties it correctly and shows the leader to earn freedom and return to the game.", "A scout who ties the knot on the first try scores 1 point for their patrol; a scout who needs a second try scores nothing but is still freed. If It pulls the tail of a scout already holding a rope tail in hand (heading to the zone), the tag does not count.", "Every 3 minutes the leader blows the whistle and the two most recently freed scouts become the new It. Play until time is called. Combined points from both parts decide the winning patrol."], "variations": ["Short on time: run only the Blindfold Knot Challenge as a straight relay, first patrol to sign off all six knots wins.", "Harder: in the Blindfold Challenge, the judge names the knot and the use ('tie the knot you would use to join a thin line to a thick one') and the scout must pick the correct knot as well as tie it.", "Easier: allow scouts to look for 5 seconds before the blindfold goes on, and drop the coaching penalty.", "Larger group: run Knot Tag in two halves of the hall with separate safe zones so nobody waits in a long line."]}, "tables": [{"caption": "Which knot for which job", "headers": ["Knot", "Job", "Remember it by"], "rows": [["Sheet bend", "Join two ropes, especially of different thickness", "Up through the bight, around behind, under itself; ends on the same side"], ["Double sheet bend", "Join very different or slippery ropes", "Sheet bend with a second turn around the bight"], ["Rolling hitch", "Grip a pole or rope and pull along it without sliding", "Two turns toward the pull, then a half hitch"], ["Taut-line hitch", "Adjustable loop for tent guylines", "Two wraps inside the loop, one outside, slide to tighten"], ["Trucker's hitch", "Pull a line very tight (3-to-1 pulley)", "Loop in the standing part, through the anchor, back through the loop, lock with two half hitches"], ["Cleat hitch", "Tie a boat or halyard to a cleat", "Round turn, figure-8, locking hitch"]]}, {"caption": "Rope materials at a glance", "headers": ["Material", "Strength", "Stretch", "Floats?", "Best for", "Weakness"], "rows": [["Nylon", "Very high", "High (about 20 percent)", "No", "Anchor and dock lines, shock loads", "Absorbs water, slightly weaker when wet"], ["Polyester", "High", "Low", "No", "Sheets, halyards, control lines", "Costs more"], ["Polypropylene", "Low to medium", "Medium", "Yes", "Throw bags, ski lines, painters", "Sun damage, melts easily, stiff in cold"]]}], "references": [{"label": "Animated Knots: Sheet Bend", "url": "https://www.animatedknots.com/sheet-bend-knot", "why": "Step-by-step animation to practise before teaching; shows the correct ends-same-side check."}, {"label": "Animated Knots: Rolling Hitch", "url": "https://www.animatedknots.com/rolling-hitch-knot", "why": "Shows the direction of pull clearly, the part scouts most often get backwards."}, {"label": "Animated Knots: Taut-Line Hitch", "url": "https://www.animatedknots.com/taut-line-hitch-knot", "why": "Tent guyline hitch with the wraps counted out."}, {"label": "Animated Knots: Trucker's Hitch", "url": "https://www.animatedknots.com/truckers-hitch-knot", "why": "Shows the loop, the pulley pull and the locking half hitches."}, {"label": "Animated Knots: Cleat Hitch", "url": "https://www.animatedknots.com/cleat-hitch-knot", "why": "The round turn, figure-8 and locking hitch in order, including the common wrong-way lock."}, {"label": "Animated Knots: Common Whipping", "url": "https://www.animatedknots.com/common-whipping-knot", "why": "Whipping sequence with the bight-drag finish demonstrated."}], "visual": "knot-uses", "takeHome": "Whip both ends of one rope at home (any string will do), tie a taut-line hitch on a doorknob and adjust it five times, and bring the whipped rope next week to be checked."}, {"n": 20, "date": "2027-02-09", "term": "Winter", "title": "Stars & Celestial Navigation", "theme": "Finding north, finding your latitude and reading the winter sky over Ontario", "sea": true, "calendar": ["Ordinary week in the Coptic calendar. Tuesday is not a fast day.", "Presentation of Christ in the Temple is next Monday, Feb 15 (also Family Day, no school). Jonah's fast begins Feb 22.", "Sunset in southern Ontario is about 5:40 pm this week, so the sky is fully dark by meeting time; a 2-minute look outside the hall door at Orion is worth it if the sky is clear."], "objectives": ["Find Polaris using the pointer stars of the Big Dipper and check it with Cassiopeia.", "Estimate latitude from the height of Polaris above the horizon using hand measurements (fist equals 10 degrees).", "Identify Orion, Sirius and the Pleiades in the February evening sky and use Orion's belt for rough direction.", "Name the eight moon phases and explain how the moon causes spring and neap tides.", "Set a planisphere for tonight's date and time and use Stellarium Web to preview the sky."], "materials": [{"item": "Planisphere (star wheel) for latitude 40-50 degrees north", "qty": "3 (1 per 2 patrols)", "note": "about $15 each at a bookshop or science store; reusable for years"}, {"item": "Laptop or tablet with Stellarium Web loaded, plus projector or TV if available", "qty": "1", "note": "stellarium-web.org works in a browser; test the hall wifi or download in advance"}, {"item": "Printed sky charts: Big Dipper to Polaris, Cassiopeia, Orion region, moon phases", "qty": "1 set per patrol", "note": "print from the visual or draw large on chart paper"}, {"item": "Paper cups (white, 250 mL)", "qty": "40", "note": "activity projectors; dollar store"}, {"item": "Push pins or safety pins", "qty": "1 per scout", "note": "for punching star holes"}, {"item": "Printed constellation templates sized to fit a cup bottom (Big Dipper, Little Dipper, Cassiopeia, Orion, Canis Major, Taurus with Pleiades, Leo, Gemini)", "qty": "2 of each", "note": "dots only, 6-10 stars each, no lines"}, {"item": "Flashlights or phone lights", "qty": "1 per patrol", "note": "ask scouts to bring a flashlight"}, {"item": "Masking tape, pencils, corrugated cardboard squares 10 cm", "qty": "1 roll, 25 pencils, 25 squares", "note": "cardboard backs the cup while pinning"}, {"item": "A ball (moon), a lamp without shade (sun) and a globe or larger ball (Earth)", "qty": "1 each", "note": "moon-phase demo"}], "prep": ["Open Stellarium Web at home, set the location to your town, the date to tonight and the time to 8:00 pm, and take screenshots of the north sky (Polaris, Big Dipper, Cassiopeia) and the south sky (Orion, Sirius, Pleiades) in case the hall internet fails.", "Practise the fist measurement: with your arm straight, your closed fist from bottom to top covers about 10 degrees of sky. Four and a half fists up from the horizon in Toronto lands you on Polaris.", "Set each planisphere to Feb 9 at 8 pm and note how it looks so you can show scouts the target.", "Print the constellation dot templates and the sky charts. Cut the templates into circles that fit inside a cup bottom.", "Test one cup projector: pin the holes, hold the flashlight inside the cup, darken the room and aim at the ceiling. Bigger holes make brighter stars; use the pin tip for faint stars and wiggle it for bright ones.", "Check that the hall lights can be fully turned off and that emergency lighting still gives enough light to move safely.", "Check tonight's actual moon phase (a calendar app or the tides.gc.ca site shows it) so you can point it out."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Family Day, Presentation feast, Jonah's fast)."}, {"time": "6:25", "min": 40, "what": "Practical: how the sky moves, Big Dipper to Polaris, latitude from Polaris, Orion and the winter stars, moon phases and tides, planisphere and Stellarium."}, {"time": "7:05", "min": 10, "what": "Spiritual: Psalm 19:1 and Psalm 8, the heavens declare the glory of God."}, {"time": "7:15", "min": 25, "what": "Activity: Constellation Projectors, patrols build cup projectors and run a ceiling planetarium quiz."}, {"time": "7:40", "min": 5, "what": "Closing: recap (pointers, five fists, belt), take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Reading the Night Sky Like a Navigator", "intro": "Before GPS, every ship's officer could find north and their latitude from the stars, and Coptic monks in the desert prayed the Midnight Praise by the turning of the sky. Tonight you learn the two or three star patterns that let you do the same from anywhere in Ontario, plus how the moon runs the tides. Nothing here needs equipment; your own fist is the instrument.", "steps": [{"title": "How the sky moves", "min": 6, "detail": "Explain: the Earth turns once a day, so the whole sky seems to wheel around one point, the north celestial pole, which sits almost exactly on the star Polaris. Stars near Polaris never set for us; they are called circumpolar (the Big Dipper and Cassiopeia are the useful ones). Stars far from Polaris rise in the east and set in the west, like the sun. The sky also shifts with the seasons, about 1 degree per night, which is why Orion rules the winter evening and is gone by June. Star brightness is measured in magnitude; lower numbers are brighter, and Sirius at minus 1.5 is the brightest star in the sky. Warn about light pollution: from a city you may see 50 stars, from a dark lake 2000, so learn the bright patterns first. Show the Stellarium screenshot of tonight's north sky."}, {"title": "Big Dipper to Polaris, checked with Cassiopeia", "min": 8, "detail": "Hand out the north sky chart. The Big Dipper is seven bright stars: four in the bowl, three in the handle. The two stars at the outer edge of the bowl, the side away from the handle, are the Pointers (Dubhe and Merak). Draw a line from the bottom pointer through the top pointer and keep going about five times the distance between them. The next moderately bright star you hit is Polaris. Polaris is not especially bright (magnitude 2), so do not look for the brightest star; look for the lonely one at the end of the pointer line. Polaris is also the last star in the handle of the Little Dipper. Check: Cassiopeia is a bright W (or M) shape on the opposite side of Polaris from the Big Dipper; the deeper V of the W points roughly toward Polaris. In February at 8 pm the Dipper stands on its handle low in the northeast and Cassiopeia is high in the northwest. Have each scout trace the line with a finger on the chart, then close their eyes and describe the steps out loud."}, {"title": "Latitude from Polaris", "min": 7, "detail": "Here is the navigator's secret: the angle of Polaris above the horizon equals your latitude. At the North Pole (90 degrees north) Polaris is straight overhead; at the equator it sits on the horizon. Toronto is about 43.7 degrees north, Ottawa 45.4, Sudbury 46.5, so from southern Ontario Polaris is a little less than halfway up the sky. Teach the hand measures, all made with a straight arm: a fist is about 10 degrees, three middle fingers about 5 degrees, a little finger about 1 degree, and a spread hand from thumb tip to little finger about 20 degrees. Stack fists from the horizon: four fists plus a bit lands on Polaris in Toronto. Practise indoors by taping a paper star on the wall at about 44 degrees above a floor line (a leader can measure it with a phone inclinometer app) and having scouts stack fists from the 'horizon' tape line. Mention that sailors used a quadrant, later a sextant, to do this precisely, and that without a clock latitude was the only thing they could find from the stars."}, {"title": "Orion and the winter stars", "min": 7, "detail": "Switch to the south sky chart. Orion the Hunter is the easiest winter pattern: three equally bright stars in a short straight line make his belt. Above the belt to the left is Betelgeuse, a red-orange supergiant; below the belt to the right is Rigel, blue-white and very bright. Hanging from the belt is the sword, which contains the Orion Nebula, a cloud where stars are being born. Follow the belt line down and to the left about 20 degrees and you reach Sirius, the brightest star in the sky, in Canis Major. Follow the belt up and to the right and you reach Aldebaran, the red eye of Taurus, then the Pleiades, a tight little cluster like a tiny dipper. Navigation use: Orion sits near the celestial equator, so the belt rises almost exactly in the east and sets almost exactly in the west, anywhere on Earth. In February at 8 pm Orion is high in the south. Ask scouts to point to where Orion would be if the hall's south wall were the horizon."}, {"title": "Moon phases and tides", "min": 7, "detail": "Turn off the lights and use the lamp (sun), a scout with the ball (moon) walking around a seated scout (Earth). The lit half of the ball always faces the lamp; what the Earth scout sees changes. Name the eight phases in order: new moon (between us and the sun, invisible), waxing crescent, first quarter (right half lit in the evening sky), waxing gibbous, full (opposite the sun, rises at sunset), waning gibbous, last quarter (left half lit, seen in the morning), waning crescent. The cycle takes about 29.5 days. Tides: the moon's gravity pulls the ocean into two bulges, so most coasts get two high tides and two low tides a day, about 12 hours 25 minutes apart. At new and full moon the sun and moon pull in line and tides are biggest (spring tides, nothing to do with the season); at the quarters they pull at right angles and tides are smallest (neap tides). The Great Lakes are too small for real tides (a few centimetres), but the Bay of Fundy in Nova Scotia has the highest tides on Earth, up to 16 m (about 52 ft)."}, {"title": "Planisphere and Stellarium", "min": 5, "detail": "Show a planisphere: two discs, the bottom one printed with stars, the top one with a window shaped like the sky. Rotate the top disc until tonight's date on the rim lines up with the current time on the other scale (8 pm for February 9). The stars in the window are what is up right now. To use it outside, hold it overhead with the direction you are facing at the bottom edge of the window; the chart then matches the sky. Patrol pairs set the planisphere for tonight and find Polaris, Orion and Sirius on it. Then demonstrate Stellarium Web on the laptop: type your town in the location box, set the date and time, drag to look around, click a star to see its name, and use the search box to find Polaris. Point out it also shows planets, which planispheres cannot, and that it works on a phone at camp with the screen dimmed red to protect night vision."}], "tips": ["Most scouts have never actually seen the Big Dipper pointed out. If the sky is clear, take the whole troop outside the hall door for two minutes and find Polaris for real; that beats any diagram.", "Keep saying 'Polaris is not bright, it is alone'. The number-one error is picking the brightest star in the north.", "The fist measure works for scouts too because arm length and fist size scale together; let them check by stacking fists from horizon to straight overhead, which should be about nine.", "For the moon demo, the scout holding the ball should hold it above their head so the Earth scout's head does not block the lamp.", "If a planisphere is out of your budget, print a free star wheel template (search 'printable planisphere') on card stock and assemble with a brass fastener."], "safety": ["When the lights go off, have everyone seated first and keep the exit lights visible. Turn lights back on before anyone moves.", "Push pins are sharp: pin onto the cardboard square, not a hand or a table top, and collect all pins at the end.", "If you go outside to look at the sky, count heads out and back in, stay on the lit path near the door, and keep coats on; February evenings can be well below minus 10 degrees Celsius."]}, "spiritual": {"title": "The Heavens Declare", "ref": "Psalm 19:1; Psalm 8:3-4", "verse": "The heavens declare the glory of God; And the firmament shows His handiwork. (Psalm 19:1) When I consider Your heavens, the work of Your fingers, The moon and the stars, which You have ordained...", "url": "https://www.biblegateway.com/passage/?search=Psalm+19%3A1%3B+Psalm+8%3A3-4&version=NKJV", "message": "Tonight you learned that the sky is not random. Polaris stays fixed while everything wheels around it. The moon keeps its 29-day rhythm so exactly that sailors print tide tables years ahead. Orion's belt rises in the east and sets in the west for every person on Earth. David looked up at the same stars three thousand years ago and wrote, 'The heavens declare the glory of God.' The stars do not preach with words, but their order, their beauty and their faithfulness are a sermon anyone can read in any language. That is why the Church prays through the night. The Agpeya's Midnight Prayer, which our monks in the desert still pray, is timed by the stars, and the three watches of the night remind us that Christ, the Bridegroom, comes when we least expect Him. St. Antony left the city for the desert partly because under that huge sky he could not stop thinking about the greatness of God. Then Psalm 8 turns the telescope around: 'What is man that You are mindful of him?' The God who set Polaris in place knows your name and counts the hairs on your head. A navigator trusts the fixed star because it never moves. We have a fixed point too: the God who made the stars became a child in Bethlehem and drew the Magi to Himself by a star. Look up this week and let the sky remind you who holds you.", "discussion": ["What in the night sky tonight impressed you most, and what does it tell you about the God who made it?", "Polaris is the one fixed point that navigators steer by. What is the fixed point in your life when everything else feels like it is spinning?", "Psalm 8 says God is 'mindful' of us even though we are tiny compared with the stars. How does knowing that change the way you pray?"], "prayer": "O Lord, the heavens declare Your glory and the stars keep the course You gave them. Make us faithful like Polaris, steady in Your love, and humble like David, amazed that You are mindful of us. Guide our troop by Your light as You guided the Magi, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Constellation Projectors and the Ceiling Planetarium", "setup": "Patrols at their own tables with cups, pins, cardboard squares, pencils and tape. The 'planetarium' is the centre of the hall with all the lights off, ceiling as the sky. One leader runs the quiz with a score sheet, one leader controls the lights, one leader guards the pins.", "materials": ["40 paper cups", "Push pins, 1 per scout", "Constellation dot templates, 2 sets per patrol (8 patterns)", "10 cm cardboard squares, 1 per scout", "Masking tape and pencils", "1 flashlight per patrol", "Score sheet and a stopwatch"], "rules": ["Build phase (10 minutes): each patrol receives templates for all 8 constellations and must build at least 4 projectors, one constellation per cup. Tape the template to the outside of the cup bottom, put the cardboard square inside the cup, and push the pin through each dot. Make the brightest stars bigger by wiggling the pin. Write the constellation name in pencil on the side of the cup, then cover the name with a strip of tape.", "Test: put the flashlight inside the cup, aim at the ceiling, and confirm the pattern is clear from 5 m away. Patrols may fix or rebuild before the quiz.", "Planetarium quiz (12 minutes): lights off. Patrols take turns projecting one constellation onto the ceiling for 10 seconds. Every other patrol writes its guess on a slip and holds it up. Correct guesses score 1 point for the guessing patrol. The projecting patrol scores 1 point for each patrol that guesses correctly, so clean, accurate projectors earn points.", "Bonus round: the leader asks one navigation question per projected constellation (for example 'Which two stars are the Pointers?', 'Which direction does Orion's belt rise?', 'Which star is Betelgeuse?'). First patrol to answer correctly scores 2 points.", "The patrol with the most points wins. Each scout takes their cup projector home."], "variations": ["Short on time: leaders pre-punch 8 cups before the meeting and run only the planetarium quiz, patrols guessing and answering the bonus questions.", "Harder: in the quiz, the projecting patrol must show the constellation in its correct orientation for 8 pm tonight and say roughly which direction (N, S, E, W) and how high it is.", "Easier: give guessing patrols the 8 names on a printed list to choose from.", "Extension: patrols project Big Dipper and Polaris together on the ceiling and a scout uses a fist to 'measure latitude' from a taped horizon line on the wall."]}, "tables": [{"caption": "Moon phases and tides", "headers": ["Phase", "What you see (evening)", "When it rises", "Tide effect"], "rows": [["New moon", "Nothing; moon is beside the sun", "Sunrise", "Spring tide (largest range)"], ["Waxing crescent", "Thin sliver on the right", "Mid-morning", "Range shrinking"], ["First quarter", "Right half lit, due south at sunset", "Noon", "Neap tide (smallest range)"], ["Waxing gibbous", "More than half, growing", "Afternoon", "Range growing"], ["Full moon", "Whole disc, opposite the sun", "Sunset", "Spring tide (largest range)"], ["Waning gibbous", "More than half, shrinking", "Late evening", "Range shrinking"], ["Last quarter", "Left half lit, seen in the morning", "Midnight", "Neap tide (smallest range)"], ["Waning crescent", "Thin sliver on the left, before dawn", "Early morning", "Range growing"]]}, {"caption": "February 8 pm sky targets for southern Ontario", "headers": ["Target", "Where to look", "How to find it", "Use"], "rows": [["Polaris", "North, about 44 degrees up", "Pointers of the Big Dipper, 5 lengths out", "True north; height equals latitude"], ["Big Dipper", "Northeast, standing on its handle", "Seven bright stars, bowl and handle", "Finds Polaris"], ["Cassiopeia", "High in the northwest", "Bright W shape", "Confirms Polaris from the other side"], ["Orion", "High in the south", "Three belt stars in a row", "Belt rises east, sets west"], ["Sirius", "Lower left of Orion, southeast", "Follow the belt down-left; brightest star", "Landmark for the winter sky"], ["Pleiades", "Upper right of Orion, high in the southwest", "Follow the belt up-right past Aldebaran", "Tiny dipper-shaped cluster"]]}], "references": [{"label": "Stellarium Web", "url": "https://stellarium-web.org/", "why": "Free browser planetarium; set your town and 8 pm tonight to preview exactly what scouts will see."}, {"label": "Wikipedia: Polaris", "url": "https://en.wikipedia.org/wiki/Polaris", "why": "Background on the pole star, its brightness and why it marks north."}, {"label": "Wikipedia: Planisphere", "url": "https://en.wikipedia.org/wiki/Planisphere", "why": "Explains how a star wheel works and how to set it."}, {"label": "Wikipedia: Tide", "url": "https://en.wikipedia.org/wiki/Tide", "why": "Spring and neap tide explanation with diagrams to sketch on the whiteboard."}, {"label": "YouTube search: how to find Polaris using the Big Dipper", "url": "https://www.youtube.com/results?search_query=how+to+find+polaris+using+the+big+dipper", "why": "Two-minute videos that show the pointer-star method against a real sky."}, {"label": "Bible Gateway: Psalm 8 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Psalm+8&version=NKJV", "why": "Full psalm for the spiritual lesson."}], "visual": "polaris-finder", "takeHome": "On the next clear night, find Polaris from your own backyard, measure its height with your fist, and write down your estimated latitude to report next week."}, {"n": 21, "date": "2027-02-16", "term": "Winter", "title": "Radio & Communication", "theme": "VHF marine radio, the phonetic alphabet and how to call for help so that you are understood the first time", "sea": true, "calendar": ["Yesterday (Feb 15) was the Feast of the Presentation of Christ in the Temple and also Family Day in Ontario. Greet the scouts with the feast.", "Jonah's fast is next week, Feb 22-24; next Tuesday's meeting falls inside it, so any snack next week must be vegan.", "Tuesday tonight is not a fast day."], "objectives": ["Explain what a VHF marine radio is, why channel 16 matters, and the rule of listening before transmitting.", "Recite the full NATO phonetic alphabet and spell any word with it without hesitation.", "Use correct procedure words (over, out, roger, say again, wilco, stand by) and make a routine call to another vessel.", "Give a complete MAYDAY call in the correct order, and explain the difference between MAYDAY, PAN-PAN and SECURITE.", "State a position two ways: latitude and longitude, and bearing and distance from a known landmark.", "Use walkie-talkies at camp with proper protocol."], "materials": [{"item": "FRS/GMRS walkie-talkies (family two-way radios)", "qty": "4-6 (2-3 pairs)", "note": "borrow from leaders or families; about $40 a pair if buying; charge fully"}, {"item": "Handheld VHF marine radio (for show only, do not transmit on channel 16)", "qty": "1 if a leader owns one", "note": "optional; a photo on the projector works too"}, {"item": "Printed phonetic alphabet card", "qty": "1 per scout", "note": "wallet size; laminate if you can"}, {"item": "Printed MAYDAY script card", "qty": "1 per scout", "note": "see step 4 and the table"}, {"item": "Printed procedure words table", "qty": "1 per patrol", "note": "from the tables section"}, {"item": "Printed simple chart or map of a local lake or harbour with a compass rose and 3 named landmarks", "qty": "1 per patrol", "note": "hand-drawn is fine; used for giving positions"}, {"item": "Scenario cards for the mock MAYDAY drama (6 scenarios)", "qty": "1 set", "note": "see activity"}, {"item": "Cardboard box 'radio' props with a paper cup microphone", "qty": "1 per patrol", "note": "optional but fun; scouts hold the cup like a mic"}, {"item": "Whiteboard and markers", "qty": "1", "note": "for the MAYDAY order and position examples"}, {"item": "Timer, score sheets, pencils", "qty": "1 timer, 6 sheets", "note": "for the relay and drama"}], "prep": ["Memorize the phonetic alphabet yourself and practise spelling your surname, the church name and 'Sea Scouts' with it aloud.", "Write the MAYDAY sequence on the whiteboard in large letters before the meeting: MAYDAY x3, THIS IS + name x3, MAYDAY + name, POSITION, NATURE OF DISTRESS, ASSISTANCE REQUIRED, PERSONS ON BOARD, VESSEL DESCRIPTION, OVER.", "Test the walkie-talkies in the hall: pick one channel and privacy code, set them all the same, confirm they reach across the hall and into the hallway.", "Draw or print the simple harbour chart: a lake outline, a lighthouse, a marina, an island, a north arrow, and a latitude/longitude grid with minutes marked.", "Write the six scenario cards (see activity) and prepare a scoring rubric sheet per scenario.", "Choose one leader to be the 'Coast Guard' for the drama and one to time the phonetic relay.", "Remind yourself: a real VHF radio must never be used to transmit a practice MAYDAY, and in Canada an operator needs a Restricted Operator Certificate (Maritime) to transmit on a VHF."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall-in by patrol, Scout Promise, Lord's Prayer, attendance, announcements (Presentation feast greeting, Jonah's fast next week)."}, {"time": "6:25", "min": 40, "what": "Practical: VHF basics and channel 16, phonetic alphabet, procedure words and clear speaking, MAYDAY / PAN-PAN / SECURITE, giving a position, walkie-talkie protocol."}, {"time": "7:05", "min": 10, "what": "Spiritual: 1 Samuel 3:1-10, 'Speak, for Your servant hears'."}, {"time": "7:15", "min": 25, "what": "Activity: Phonetic Telephone Relay, then the Mock MAYDAY Drama scored by the Coast Guard leader."}, {"time": "7:40", "min": 5, "what": "Closing: recap the MAYDAY order together out loud, take-home challenge, closing prayer, dismissal."}], "practical": {"title": "Talk Like a Sailor: VHF, Phonetics and MAYDAY", "intro": "On the water there is no shouting across to the next boat. Sailors talk on VHF marine radio, and everyone within reach hears every word. A clear, correct call can bring help within minutes; a mumbled, panicked one wastes the seconds that matter most. Tonight you learn the alphabet, the words and the exact script that professional mariners use, and you will practise it until it comes out automatically.", "steps": [{"title": "VHF marine radio and channel 16", "min": 7, "detail": "Show the handheld VHF or a photo. A VHF (very high frequency) marine radio works by line of sight, so about 10 km (5 NM) boat to boat and 30-40 km to a tall Coast Guard antenna; it does not go around the curve of the Earth. Channel 16 (156.8 MHz) is the international distress, safety and calling channel. Every vessel with a radio keeps it switched to 16 while under way, and the Canadian Coast Guard monitors it around the clock. You call another boat on 16, then both switch to a working channel such as 68 or 72 to talk, so 16 stays clear for emergencies. Controls: power, volume, squelch (turn it up until the hiss just stops), channel selector, the push-to-talk (PTT) button on the side, and on newer sets a red DSC button that sends an automatic distress alert with your position. Rules: listen before you press PTT, because only one person can transmit at a time; press, wait one second, speak, release to listen. In Canada, operating a VHF requires a Restricted Operator Certificate (Maritime), a short course scouts can take at 14 or older."}, {"title": "The phonetic alphabet", "min": 8, "detail": "Radio is noisy, and B, D, P and T sound the same over static, so mariners and pilots spell with words. Read the whole alphabet aloud together twice, leader first, scouts echoing: Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu. Point out the spellings Alfa and Juliett are deliberate so French speakers pronounce them correctly. Numbers are said one digit at a time with clear sounds: 'wun, too, tree, fower, fife, six, seven, ait, niner, zero'; 16 is 'wun six', never 'sixteen'. Practise: each scout spells their own surname to their patrol; then the patrol spells the name of their patrol and the church. Then do it fast: the leader points at a scout and says a letter, the scout answers with the word within one second. Finish by spelling S-O-S and M-A-Y-D-A-Y together."}, {"title": "Procedure words and clear speaking", "min": 7, "detail": "Procedure words save time and prevent confusion. OVER means 'I have finished, I expect a reply'. OUT means 'I have finished, no reply expected'. Never say 'over and out'; it contradicts itself. ROGER means 'I received your message' (not 'yes'). AFFIRMATIVE means yes, NEGATIVE means no. SAY AGAIN means repeat (never 'repeat', which has a different naval meaning). WILCO means 'I will comply'. STAND BY means 'wait'. THIS IS introduces your vessel name. A routine call: 'Sea Scout One, Sea Scout One, Sea Scout One, this is Sea Scout Two, Sea Scout Two, Sea Scout Two, over.' The reply: 'Sea Scout Two, this is Sea Scout One, go ahead, over.' Then: 'Switch to channel six eight, over.' 'Six eight, roger, out.' Teach RSVP for speaking: Rhythm (steady, pause between phrases), Speed (slower than normal), Volume (normal, do not shout into the mic), Pitch (a little higher than usual carries better). Hold the microphone 5 cm from your mouth and slightly to the side. Have patrols practise the routine call using the cup microphones."}, {"title": "MAYDAY, PAN-PAN and SECURITE", "min": 10, "detail": "Three levels, all on channel 16. MAYDAY (from the French m'aider, help me) is only for grave and imminent danger to life or the vessel: sinking, fire, man overboard not recovered, medical emergency. PAN-PAN (pronounced pahn-pahn) is urgent but not immediately life-threatening: engine failure and drifting toward rocks, a broken mast, a minor injury needing evacuation. SECURITE (say-cure-ee-tay) is a safety message: a hazard to navigation, a floating log, a storm warning. Everyone else stays silent during a MAYDAY. Teach the script from the whiteboard and have the whole troop say it in unison, then each patrol, then individuals: 'MAYDAY, MAYDAY, MAYDAY. This is Sea Scout Two, Sea Scout Two, Sea Scout Two. MAYDAY, Sea Scout Two. My position is two nautical miles south of Gibraltar Point light. We are taking on water and sinking. I require immediate assistance. Four persons on board. We are a five-metre white sailing dinghy with a red sail. OVER.' Then release the button and listen. If no answer in about a minute, repeat. The Coast Guard will say 'Sea Scout Two, this is Toronto Coast Guard Radio, received MAYDAY' and ask questions. Never switch off; keep answering. As a backup, 911 on a cell phone reaches the Coast Guard, but a radio call alerts every boat nearby too."}, {"title": "Giving a position", "min": 4, "detail": "Help cannot come if they cannot find you, so position is the first thing after your name. Two ways. First, latitude and longitude from a GPS or chart, read slowly: 'four three degrees, three eight decimal five minutes north; zero seven nine degrees, two two decimal eight minutes west'. Say 'north' and 'west' every time. Second, and easier without electronics: a bearing and distance from a charted landmark, or a distance and direction from something anyone can find: 'one nautical mile east of the Port Credit lighthouse' or 'off the north tip of Centre Island'. Hand out the practice chart. Each patrol marks a point, then one scout states the position both ways to another patrol, who must find it on their chart within 30 seconds. Remind them: if unsure, describe what you can see, such as 'a green buoy number 5 close to port and a water tower ahead'."}, {"title": "Walkie-talkie protocol for camp", "min": 4, "detail": "Hand out the walkie-talkies, one per patrol leader and one to the leaders. These are FRS radios: no licence, short range (a kilometre or two in the open, less in trees). Set everyone to the same channel and privacy code, and agree on callsigns (patrol names). The protocol is the same as VHF: listen first, press PTT, wait one full second before speaking so the first word is not cut off, say who you are calling then who you are, keep every message under 10 seconds, end with over or out. Start every use with a radio check: 'Base, this is Orca, radio check, over', answered 'Orca, this is Base, loud and clear, over'. No chatter, no jokes on the air, no personal names of scouts over the radio, and report battery level to the leaders at each check-in. Demonstrate a check-in from the hallway to the hall so scouts hear how range and walls affect the signal."}], "tips": ["Chant the phonetic alphabet like a song; most scouts have it memorized by the end of the night if they hear it eight or nine times.", "Insist on the MAYDAY order every time, even in play. The order exists because a listener might only catch the first few seconds; name and position come first for that reason.", "The commonest mistakes: saying 'over and out', shouting into the mic, and forgetting to release the button to listen.", "Have the 'Coast Guard' leader deliberately ask 'say again your position' in practice so scouts learn to repeat calmly rather than panic.", "If a scout freezes, point at the whiteboard; the script is there so no one has to remember it under stress."], "safety": ["Never transmit a practice MAYDAY on a real VHF or on channel 16; it is illegal and diverts real rescue resources. Use props and walkie-talkies only.", "Walkie-talkies are not toys; keep them off the floor and away from water.", "Remind scouts that in a real emergency on land, 911 is the call, and that a lost or hurt scout should follow the STOP steps coming next week."]}, "spiritual": {"title": "Speak, for Your Servant Hears", "ref": "1 Samuel 3:1-10", "verse": "Now the LORD came and stood and called as at other times, 'Samuel! Samuel!' And Samuel answered, 'Speak, for Your servant hears.'", "url": "https://www.biblegateway.com/passage/?search=1+Samuel+3%3A1-10&version=NKJV", "message": "Tonight you learned that a radio only works one way at a time. Press the button and you talk; release it and you listen. A sailor who never lets go of the button never hears the answer, even when the Coast Guard is calling back. Young Samuel, serving in the temple, heard God call his name in the night. Three times he ran to the old priest Eli, thinking it was him. Samuel had good ears but did not yet know the voice. Eli finally taught him what to say: 'Speak, LORD, for Your servant hears.' Samuel released the button. From that night he became the prophet who would anoint kings. Yesterday the Church celebrated the Presentation of Christ in the Temple, where two other listeners, Simeon and Anna, had spent decades waiting quietly, and so they recognized the forty-day-old Messiah when everyone else walked past. Our Pope Kyrillos VI was famous for the same thing: hours of silent prayer, so that when people came with problems he already seemed to know the answer. Prayer is not only transmitting our list to God. It is holding the Agpeya, saying the psalms, and then leaving a silence for Him. Learn the discipline of the radio: say your message clearly, say 'over', and then truly listen for His reply.", "discussion": ["Samuel heard his name three times before he understood who was calling. What are some ways God 'calls' us today that we might mistake for something else?", "In your own prayer, how much time is 'transmitting' and how much is 'listening'? What could you change this week?", "Simeon and Anna waited quietly for years and were rewarded by seeing Christ. What helps you keep waiting and listening when God seems silent?"], "prayer": "Lord, You called Samuel by name in the night and he answered, 'Speak, for Your servant hears.' Open our ears to Your voice in Scripture, in the Liturgy and in the quiet of our hearts, and give us the patience of Simeon and Anna to wait for You. Teach us to listen more than we speak, through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Phonetic Telephone Relay and the Mock MAYDAY Drama", "setup": "Part 1 (10 minutes): patrols line up in single file across the length of the hall, scouts 2 m apart facing away from the leader's table at the far end. Part 2 (15 minutes): a 'bridge' area at the front with a cardboard radio and cup microphone per patrol; the Coast Guard leader sits at a table at the back with a walkie-talkie or simply listens across the hall, holding the scoring rubric.", "materials": ["Message cards for the relay (6 cards, each a 6-8 letter word or a short position such as 'BUOY 5 EAST', 'GRID 43N 79W')", "Cardboard radio props and cup microphones, 1 per patrol", "Six MAYDAY scenario cards", "Scoring rubric sheets (10 items) for the Coast Guard leader", "Timer", "Walkie-talkies for the Coast Guard's reply (optional)"], "rules": ["Phonetic Telephone Relay: the leader shows the first scout in each line a message card for 5 seconds. That scout turns and spells it to the next scout using only the phonetic alphabet, one word per letter, at normal speaking volume. Each scout passes it down the line the same way; no plain letters and no writing allowed.", "The last scout in the line writes the message on a slip and runs it to the leader. Scoring: 5 points for a perfect message, minus 1 point per wrong letter, plus 2 bonus points for the fastest patrol. Run three rounds with different cards, rotating the line order so a different scout starts each time.", "Mock MAYDAY Drama: each patrol draws one scenario card (examples: 'Your 6 m sailboat has hit a rock 1 NM north of the marina and is sinking, 5 on board'; 'A crew member has fallen overboard and cannot be seen, you are off the east point of the island, 3 on board'; 'Galley fire spreading, 500 m west of the lighthouse, 4 on board'; 'Engine failed, drifting toward the shoals off the island, no immediate danger, 2 on board (this one is a PAN-PAN)'; 'You spot a floating log in the main channel by buoy 7 (this one is a SECURITE)'; 'Scout with a suspected broken arm, on the beach at the north end, need ambulance (this one is a PAN-PAN)').", "The patrol has 3 minutes to prepare, then one scout plays the skipper and makes the call using the cup microphone while the others act out the scene silently behind. The Coast Guard leader answers, asks one follow-up question (usually 'say again your position' or 'how many persons on board'), and the skipper must respond correctly.", "Scoring rubric, 1 point each: correct level chosen (MAYDAY / PAN-PAN / SECURITE); word said three times; 'this is' plus vessel name three times; position given clearly; nature of distress stated; assistance required stated; persons on board stated; vessel description given; ended with 'over'; calm, slow, clear voice. Bonus 2 points if the follow-up question is answered correctly with proper procedure words.", "Total the relay and drama points; highest patrol wins and is named 'Radio Watch of the Night'."], "variations": ["Short on time: skip the relay and run only the MAYDAY drama with 2 minutes of prep per patrol.", "Harder: the Coast Guard leader adds radio 'static' by having another leader talk over part of the call, forcing the skipper to use 'say again' and repeat calmly.", "Easier: let the skipper hold the MAYDAY script card while calling; deduct nothing for reading it.", "Extension: run the relay again with numbers only (a latitude and longitude), using the 'niner, fife, tree' number pronunciations."]}, "tables": [{"caption": "Procedure words every radio operator uses", "headers": ["Word", "Meaning", "Example"], "rows": [["Over", "I have finished; I expect you to reply", "'Switch to six eight, over.'"], ["Out", "I have finished; no reply expected (never 'over and out')", "'Six eight, roger, out.'"], ["Roger", "I received and understood your message", "'Roger, standing by on six eight.'"], ["Wilco", "Message received and I will comply", "'Wilco, returning to harbour.'"], ["Say again", "Repeat your last message (do not say 'repeat')", "'Say again your position, over.'"], ["Affirmative / Negative", "Yes / No", "'Affirmative, four persons on board.'"], ["Stand by", "Wait; I will call you back", "'Stand by, over.'"], ["This is", "Introduces the name of the vessel calling", "'Coast Guard, this is Sea Scout Two.'"]]}, {"caption": "The three emergency call levels", "headers": ["Call (say it 3 times)", "When", "Examples", "Who replies"], "rows": [["MAYDAY", "Grave and imminent danger to life or vessel", "Sinking, fire, person overboard not recovered, serious medical emergency", "Coast Guard and any vessel that hears it; everyone else stays silent"], ["PAN-PAN", "Urgent problem, but no immediate danger to life", "Engine failure and drifting, dismasting, injury needing evacuation", "Coast Guard; other vessels may assist"], ["SECURITE", "Safety message about navigation or weather", "Floating hazard, storm warning, tow in the channel", "No reply needed; all vessels listen"]]}], "references": [{"label": "Wikipedia: NATO phonetic alphabet", "url": "https://en.wikipedia.org/wiki/NATO_phonetic_alphabet", "why": "Full alphabet with official pronunciations and the number words."}, {"label": "Wikipedia: Mayday", "url": "https://en.wikipedia.org/wiki/Mayday", "why": "Origin of the word and the standard call format, plus PAN-PAN and SECURITE."}, {"label": "Wikipedia: Marine VHF radio", "url": "https://en.wikipedia.org/wiki/Marine_VHF_radio", "why": "Channel 16, range, DSC and how the system works."}, {"label": "YouTube search: how to make a MAYDAY call on VHF radio", "url": "https://www.youtube.com/results?search_query=how+to+make+a+mayday+call+on+vhf+radio", "why": "Short demonstration videos; play one after teaching the script so scouts hear the real rhythm."}, {"label": "Transport Canada Safe Boating Guide", "url": "https://tc.canada.ca/en/marine-transportation/marine-safety/safe-boating-guide", "why": "Canadian rules on radios, the Restricted Operator Certificate and distress signals."}, {"label": "Canadian Safe Boating Council", "url": "https://csbc.ca/", "why": "Plain-language safety campaigns and communication tips for small boats."}], "visual": "phonetic-alphabet", "takeHome": "Teach the phonetic alphabet to someone at home and have them test you by spelling three street names; report the time it took you to say the whole alphabet without a card."}, {"n": 22, "date": "2027-02-23", "term": "Winter", "title": "Emergencies: Lost, Overboard & Search", "theme": "What to do when someone is missing, in the woods or in the water, and how to search until they are found", "sea": true, "calendar": ["Jonah's fast, Feb 22-24. Tonight is a fasting day: any snack must be vegan (fruit, pretzels, hummus and pita, dates). Many parishes hold the Jonah's fast prayers and read the whole book of Jonah this week.", "Great Lent begins Monday, Mar 8. Remind families that meetings from Mar 9 on will follow Lenten fasting for any food.", "Optional: invite the parish priest to give a two-minute word on Jonah's fast during the opening."], "objectives": ["Recite and apply the STOP principle (Stop, Think, Observe, Plan) when lost, and the hug-a-tree rules for staying put and staying visible.", "Use standard whistle signals (one, two, three blasts) and explain why three of anything means distress.", "Perform the five man-overboard steps (shout, point, throw, turn, recover) in order and without hesitation.", "Organize a line search and an expanding-square search in the hall with a patrol.", "Explain what leaders do when a scout is missing at camp and what the missing scout should do."], "materials": [{"item": "Pea-less safety whistles", "qty": "1 per scout (25)", "note": "about $1.50 each in bulk; scouts keep them on their PFD or pack from now on"}, {"item": "'Oscar' man-overboard dummy: a duffel bag or pillowcase filled with about 5 kg of rice or old towels, tied shut, with a face drawn on tape", "qty": "2", "note": "reusable; name tag 'Oscar' (the O flag means man overboard)"}, {"item": "Throw bags or 15 m floating rope in a stuff sack", "qty": "2", "note": "from Lesson 12; if unavailable, a coiled 15 m rope"}, {"item": "Foam ring buoy or seat cushion", "qty": "2", "note": "any throwable flotation prop"}, {"item": "Large orange garbage bags (survival shelter demo)", "qty": "5", "note": "one per patrol; hug-a-tree kit item"}, {"item": "Masking tape for floor grids and a 'last seen' marker", "qty": "2 rolls", "note": "a 6 m by 6 m grid with 1 m squares"}, {"item": "Small hidden objects (key rings, small toy figures, coins)", "qty": "15", "note": "for the grid search"}, {"item": "Blindfolds", "qty": "6", "note": "for the MOB helmsman"}, {"item": "Printed whistle-signal and MOB-step cards", "qty": "1 per patrol", "note": "from the tables section"}, {"item": "Fasting-friendly snack: pretzels, orange slices, dates", "qty": "enough for 25", "note": "check nut allergies; no dairy, eggs or meat this week"}], "prep": ["Assemble the two Oscar dummies and test that a scout can drag one 10 m by a rope tied around it.", "Tape a 6 by 6 grid of 1 m squares on the hall floor in one corner and hide 15 small objects under chairs, tape edges, along baseboards and in plain sight at different heights within it. No
