he rest doing the plank."]}, "tables": [{"caption": "Heat illness: recognise and respond", "headers": ["Condition", "Signs", "What to do"], "rows": [["Dehydration", "Thirst, dark urine, headache, tiredness", "Drink water regularly, 500 mL per hour in heat; add a salty snack"], ["Heat cramps", "Painful muscle spasms in legs or abdomen after exertion", "Rest in shade, stretch gently, sip water or sports drink"], ["Heat exhaustion", "Heavy sweating, cool clammy pale skin, weakness, dizziness, nausea, headache", "Stop, shade, loosen clothing, cool wet cloths, sip fluids; if not better in 30 minutes, get medical help"], ["Heat stroke (emergency)", "Hot skin, confusion, slurred speech, staggering, fainting, temperature over 40 C", "Call 911, cool aggressively with water, fanning, ice at neck, armpits, groin; nothing to drink if confused"]]}], "references": [{"label": "Lifesaving Society", "url": "https://www.lifesaving.ca/", "why": "The Swim to Survive standard (roll into deep water, tread 1 minute, swim 50 m) and drowning-prevention facts for Ontario."}, {"label": "YouTube search: how to right a capsized canoe Capistrano flip", "url": "https://www.youtube.com/results?search_query=how+to+right+a+capsized+canoe+capistrano+flip", "why": "Watch the two-person righting and the canoe-over-canoe rescue before teaching."}, {"label": "YouTube search: how to right a capsized sailing dinghy centreboard", "url": "https://www.youtube.com/results?search_query=how+to+right+a+capsized+sailing+dinghy+centreboard", "why": "The centreboard lever and scoop method, and what to do if the boat turtles."}, {"label": "Wikipedia: Cold shock response", "url": "https://en.wikipedia.org/wiki/Cold_shock_response", "why": "Why May water is dangerous even on a hot Victoria Day weekend."}, {"label": "Canadian Red Cross: First aid tips and resources", "url": "https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources", "why": "Heat exhaustion and heat stroke first aid to confirm the table."}, {"label": "Bible Gateway: Joshua 1:9 (NKJV)", "url": "https://www.biblegateway.com/passage/?search=Joshua+1%3A9&version=NKJV", "why": "The courage verse for the spiritual lesson."}], "visual": null, "takeHome": "Go to a pool with a buddy or parent before the swim check and practise treading water for one minute and swimming 50 m without stopping; teach the six capsize steps to a family member so they can quiz you next week."}, {"n": 34, "date": "2027-05-25", "term": "Spring", "title": "Sea Scout Olympics & Year-End", "theme": "Run the race: skills review, recognition, and a celebration of the year", "sea": true, "calendar": ["Holy Fifty Days continue: Christ is Risen! No fasting. Celebration snacks are allowed (pizza with meat or cheese, cake, juice); check allergies and offer a vegan option for anyone who prefers it.", "Victoria Day was yesterday (May 24). Ascension is Jun 10 and Pentecost Jun 20; if the troop meets again before summer for a regatta or camp briefing, announce it tonight.", "Invite parents to arrive at 7:30 pm for the awards and snack; send the invitation a week ahead. Ask Abouna to attend and close with the blessing if possible.", "Collect all remaining summer camp and regatta forms, and the troop gear inventory from Lesson 30 for the treasurer."], "objectives": ["Demonstrate, under time pressure, the core skills of the year: five knots, a compass bearing, recovery position and bleeding control, a semaphore message, and a chart position.", "Give and receive honest feedback on the year using a simple plus, minus, next format.", "Recognise the growth and contribution of every scout in the troop, not just the winners.", "Know the summer plans, the swim check date, and what gear to prepare.", "Leave the hall and the troop gear clean, inventoried, and ready for September."], "materials": [{"item": "Station 1 Knots: 2 m rope per scout, a spar for the clove hitch, a rail for the round turn and two half hitches", "qty": "25 ropes", "note": "troop rope kit, inspected in Lesson 30"}, {"item": "Station 2 Compass: baseplate compasses, a bearing course of 5 taped marks on the floor with a hidden letter under each", "qty": "5 compasses", "note": "reuse Lesson 4 course"}, {"item": "Station 3 First aid: triangular bandages, gauze, gloves, a scenario card, a pillow or manikin for CPR position", "qty": "1 set", "note": "troop kit, restocked"}, {"item": "Station 4 Semaphore: two pairs of semaphore flags, the semaphore chart for the judge only", "qty": "2 pairs", "note": ""}, {"item": "Station 5 Chart: a simple chart or the Lesson 14 practice chart, parallel rules or a ruler, dividers, pencil", "qty": "1 set", "note": ""}, {"item": "Station 6 Sea Sense: 10 signal flag cards, a nav light diagram, a lateral buoy picture, a throw bag and a hula hoop at 6 m", "qty": "1 set", "note": "combines Lessons 10, 12, 32"}, {"item": "Score sheets for each station and a master scoreboard on the flip chart", "qty": "6 plus 1", "note": ""}, {"item": "Stopwatches or phones", "qty": "6", "note": "one per station judge"}, {"item": "Recognition: a certificate for every scout with one specific strength written on it, plus small awards (patrol trophy, Most Improved, Servant of the Year, Sea Skills, Spirit)", "qty": "25 certificates, 5 awards", "note": "leaders write the strengths this week; dollar store medals or a wooden plaque"}, {"item": "Feedback slips (plus, minus, next) and pencils", "qty": "30", "note": ""}, {"item": "Celebration snacks: pizza, veggie tray, cake, juice; paper plates and napkins", "qty": "for 25 scouts and parents", "note": "no fast; check allergies; keep a vegan slice option"}, {"item": "Patrol flags from Lesson 32", "qty": "1 per patrol", "note": "judged tonight"}], "prep": ["One week before: invite parents for 7:30 pm and ask Abouna to attend. Order pizza for 7:25 pm delivery.", "Leaders meet and write one specific strength for every scout on their certificate (e.g., 'Always the first to help a younger scout with knots'). Decide award winners together; make sure the awards spread across patrols.", "Set up six stations around the walls with a numbered sign, the materials, a score sheet, and a judge's answer key. Tape the compass course. Test that every station takes about 4 minutes for a patrol of 5.", "Prepare a station answer key: knots to tie (bowline, reef knot, clove hitch, sheet bend, round turn and two half hitches), the five bearings and their hidden letters spelling a word (e.g., ANCHOR minus one letter), the first-aid scenario, the semaphore word (e.g., REGATTA), the chart lat/long position, and the sea sense answers.", "Print the feedback slips and the summer plan sheet (dates, swim check, gear list, contacts).", "Draw the master scoreboard with patrol names and six station columns plus a patrol flag column.", "Assign one leader or older scout as judge for each station and one as scorekeeper; brief them on scoring at 6:00 pm."], "schedule": [{"time": "6:15", "min": 10, "what": "Opening: fall in with patrol flags, 'Christ is Risen!', flag, Scout Promise, Lord's Prayer, attendance, the year in numbers (meetings, knots, skills)"}, {"time": "6:25", "min": 40, "what": "Practical: rapid refresher circuit through five skill stations (6 min each), then feedback slips and summer plans"}, {"time": "7:05", "min": 10, "what": "Spiritual: run the race (2 Timothy 4:7; Hebrews 12:1)"}, {"time": "7:15", "min": 25, "what": "Activity: Sea Scout Olympics, patrol vs patrol across six stations, 4 minutes each; parents arrive 7:30; scores tallied"}, {"time": "7:40", "min": 5, "what": "Closing: awards and certificates, patrol trophy, Abouna's blessing, closing prayer, then celebration snacks with parents"}], "practical": {"title": "Refresher Circuit, Feedback, and Summer Plans", "intro": "Tonight is the last meeting of the year, and it is a test you have been preparing for since September. Before the Olympics we do one quiet lap through the skills with a coach at each station, so that nobody meets a station cold. Then we look back honestly and look ahead to the summer.", "steps": [{"title": "Refresher circuit: five stations, six minutes each", "min": 30, "detail": "Patrols rotate on the whistle; the coach at each station demonstrates once, then every scout does it, and the coach corrects quietly. Knots: bowline (rabbit up the hole, round the tree, back down; a fixed loop for a lifeline), reef knot (right over left, left over right; joining two equal lines, reefing a sail), clove hitch (two turns crossing over themselves around a spar; a fender or a start of a lashing), sheet bend (bight in the thicker line, thinner line up through, around behind both, and under itself; joining unequal lines), round turn and two half hitches (full round turn on the rail, then two half hitches in the same direction; mooring a boat). Compass: hold the compass flat at waist height, turn the dial so the bearing is at the index line, turn your whole body until the red needle sits in the orienting arrow ('red in the shed'), sight along the direction-of-travel arrow, pace to the mark. First aid: check the scene, check the person, call 911 and say the address first, care: recovery position (arm up, hand to cheek, knee up, roll toward you), direct pressure on bleeding with gauze, do not remove soaked dressings, add more. Semaphore: the coach shows the letter positions for the word of the night and the scouts send it in pairs. Chart: find the compass rose, read latitude off the side scale and longitude off the top or bottom scale, plot a position with the ruler, measure a distance with dividers on the latitude scale (one minute equals one nautical mile). Coaches are told: praise loudly, correct quietly, nobody leaves a station unable to do the skill."}, {"title": "Plus, minus, next: feedback", "min": 6, "detail": "Give every scout a slip and a pencil; leaders fill one too. Three lines. Plus: the best thing about Sea Scouts this year (a lesson, a moment, a person). Minus: one thing that should change or that we should stop doing. Next: one thing you want to learn or do next year (a skill, a trip, a service project). Two minutes to write in silence, names optional. Then each patrol shares one plus and one next out loud, chosen by the patrol leader, while the scorekeeper writes the 'next' items on the flip chart. Leaders promise out loud to read every slip and to bring the list of 'next' items to the September planning meeting. Explain that this is how a ship's company improves: an honest debrief after every voyage, with no blame, in the same spirit as the Holy Week journal in Lesson 30. Collect the slips in an envelope."}, {"title": "Summer plans and gear", "min": 4, "detail": "Hand out the summer sheet and read it: dates and location of summer camp and any regatta; the swim check date and the standard (Lesson 33); the packing list (PFD if the scout owns one, whistle, hat, SPF 30 sunscreen, two water bottles, water shoes, rain jacket, dry bag, sleeping bag rated to 0 C, headlamp, mess kit, personal medications in a labelled bag, no valuables); forms still outstanding (name them); the family float plan rule (every paddle trip with the troop is signed out on the dock); and the leader contact numbers. Remind them that summer is when the year's skills get used for real: they will tie the knots on real docks, read real weather, and paddle real water. Ask each patrol to name one skill they are most excited to use and one skill they will practise at home before camp. Close with the announcement that patrol leaders for September will be chosen from those who show the Scout Law all summer, not from the Olympic winners."}], "tips": ["The refresher circuit is coaching, not testing; no scores. Save all competition for the Olympics.", "Put your strongest coaches on knots and compass; those stations back up fastest.", "Read a few 'plus' slips aloud at the awards if they honour a leader or a fellow scout; it sets the tone.", "Keep to time ruthlessly; parents arrive at 7:30 and the pizza does not wait."], "safety": ["Stations are spread along the walls with a clear centre lane; no running between stations.", "Throw bag station: throw underhand, and nobody stands in the hoop while another scout is throwing.", "First-aid station uses no real casualties on hard floors without a mat.", "Snack: confirm allergies, label vegan and meat pizzas, and keep an EpiPen holder's kit accessible."]}, "spiritual": {"title": "Run the Race", "ref": "2 Timothy 4:7; Hebrews 12:1", "verse": "I have fought the good fight, I have finished the race, I have kept the faith.", "url": "https://www.biblegateway.com/passage/?search=2+Timothy+4%3A7&version=NKJV", "message": "Christ is Risen! St. Paul wrote these words in a Roman prison, near the end of his life, to Timothy, a young man he had trained. Look at the three things he says: I fought, I finished, I kept. Not 'I won every time.' Not 'I never fell.' He fought, he finished, he kept the faith. Tonight you will run six stations against the clock, and one patrol will win the trophy. Good. Compete hard. But listen to what the Church has always said about the race: the medal is not the point. The point is finishing with your faith intact. In September some of you could not tie a bowline, did not know port from starboard, had never held a compass. Look at what you can do now. That happened one Tuesday at a time, one 'I will do my best' at a time. Hebrews says we are 'surrounded by so great a cloud of witnesses', and for us that cloud has names: St. Mark who brought the faith to Egypt, St. George who kept it under torture, St. Verena who carried it to Switzerland, Pope Kyrillos who kept it in prayer through the night. They are in the stands tonight. They finished. Now it is your lap. This summer, on real water, with real weather and real people, run the race the way you learned to tie the knot: carefully, honestly, and together. Fight the good fight. Finish. Keep the faith.", "discussion": ["St. Paul says 'I have finished the race', not 'I have won'. What is the difference, and which matters more this summer?", "Who in the 'cloud of witnesses' would you want watching your lap, and why?", "What did you learn this year that was hard at first, and what does that teach you about keeping the faith when it is hard?"], "prayer": "Risen Lord Jesus, we thank You for every Tuesday of this year, for every knot, every skill, and every friend. Help us fight the good fight, finish the race, and keep the faith this summer and always, surrounded by the cloud of Your saints. Through the intercessions of the Theotokos St. Mary and all the saints. Amen."}, "activity": {"title": "Sea Scout Olympics", "setup": "Six numbered stations around the hall, one judge with a stopwatch and score sheet at each. Patrols start at different stations (Patrol 1 at Station 1, and so on) and rotate clockwise on the scorekeeper's whistle every 4 minutes. Each station is scored out of 10. Patrol flags are planted at the start line and judged during the rotation. Parents arriving at 7:30 watch from the sides. The scorekeeper tallies on the flip chart after each rotation.", "materials": ["All station materials from the materials list", "Six score sheets and answer keys, master scoreboard", "Whistle for the scorekeeper", "Patrol trophy, individual awards, certificates", "Snacks ready at 7:40"], "rules": ["Station 1, Knot Relay: scouts line up; on 'Go' the first scout ties a bowline, runs back, tags the next who ties a reef knot, then clove hitch on the spar, sheet bend between two ropes, round turn and two half hitches on the rail, and the cycle repeats until time is called. 1 point per correct knot checked by the judge, maximum 10; a wrong knot is untied and retied by the same scout.", "Station 2, Bearing Hunt: the judge gives the patrol a card with 5 bearings and pace counts from the start mark; the patrol follows them in order with one compass, collecting the hidden letter under each mark. 2 points p function fmtDate(iso, long){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  return long ? `${wd}, ${MONTHS[m-1]} ${d}, ${y}` : `${MONTHS[m-1]} ${d}`;
}

V["compass-rose"] = () => {
  const pts=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  let s='<svg viewBox="0 0 440 440" width="440" height="440" role="img" aria-label="Compass rose with 16 points and degrees">';
  s+='<circle cx="220" cy="220" r="200" fill="var(--surface-2)" stroke="var(--line-strong)"/>';
  s+='<circle cx="220" cy="220" r="150" fill="none" stroke="var(--line-strong)"/>';
  for(let d=0; d<360; d+=10){
    const a=(d-90)*Math.PI/180, r1=d%30?190:180, x1=220+r1*Math.cos(a), y1=220+r1*Math.sin(a), x2=220+200*Math.cos(a), y2=220+200*Math.sin(a);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-width="${d%30?1:2}"/>`;
    if(d%30===0){const rx=220+168*Math.cos(a), ry=220+168*Math.sin(a); s+=`<text x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${d===0?"000":String(d).padStart(3,"0")}°</text>`;}
  }
  pts.forEach((p,i)=>{
    const deg=i*22.5, a=(deg-90)*Math.PI/180, big=i%4===0, mid=i%2===0;
    const L= big?150:mid?120:95, w= big?14:mid?9:6;
    const tip=[220+L*Math.cos(a),220+L*Math.sin(a)];
    const a2=a+Math.PI/2; const l=[220+w*Math.cos(a2),220+w*Math.sin(a2)], r=[220-w*Math.cos(a2),220-w*Math.sin(a2)];
    const fill = big?(p==="N"?"var(--red)":"var(--ink)"):mid?"var(--sea)":"var(--muted)";
    s+=`<polygon points="${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${l[0].toFixed(1)},${l[1].toFixed(1)} 220,220" fill="${fill}"/><polygon points="${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${r[0].toFixed(1)},${r[1].toFixed(1)} 220,220" fill="${fill}" opacity=".55"/>`;
    const tx=220+(big?128:mid?135:110)*Math.cos(a)*(big?1:1), ty=220+(big?128:mid?135:110)*Math.sin(a);
    const fs= big?18:mid?12:9;
    const lx=220+(big?120:mid?134:110)*Math.cos(a), ly=220+(big?120:mid?134:110)*Math.sin(a);
    s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fs}" font-family="Archivo,sans-serif" font-weight="700" fill="var(--ink)" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="var(--surface-2)" stroke-width="4">${p}</text>`;
  });
  s+='<circle cx="220" cy="220" r="6" fill="var(--ground)" stroke="var(--ink)" stroke-width="2"/></svg>';
  return {svg:s, cap:"Sixteen-point compass rose. Bearings are read clockwise from North: N 000°, E 090°, S 180°, W 270°. Each small tick is 10°."};
};

V["semaphore"] = () => {
  const pos={A:[1,0],B:[2,0],C:[3,0],D:[4,0],E:[0,5],F:[0,6],G:[0,7],H:[1,2],I:[1,3],J:[4,6],K:[1,4],L:[1,5],M:[1,6],N:[1,7],O:[2,3],P:[2,4],Q:[2,5],R:[2,6],S:[2,7],T:[3,4],U:[3,5],V:[4,7],W:[5,6],X:[5,7],Y:[3,6],Z:[6,7]};
  const ang=p=>p===0?0:p*45; // clockwise from straight down, signaller's right side first
  const fig=(L)=>{
    const [p1,p2]=pos[L];
    const arm=(p,dashed)=>{ if(p===0 && dashed) return ""; const a=(ang(p))*Math.PI/180; const x=50-Math.sin(a)*40*(p===0?0.6:1), y=60+Math.cos(a)*40*(p===0?0.6:1);
      // Note: signaller faces the viewer, so signaller's right is on the viewer's left. We draw from BEHIND the signaller (as the learner stands), so right arm goes to the right.
      const xr=50+Math.sin(a)*40*(p===0?0.6:1);
      return `<line x1="50" y1="60" x2="${xr.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><rect x="${(xr-9).toFixed(1)}" y="${(y-9).toFixed(1)}" width="18" height="18" fill="${dashed?'var(--gold)':'var(--red)'}" transform="rotate(${ang(p)} ${xr.toFixed(1)} ${y.toFixed(1)})"/>`; };
    // p1 is the position of one arm, p2 of the other. Positions 1-3 right arm, 5-7 left arm, 4 straight up (either).
    const arms=[p1,p2].map((p,i)=>{ let pp=p; if(p===0) return `<line x1="50" y1="60" x2="${i===0?62:38}" y2="95" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`;
      // convert: positions 5,6,7 => left side (negative sin)
      const a=ang(pp)*Math.PI/180; const x=50+Math.sin(a)*40, y=60+Math.cos(a)*40;
      return `<line x1="50" y1="60" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><g transform="rotate(${ang(pp)} ${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${(x-10).toFixed(1)}" y="${(y-10).toFixed(1)}" width="20" height="20" fill="var(--red)"/><path d="M${(x-10).toFixed(1)} ${(y-10).toFixed(1)} L${(x+10).toFixed(1)} ${(y+10).toFixed(1)} L${(x-10).toFixed(1)} ${(y+10).toFixed(1)} Z" fill="var(--gold)"/></g>`; }).join("");
    return `<div class="cell"><svg viewBox="0 0 100 125" role="img" aria-label="Semaphore ${L}"><circle cx="50" cy="45" r="9" fill="var(--ink)"/><line x1="50" y1="54" x2="50" y2="100" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="100" x2="40" y2="122" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="100" x2="60" y2="122" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>${arms}</svg><b>${L}</b></div>`;
  };
  let h='<div class="vis-grid" style="grid-template-columns:repeat(auto-fill,minmax(88px,1fr))">'+Object.keys(pos).map(fig).join("")+'</div>';
  return {html:h, cap:"Drawn as seen from BEHIND the signaller, so the arm on the right of each figure is the signaller's right arm. Positions go clockwise: low, out, high, up. Letters run in circles: A to G use one arm; H to N keep one arm at the A position; O to S keep one at B, and so on. Hold both flags down to rest, cross them low to mean 'error'."};
};

    <div class="two">
      <div class="card soft"><ul style="font-size:.95rem;margin:0"><li>Two leaders present at all times; one leader holds the allergy and medical list.</li><li>Rope: never around a neck, never a loop that can tighten on a limb; cut, do not pull, if a knot jams on a person.</li><li>Fire and candles: leader-lit only, bucket of water or extinguisher within reach, hair tied back.</li><li>Food: check allergies, wash hands, nut-free by default, label fasting-friendly items.</li></ul></div>
      <div class="card soft"><ul style="font-size:.95rem;margin:0"><li>Physical games: shoes on, clear the floor of chairs and cables, walk-only rule near walls.</li><li>Tools (knives, saws) are not used in the hall in this programme; lashing projects use pre-cut spars.</li><li>Follow Scouts Canada's two-scouter rule, incident reporting and youth-protection policies at every meeting.</li><li>Confirm with the church office before Holy Week (Apr 27) and any week that overlaps a service.</li></ul></div>
    </div>
  </section>
  </section>`;
}

/* ---------- Router / nav ---------- */
const view=document.getElementById("view"), nav=document.getElementById("nav"), side=document.getElementById("side");
let allMode=false;
function buildNav(){
  let h=`<a href="#overview" data-id="overview"><span class="d">◎</span><span>Overview &amp; calendar</span></a>`;
  TERM_ORDER.forEach(t=>{
    const ls=LESSONS.filter(l=>l.term===t); if(!ls.length) return;
    h+=`<div class="nav-term"><div class="eyebrow"><span>${t}</span><span>${ls.length} wks</span></div>`;
    ls.forEach(l=>{
      h+=`<a href="#week-${l.n}" data-id="week-${l.n}"><span class="d">${fmtDate(l.date)}</span><span>${esc(l.title)}<span class="mark ${l.sea?"":"land"}" title="${l.sea?"Sea skills":"Scoutcraft"}"></span></span></a>`;
      const b=BREAKS.find(b=>b.after===l.n); if(b) h+=`<div class="break">${esc(b.label)}</div>`;
    });
    h+=`</div>`;
  });
  nav.innerHTML=h;
}
function route(){
  const id=(location.hash||"#overview").slice(1);
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.id===id));
  if(allMode){
    if(!view.dataset.all){view.innerHTML=renderOverview()+LESSONS.map((l,i)=>renderLesson(l,i)).join("");view.dataset.all="1";document.body.classList.add("all-mode");}
    const el=document.getElementById(id); if(el) el.scrollIntoView();
  } else {
    delete view.dataset.all; document.body.classList.remove("all-mode");
    if(id==="overview"){view.innerHTML=renderOverview();}
    else { const i=LESSONS.findIndex(l=>`week-${l.n}`===id); view.innerHTML = i>=0? renderLesson(LESSONS[i],i) : renderOverview(); }
    window.scrollTo({top:0});
  }
  side.classList.remove("open");
}
view.addEventListener("change",e=>{ if(e.target.matches("input[data-key]")){ setDone(e.target.dataset.key,e.target.checked); e.target.closest("li").classList.toggle("done",e.target.checked);} });
document.getElementById("btnAll").addEventListener("click",e=>{ allMode=!allMode; e.target.textContent=allMode?"Show one week at a time":"Show all lessons"; delete view.dataset.all; route(); });
document.getElementById("btnPrint").addEventListener("click",()=>window.print());
document.getElementById("menuBtn").addEventListener("click",()=>side.classList.toggle("open"));
window.addEventListener("hashchange",route);
buildNav(); route();
</script>
